---
$schema: moz://mozilla.org/schemas/glean/metrics/2-0-0
$tags:
  - "Core :: XPCOM"

timer_thread:
  timers_fired_per_wakeup:
    type: custom_distribution
    description: >
      How many timers were processed in a single wake-up of the Timer Thread.
    range_min: 0
    range_max: 80
    bucket_count: 20
    histogram_type: exponential
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1814718
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1814718
    data_sensitivity:
      - technical
    notification_emails:
      - jlink@mozilla.com
    expires: never

memory_watcher:
  on_high_memory_stats:
    type: event
    description: >
      This event is recorded when the memory situation is no longer low.
      The "stats" object consists of three numbers comma-delimited: 1) how
      many times a tab was unloaded 2) how many memory-pressure events
      were dispatched 3) how long we were in the low-memory situation in
      seconds
      This event was generated to correspond to the Legacy Telemetry event
      memory_watcher.on_high_memory#stats.
    bugs:
      - https://bugzil.la/1715858
    data_reviews:
      - https://bugzil.la/1715858
    notification_emails:
      - tkikuchi@mozilla.com
    expires: never
    extra_keys:
      value:
        description: >
          The `value` of the event. Mirrors to the Legacy Telemetry
          event's `value` parameter.
          The stringified, comma-separated stats.
        type: string

  process_oom_killed:
    type: event
    description: >
      Recorded when a content process is killed by the Linux OOM killer (SIGKILL).
      PSI (Pressure Stall Information) metrics are included to understand memory
      pressure context at the time of the kill. This helps analyze memory pressure
      patterns and OOM kill correlation.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1995907
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1995907
    notification_emails:
      - tli@mozilla.com
    expires: never
    extra_keys:
      psi_some_avg10:
        description: PSI some avg10 value (10-second average partial stall percentage)
        type: string
      psi_some_avg60:
        description: PSI some avg60 value (60-second average partial stall percentage)
        type: string
      psi_full_avg10:
        description: PSI full avg10 value (10-second average complete stall percentage)
        type: string
      psi_full_avg60:
        description: PSI full avg60 value (60-second average complete stall percentage)
        type: string
      psi_available:
        description:  PSI values are available.
        type: boolean

  non_oom_sample:
    type: event
    description: >
      Records PSI (Pressure Stall Information) metrics sampled 120 seconds
      after an OOM-killed content process. By capturing memory pressure
      values that did not trigger further OOM kills, this helps establish
      the boundary between recoverable memory pressure and OOM conditions.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2010734
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2010734
    notification_emails:
      - tli@mozilla.com
    expires: never
    extra_keys:
      psi_some_avg10:
        description: PSI some avg10 value (10-second average partial stall percentage)
        type: string
      psi_some_avg60:
        description: PSI some avg60 value (60-second average partial stall percentage)
        type: string
      psi_full_avg10:
        description: PSI full avg10 value (10-second average complete stall percentage)
        type: string
      psi_full_avg60:
        description: PSI full avg60 value (60-second average complete stall percentage)
        type: string

memory_phc:
  slop:
    type: memory_distribution
    description: >
      Over-allocation due to PHC's rounding (aka internal
      fragmentation).  Measured in bytes.
    memory_unit: byte
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1829127
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1892149
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1969177
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2026442
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2072826
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1829127
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1892149
    notification_emails:
      - memshrink-telemetry-alerts@mozilla.com
      - pbone@mozilla.com
    expires: 173

  slots_allocated:
    type: custom_distribution
    description: >
      Number of PHC slots currently allocated
    range_min: 1
    range_max: 16384
    bucket_count: 64
    histogram_type: exponential
    unit: PHC slots
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1829127
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1892149
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1969177
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2026442
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2072826
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1829127
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1892149
    notification_emails:
      - memshrink-telemetry-alerts@mozilla.com
      - pbone@mozilla.com
    expires: 173

  slots_freed:
    type: custom_distribution
    description: >
      Number of PHC slots allocated-then-freed
    range_min: 1
    range_max: 16384
    bucket_count: 64
    histogram_type: exponential
    unit: PHC slots
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1829127
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1892149
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1969177
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2026442
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2072826
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1829127
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1892149
    notification_emails:
      - memshrink-telemetry-alerts@mozilla.com
      - pbone@mozilla.com
    expires: 173

