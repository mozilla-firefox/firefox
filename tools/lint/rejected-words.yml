---
avoid-gobbledygook:
    description: "American English colloquialism. Use 'nonsense' instead."
    level: error
    include: ['.']
    type: external
    payload: mozcheck:lint
    setup: mozcheck:setup
    check: rejected-words
    check-config:
        regex-pattern: \b(gobbledy)?-?gook
        ignore-case: true
    support-files:
        - 'tools/lint/mozcheck/**'
    exclude:
        - extensions/spellcheck/locales/en-US/hunspell/dictionary-sources/orig/en_US-custom.dic
        - extensions/spellcheck/locales/en-US/hunspell/dictionary-sources/utf8/en-US-utf8.dic
        - extensions/spellcheck/locales/en-US/hunspell/en-US.dic
        - taskcluster/test/params
        - tools/lint/rejected-words.yml

forbid-moduleloaderbase-include:
    description: >-
        New #includes of js/loader/ModuleLoaderBase.h from a header are
        forbidden because the header has a large build-wide include fan-out
        (see bug 2054848): a header that pulls it in drags it into every
        translation unit that includes that header. Prefer forward-declaring
        JS::loader::ModuleLoaderBase, or move the code that needs the complete
        type out-of-line into a .cpp. Including it from a .cpp is fine. If a new
        header genuinely needs the full type, add it to the exclude list below
        and consult the module loader owners.
    level: error
    include: ['.']
    type: external
    payload: mozcheck:lint
    setup: mozcheck:setup
    check: rejected-words
    check-config:
        regex-pattern: '#\s*include\s+"(js/loader/)?ModuleLoaderBase\.h"'
        ignore-case: false
    support-files:
        - 'tools/lint/mozcheck/**'
    extensions:
        - h
    exclude:
        # Headers that genuinely require the complete type. Prefer shrinking
        # this list over growing it (bug 2054848).
        - js/loader/ModuleLoadRequest.h
        - dom/script/ModuleLoader.h
        - dom/workers/loader/WorkerModuleLoader.h
        - dom/worklet/loader/WorkletModuleLoader.h
        - js/xpconnect/loader/SyncModuleLoader.h
        - js/xpconnect/loader/NonSharedGlobalSyncModuleLoaderScope.h
