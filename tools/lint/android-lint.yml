---
android-lint:
    description: Android lint
    include:
        - 'dom/media/systemservices/android_video_capture/java/src'
        - 'mobile/android/android-components/plugins/dependencies'
        - 'mobile/android/android-components/plugins/publicsuffixlist'
        - 'mobile/android/fenix/plugins/apksize'
        - 'mobile/android/geckoview'
        - 'mobile/android/gradle/plugins/conventions'
    exclude: []
    extensions: ['java', 'kt']
    support-files:
        - 'mobile/android/**/Makefile.in'
        - 'mobile/android/config/**'
        - 'mobile/android/gradle.configure'
        - 'mobile/android/**/moz.build'
        - '**/*.gradle'
        - '**/*.gradle.kts'
    type: global
    payload: android.lints:lint
    setup: android.lints:setup
