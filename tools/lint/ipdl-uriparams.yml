---
avoid-ipdl-uriparams:
    description: >-
        Use nsIURI (e.g. `nullable nsIURI`) instead of URIParams in IPDL
        interfaces. nsIURI is serialized directly, so there is no need to
        convert to and from URIParams with SerializeURI/DeserializeURI.
    level: error
    include: ['.']
    type: external
    payload: mozcheck:lint
    setup: mozcheck:setup
    check: rejected-words
    check-config:
        regex-pattern: '\bURIParams\b'
        ignore-case: false
    support-files:
        - 'tools/lint/mozcheck/**'
    extensions:
        - ipdl
        - ipdlh
    exclude:
        # The definition of URIParams.
        - ipc/glue/URIParams.ipdlh
