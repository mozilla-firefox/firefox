---
android-fenix:
    description: Android formatting lint for Fenix
    include: ['mobile/android/fenix']
    exclude: []
    extensions: ['java', 'kt', 'xml']
    support-files:
        - 'mobile/android/**/Makefile.in'
        - 'mobile/android/config/**'
        - 'mobile/android/shared-lint.xml'
        - 'mobile/android/gradle.configure'
        - 'mobile/android/**/moz.build'
        - 'build.gradle'
        - 'settings.gradle'
        - 'gradle.properties'
        - 'gradle/**'
        - 'gradlew'
        - 'gradlew.bat'
        - 'mobile/android/shared-settings.gradle'
        - 'mobile/android/version.txt'
        - 'mobile/android/gradle/**'
        - 'mobile/android/android-components/.buildconfig.yml'
        - 'mobile/android/android-components/.config.yml'
        - 'mobile/android/android-components/plugins/**'
        - 'mobile/android/android-components/**/*.gradle'
        - 'mobile/android/annotations/build.gradle'
        - 'mobile/android/fenix/**'
        - 'mobile/android/geckoview/build.gradle'
        - 'third_party/application-services/.buildconfig-android.yml'
        - 'third_party/application-services/**/*.gradle'
        - 'mobile/android/gradle.py'
        - 'mobile/android/mach_commands.py'
        - 'tools/lint/android/lints.py'
    type: global
    payload: android.lints:fenix_format
    setup: android.lints:setup
