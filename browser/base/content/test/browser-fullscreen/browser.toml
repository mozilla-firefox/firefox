[DEFAULT]
support-files = [
  "head.js",
  "open_and_focus_helper.html",
]

["browser_bug1557041.js"]

["browser_bug1620341.js"]
support-files = [
  "fullscreen.html",
  "fullscreen_frame.html",
]
skip-if = [
  "os == 'linux' && os_version == '24.04' && arch == 'x86_64' && display == 'x11' && asan && swgl", # Bug 1864085
