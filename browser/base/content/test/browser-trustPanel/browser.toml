[DEFAULT]
support-files = [
  "!/browser/components/urlbar/tests/browser/head-common.js",
  "head.js",
  "load_mixed_content_after_load.html",
  "silence.ogg",
]
prefs = [
  "browser.urlbar.trending.featureGate=false",
  # trackerCount ships disabled by default (enabled via Nimbus, bug 2065206);
  # turn it on here so the trust-panel tests keep exercising it.
  "browser.urlbar.trackerCount.featureGate=true",
  "browser.urlbar.trackerCount.enabled=true",
]

["browser_trust_panel.js"]
https_first_disabled = true
support-files = ["!/browser/base/content/test/browser-protectionsUI/trackingPage.html"]

["browser_trust_panel_cert_exception.js"]

["browser_trust_panel_focus.js"]

["browser_trust_panel_icon.js"]
https_first_disabled = true
support-files = [
  "!/browser/base/content/test/browser-protectionsUI/trackingPage.html",
  "navigation.sjs",
]

["browser_trust_panel_pages.js"]
https_first_disabled = true

["browser_trust_panel_privacy_metrics_alignment.js"]
https_first_disabled = true
support-files = ["!/browser/base/content/test/browser-protectionsUI/trackingPage.html"]

["browser_trust_panel_security_view.js"]
https_first_disabled = true

["browser_trust_panel_telemetry.js"]
https_first_disabled = true
support-files = ["!/browser/base/content/test/browser-protectionsUI/trackingPage.html"]
