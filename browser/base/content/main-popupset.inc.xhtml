  <!-- Feature callout for the selection actions. -->
  <html:template id="selectionCalloutTemplate">
    <panel id="selection-callout-panel"
           role="status"
           noautofocus="true"
           consumeoutsideclicks="never"
           nonnative="">
      <vbox class="panel-subview-body">
        <svg xmlns="http://www.w3.org/2000/svg"
             class="selection-callout-shape"
             aria-hidden="true">
          <defs>
            <linearGradient id="selection-callout-edge"
                            x1="0.2217" y1="-0.0354" x2="1.0972" y2="0.2903">
              <stop class="selection-callout-gradient-start" offset="0"/>
              <stop class="selection-callout-gradient-end" offset="0.711538"/>
            </linearGradient>
          </defs>
          <path class="selection-callout-edge"/>
        </svg>
        <html:div class="selection-callout-content">
          <html:p class="selection-callout-title"
                  data-l10n-id="genai-selection-callout-title"/>
          <html:div class="selection-callout-row">
            <html:div class="selection-callout-mark-column">
              <html:img class="selection-callout-mark"
                        src="chrome://branding/content/about-logo.svg"
                        alt=""/>
              <html:moz-badge class="selection-callout-new-badge"
                              type="new"/>
            </html:div>
            <html:p class="selection-callout-message"
                    data-l10n-id="genai-selection-callout-text">
              <html:span class="selection-callout-more-link"
                         role="button"
                         tabindex="0"
                         data-l10n-name="more-actions"/>
            </html:p>
          </html:div>
        </html:div>
      </vbox>
    </panel>
  </html:template>
