[DEFAULT]
support-files = ["head.js"]
prefs = [
  "sidebar.revamp=false",
  "telemetry.number_of_site_origin.min_interval=0",
]

["browser_BrowserDOMWindow_openURI.js"]

["browser_BrowserWindowTracker.js"]

["browser_BrowserWindowTracker_minimize.js"]
skip-if = [
  "os == 'linux' && os_version == '22.04' && arch == 'x86_64' && display == 'wayland'", # Bug 2057872
]

["browser_CrashFileCleaner.js"]
run-if = [
  "crashreporter",
]

["browser_EveryWindow.js"]

["browser_HomePage_add_button.js"]

["browser_PageActions.js"]

["browser_PageActions_contextMenus.js"]

["browser_PageActions_newWindow.js"]

["browser_PermissionUI.js"]

["browser_PermissionUI_notification_nimbus.js"]

["browser_PermissionUI_prompts.js"]

["browser_ProcessHangNotifications.js"]

["browser_ReducedProtectionNotification.js"]
https_first_disabled = true

["browser_ReducedProtectionNotification_permanentPB.js"]

["browser_SitePermissions.js"]

["browser_SitePermissions_combinations.js"]

["browser_SitePermissions_expiry.js"]

["browser_SitePermissions_tab_urls.js"]
https_first_disabled = true

["browser_Telemetry_numberOfSiteOrigins.js"]
support-files = ["contain_iframe.html"]

["browser_Telemetry_numberOfSiteOriginsPerDocument.js"]
support-files = [
  "contain_iframe.html",
  "blank_iframe.html",
]

["browser_UIDensityTelemetry.js"]

["browser_URILoadingHelper_chromeless.js"]

["browser_UnsubmittedCrashHandler.js"]
run-if = [
  "crashreporter",
]

["browser_UpdatePolicyEnforcer.js"]


["browser_UsageTelemetry.js"]
https_first_disabled = true

["browser_UsageTelemetry_domains.js"]
https_first_disabled = true

["browser_UsageTelemetry_idleDaily.js"]

["browser_UsageTelemetry_interaction.js"]
https_first_disabled = true
skip-if = [
  "os == 'win' && os_version == '11.26200' && opt && verify-standalone",
]

["browser_UsageTelemetry_private_and_restore.js"]
https_first_disabled = true

["browser_UsageTelemetry_toolbars.js"]

["browser_UsageTelemetry_uniqueOriginsVisitedInPast24Hours.js"]
https_first_disabled = true

["browser_UsageTelemetry_window_opening.js"]

["browser_WindowLock.js"]
run-if = [
  "os == 'mac'",
  "os == 'win'",
]
support-files = [
  "!/dom/media/mediacontrol/tests/browser/file_non_autoplay.html",
  "!/dom/media/test/gizmo.mp4",
]

["browser_WindowLock_featureGate.js"]
run-if = [
  "os == 'mac'",
  "os == 'win'",
]

["browser_aswebauth_session.js"]
run-if = ["os == 'mac'"]
support-files = [
  "browser_aswebauth_form.sjs",
  "head_aswebauth.js",
]

["browser_aswebauth_session_cancel.js"]
run-if = ["os == 'mac'"]
support-files = [
  "browser_aswebauth_form.sjs",
  "head_aswebauth.js",
]

["browser_aswebauth_session_ephemeral.js"]
run-if = ["os == 'mac'"]
support-files = [
  "browser_aswebauth_form.sjs",
  "head_aswebauth.js",
]

["browser_aswebauth_session_window.js"]
run-if = ["os == 'mac'"]
support-files = [
  "browser_aswebauth_form.sjs",
  "head_aswebauth.js",
]

["browser_taskbar_preview.js"]
run-if = [
  "os == 'win'",
]

["browser_urlBar_zoom.js"]
