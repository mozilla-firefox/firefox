    data_sensitivity:
      - technical
    send_in_pings:
      - metrics
      - new-profile
    notification_emails:
      - rtestard@mozilla.com
      - application-update-telemetry-alerts@mozilla.com
    expires: never
    telemetry_mirror: INSTALLATION_FIRSTSEEN_ADMIN_USER

  install_existed:
    type: boolean
    description: >
      Whether there was already an install in this location
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1811374
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1811374
    data_sensitivity:
      - technical
    send_in_pings:
      - metrics
      - new-profile
    notification_emails:
      - rtestard@mozilla.com
      - application-update-telemetry-alerts@mozilla.com
    expires: never
    telemetry_mirror: INSTALLATION_FIRSTSEEN_INSTALL_EXISTED

  profdir_existed:
    type: boolean
    description: >
      Whether the top-level profile directory existed
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1811374
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1811374
    data_sensitivity:
      - technical
    send_in_pings:
      - metrics
      - new-profile
    notification_emails:
      - rtestard@mozilla.com
      - application-update-telemetry-alerts@mozilla.com
    expires: never
    telemetry_mirror: INSTALLATION_FIRSTSEEN_PROFDIR_EXISTED

  other_inst:
    type: boolean
    description: >
      Whether there was already any non-MSIX install on this system
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1811374
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1811374
    data_sensitivity:
      - technical
    send_in_pings:
      - metrics
      - new-profile
    notification_emails:
      - rtestard@mozilla.com
      - application-update-telemetry-alerts@mozilla.com
    expires: never
    telemetry_mirror: INSTALLATION_FIRSTSEEN_OTHER_INST

  other_msix_inst:
    type: boolean
    description: >
      Whether there was already any MSIX install on this system
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1811374
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1811374
    data_sensitivity:
      - technical
    send_in_pings:
      - metrics
      - new-profile
    notification_emails:
      - rtestard@mozilla.com
      - application-update-telemetry-alerts@mozilla.com
    expires: never
    telemetry_mirror: INSTALLATION_FIRSTSEEN_OTHER_MSIX_INST

  silent:
    type: boolean
    description: >
      (optional, present if installer_type is "full")
      Whether this was a silent install
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1811374
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1811374
    data_sensitivity:
      - technical
    send_in_pings:
      - metrics
      - new-profile
    notification_emails:
      - rtestard@mozilla.com
