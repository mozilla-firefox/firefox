---
$schema: moz://mozilla.org/schemas/glean/metrics/2-0-0
$tags:
  - 'Firefox :: IP Protection'

ipprotection:
  alert_button_clicked:
    type: event
    description: >
      Recorded when a user clicks "Continue without VPN" or "Close all tabs" in the VPN alert.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2020503
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2020503
    data_sensitivity:
      - interaction
    notification_emails:
      - kpatenio@mozilla.com
      - vpn-telemetry@mozilla.com
    expires: never
    extra_keys:
      buttonType:
        type: quantity
        description: >
          Action taken by the user, represented as an integer.
          0 = continue without VPN
          1 = close all tabs
      reason:
        type: string
        description: >
          Reason why the alert was triggered: "paused" or "error".

  click_upgrade_button:
    type: event
    description: >
      This is recorded when a user clicks the upgrade button in the VPN panel.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1972930
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1972930
    notification_emails:
      - rking@mozilla.com
      - vpn-telemetry@mozilla.com
    expires: never

  removed_from_toolbar:
    type: event
    description: >
      Recorded when the IP Protection widget is removed from the toolbar.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2017739
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2017739
    data_sensitivity:
      - interaction
    notification_emails:
      - mhynson@mozilla.com
      - vpn-telemetry@mozilla.com
    expires: never

  bandwidth_used_threshold:
    type: event
    description: >
      Recorded when the percentage of bandwidth used crosses a threshold of 50,
      75, or 90%.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2017744
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2017744
    data_sensitivity:
      - interaction
    notification_emails:
      - mhynson@mozilla.com
      - vpn-telemetry@mozilla.com
    expires: never
    extra_keys:
      percentage:
        type: quantity
        description: >
          The bandwidth usage threshold that was crossed (50, 75, or 90).

  exclusion_toggled:
    type: event
    description: >
      Recorded when a site exclusion is added or removed using the panel toggle UI.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2017487
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2017487
    data_sensitivity:
      - interaction
    notification_emails:
      - kpatenio@mozilla.com
      - vpn-telemetry@mozilla.com
    expires: never
    extra_keys:
      excluded:
        type: boolean
        description: >
          True if the site was excluded (VPN disabled for site).
          False if the exclusion was removed (VPN re-enabled for site).

  get_started:
    type: event
    description: >
      Recorded when the user clicks the get started button in the panel or settings.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2017484
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2017484
    data_sensitivity:
      - interaction
    notification_emails:
      - fchasen@mozilla.com
      - vpn-telemetry@mozilla.com
    expires: never

  enrollment:
    type: event
    description: >
      Recorded when an account has been enrolled after completing the sign up flow.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2017484
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2063725
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2017484
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2063725
    data_sensitivity:
      - interaction
    notification_emails:
      - fchasen@mozilla.com
      - vpn-telemetry@mozilla.com
    expires: never
    extra_keys:
      enrolled:
        type: boolean
        description: >
          True if the enrollment finished successfully.
      reason:
        type: string
        description: >
          Why the enrollment failed, as one of the AUTH_ERRORS values in
          IPPAuthProvider.sys.mjs. Empty when it succeeded.

  location_selector_button_clicked:
    type: event
    description: >
      Recorded when a user clicks the location selector button to open the
      locations subview.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2035944
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2035944
    data_sensitivity:
      - interaction
    notification_emails:
      - kpatenio@mozilla.com
      - vpn-telemetry@mozilla.com
    expires: never

  location_changed:
    type: event
    description: >
      Recorded when a user picks a new egress location from the location selector.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2035944
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2035944
    data_sensitivity:
      - interaction
    notification_emails:
      - kpatenio@mozilla.com
      - vpn-telemetry@mozilla.com
    expires: never
    extra_keys:
      location:
        type: string
        description: >
          The country code of the selected egress location, or "REC" if the
          recommended location was selected.

  rules_page_opened:
    type: event
    description: >
      Recorded when a user opens the VPN site rules page in settings
      (about:settings#vpnSiteRules) via a Manage VPN Rules button.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2081951
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2081951
    data_sensitivity:
      - interaction
    notification_emails:
      - rking@mozilla.com
      - vpn-telemetry@mozilla.com
    expires: never
    extra_keys:
      entrypoint:
        type: string
        description: >
          Where the user opened the page from: "panel" for the button in the
          VPN panel, "settings" for the button in about:settings#privacy.

  promo_seen:
    type: event
    description: >
      Recorded when a promo is shown to the user in the VPN panel or in
      settings.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2090329
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2090329
    data_sensitivity:
      - interaction
    notification_emails:
      - rking@mozilla.com
      - vpn-telemetry@mozilla.com
    expires: never
    extra_keys:
      promo:
        type: string
        description: >
          Which promo was shown: "mozillavpn" for the Mozilla VPN promo,
          "defaultbrowser" for the Set to Default promo.
      entrypoint:
        type: string
        description: >
          Where the promo was shown: "panel" for the VPN panel, "settings" for
          about:settings.

  promo_clicked:
    type: event
    description: >
      Recorded when a user clicks a promo in the VPN panel or in settings.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2090329
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2090329
    data_sensitivity:
      - interaction
    notification_emails:
      - rking@mozilla.com
      - vpn-telemetry@mozilla.com
    expires: never
    extra_keys:
      promo:
        type: string
        description: >
          Which promo was clicked: "mozillavpn" for the Mozilla VPN promo,
          "defaultbrowser" for the Set to Default promo.
      entrypoint:
        type: string
        description: >
          Where the promo was clicked: "panel" for the VPN panel, "settings"
          for about:settings.
