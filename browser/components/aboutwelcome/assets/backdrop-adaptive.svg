<style>
  /* ---- LIGHT MODE (default) ---- */
  :root, svg {
    --backdrop: #FCF5F0;
    --grad-0: url(#g0-light);
    --grad-1: url(#g1-light);
    --grad-2: url(#g2-light);
    --grad-3: url(#g3-light);
    --hill-opacity: 0.7;
  }

  /* ---- DARK MODE ---- */
  @media (prefers-color-scheme: dark) {
    :root, svg {
      --backdrop: #210340;
      --grad-0: url(#g0-dark);
      --grad-1: url(#g1-dark);
      --grad-2: url(#g2-dark);
      --grad-3: url(#g3-dark);
      --hill-opacity: 1;
    }
  }

  .backdrop { fill: var(--backdrop); }
  .cloud-sm { fill: var(--grad-0); }
  .cloud-md { fill: var(--grad-1); }
  .cloud-lg { fill: var(--grad-2); }
  .hill     { fill: var(--grad-3); fill-opacity: var(--hill-opacity); }
</style>

