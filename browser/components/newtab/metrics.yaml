# Adding a new metric? We have docs for that!
# https://firefox-source-docs.mozilla.org/toolkit/components/glean/user/new_definitions_file.html

---
$schema: moz://mozilla.org/schemas/glean/metrics/2-0-0
$tags:
  - 'Firefox :: New Tab Page'

newtab:
  locale:
    type: string
    description: >
      The application's locale as of when newtab's TelemetryFeed was init.
      Comes from `Services.local.appLocaleAsBCP47`.
      Looks like `en-US`.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1766887
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1786670
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1817105
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1766887
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1786670#c3
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1817105#c11
    data_sensitivity:
      - interaction
    notification_emails:
      - anicholson@mozilla.com
      - chutten@mozilla.com
      - mmccorquodale@mozilla.com
      - najiang@mozilla.com
      - lina@mozilla.com
    expires: never
    send_in_pings:
      - newtab
    lifetime: application

  newtab_category:
    type: string
    description: >
      The current setting of the newtab page.
      One of ["enabled", "disabled", "extension"] or any value from
      SiteClassifier like "known-hijacker" or "social-media".
      Similar to Activity Stream's PAGE_TAKEOVER_DATA event's
      `newtab_url_category`.
      Sampled once after newtab init.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1786612
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1817105
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1786612
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1817105#c11
    data_sensitivity:
      - technical
    notification_emails:
      - anicholson@mozilla.com
      - chutten@mozilla.com
      - mmccorquodale@mozilla.com
      - najiang@mozilla.com
      - lina@mozilla.com
    expires: never
    send_in_pings:
      - newtab
    lifetime: application

  homepage_category:
    type: string
    description: >
      The current setting of the home page.
      One of ["enabled", "disabled", "extension"] or any value from
      SiteClassifier like "known-hijacker" or "social-media".
      Similar to Activity Stream's PAGE_TAKEOVER_DATA event's
      `home_url_category`.
      Sampled once after newtab init.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1786612
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1817105
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1786612
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1817105#c11
    data_sensitivity:
      - technical
    notification_emails:
      - anicholson@mozilla.com
      - chutten@mozilla.com
      - mmccorquodale@mozilla.com
      - najiang@mozilla.com
      - lina@mozilla.com
    expires: never
    send_in_pings:
      - newtab
    lifetime: application

  opened:
    type: event
    description: >
      Recorded when newtab UI is opened via `about:newtab` or `about:home` or
      `about:welcome` and has been made visible (see `visibility_event_rcvd_ts`
      in
      [detect-user-session-start.js](https://searchfox.org/firefox-main/source/browser/components/newtab/content-src/lib/detect-user-session-start.js)).
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1766887
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1786670
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1817105
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1766887
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1786670#c3
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1817105#c11
    data_sensitivity:
      - interaction
    notification_emails:
      - anicholson@mozilla.com
      - chutten@mozilla.com
      - mmccorquodale@mozilla.com
      - najiang@mozilla.com
      - lina@mozilla.com
    expires: never
    extra_keys:
      newtab_visit_id: &newtab_visit_id
        description: >
          The id of this newtab visit.
          Allows you to separate multiple simultaneous newtabs and
          build an event timeline of actions taken from this newtab.
        type: string
      source:
        description: >
          The source that opened this newtab.
          One of
            * `about:newtab`
            * `about:home`
            * `about:welcome`
            * `other`
          (See `ONBOARDING_ALLOWED_PAGE_VALUES`).
        type: string
      window_inner_height:
        description: >
          The height of the page window at time of load.
        type: string
      window_inner_width:
        description: >
          The width of the page window at time of load.
        type: string
    send_in_pings:
      - newtab

  closed:
    type: event
    description: >
      Recorded when newtab UI is closed by
      * navigation
      * closing the tab

      Doesn't mean that the newtab was ever visible to a user.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1766887
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1786670
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1817105
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1766887
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1786670#c3
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1817105#c11
    data_sensitivity:
      - interaction
    notification_emails:
      - anicholson@mozilla.com
      - chutten@mozilla.com
      - mmccorquodale@mozilla.com
      - najiang@mozilla.com
      - lina@mozilla.com
    expires: never
    extra_keys:
      newtab_visit_id: *newtab_visit_id
    send_in_pings:
      - newtab

  blocked_sponsors:
    type: string_list
    description: >
      The advertiser names that have been dismissed by the user.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1828234
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1828234#c1
    data_sensitivity:
      - interaction
    notification_emails:
      - anicholson@mozilla.com
      - chutten@mozilla.com
      - mmccorquodale@mozilla.com
      - najiang@mozilla.com
      - lina@mozilla.com
      - ttran@mozilla.com
    expires: never
    send_in_pings:
      - newtab
    lifetime: application

  sov_allocation:
    type: string_list
    description: >
      The partner group assignment for sov
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1840311
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1840311#c3
    data_sensitivity:
      - technical
    notification_emails:
      - anicholson@mozilla.com
      - chutten@mozilla.com
      - mmccorquodale@mozilla.com
      - najiang@mozilla.com
      - lina@mozilla.com
      - ttran@mozilla.com
    expires: never
    send_in_pings:
      - newtab
    lifetime: application

  tooltip_click:
    type: event
    description: >
      Recorded when a feature highlight tooltip is opened.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1888983
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1888983
    data_sensitivity:
      - interaction
    notification_emails:
      - sdowne@mozilla.com
    expires: never
    extra_keys:
      newtab_visit_id: *newtab_visit_id
      feature: &feature
        description: The feature highlight that was interacted with.
        type: string
    send_in_pings:
      - newtab

  topic_selection_open:
    type: event
    description: >
      Recorded when the topic selection modal is opened
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1896004
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1896004
    data_sensitivity:
      - interaction
    notification_emails:
      - nbarrett@mozilla.com
      - mcrawford@mozilla.com
    expires: never
    extra_keys:
      newtab_visit_id: *newtab_visit_id
    send_in_pings:
      - newtab

  topic_selection_dismiss:
    type: event
    description: >
      Recorded when the topic selection modal is dismissed (topics are not saved)
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1896004
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1896004
    data_sensitivity:
      - interaction
    notification_emails:
      - nbarrett@mozilla.com
      - mcrawford@mozilla.com
    expires: never
    extra_keys:
      newtab_visit_id: *newtab_visit_id
    send_in_pings:
      - newtab

  topic_selection_topics_saved:
    type: event
    description: >
      Recorded when topics are saved from the topics selection modal
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1896004
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1896004
    data_sensitivity:
      - interaction
    notification_emails:
      - nbarrett@mozilla.com
      - mcrawford@mozilla.com
    expires: never
    extra_keys:
      newtab_visit_id: *newtab_visit_id
      topics:
        description: >
          list of topics that were saved by user
        type: string
      previous_topics:
        description: >
          list of previous topics that were saved, an empty string
          means no previous topics were saved
        type: string
      first_save:
        description: >
          whether or not it is the user's first time setting topics
        type: boolean
    send_in_pings:
      - newtab

  selected_topics:
      type: string_list
      description: >
        The list of topics the user selected
      bugs:
        - https://bugzilla.mozilla.org/show_bug.cgi?id=1907152
      data_reviews:
        - https://bugzilla.mozilla.org/show_bug.cgi?id=1907152
      data_sensitivity:
        - interaction
      notification_emails:
        - nbarrett@mozilla.com
        - mcrawford@mozilla.com
      expires: never
      send_in_pings:
        - newtab
      lifetime: application

  wallpaper_click:
    type: event
    description: >
      Recorded when a user clicks on a wallpaper option
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1896004
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1896004
    data_sensitivity:
      - interaction
    notification_emails:
      - nbarrett@mozilla.com
      - mcrawford@mozilla.com
    expires: never
    extra_keys:
      selected_wallpaper:
        description: >
          Which wallpaper has been selected by the user
          Will be the title of a Wallpaper or 'none' for users
          that reset the background to default
        type: string
      had_previous_wallpaper:
        description: >
          Whether or not user had a previously set wallpaper
        type: boolean
      had_uploaded_previously:
        description: >
          Whether or not user had a previously uploaded a custom wallpaper
        type: boolean
      newtab_visit_id: *newtab_visit_id
    send_in_pings:
      - newtab

  wallpaper_saved_add:
    type: event
    description: >
      Recorded when an image is added to the "Your images" folder. Sent by the
      parent process once the image is really saved, so an upload the parent
      refuses is not counted. Covers an image someone added and a Picture of
      the Day they kept. A Firefox wallpaper kept for them when it was retired
      is saved during a background sync with no page to attribute it to, so it
      is not counted here. Applying a picture already saved is reported as a
      selection rather than another save.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2067845
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2067845
    data_sensitivity:
      - interaction
    notification_emails:
      - dgrant@mozilla.com
    expires: never
    extra_keys:
      wallpaper_source:
        description: >
          Where the image came from: "custom" for an image someone added,
          "potd" for a Picture of the Day they kept
        type: string
      saved_wallpaper_count:
        description: >
          How many wallpapers the user has saved once this one is in
        type: quantity
      newtab_visit_id: *newtab_visit_id
    send_in_pings:
      - newtab

  wallpaper_saved_click:
    type: event
    description: >
      Recorded when a wallpaper from the "Your images" folder has been applied.
      Sent by the parent process once the image is really applied, so a request
      the parent refuses is not counted. A saved wallpaper can be a file the
      user uploaded, a Picture of the Day they chose to keep, or a Firefox
      wallpaper kept for them when it was retired. Recorded in addition to
      wallpaper_click, which reports every saved wallpaper as "custom" and so
      cannot tell them apart; the two together describe one selection, not two.
      Carries no name of any kind. An image someone added is known only by a
      number, and a kept picture is known by its own description.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2067845
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2067845
    data_sensitivity:
      - interaction
    notification_emails:
      - dgrant@mozilla.com
    expires: never
    extra_keys:
      saved_wallpaper_count:
        description: >
          How many wallpapers the user has saved at the time of the click
        type: quantity
      wallpaper_source:
        description: >
          Where the picked image came from: "custom" for an image someone
          added, "potd" for a Picture of the Day they kept, "builtin" for a
          Firefox wallpaper kept for them when it was retired
        type: string
      newtab_visit_id: *newtab_visit_id
    send_in_pings:
      - newtab

  wallpaper_saved_remove:
    type: event
    description: >
      Recorded when a wallpaper has been removed from the "Your images" folder.
      Sent by the parent process once the image is really gone, so a removal
      that fails is not counted. A saved wallpaper can be a file the user
      uploaded, a Picture of the Day they chose to keep, or a Firefox wallpaper
      kept for them when it was retired. Carries no name of any kind.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2067845
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2067845
    data_sensitivity:
      - interaction
    notification_emails:
      - dgrant@mozilla.com
    expires: never
    extra_keys:
      saved_wallpaper_count:
        description: >
          How many wallpapers the user has saved after the removal
        type: quantity
      was_applied:
        description: >
          Whether the removed wallpaper was the one currently on the page
        type: boolean
      wallpaper_source:
        description: >
          Where the removed image came from: "custom" for a file the user
          uploaded, "potd" for a Picture of the Day they kept, or "builtin"
          for a Firefox wallpaper kept when it was retired
        type: string
      newtab_visit_id: *newtab_visit_id
    send_in_pings:
      - newtab

  wallpaper_highlight_cta_click:
    type: event
    description: >
      Recorded when a user clicks the CTA on the wallpaper feature highlight
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1900854
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1900854
    data_sensitivity:
      - interaction
    notification_emails:
      - mcrawford@mozilla.com
    expires: never
    extra_keys:
      newtab_visit_id: *newtab_visit_id
    send_in_pings:
      - newtab

  wallpaper_highlight_dismissed:
    type: event
    description: >
      Recorded when a user dismisses the wallpaper feature highlight
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1900854
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1900854
    data_sensitivity:
      - interaction
    notification_emails:
      - mcrawford@mozilla.com
    expires: never
    extra_keys:
      newtab_visit_id: *newtab_visit_id
    send_in_pings:
      - newtab

  wallpaper_category_click:
    type: event
    description: >
      Recorded when a user clicks a wallpaper category option
    bugs:
     - https://bugzilla.mozilla.org/show_bug.cgi?id=1900420
    data_reviews:
     - https://bugzilla.mozilla.org/show_bug.cgi?id=1900420
    data_sensitivity:
      - interaction
    notification_emails:
     - nbarrett@mozilla.com
    expires: never
    extra_keys:
      selected_category:
        description: >
          Which wallpaper category selected by user
        type: string
      newtab_visit_id: *newtab_visit_id
    send_in_pings:
      - newtab

  customize_panel_open:
    type: event
    description: >
      Recorded when the customize panel becomes visible, whichever control
      or message opened it.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2066344
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2066344
    data_sensitivity:
      - interaction
    notification_emails:
      - npypchenko@mozilla.com
    expires: never
    extra_keys:
      newtab_visit_id: *newtab_visit_id
    send_in_pings:
      - newtab

  customize_panel_subpanel_open:
    type: event
    description: >
      Recorded when one of the customize panel's subpanels becomes visible,
      whether opened from the panel, from a widget's context menu, or by a
      message deep link.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2066344
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2066344
    data_sensitivity:
      - interaction
    notification_emails:
      - npypchenko@mozilla.com
    expires: never
    extra_keys:
      newtab_visit_id: *newtab_visit_id
      panel:
        description: >
          Which subpanel opened. One of themes_management,
          wallpaper_categories, sections_management, widgets_management,
          the ids of CUSTOMIZE_SUBPANELS in
          browser/extensions/newtab/content-src/lib/constants.mjs.
        type: string
    send_in_pings:
      - newtab

  appearance_explore_more_themes_click:
    type: event
    description: >
      Recorded when the user clicks Explore more themes in the customize
      panel's themes subpanel, which opens the about:addons themes list.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2066344
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2066344
    data_sensitivity:
      - interaction
    notification_emails:
      - npypchenko@mozilla.com
    expires: never
    extra_keys:
      newtab_visit_id: *newtab_visit_id
    send_in_pings:
      - newtab

  weather_change_display:
    type: event
    description: >
      Recorded when a user changes the weather display.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1895797
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1895797
    data_sensitivity:
      - interaction
    notification_emails:
      - mcrawford@mozilla.com
    expires: never
    extra_keys:
      weather_display_mode: &weather_display_mode
        description: >
          Which display mode is selected.
        type: string
      newtab_visit_id: *newtab_visit_id
    send_in_pings:
      - newtab

  weather_enabled:
    lifetime: application
    type: boolean
    description: >
      Whether the weather widget is enabled on the newtab.
      Corresponds to the value of the
      `browser.newtabpage.activity-stream.showWeather` pref.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1899340
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1899340
    data_sensitivity:
      - interaction
    notification_emails:
      - mcrawford@mozilla.com
      - sdowne@mozilla.com
    expires: never
    send_in_pings:
      - newtab

  weather_open_provider_url:
    type: event
    description: >
      Recorded when a user opens a link to the Weather provider website.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1895797
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1895797
    data_sensitivity:
      - interaction
    notification_emails:
      - mcrawford@mozilla.com
    expires: never
    extra_keys:
      newtab_visit_id: *newtab_visit_id
    send_in_pings:
      - newtab

  weather_impression:
      type: event
      description: >
        Recorded when the weather widget is viewed
      bugs:
        - https://bugzilla.mozilla.org/show_bug.cgi?id=1898275
      data_reviews:
        - https://bugzilla.mozilla.org/show_bug.cgi?id=1895797
      data_sensitivity:
        - interaction
      notification_emails:
        - mcrawford@mozilla.com
      expires: never
      extra_keys:
        newtab_visit_id: *newtab_visit_id
      send_in_pings:
        - newtab

  weather_load_error:
      type: event
      description: >
        Recorded when the weather widget is not available
      bugs:
        - https://bugzilla.mozilla.org/show_bug.cgi?id=1898275
      data_reviews:
        - https://bugzilla.mozilla.org/show_bug.cgi?id=1895797
      data_sensitivity:
        - interaction
      notification_emails:
        - mcrawford@mozilla.com
      expires: never
      extra_keys:
        newtab_visit_id: *newtab_visit_id
      send_in_pings:
        - newtab

  weather_location_selected:
      type: event
      description: >
        Recorded when a user selects a location for weather widget
      bugs:
        - https://bugzilla.mozilla.org/show_bug.cgi?id=1900103
      data_reviews:
        - https://bugzilla.mozilla.org/show_bug.cgi?id=1900103
      data_sensitivity:
        - interaction
      notification_emails:
        - nbarrett@mozilla.com
      expires: never
      extra_keys:
        newtab_visit_id: *newtab_visit_id
      send_in_pings:
        - newtab

  weather_opt_in_selection:
      type: event
      description: >
        Recorded when a user answers the location opt-in prompt
      bugs:
        - https://bugzilla.mozilla.org/show_bug.cgi?id=1989875
      data_reviews:
        - https://bugzilla.mozilla.org/show_bug.cgi?id=1989875
      data_sensitivity:
        - interaction
      notification_emails:
        - rhamoui@mozilla.com
      expires: never
      extra_keys:
        user_selection:
          description: >
           User's selection when interacting with weather opt-in.
          type: string
        newtab_visit_id: *newtab_visit_id
      send_in_pings:
        - newtab

  weather_detect_location:
      type: event
      description: >
        Recorded when a user selects 'detect my location' from weather context menu
      bugs:
        - https://bugzilla.mozilla.org/show_bug.cgi?id=1992647
      data_reviews:
        - https://bugzilla.mozilla.org/show_bug.cgi?id=1992647
      data_sensitivity:
        - interaction
      notification_emails:
        - rhamoui@mozilla.com
      expires: never
      extra_keys:
        newtab_visit_id: *newtab_visit_id
      send_in_pings:
        - newtab

  sections_impression:
    type: event
    description: >
      Recorded when a section is viewport and triggers an impression event
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1927916
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1938215
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1927916
    data_sensitivity:
      - interaction
    notification_emails:
      - nbarrett@mozilla.com
      - mcrawford@mozilla.com
    expires: never
    extra_keys:
      newtab_visit_id: *newtab_visit_id
      section_position:
        description: >
          position of section on newtab
        type: string
      is_section_followed: &is_section_followed
        description: >
          If click belongs in a section, if that section is followed
        type: boolean
      content_redacted:
        description: >
          Are content details sent separately in the newtab_content ping
