      is_section_followed:
        description: >
          If click belongs in a section, if that section is followed
        type: boolean
      variant_id: *variant_id
      source_section_id: *source_section_id
      layout_name: *layout_name
      dwell_time:
        description: >
          Active dwell time on the opened story, in milliseconds, multiplied by
          1 + Laplace(b) noise, rounded, and limited to between 0 and 60000. A
          value of 60000 means 60 seconds or more. The scale b is 0.05 unless
          set otherwise through Nimbus. Recorded for organic story clicks only.

          A story the user was still reading when the ping was submitted
          reports the time read so far, and is not distinguished from one the
          user had left.

          Absent when the dwell time feature is off, when the story was never
          looked at (opened in a background tab and closed, or not yet switched
          to when the ping was submitted), when it was opened in a private
          window, and when the click could not be matched to a page that
          loaded, which covers failed loads and opens that never produce a
          content browser.

          A click dropped by the daily or weekly organic cap takes its dwell
          time with it, so the dwell time is missing non-uniformly for users
          who click a lot.

          When the click's story was replaced by a random one from the feed,
          the dwell time is still the time spent on the story actually opened,
          reported against the replacement's corpus_item_id.
        type: quantity
    send_in_pings:
      - newtab-content

