contextual.services.topsites:
  impression:
    type: labeled_counter
    description: >
      A keyed uint recording how many times the user has viewed the
      sponsored TopSites on the newtab page. The key is a combination of
      the source and the placement of the TopSites tile (1-based). such as
      'urlbar_1', 'newtab_2'.
      This metric was generated to correspond to the Legacy Telemetry
      scalar contextual.services.topsites.impression.
    bugs:
      - https://bugzil.la/1688698
    data_reviews:
      - https://bugzil.la/1688698
    notification_emails:
      - najiang@mozilla.com
    expires: never
    telemetry_mirror: CONTEXTUAL_SERVICES_TOPSITES_IMPRESSION

  click:
    type: labeled_counter
    description: >
      A keyed uint recording how many times the user has clicked on the
      sponsored TopSites on the newtab page. The key is a combination of
      the source and the placement of the TopSites tile (1-based). such as
      'urlbar_1', 'newtab_2'.
      This metric was generated to correspond to the Legacy Telemetry
      scalar contextual.services.topsites.click.
    bugs:
      - https://bugzil.la/1688698
    data_reviews:
      - https://bugzil.la/1688698
    notification_emails:
      - najiang@mozilla.com
    expires: never
    telemetry_mirror: CONTEXTUAL_SERVICES_TOPSITES_CLICK

# Mirrors the ads_client category defined by the vendored component in
# third_party/application-services/components/ads-client/metrics.yaml. That file
# is only consumed by the mobile Glean gradle plugin, so desktop has to
# redeclare the metrics here to get them into FOG. Keep both in sync: the labels
# come from MozAdsTelemetryWrapper in the component's src/ffi/telemetry.rs.
# Bug 2012752 is adding a way for shared Rust components to record metrics
# directly; once that lands on Desktop this duplication can go away.
ads_client:
  build_cache_error:
    type: labeled_string
    description: >
      Errors encountered when building the HTTP cache, labeled by error type.
      The string value contains the error message or error type.
    labels:
      - builder_error
      - database_error
      - empty_db_path
      - invalid_max_size
      - invalid_ttl
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2058567
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2058567
    data_sensitivity:
      - technical
    notification_emails:
      - ahanot@mozilla.com
      - llisi@mozilla.com
      - toast@mozilla.com
    expires: never

  client_error:
    type: labeled_string
    description: >
      Errors encountered when using the ads client, labeled by operation type.
      The string value contains the error message or error type. Errors are
      recorded even if they are propagated to the consumer.
    labels:
      - record_click
      - record_impression
      - report_ad
      - request_ads
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2058567
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2058567
    data_sensitivity:
      - interaction
    notification_emails:
      - ahanot@mozilla.com
      - llisi@mozilla.com
      - toast@mozilla.com
    expires: never

  client_operation_total:
    type: labeled_counter
    description: >
      The total number of operations attempted by the ads client, labeled by
      operation type. Used as the denominator for client_operation_success_rate.
    labels:
      - new
      - record_click
      - record_impression
      - report_ad
      - request_ads
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2058567
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2058567
    data_sensitivity:
      - interaction
    notification_emails:
      - ahanot@mozilla.com
      - llisi@mozilla.com
      - toast@mozilla.com
    expires: never

  deserialization_error:
    type: labeled_string
    description: >
      Deserialization errors encountered when parsing AdResponse data,
      labeled by error type. The string value contains the error message or
      details. Invalid ad items are skipped but these errors are tracked for
      monitoring data quality issues.
    labels:
      - invalid_ad_item
      - invalid_array
      - invalid_structure
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2058567
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2058567
    data_sensitivity:
      - technical
    notification_emails:
      - ahanot@mozilla.com
      - llisi@mozilla.com
      - toast@mozilla.com
    expires: never

  http_cache_outcome:
    type: labeled_string
    description: >
      The total number of outcomes encountered during read operations on the
      http cache, labeled by type. The string value contains the error message
      or error type.
    labels:
      - cleanup_failed
      - hit
      - lookup_failed
      - miss_not_cacheable
      - miss_stored
      - no_cache
      - store_failed
      - trim_failed
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2058567
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2058567
    data_sensitivity:
      - technical
    notification_emails:
      - ahanot@mozilla.com
      - llisi@mozilla.com
      - toast@mozilla.com
    expires: never
