      - https://bugzilla.mozilla.org/show_bug.cgi?id=2012821
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2085959
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2012821
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2085959
    data_sensitivity:
      - interaction
    notification_emails:
      - mcrawford@mozilla.com
    expires: never
    extra_keys:
      newtab_visit_id: *newtab_visit_id
      widget_size: *widget_size
      action_type:
        description: >
          Type of container action. (hide_all, change_size_all,
          change_row_visibility, feedback, remove_all_from_home).
          remove_all_from_home moves every widget on the Home space back to the
          Widgets space without turning any off.
        type: string
      action_value:
        description: >
          Optional value for the action.
        type: string
    send_in_pings:
      - newtab

  widgets_enabled_list:
    type: string_list
    description: >
      The list of widget telemetry names currently enabled by the user.
      Recorded at startup and whenever a widget is enabled or disabled.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2015530
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2015530
    data_sensitivity:
      - interaction
    notification_emails:
      - mcrawford@mozilla.com
    expires: never
    lifetime: application
    send_in_pings:
      - newtab

  widgets_home_list:
    type: string_list
    description: >
      The list of widget telemetry names pinned to the Home space that it
      currently shows. Recorded at startup and whenever the user pins or
      unpins a widget or a widget is enabled or disabled. Only set in layouts
      where users pin widgets to Home, so an empty list means nothing is
      pinned there.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2085959
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2085959
    data_sensitivity:
      - interaction
    notification_emails:
      - mcrawford@mozilla.com
      - jbrown@mozilla.com
    expires: never
    lifetime: application
    send_in_pings:
      - newtab

  page_layout_variant:
    type: string
    description: >
      The name of the newtab page layout variant the client is assigned, for
      layout experimentation. One of nova-full-width,
      side-by-side-content-lead, side-by-side-widgets-lead,
      side-by-side-content-lead-five, side-by-side-widgets-lead-five,
      spaces-buttons-top, spaces-buttons-bottom, spaces-thematic-v1,
      spaces-preview-kit, spaces-preview-illustrated, spaces-preview-cards,
      auto-minimize-widgets or widgets-ad-large. The -five variants reach five
      card columns counting the widgets column, the others four. The spaces
      variants split the band into separately-navigable panels; the buttons-
      ones differ only in where the segmented control sits, while
      spaces-thematic-v1 names its panels for interests and puts the
      side-by-side pair inside each one. The auto-minimize-widgets variant
      collapses the widgets section to its title row shortly after load. The
      widgets-ad-large variant puts a large sponsored card at the end of the
      first widget row. At one card column it sits second instead. Reports the
      assigned variant whether or not the page can currently render it, and
      covers variants set by pref as well as by a Nimbus train-hop
      configuration.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2061741
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2071407
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2061741
    data_sensitivity:
      - technical
    notification_emails:
      - mcrawford@mozilla.com
    expires: never
    lifetime: application
    send_in_pings:
      - newtab

  spaces_switch:
    type: event
    description: >
      Recorded when the user navigates from one newtab space to another, in the
      spaces page layout variants. Not recorded for the space the page opens on,
      only for switches away from it, so the count is the number of deliberate
      navigations.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2061742
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2061742
    data_sensitivity:
      - interaction
    notification_emails:
      - sdowne@mozilla.com
    expires: never
    extra_keys:
      newtab_visit_id: *newtab_visit_id
      space:
        description: >
          The space navigated to. One of stories, widgets or activity in the
          V1 spaces variants, or a thematic space id configured via Nimbus.
        type: string
      previous_space:
        description: >
          The space navigated away from, same values as space.
        type: string
      method:
        description: >
          Which control was used: tab (the segmented control), keyboard (arrow
          keys on the segmented control), swipe (horizontal wheel, shift plus
          wheel, or a touch drag), arrow (the edge arrows in
          spaces-floating-arrows), preview_tab (a tab, in the spaces-preview
          variants or a thematic config with the preview on) or peek (the
          neighbouring space's preview in spaces-peek).
        type: string
    send_in_pings:
      - newtab

