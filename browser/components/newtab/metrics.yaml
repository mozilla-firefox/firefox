          a piece of content scheduled for a specific day on a specific surface.
        type: string
      corpus_item_id: &corpus_item_id
        description: >
          A content identifier.
          For organic Newtab recommendations it is an opaque id produced by
          Newtab's recommendation systems that corresponds uniquely to the URL.
          This is the replacement for scheduled_corpus_item_id.
        type: string
      received_rank: &received_rank
        description: The rank or order of the recommendation at the time it was sent to the client.
        type: quantity
      recommended_at: &recommended_at
        description: The time in milliseconds the recomendation was recommended at.
        type: quantity
      section_position:
        description: >
          If click belongs in a section, the numeric position of the section
        type: string
      is_section_followed: *is_section_followed
      layout_name: *layout_name
      card_column: &card_column
        description: >
          The 1-based grid column the card occupied at the time of the event.
          A card spanning several columns reports its leftmost one.
        type: quantity
      is_ad_eligible_position:
        description: >
          Recorded as true when the position this card occupied is one an ad is
          allowed to fill, and omitted otherwise. Never recorded when sponsored
          content is turned off, either by the user or by Mozilla, since no
          position can hold an ad then. Independent of `is_sponsored`, which
          reports whether this particular card is an ad: an ad-eligible position
          that no ad was available for is filled with organic content and still
          reports true.
        type: boolean
      content_redacted:
        description: >
          Are content details sent separately in the newtab_content ping
        type: boolean
