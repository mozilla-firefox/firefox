# Adding a new metric? We have docs for that!
# https://firefox-source-docs.mozilla.org/toolkit/components/glean/user/new_definitions_file.html

---
$schema: moz://mozilla.org/schemas/glean/metrics/2-0-0
$tags:
  - "Core :: Machine Learning"

smart_window:
  chat_submit:
    type: event
    description: |
      Recorded when the user submits a chat entry
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2015626
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2009615
    data_reviews:
      - https://phabricator.services.mozilla.com/D282873
    data_sensitivity:
      - interaction
    notification_emails: &emails
      - firefox-ai-and-ml@mozilla.com
    expires: never
    extra_keys:
      chat_id: &chat_id
        type: string
        description: >
          UUID for this smart window session. Unique identifier for each chat conversation
      detected_intent: &detected_intent
        type: string
        description: >
          What was the detected intent for the request: navigate, search, chat, or action
      length: &length
        type: quantity
        unit: characters
        description: >
          Number of characters submitted
      location: &location
        type: string
        description: >
          Which input was used: fullpage, sidebar, or urlbar
      mentions:
        type: quantity
        unit: count
        description: >
          Number of mentions in the request
      message_seq: &message_seq
        type: quantity
        unit: count
        description: >
          Number of messages in that chat
      model: &model
        type: string
        description: >
          Model selected by the user
      submit_type: &submit_type
        type: string
        description: >
          How the request was submitted: button, enter, follow-up, shortcuts, starter, or suggestion
      tabs:
        type: quantity
        unit: count
        description: >
          Number of tabs selected
      turn_number: &turn_number
        type: quantity
        unit: count
        description: >
          Current chat turn number
      chat_version: &chat_version
        type: string
        description: >
          Version of chat prompt used for this request

  search_submit:
    type: event
    description: |
      Recorded when the user runs a search query
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2009615
    data_reviews:
      - https://phabricator.services.mozilla.com/D288855
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      chat_id: *chat_id
      detected_intent: *detected_intent
      length: *length
      location: *location
      message_seq: *message_seq
      model: *model
      provider:
        type: string
        description: >
          Search provider used in the request
      submit_type: *submit_type

  navigate_submit:
    type: event
    description: |
      Recorded when the user navigates to a URL
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2009615
    data_reviews:
      - https://phabricator.services.mozilla.com/D288855
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      chat_id: *chat_id
      detected_intent: *detected_intent
      length: *length
      location: *location
      message_seq: *message_seq
      model: *model
      submit_type: *submit_type

  # Chat Assistant
  chat_previous_session:
    type: event
    description: |
      User clicks on previous session button
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2022629
    data_reviews:
      - https://phabricator.services.mozilla.com/D287197
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      tabs:
        type: quantity
        unit: count
        description: >
          Number of tabs restored

  history_displayed:
    type: event
    description: |
      Results from Ask History are displayed to the user
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2022629
    data_reviews:
      - https://phabricator.services.mozilla.com/D287197
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      location: *location
      chat_id: *chat_id
      message_seq: *message_seq
      total: &total
        type: quantity
        unit: count
        description: >
          Number of history entries displayed
      reason: &history_reason
        type: string
        description: >
          What triggered the history display: ask or restore

  history_click:
    type: event
    description: |
      User clicks on a history result
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2022629
    data_reviews:
      - https://phabricator.services.mozilla.com/D287197
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      location: *location
      chat_id: *chat_id
      message_seq: *message_seq
      total: *total
      position: &position
        type: quantity
        unit: count
        description: >
          Position of the entry that was clicked

  chat_retrieved:
    type: event
    description: |
      User retrieves a chat from history
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2022629
    data_reviews:
      - https://phabricator.services.mozilla.com/D287197
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      location: *location
      chat_id: *chat_id
      message_seq: *message_seq
      time_delta:
        type: quantity
        unit: ms
        description: >
          Elapsed time in milliseconds between last updated chat session completion and retrieval

  quick_prompt_displayed:
    type: event
    description: |
      User is presented with one or more quick prompts
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2022629
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2062688
    data_reviews:
      - https://phabricator.services.mozilla.com/D282482
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      location: *location
      chat_id: *chat_id
      message_seq: *message_seq
      prompts:
        type: quantity
        unit: count
        description: >
          Number of prompts displayed
      resume_prompts:
        type: quantity
        unit: count
        description: >
          Number of displayed prompts that were resume pills

  quick_prompt_clicked:
    type: event
    description: |
      Recorded when the user selects a prompt suggestion in smart window mode
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2022629
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2062688
    data_reviews:
      - https://phabricator.services.mozilla.com/D282482
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      location: *location
      chat_id: *chat_id
      message_seq: *message_seq
      starter: &starter
        type: boolean
        description: >
          Boolean indicating if the prompt is a conversation starter, as opposed to a follow-up
      starter_type:
        type: string
        description: >
          The type of prompt that was clicked: default, resume, or followup

  get_page_content:
    type: event
    description: |
      Browser reads the contents of a tab to include in chat result
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2022629
    data_reviews:
      - https://phabricator.services.mozilla.com/D287197
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      location: *location
      chat_id: *chat_id
      message_seq: *message_seq
      length:
        type: quantity
        unit: count
        description: >
          Number of characters read from the page
      time:
        type: quantity
        unit: ms
        description: >
          Time to process the request

  link_click:
    type: event
    description: |
      User clicks a link within the response
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2022629
    data_reviews:
      - https://phabricator.services.mozilla.com/D287197
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      location: *location
      chat_id: *chat_id
      message_seq: *message_seq

  memory_removed_panel:
    type: event
    description: |
      User removes a single memory from the memories panel
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2022629
    data_reviews:
      - https://phabricator.services.mozilla.com/D287197
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      memories:
        type: quantity
        unit: count
        description: >
          Total number of memories still present after the removal
      trigger:
        type: string
        description: >
          The location where the removal occurred (assistant, settings)
      in_use:
        type: quantity
        unit: count
        description: >
          Number of memories still applied to the assistant message after the removal. Null when the trigger is "settings"

  memory_applied:
    type: event
    description: |
      Triggered when a memory is used as part of query to provide response/results to user
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2022629
    data_reviews:
      - https://phabricator.services.mozilla.com/D287197
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      location: *location
      chat_id: *chat_id
      message_seq: *message_seq

  memory_applied_click:
    type: event
    description: |
      User clicks on memories applied tooltip
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2022629
    data_reviews:
      - https://phabricator.services.mozilla.com/D287197
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      location: *location
      chat_id: *chat_id
      message_seq: *message_seq

  retry_no_memories:
    type: event
    description: |
      User selects retry without memories
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2022629
    data_reviews:
      - https://phabricator.services.mozilla.com/D287197
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      location: *location
      chat_id: *chat_id
      message_seq: *message_seq

  memories_toggle:
    type: event
    description: |
      Recorded when the user clicks the toggle to turn memories on or off for that chat
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2022629
    data_reviews:
      - https://phabricator.services.mozilla.com/D287197
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      location: *location
      chat_id: *chat_id
      message_seq: *message_seq
      memories:
        type: quantity
        unit: count
        description: >
          Total number of memories available
      toggle: &toggle
        type: boolean
        description: >
          Whether the memories feature is enabled or not. True for turning on and false for turning off

  search_handoff:
    type: event
    description: |
      A search toolcall is made due to assistant requiring more information to respond to a prompt
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2024869
    data_reviews:
      - https://phabricator.services.mozilla.com/D287975
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      location: *location
      chat_id: *chat_id
      message_seq: *message_seq
      provider:
        type: string
        description: >
          The provider used for the search handoff, for example "google" or "bing"
      model:
        type: string
        description: >
          Model selected by the user

  tool_call:
    type: event
    description: |
      The assistant invokes a tool. The tool_name extra identifies which tool;
      the prompt_version extra captures the Remote Settings configuration
      version for the chat feature so tool-call behavior can be correlated
      with prompt revisions during debugging.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2041835
    data_reviews:
      - https://phabricator.services.mozilla.com/D302170
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      location: *location
      chat_id: *chat_id
      message_seq: *message_seq
      tool_name:
        type: string
        description: >
          Name of the invoked tool, e.g. "run_search", "get_open_tabs",
          "search_browsing_history", "get_user_memories"
      model: *model
      prompt_version:
        type: string
        description: >
          Remote Settings prompt configuration version, or empty if unavailable
      error:
        type: string
        description: >
          Canonical tool-call error code, or empty on success

  model_request:
    type: event
    description: |
      A request is made to the backend model
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2021947
    data_reviews:
      - https://phabricator.services.mozilla.com/D287710
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      location: *location
      chat_id: *chat_id
      message_seq: *message_seq
      request_id: &request_id
        type: string
        description: >
          Identifier to be used to cross reference with backend telemetry
      detected_intent: *detected_intent
      intent: &intent
        type: string
        description: >
          Intent of the request
      tokens: &tokens
        type: quantity
        unit: count
        description: >
          number of tokens processed to fulfill the request
      memories:
        type: quantity
        unit: count
        description: >
          Number of memories included in the response

  model_response:
    type: event
    description: |
      A response is received from the backend model
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2021947
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2035241
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2040801
    data_reviews:
      - https://phabricator.services.mozilla.com/D287710
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      location: *location
      chat_id: *chat_id
      message_seq: *message_seq
      request_id: *request_id
      intent: *intent
      tokens: *tokens
      memories:
        type: quantity
        unit: count
        description: >
          Number of memories included in the response
      latency:
        type: quantity
        unit: ms
        description: >
          Time in ms to start processing the request
      duration:
        type: quantity
        unit: ms
        description: >
          Time in ms to process the request
      error: &error
        type: string
        description: >
          Canonical chat error name, or empty on success
      http_status:
        type: quantity
        unit: count
        description: >
          HTTP status from the inference back-end, or 0 if no response
      model: *model
      is_retry:
        type: boolean
        description: >
          True when this response (success or failure) was produced by a
          user-initiated retry of a previous turn

  client_error:
    type: event
    description: |
      A client-side runtime or render failure was observed in the Smart Window
      UI (Lit lifecycle, markdown rendering, malformed message data, or other
      uncaught UI runtime errors).
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2040803
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2040803#c5
    data_sensitivity:
      - technical
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      location: *location
      chat_id: *chat_id
      message_seq: *message_seq
      model: *model
      source:
        type: string
        description: >
          The Smart Window surface the failure originated from: lit-render,
          markdown, message-data, or uncaught
      name:
        type: string
        description: >
          Error name (e.g. TypeError, SyntaxError, or a custom Error name)
      message:
        type: string
        description: >
          Sanitized stable error message key. This is not the raw exception
          message.
      filename:
        type: string
        description: >
          Source file the error originated from, or empty if unknown
      lineno:
        type: quantity
        unit: count
        description: >
          Line number in the source file the error originated from, or 0 if
          unknown

  chat_storage:
    type: quantity
    unit: bytes
    description: |
      Size of the chat storage
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2024507
    data_reviews:
      - https://phabricator.services.mozilla.com/D288707
    data_sensitivity:
      - technical
    notification_emails: *emails
    expires: never

  memories_count:
    type: labeled_quantity
    description: |
      Number of memories stored for a user, split by source
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2024507
    data_reviews:
      - https://phabricator.services.mozilla.com/D288707
    data_sensitivity:
      - technical
    notification_emails: *emails
    expires: never
    labels:
      - history
      - conversation
      - session

  memories_last_updated:
    type: datetime
    description: |
      Date when memories were last updated
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2024507
    data_reviews:
      - https://phabricator.services.mozilla.com/D288707
    data_sensitivity:
      - technical
    notification_emails: *emails
    expires: never

  onboarding_screen_impression:
    type: event
    description: |
      Recorded when onboarding screen is displayed in smart window mode
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2009613
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2009613
    data_sensitivity:
      - interaction
    notification_emails: *emails
    extra_keys:
      message_id:
        description: >
          Identifier for the onboarding screen that is displayed, for example
          'AI_WINDOW_WELCOME_0_AI_WINDOW_INTRO_WW' for the welcome screen,
          'AI_WINDOW_WELCOME_1_AI_WINDOW_CHOOSE_MODEL_WW' for the model selection screen
        type: string
    expires: never

  onboarding_model_selected:
    type: event
    description: |
      Recorded when user selects a model for Smart Window during onboarding
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2009613
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2009613
    data_sensitivity:
      - interaction
    notification_emails: *emails
    extra_keys:
      model:
        description: >
          Identifier for the model tile clicked by the user during onboarding,
          for example: '1', '2', '3'
        type: string
    expires: never

  onboarding_model_navigate:
    type: event
    description: |
      Recorded when user clicks next on the model selection screen
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2009613
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2009613
    data_sensitivity:
      - interaction
    notification_emails: *emails
    extra_keys:
      model:
        description: >
          Identifier for the selected model during onboarding when user clicks done,
          for example: '1', '2', '3'
        type: string
    expires: never

  onboarding_memories_navigate:
    type: event
    description: |
      Recorded when user clicks next on the memories onboarding screen
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2032998
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2044126
    data_reviews:
      - https://phabricator.services.mozilla.com/D296747
      - https://phabricator.services.mozilla.com/D304658
    data_sensitivity:
      - interaction
    notification_emails: *emails
    extra_keys:
      source:
        description: >
          Comma-separated list of memory checkbox ids the user had selected
          when clicking next, for example: 'memories-chats,memories-browsing'.
          Empty string if the user deselects all options
        type: string
    expires: never

  onboarding_memories_settings:
    type: event
    description: |
      Records memories checklist selections made by user on the memories onboarding screen
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2032998
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2032998
    data_sensitivity:
      - interaction
    notification_emails: *emails
    extra_keys:
      source:
        description: >
          Comma-separated list of memory checkbox ids the user had selected
          when clicking done, for example: 'memories-chats,memories-browsing'.
          Empty string if the user deselects all options
        type: string
    expires: never

  onboarding_setdefault_navigate:
    type: event
    description: |
      Recorded when user clicks done on the set default onboarding screen
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2037220
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2044126
    data_reviews:
      - https://phabricator.services.mozilla.com/D300448
      - https://phabricator.services.mozilla.com/D304658
    data_sensitivity:
      - interaction
    notification_emails: *emails
    extra_keys:
      source:
        description: >
          Comma-separated list of set default checkbox ids the user had selected
          when clicking done, for example: 'set-default-window'.
          Empty string if the user deselects all options
        type: string
    expires: never

  onboarding_setdefault_settings:
    type: event
    description: |
      Records set default checklist selections made by user on the set default onboarding screen
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2037220
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2037220
    data_sensitivity:
      - interaction
    notification_emails: *emails
    extra_keys:
      source:
        description: >
          Comma-separated list of set default checkbox ids the user had selected
          when clicking done, for example: 'set-default-window'.
          Empty string if the user deselects all options
        type: string
    expires: never

  onboarding_back_navigate:
    type: event
    description: |
      Recorded when user clicks back on an onboarding screen
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2037220
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2037220
    data_sensitivity:
      - interaction
    notification_emails: *emails
    extra_keys:
      message_id:
        description: >
          Identifier of the onboarding screen the user navigated back from
        type: string
    expires: never

  onboarding_complete:
    type: event
    description: |
      Indicates if user completed onboarding successfully
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2009613
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2044126
    data_reviews:
      - https://phabricator.services.mozilla.com/D287028
      - https://phabricator.services.mozilla.com/D304658
    data_sensitivity:
      - interaction
    notification_emails: *emails
    extra_keys:
      model:
        description: >
          Final model selected on the model onboarding screen,
          for example: '1', '2', '3'
        type: string
      memory_source:
        description: >
          Final value from the last memories navigate, a comma-separated list
          of memory checkbox ids the user had selected, for example:
          'memories-chats,memories-browsing'. Empty string if the user
          deselects all options
        type: string
      setdefault_source:
        description: >
          Final value from the last set default navigate, a comma-separated
          list of set default checkbox ids the user had selected, for example:
          'set-default-window'. Empty string if the user deselects all options
        type: string
    expires: never

  open_window:
    type: event
    description: |
      Recorded when a Smart Window is opened
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2009610
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2037980
    data_reviews:
      - https://phabricator.services.mozilla.com/D285902
      - https://phabricator.services.mozilla.com/D299196
    data_sensitivity:
      - interaction
    notification_emails: *emails
    extra_keys:
      trigger:
        type: string
        description: >
          The reason the Smart Window was opened. One of: switch, menu, new_window, open_browser, undo_close, or keyboard_shortcut
      fxa:
        type: boolean
        description: >
          Whether the user is signed in to their Firefox Account
      onboarding:
        type: boolean
        description: >
          Whether the user saw firstrun onboarding when opening Smart Window. True if onboarding has not yet been completed.
      opened_tabs:
