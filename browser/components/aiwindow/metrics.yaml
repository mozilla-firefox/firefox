---
$schema: moz://mozilla.org/schemas/glean/metrics/2-0-0
$tags:
  - "Core :: Machine Learning"

smart_window:
  chat_submit:
    type: event
    description: |
      Recorded when the user submits a chat entry
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2015626
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2009615
    data_reviews:
      - https://phabricator.services.mozilla.com/D282873
    data_sensitivity:
      - interaction
    notification_emails: &emails
      - firefox-ai-and-ml@mozilla.com
    expires: never
    extra_keys:
      chat_id: &chat_id
        type: string
        description: >
          UUID for this smart window session. Unique identifier for each chat conversation
      detected_intent: &detected_intent
        type: string
        description: >
          What was the detected intent for the request: navigate, search, chat, or action
      length: &length
        type: quantity
        unit: characters
        description: >
          Number of characters submitted
      location: &location
        type: string
        description: >
          Which input was used: fullpage, sidebar, or urlbar
      mentions:
        type: quantity
        unit: count
        description: >
          Number of mentions in the request
      message_seq: &message_seq
        type: quantity
        unit: count
        description: >
          Number of messages in that chat
      model: &model
        type: string
        description: >
          Model selected by the user
      submit_type: &submit_type
        type: string
        description: >
          How the request was submitted: button, enter, follow-up, menu, resume,
          retry, shortcuts, starter, or suggestion
      tabs:
        type: quantity
        unit: count
        description: >
          Number of tabs selected
      turn_number: &turn_number
        type: quantity
        unit: count
        description: >
          Current chat turn number
      chat_version: &chat_version
        type: string
        description: >
          Version of chat prompt used for this request

  search_submit:
    type: event
    description: |
      Recorded when the user runs a search query
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2009615
    data_reviews:
      - https://phabricator.services.mozilla.com/D288855
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      chat_id: *chat_id
      detected_intent: *detected_intent
      length: *length
      location: *location
      message_seq: *message_seq
      model: *model
      provider:
        type: string
        description: >
          Search provider used in the request
      submit_type: *submit_type

  navigate_submit:
    type: event
    description: |
      Recorded when the user navigates to a URL
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2009615
    data_reviews:
      - https://phabricator.services.mozilla.com/D288855
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      chat_id: *chat_id
      detected_intent: *detected_intent
      length: *length
      location: *location
      message_seq: *message_seq
      model: *model
      submit_type: *submit_type

  # Chat Assistant
  chat_previous_session:
    type: event
    description: |
      User clicks on previous session button
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2022629
    data_reviews:
      - https://phabricator.services.mozilla.com/D287197
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      tabs:
        type: quantity
        unit: count
        description: >
          Number of tabs restored

  history_displayed:
    type: event
    description: |
      Results from Ask History are displayed to the user
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2022629
    data_reviews:
      - https://phabricator.services.mozilla.com/D287197
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      location: *location
      chat_id: *chat_id
      message_seq: *message_seq
      total: &total
        type: quantity
        unit: count
        description: >
          Number of history entries displayed
      reason: &history_reason
        type: string
        description: >
          What triggered the history display: ask or restore

  history_click:
    type: event
    description: |
      User clicks on a history result
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2022629
    data_reviews:
      - https://phabricator.services.mozilla.com/D287197
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      location: *location
      chat_id: *chat_id
      message_seq: *message_seq
      total: *total
      position: &position
        type: quantity
        unit: count
        description: >
          Position of the entry that was clicked

  chat_retrieved:
    type: event
    description: |
      User retrieves a chat from history
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2022629
    data_reviews:
      - https://phabricator.services.mozilla.com/D287197
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      location: *location
      chat_id: *chat_id
      message_seq: *message_seq
      time_delta:
        type: quantity
        unit: ms
        description: >
          Elapsed time in milliseconds between last updated chat session completion and retrieval

  quick_prompt_displayed:
    type: event
    description: |
      User is presented with one or more quick prompts
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2022629
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2062688
    data_reviews:
      - https://phabricator.services.mozilla.com/D282482
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      location: *location
      chat_id: *chat_id
      message_seq: *message_seq
      prompts:
        type: quantity
        unit: count
        description: >
          Number of prompts displayed
      resume_prompts:
        type: quantity
        unit: count
        description: >
          Number of displayed prompts that were resume pills

  quick_prompt_clicked:
    type: event
    description: |
      Recorded when the user selects a prompt suggestion in smart window mode
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2022629
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2062688
    data_reviews:
      - https://phabricator.services.mozilla.com/D282482
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      location: *location
      chat_id: *chat_id
      message_seq: *message_seq
      starter: &starter
        type: boolean
        description: >
          Boolean indicating if the prompt is a conversation starter, as opposed to a follow-up
      starter_type:
        type: string
        description: >
          The type of prompt that was clicked: default, resume, or followup

  quick_prompt_dismissed:
    type: event
    description: |
      Recorded when the user dismisses a resume-activity starter pill
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2064739
    data_reviews:
      - https://phabricator.services.mozilla.com/D321683
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      chat_id: *chat_id

  get_page_content:
    type: event
    description: |
      Browser reads the contents of a tab to include in chat result
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2022629
    data_reviews:
      - https://phabricator.services.mozilla.com/D287197
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      location: *location
      chat_id: *chat_id
      message_seq: *message_seq
      length:
        type: quantity
        unit: count
        description: >
          Number of characters read from the page
      time:
        type: quantity
        unit: ms
        description: >
          Time to process the request

  link_click:
    type: event
    description: |
      User clicks a link within the response
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2022629
    data_reviews:
      - https://phabricator.services.mozilla.com/D287197
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      location: *location
      chat_id: *chat_id
      message_seq: *message_seq

  aitab_open:
    type: event
    description: |
      The user opens a generated page from its chat card, the first time
      from the choose card or again from the completed card.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2069135
    data_reviews:
      - https://phabricator.services.mozilla.com/D329058
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      chat_id: *chat_id
      open_target:
        type: string
        description: >
          Where the page opens: "current" or "new".
      card_state:
        type: string
        description: >
          The card the open came from: "choose" for the first open,
          "complete" for a later open from the finished card.

  aitab_view:
    type: event
    description: |
      about:smartpage finishes looking up a generated page. The outcome is
      the status the page shows. The event is sent after the component
      renders, without waiting for the font. The font extra records
      whether the heading face was installed at that point.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2069135
    data_reviews:
      - https://phabricator.services.mozilla.com/D329058
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      outcome:
        type: string
        description: >
          "ready", "unavailable", or "error".
      font:
        type: string
        description: >
          Heading font status at render: "ready" when the face was
          added, "unavailable" when it has not been added yet,
          "error" when installing the face already failed.

  aitab_link_click:
    type: event
    description: |
      The user opens a link from a generated page.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2069135
    data_reviews:
      - https://phabricator.services.mozilla.com/D329058
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      component_type:
        type: string
        description: >
          The component name recorded for creation, for example "Header"
          or "List_column". "unknown" when the click is outside those blocks.
      result:
        type: string
        description: >
          "switch" when an existing tab was focused, "new" when a tab
          was opened, "error" when that attempt failed.

  aitab_delete:
    type: event
    description: |
      The user deletes a generated page that was still stored.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2069135
    data_reviews:
      - https://phabricator.services.mozilla.com/D329058
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never

  memory_removed_panel:
    type: event
    description: |
      User removes a single memory from the memories panel
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2022629
    data_reviews:
      - https://phabricator.services.mozilla.com/D287197
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      memories:
        type: quantity
        unit: count
        description: >
          Total number of memories still present after the removal
      trigger:
        type: string
        description: >
          The location where the removal occurred (assistant, settings)
      in_use:
        type: quantity
        unit: count
        description: >
          Number of memories still applied to the assistant message after the removal. Null when the trigger is "settings"

  memory_applied:
    type: event
    description: |
      Triggered when a memory is used as part of query to provide response/results to user
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2022629
    data_reviews:
      - https://phabricator.services.mozilla.com/D287197
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      location: *location
      chat_id: *chat_id
      message_seq: *message_seq

  memory_applied_click:
    type: event
    description: |
      User clicks on memories applied tooltip
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2022629
    data_reviews:
      - https://phabricator.services.mozilla.com/D287197
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      location: *location
      chat_id: *chat_id
      message_seq: *message_seq

  retry_no_memories:
    type: event
    description: |
      User selects retry without memories
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2022629
    data_reviews:
      - https://phabricator.services.mozilla.com/D287197
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      location: *location
      chat_id: *chat_id
      message_seq: *message_seq

  memories_toggle:
    type: event
    description: |
      Recorded when the user clicks the toggle to turn memories on or off for that chat
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2022629
    data_reviews:
      - https://phabricator.services.mozilla.com/D287197
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      location: *location
      chat_id: *chat_id
      message_seq: *message_seq
      memories:
        type: quantity
        unit: count
        description: >
          Total number of memories available
      toggle: &toggle
        type: boolean
        description: >
          Whether the memories feature is enabled or not. True for turning on and false for turning off

  search_handoff:
    type: event
    description: |
      A search toolcall is made due to assistant requiring more information to respond to a prompt
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2024869
    data_reviews:
      - https://phabricator.services.mozilla.com/D287975
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      location: *location
      chat_id: *chat_id
      message_seq: *message_seq
      provider:
        type: string
        description: >
          The provider used for the search handoff, for example "google" or "bing"
      model:
        type: string
        description: >
          Model selected by the user

  tool_call:
    type: event
    description: |
      The assistant requests a tool call. Recorded for successful and failed
      executions, blocked or invalid requests, and calls skipped or aborted
      before execution. The error extra distinguishes these outcomes.
      The tool_name extra identifies the requested tool;
      the prompt_version extra captures the Remote Settings configuration
      version for the chat feature so tool-call behavior can be correlated
      with prompt revisions during debugging.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2041835
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2068252
    data_reviews:
      - https://phabricator.services.mozilla.com/D302170
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2068252
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      location: *location
      chat_id: *chat_id
      message_seq: *message_seq
      tool_name:
        type: string
        description: >
          Name of the requested tool, e.g. "run_search", "get_open_tabs",
          "search_browsing_history", "get_user_memories"
      model: *model
      prompt_version:
        type: string
        description: >
          Remote Settings prompt configuration version, or empty if unavailable
      error:
        type: string
        description: >
          Canonical tool-call error code, or empty on success.
          "duplicate_search" and "memories_disabled" identify calls blocked
          before execution. "invalid_arguments" means the arguments could not
          be parsed or prepared. "skipped" means the call was not executed
          because another tool was selected to finish the turn. "aborted"
          means the call was not started because the response was stopped.
          "execution_failed" covers thrown errors and tools that report a
          failure by returning an error-bearing result, as search_the_web does.
          For the reason a search failed, see the error extra on
          smart_window.search_the_web

  model_request:
    type: event
    description: |
      A request is made to the backend model
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2021947
    data_reviews:
      - https://phabricator.services.mozilla.com/D287710
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      location: *location
      chat_id: *chat_id
      message_seq: *message_seq
      request_id: &request_id
        type: string
        description: >
          Identifier to be used to cross reference with backend telemetry
      detected_intent: *detected_intent
      intent: &intent
        type: string
        description: >
          Intent of the request
      tokens: &tokens
        type: quantity
        unit: count
        description: >
          number of tokens processed to fulfill the request
      memories:
        type: quantity
        unit: count
        description: >
          Number of memories included in the response

  model_response:
    type: event
    description: |
      A response is received from the backend model
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2021947
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2035241
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2040801
    data_reviews:
      - https://phabricator.services.mozilla.com/D287710
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      location: *location
      chat_id: *chat_id
      message_seq: *message_seq
      request_id: *request_id
      intent: *intent
      tokens: *tokens
      memories:
        type: quantity
        unit: count
        description: >
          Number of memories included in the response
      latency:
        type: quantity
        unit: ms
        description: >
          Time in ms to start processing the request
      duration:
        type: quantity
        unit: ms
        description: >
          Time in ms to process the request
      error: &error
        type: string
        description: >
          Canonical chat error name, or empty on success
      http_status:
        type: quantity
        unit: count
        description: >
          HTTP status from the inference back-end, or 0 if no response
      model: *model
      is_retry:
        type: boolean
        description: >
          True when this response (success or failure) was produced by a
          user-initiated retry of a previous turn

  time_to_first_character:
    type: event
    description: |
      Recorded when the first character of an assistant response is rendered
      after a chat request is submitted
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2073242
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2073242
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      location: *location
      chat_id: *chat_id
      message_seq: *message_seq
      request_id: *request_id
      model: *model
      latency:
        type: quantity
        unit: ms
        description: >
          Time from response request start to the first rendered assistant character

  client_error:
    type: event
    description: |
      A client-side runtime or render failure was observed in the Smart Window
      UI (Lit lifecycle, markdown rendering, malformed message data, or other
      uncaught UI runtime errors).
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2040803
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2040803#c5
    data_sensitivity:
      - technical
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      location: *location
      chat_id: *chat_id
      message_seq: *message_seq
      model: *model
      source:
        type: string
        description: >
          The Smart Window surface the failure originated from: lit-render,
          markdown, message-data, or uncaught
      name:
        type: string
        description: >
          Error name (e.g. TypeError, SyntaxError, or a custom Error name)
      message:
        type: string
        description: >
          Sanitized stable error message key. This is not the raw exception
          message.
      filename:
        type: string
        description: >
          Source file the error originated from, or empty if unknown
      lineno:
        type: quantity
        unit: count
        description: >
          Line number in the source file the error originated from, or 0 if
          unknown

  search_the_web:
    type: event
    description: |
      Recorded when the snippets-based search_the_web flow finishes. Reports
      how long the flow took and where that time went, so its latency can be
      attributed to the Exa retrieval or to processing the results, and so
      failed searches can be told apart from searches that returned nothing.

      Only the snippets-based flow is reported. The flow is not recorded when
      it escalates to the Google handoff, which retrieves nothing of its own
      and is covered by smart_window.search_handoff.

      These durations cover the tool call only. The event is recorded when the
      flow returns its snippets to the assistant, before any of it has been
      shown to the user: the assistant then composes the user-facing reply from
      those snippets in a further model turn. For the user-visible turn, which
      includes that reply, see smart_window.model_response.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2068252
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2068252
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      location: *location
      chat_id: *chat_id
      message_seq: *message_seq
      total_duration:
        type: quantity
        unit: ms
        description: >
          Time in ms for the whole search flow, from the flow starting through
          the snippets being returned to the assistant. This starts before the
          query is validated, so on the invalid_query path it covers a run
          during which no search request was ever issued. It excludes the
          argument parsing and action-log setup the chat loop does before
          invoking the flow.
      retrieval_duration:
        type: quantity
        unit: ms
        description: >
          Time in ms for the search provider to return results, including
          acquiring the auth token the request needs. 0 when the flow failed
          before the request was made.
      processing_duration:
        type: quantity
        unit: ms
        description: >
          Time in ms to filter, cap, sanitize and truncate the retrieved
          results and register them for citation. 0 when retrieval failed.
      results_retrieved:
        type: quantity
        unit: count
        description: >
          Number of usable results the search provider returned, after results
          with no URL were discarded. 0 when retrieval failed.
      results_returned:
        type: quantity
        unit: count
        description: >
          Number of results handed to the assistant, never more than
          results_retrieved. 0 on any failure. Two independent causes can make
          this lower than results_retrieved, so the difference between them is
          not a drop rate: results with an unusable URL or too short a snippet
          are discarded, and whatever survives is then capped at a limit below
          the number retrieval requests. When retrieval returns no more than
          that cap and nothing is discarded, the two counts are equal.
      snippet_chars_returned:
        type: quantity
        unit: count
        description: >
          Total characters of snippet text across the results handed to the
          assistant, measured after whitespace is collapsed and the per-snippet
          cap is applied, and counting the single ellipsis character appended
          to a snippet that was cut. A length only, never the text itself.
          0 on any failure. Read with results_returned this distinguishes a few
          substantial snippets from several thin ones.
      snippet_chars_truncated:
        type: quantity
        unit: count
        description: >
          Total characters removed from those snippets by the per-snippet cap,
          summed across the results handed to the assistant. A length only,
          never the text itself. 0 when nothing was cut and on any failure. A
          large value means the assistant is answering from material the cap
          shortened.
      http_status:
        type: quantity
        unit: count
        description: >
          HTTP status from the search back-end, or 0 if no response arrived.
      error:
        type: string
        description: >
          Canonical reason the flow ended. One of: "" on success;
          "invalid_query" when the assistant supplied no usable query;
          "config_error" when the endpoint or auth token was unavailable;
          "timeout" when the search request exceeded its deadline;
          "http_error" when the back-end returned a non-2xx status, whose value
          is in http_status; "network_error" when the request failed below the
          HTTP layer; "retrieval_failed" for any other retrieval failure;
          "no_results" when nothing usable survived processing;
