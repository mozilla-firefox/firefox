    type: event
    description: |
      Recorded when a user interacts with a Smart Window monitor notification.
    bugs: *monitor_bugs
    data_reviews: *monitor_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      <<: *monitor_extra_keys
      click_type:
        type: string
        description: >
          Type of notification interaction: "open_url" (body clicked to open watched page), "snooze" (snooze button clicked), or "dismiss" (dismiss button clicked to mute notifications).

  # The "Organize Tabs" events below describe one user journey, so they share a
  # vocabulary of extra keys. None of them record a URL, a tab title, or a
  # group's generated name: where the amount of text matters, only its length
  # in characters is reported.

  auto_tab_group_menu_opened:
    type: event
    description: |
      Recorded when the user opens the "Organize Tabs" panel. Closing the panel
      with the same toolbar button does not record anything.
    bugs: &atg_bugs
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2058218
    data_reviews: &atg_data_reviews
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2058218
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      source:
        type: string
        description: >
          How the panel was opened: "button" for the toolbar button,
          "callout_click" for the feature callout's "Organize tabs" button,
          "message" for a messaging system surface that did not identify
          itself.
      tabs: &atg_tabs
        type: quantity
        unit: tabs
        description: >
          Number of tabs open in the window.

  auto_tab_grouping_requested:
    type: event
    description: |
      Recorded when opening the panel asks for a fresh set of suggestions.
      Reopening a panel whose suggestions are still valid reuses them and does
      not record this.
    bugs: *atg_bugs
    data_reviews: *atg_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      tabs: *atg_tabs

  auto_tab_grouping_started:
    type: event
    description: |
      Recorded when the on-device model actually starts clustering. A request
      with no start means the feature turned out to be unavailable or the window
      had too few groupable tabs, so nothing ran.
    bugs: *atg_bugs
    data_reviews: *atg_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      tabs: *atg_tabs
      total_length: &atg_total_length
        type: quantity
        unit: characters
        description: >
          Total length, in characters, of the tab titles the model is given.
          The titles themselves are not recorded.

  auto_tab_grouping_completed:
    type: event
    description: |
      Recorded when clustering finishes, whether or not it produced anything.
      Zero groups with success true means the model ran but found nothing worth
      suggesting.
    bugs: *atg_bugs
    data_reviews: *atg_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      tabs: *atg_tabs
      groups: &atg_groups
        type: quantity
        unit: groups
        description: >
          Number of groups suggested.
      grouped_tabs: &atg_grouped_tabs
        type: quantity
        unit: tabs
        description: >
          Number of tabs in the group, or across the groups, this event
          describes.
      success: &atg_success
        type: boolean
        description: >
          Whether the process finished without error.
      error_type: &atg_error_type
        type: string
        description: >
          Why the process failed, empty when success is true: the error's name,
          such as "TypeError", or "TimeoutError" when the process ran out of
          time. Error messages are never recorded, only the name, so no path,
          URL or tab title can appear here.
      total_length:
        type: quantity
        unit: characters
        description: >
          Total length, in characters, of the tab titles in the suggested
          groups. The titles themselves are not recorded.
      time: &atg_time
        type: quantity
        unit: milliseconds
        description: >
          How long the process took.

  auto_tab_group_suggested:
    type: event
    description: |
      Recorded once for each group offered by a completed clustering run, so a
      single run's groups can be told apart by size.
    bugs: *atg_bugs
    data_reviews: *atg_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      grouped_tabs: *atg_grouped_tabs
      total_length:
        type: quantity
        unit: characters
        description: >
          Total length, in characters, of the titles of this group's tabs. The
          titles themselves are not recorded.
      grouped_id: &atg_grouped_id
        type: quantity
        unit: id
        description: >
          Identifies one suggested group so the events about it can be joined
          together. A counter that starts over every session; it says nothing
          about the user, the tabs, or the group's name.

  auto_tab_group_window_display:
    type: event
    description: |
      Recorded when the panel has finished loading and is showing the user what
      it found.
    bugs: *atg_bugs
    data_reviews: *atg_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      suggested_groups:
        type: quantity
        unit: groups
        description: >
          Number of groups listed under "Suggested groups".
      groups:
        type: quantity
        unit: groups
        description: >
          Number of groups listed under "Just created", which the user can still
          ungroup.
      time:
        type: quantity
        unit: milliseconds
        description: >
          How long the user waited between asking for the panel and seeing it
          populated.

  auto_tab_group_accepted:
    type: event
    description: |
      Recorded once for each suggested group the user chooses to create, before
      the group is made.
    bugs: *atg_bugs
    data_reviews: *atg_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      grouped_tabs: *atg_grouped_tabs
      grouped_id: *atg_grouped_id
      source: &atg_accept_source
        type: string
        description: >
          "individual_accept" when the user picked this one group,
          "collective_accept" when they created every suggestion at once.

  auto_tab_group_completed:
    type: event
    description: |
      Recorded once for each accepted group after the tabs have actually been
      grouped, so an accept that failed can be told from one that worked.
    bugs: *atg_bugs
    data_reviews: *atg_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      grouped_tabs: *atg_grouped_tabs
      grouped_id: *atg_grouped_id
      source: *atg_accept_source
      success: *atg_success
      error_type: *atg_error_type

  auto_tab_ungroup_requested:
    type: event
    description: |
      Recorded once for each group the user chooses to ungroup from the "Just
      created" list, before the group is dissolved.
    bugs: *atg_bugs
    data_reviews: *atg_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      grouped_tabs: *atg_grouped_tabs
      grouped_id: *atg_grouped_id
      source: &atg_ungroup_source
        type: string
        description: >
          "collective_ungroup" when the user reversed every group in the "Just
          created" list at once, which is the only way the panel offers today,
          and "individual_ungroup" should it ever offer per-group undo.

  auto_tab_ungroup_completed:
    type: event
    description: |
      Recorded once for each group after it has been dissolved. Ungrouping keeps
      the tabs open.
    bugs: *atg_bugs
    data_reviews: *atg_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      grouped_tabs: *atg_grouped_tabs
      grouped_id: *atg_grouped_id
      source: *atg_ungroup_source
      success: *atg_success
      error_type: *atg_error_type

  close_duplicate_tabs_requested:
    type: event
    description: |
      Recorded when the user picks "Close Duplicate Tabs" in the panel.
    bugs: *atg_bugs
    data_reviews: *atg_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      tabs: *atg_tabs

  close_duplicate_tabs_started:
    type: event
    description: |
      Recorded when the search for duplicate tabs starts.
    bugs: *atg_bugs
    data_reviews: *atg_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      tabs: *atg_tabs
      total_length:
        type: quantity
        unit: characters
        description: >
          Total length, in characters, of the titles of the window's tabs. The
          titles themselves are not recorded.

  close_duplicate_tabs_completed:
    type: event
    description: |
      Recorded when the search for duplicate tabs finishes, before the user is
      asked to confirm closing them.
    bugs: *atg_bugs
    data_reviews: *atg_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      tabs: *atg_tabs
      duplicate_tabs: &atg_duplicate_tabs
        type: quantity
        unit: tabs
        description: >
          Number of tabs found to be duplicates of another open tab.
      success: *atg_success
      error_type: *atg_error_type
      time: *atg_time

  duplicate_tabs_closed:
    type: event
    description: |
      Recorded after the duplicate tabs have been closed. Nothing is recorded if
      the user declines the confirmation prompt, so a completed search with no
      close means they backed out.
    bugs: *atg_bugs
    data_reviews: *atg_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      duplicate_tabs:
        type: quantity
        unit: tabs
        description: >
          Number of duplicate tabs that were closed.
      success: *atg_success
      error_type: *atg_error_type
