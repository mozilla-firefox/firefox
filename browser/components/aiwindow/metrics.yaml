  # The agentic action events below share one vocabulary of extra keys. The
  # agent key names the agent type so every agent, such as research or
  # monitor, can record the same events; only the monitor agent records them
  # today. The spec names tabs, check_frequency and status map to urls,
  # schedule_type and enabled here.

  agentic_action_create_submit:
    type: event
    description: |
      Recorded when the creation of an agentic action is requested, before
      the request is validated. Describes what was submitted, so it carries
      no action_id, age, enabled or prompt_version: the action does not
      exist yet. Always followed by agentic_action_create_complete. chat_id
      and message_seq are only present for chat-originated creations and
      are provided by the front end.
    bugs: &agentic_action_bugs
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2046610
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2072399
    data_reviews: &agentic_action_data_reviews
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2072399
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      agent: &agentic_action_agent
        type: string
        description: >
          Agent type the action belongs to. Always monitor for now; other
          agents, such as research, will record their own values.
      source: &agentic_action_source
        type: string
        description: >
          Surface the request came from: in_line_chat (chat card),
          toolbar_panel, about_page (about:smartwindowtasks) or unknown.
          Tests record test.
      chat_id: *chat_id
      message_seq: *message_seq
      monitors: &agentic_action_monitors
        type: quantity
        unit: count
        description: >
          Number of monitors stored when the event was recorded, or 0 when
          the store could not be loaded.
      urls: &agentic_action_urls
        type: quantity
        unit: count
        description: >
          Number of URLs watched by the monitor (the spec's tabs). On
          agentic_action_create_submit this counts the URLs as submitted,
          before invalid ones are dropped.
      length: &agentic_action_length
        type: quantity
        unit: characters
        description: >
          Number of characters in the monitor prompt.
      schedule_type: &agentic_action_schedule_type
        type: string
        description: >
          Type of schedule used by the monitor: interval, daily or weekly
          (the spec's check_frequency). Absent when the submitted schedule
          type is none of those.
      check_time: &agentic_action_check_time
        type: string
        description: >
          Local wall clock time the monitor checks at, as zero padded HH:MM.
          Only present for daily and weekly schedules.
      check_weekday: &agentic_action_check_weekday
        type: quantity
        unit: weekday
        description: >
          Weekday the monitor checks on, 0 for Sunday through 6 for
          Saturday. Only present for weekly schedules.

  agentic_action_create_complete:
    type: event
    description: |
      Recorded when the creation of an agentic action finishes, whether it
      succeeded or failed. On success the monitor exists and the shared keys
      describe it; on failure the keys repeat the submitted values from
      agentic_action_create_submit. chat_id and message_seq are only present
      for chat-originated creations and are provided by the front end.
    bugs: *agentic_action_bugs
    data_reviews: *agentic_action_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      <<: &agentic_action_extra_keys
        monitors: *agentic_action_monitors
        urls: *agentic_action_urls
        length: *agentic_action_length
        age:
          type: quantity
          unit: ms
          description: >
            Age of the monitor in milliseconds since it was created.
        active_age:
          type: quantity
          unit: ms
          description: >
            Milliseconds since the monitor's current active period began: its
            creation, or the last time it was resumed or edited.
        schedule_type: *agentic_action_schedule_type
        prompt_version:
          type: string
          description: >
            Version of the monitor prompt used for the monitor.
        enabled:
          type: boolean
          description: >
            Whether the monitor is enabled (the spec's status).
        action_id:
          type: string
          description: >
            Random UUID of the monitor the event belongs to, generated on the
            client when the monitor is created. Lets create, run,
            notification and click events be joined per monitor.
        agent: *agentic_action_agent
        check_time: *agentic_action_check_time
        check_weekday: *agentic_action_check_weekday
      source: *agentic_action_source
      chat_id: *chat_id
      message_seq: *message_seq
      success:
        type: boolean
        description: >
          Whether the monitor was created.
      error_code:
        type: string
        description: >
          Why creation failed: limit_reached (the active monitor cap), invalid_input
          (no prompt, no valid URL, too many URLs or a bad schedule),
          storage_error (the IndexedDB write failed), interrupted (the
          browser is shutting down) or unknown_error. Only present when
          success is false. Never a free-form message.

  agentic_action_edit_complete:
    type: event
    description: |
      Recorded when a monitor's definition (title, prompt, watched URLs or
      schedule) is saved, whether or not anything changed. A plain pause or
      resume records agentic_action_pause or agentic_action_resume instead.
      source, chat_id and message_seq are provided by the front end and stay
      unset until it passes them.
    bugs: *agentic_action_bugs
    data_reviews: *agentic_action_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      <<: *agentic_action_extra_keys
      source: *agentic_action_source
      chat_id: *chat_id
      message_seq: *message_seq

  agentic_action_pause:
    type: event
    description: |
      Recorded when a monitor is paused, so it stops running on its schedule
      until resumed: by the user, or by the monitor itself when it hits an
      auto-expiry rule. source, chat_id and message_seq are provided by the
      front end and stay unset until it passes them.
    bugs: *agentic_action_bugs
    data_reviews: *agentic_action_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      <<: *agentic_action_extra_keys
      source: *agentic_action_source
      chat_id: *chat_id
      message_seq: *message_seq
      reason:
        type: string
        description: >
          Why the monitor paused: user (paused from the UI), no_match (it ran
          for the no-match window without its condition being met) or
          max_age (it reached the maximum active lifetime).

  agentic_action_resume:
    type: event
    description: |
      Recorded when a paused monitor is resumed. source, chat_id and
      message_seq are provided by the front end and stay unset until it
      passes them.
    bugs: *agentic_action_bugs
    data_reviews: *agentic_action_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      <<: *agentic_action_extra_keys
      source: *agentic_action_source
      chat_id: *chat_id
      message_seq: *message_seq

  agentic_action_delete:
    type: event
    description: |
      Recorded when a monitor is deleted. enabled tells whether it was
      running or paused at the time. source, chat_id and message_seq are
      provided by the front end and stay unset until it passes them.
    bugs: *agentic_action_bugs
    data_reviews: *agentic_action_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      <<: *agentic_action_extra_keys
      source: *agentic_action_source
      chat_id: *chat_id
      message_seq: *message_seq

  agentic_action_execute_request:
    type: event
    description: |
      Recorded when a monitor run starts, whether the user asked for it or
      the schedule fired. Recorded before the check does any work, so a
      crash or hard shutdown mid-run leaves a request without a terminal
      event: the number of requests is greater than or equal to the number
      of agentic_action_execute_complete plus agentic_action_execute_cancel
      events. A run asked for while another run of the same monitor is in
      progress, and a schedule timer firing for a disabled or not yet due
      monitor, record nothing.
    bugs: *agentic_action_bugs
    data_reviews: *agentic_action_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      <<: *agentic_action_extra_keys
      reason: &agentic_action_reason
        type: string
        description: >
          Why the run happened: manual (the user asked, which includes the
          automatic first check the chat card triggers right after
          creation), trigger_time (the schedule fired less than five minutes
          after the scheduled time) or delayed (the schedule fired five
          minutes or more late, mostly because the browser was closed or
          asleep).
      execution_seq: &agentic_action_execution_seq
        type: quantity
        unit: count
        description: >
          Lifetime run number of the monitor, 1 for its first run and 0 on
          the notification shown at creation, before any run. Counts runs
          since the counter was introduced; monitors created before that
          start from their visible history length. Best effort: a store
          failure can leave the persisted count behind.
      delay: &agentic_action_delay
        type: quantity
        unit: ms
        description: >
          For scheduled runs, how long after the scheduled time the run
          started. A timer that fired on time reports close to zero. A run
          that was already overdue when its timer was armed, such as at
          browser start, reports the missed time plus about one second,
          because overdue timers are armed one second out. Larger values
          mostly measure time the browser was closed or asleep. Absent for
          manual runs and when the stored scheduled time could not be
          parsed.

  agentic_action_execute_start:
    type: event
    description: |
      Recorded when a monitor run hands the check to the model: the watched
      pages were extracted and the prompt was loaded. A request without a
      start failed or was torn down before reaching the model.
    bugs: *agentic_action_bugs
    data_reviews: *agentic_action_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      <<: *agentic_action_extra_keys
      reason: *agentic_action_reason
      execution_seq: *agentic_action_execution_seq
      model: &agentic_action_model
        type: string
        description: >
          Model the check ran with: the model id from the monitor feature
          config, or from the chat config when the monitor config says
          generic, or the custom model name the user entered when a custom
          model is configured. A value of generic means neither config
          named a model and the service picked the default. Absent when the
          run failed before its conversation was built.

  agentic_action_execute_complete:
    type: event
    description: |
      Recorded when a monitor run finishes on its own, successfully or with
      a failure, including a timeout. A run torn down by deleting the
      monitor or shutting down the browser records
      agentic_action_execute_cancel instead.
    bugs: *agentic_action_bugs
    data_reviews: *agentic_action_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      <<: *agentic_action_extra_keys
      reason: *agentic_action_reason
      execution_seq: *agentic_action_execution_seq
      success:
        type: boolean
        description: >
          Whether the monitor run completed successfully.
      error_code:
        type: string
        description: >
          One of the monitor run error codes: network_error, timeout,
          budget_exceeded, rate_limit, request_too_large, max_users_reached,
          upstream_rate_limit, fastly_rate_limit, request_blocked,
          invalid_model, invalid_request, global_budget_exceeded,
          guest_budget_exceeded, max_guests_reached,
          auth_error, content_extraction_error,
          canceled, interrupted, model_error, prompt_load_error or
          unknown_error.
          Only present when success is false. Never a free-form message.
      outcome:
        type: boolean
        description: >
          Whether the monitor condition was met on this run. Only present
          when success is true. A model reply that could not be parsed is
          stored as a successful not-met run, so it counts as false here.
      latency:
        type: quantity
        unit: ms
        description: >
          Time spent in the model call only, excluding page extraction and
          the account token fetch. Only present when the model call
          completed.
      duration: &agentic_action_duration
        type: quantity
        unit: ms
        description: >
          Total time of the run from start to its terminal event, including
          page extraction and the model call.
      model: *agentic_action_model
      delay: *agentic_action_delay

  agentic_action_execute_cancel:
    type: event
    description: |
      Recorded when a monitor run is torn down before it finished because
      the user deleted the monitor mid-run or the browser started shutting
      down. A run that timed out or failed records
      agentic_action_execute_complete with an error_code instead.
    bugs: *agentic_action_bugs
    data_reviews: *agentic_action_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      <<: *agentic_action_extra_keys
      reason: *agentic_action_reason
      execution_seq: *agentic_action_execution_seq
      error_code:
        type: string
        description: >
          Why the run was torn down: canceled (the monitor was deleted) or
          interrupted (browser shutdown). Never a free-form message.
      duration: *agentic_action_duration
      model: *agentic_action_model

  agentic_action_notification_display:
    type: event
    description: |
      Recorded when a desktop notification about a monitor is shown: the
      condition-met or failed-check notification after a run, the one-off
      notification shown right after the monitor is created, or the
      notification shown when the monitor pauses itself after hitting an
      auto-expiry rule. The run's reason is not repeated here; join action_id
      and execution_seq to agentic_action_execute_request for it.
    bugs: &agentic_action_notification_bugs
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2046610
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2072399
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2072692
    data_reviews: *agentic_action_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      <<: *agentic_action_extra_keys
      notification_type: &agentic_action_notification_type
        type: string
        description: >
          Which notification: condition_met (a run met the monitor
          condition), run_failed (a run could not check the page), created
          (the monitor was just created) or expired (the monitor paused
          itself after hitting an auto-expiry rule).
      execution_seq: *agentic_action_execution_seq
      outcome: &agentic_action_notification_outcome
        type: boolean
        description: >
          Always true: the condition-met notification is only shown when the
          condition was met. Absent for the run_failed, created and expired
          notifications.

  agentic_action_notification_close:
    type: event
    description: |
      Recorded when the user interacts with a monitor desktop notification.
      Notifications the user ignores, or that the system closes on its own,
      record nothing. The run's reason is not repeated here; join action_id
      and execution_seq to agentic_action_execute_request for it.
    bugs: *agentic_action_notification_bugs
    data_reviews: *agentic_action_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      <<: *agentic_action_extra_keys
      notification_type: *agentic_action_notification_type
      execution_seq: *agentic_action_execution_seq
      outcome: *agentic_action_notification_outcome
      reason:
        type: string
        description: >
          What the user did: open_url (clicked the body of a condition-met
          or failed-check notification, opening the watched page), snooze
          (hold off checks until the next day), dismiss (mute the monitor's
          notifications), open_tasks (clicked the body of the created or
          expired notification, opening the tasks page) or resume (turned an
          expired monitor back on from its notification).

  # The "Organize Tabs" events below describe one user journey, so they share a
  # vocabulary of extra keys. None of them record a URL, a tab title, or a
  # group's generated name: where the amount of text matters, only its length
  # in characters is reported.

  auto_tab_group_menu_opened:
    type: event
    description: |
      Recorded when the user opens the "Organize Tabs" panel. Closing the panel
      with the same toolbar button does not record anything.
    bugs: &atg_bugs
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2058218
    data_reviews: &atg_data_reviews
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2058218
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      source:
        type: string
        description: >
          How the panel was opened: "button" for the toolbar button,
          "callout_click" for the feature callout's "Organize tabs" button,
          "message" for a messaging system surface that did not identify
          itself.
      tabs: &atg_tabs
        type: quantity
        unit: tabs
        description: >
          Number of tabs open in the window.

  auto_tab_grouping_requested:
    type: event
    description: |
      Recorded when opening the panel asks for a fresh set of suggestions.
      Reopening a panel whose suggestions are still valid reuses them and does
      not record this.
    bugs: *atg_bugs
    data_reviews: *atg_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      tabs: *atg_tabs

  auto_tab_grouping_started:
    type: event
    description: |
      Recorded when the on-device model actually starts clustering. A request
      with no start means the feature turned out to be unavailable or the window
      had too few groupable tabs, so nothing ran.
    bugs: *atg_bugs
    data_reviews: *atg_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      tabs: *atg_tabs
      total_length: &atg_total_length
        type: quantity
        unit: characters
        description: >
          Total length, in characters, of the tab titles the model is given.
          The titles themselves are not recorded.

  auto_tab_grouping_completed:
    type: event
    description: |
      Recorded when clustering finishes, whether or not it produced anything.
      Zero groups with success true means the model ran but found nothing worth
      suggesting.
    bugs: *atg_bugs
    data_reviews: *atg_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      tabs: *atg_tabs
      groups: &atg_groups
        type: quantity
        unit: groups
        description: >
          Number of groups suggested.
      grouped_tabs: &atg_grouped_tabs
        type: quantity
        unit: tabs
        description: >
          Number of tabs in the group, or across the groups, this event
          describes.
      success: &atg_success
        type: boolean
        description: >
          Whether the process finished without error.
      error_type: &atg_error_type
        type: string
        description: >
          Why the process failed, empty when success is true: the error's name,
          such as "TypeError". Error messages are never recorded, only the
          name, so no path, URL or tab title can appear here.
      total_length:
        type: quantity
        unit: characters
        description: >
          Total length, in characters, of the tab titles in the suggested
          groups. The titles themselves are not recorded.
      time: &atg_time
        type: quantity
        unit: milliseconds
        description: >
          How long the process took.

  auto_tab_group_suggested:
    type: event
    description: |
      Recorded once for each group offered by a completed clustering run, so a
      single run's groups can be told apart by size.
    bugs: *atg_bugs
    data_reviews: *atg_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      grouped_tabs: *atg_grouped_tabs
      total_length:
        type: quantity
        unit: characters
        description: >
          Total length, in characters, of the titles of this group's tabs. The
          titles themselves are not recorded.
      grouped_id: &atg_grouped_id
        type: quantity
        unit: id
        description: >
          Identifies one suggested group so the events about it can be joined
          together. A counter that starts over every session; it says nothing
          about the user, the tabs, or the group's name.

  auto_tab_group_window_display:
    type: event
    description: |
      Recorded when the panel has finished loading and is showing the user what
      it found, or, when clustering is slow, what it had by the time it stopped
      waiting.
    bugs: *atg_bugs
    data_reviews: *atg_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      suggested_groups:
        type: quantity
        unit: groups
        description: >
          Number of groups listed under "Suggested groups".
      groups:
        type: quantity
        unit: groups
        description: >
          Number of groups listed under "Just created", which the user can still
          ungroup.
      time:
        type: quantity
        unit: milliseconds
        description: >
          How long the user waited between asking for the panel and seeing it
          populated.
      waited_out:
        type: boolean
        description: >
          True when the panel stopped waiting on clustering before it finished,
          so suggested_groups counts only what was ready then and the run's
          groups fill the panel in later.

  auto_tab_group_accepted:
    type: event
    description: |
      Recorded once for each suggested group the user chooses to create, before
      the group is made.
    bugs: *atg_bugs
    data_reviews: *atg_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      grouped_tabs: *atg_grouped_tabs
      grouped_id: *atg_grouped_id
      source: &atg_accept_source
        type: string
        description: >
          "individual_accept" when the user picked this one group,
          "collective_accept" when they created every suggestion at once.

  auto_tab_group_completed:
    type: event
    description: |
      Recorded once for each accepted group after the tabs have actually been
      grouped, so an accept that failed can be told from one that worked.
    bugs: *atg_bugs
    data_reviews: *atg_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      grouped_tabs: *atg_grouped_tabs
      grouped_id: *atg_grouped_id
      source: *atg_accept_source
      success: *atg_success
      error_type: *atg_error_type

  auto_tab_ungroup_requested:
    type: event
    description: |
      Recorded once for each group the user chooses to ungroup from the "Just
      created" list, before the group is dissolved.
    bugs: *atg_bugs
    data_reviews: *atg_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      grouped_tabs: *atg_grouped_tabs
      grouped_id: *atg_grouped_id
      source: &atg_ungroup_source
        type: string
        description: >
          "collective_ungroup" when the user reversed every group in the "Just
          created" list at once, which is the only way the panel offers today,
          and "individual_ungroup" should it ever offer per-group undo.

  auto_tab_ungroup_completed:
    type: event
    description: |
      Recorded once for each group after it has been dissolved. Ungrouping keeps
      the tabs open.
    bugs: *atg_bugs
    data_reviews: *atg_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      grouped_tabs: *atg_grouped_tabs
      grouped_id: *atg_grouped_id
      source: *atg_ungroup_source
      success: *atg_success
      error_type: *atg_error_type

  close_duplicate_tabs_requested:
    type: event
    description: |
      Recorded when the user picks "Close Duplicate Tabs" in the panel.
    bugs: *atg_bugs
    data_reviews: *atg_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      tabs: *atg_tabs

  close_duplicate_tabs_started:
    type: event
    description: |
      Recorded when the search for duplicate tabs starts.
    bugs: *atg_bugs
    data_reviews: *atg_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      tabs: *atg_tabs
      total_length:
        type: quantity
        unit: characters
        description: >
          Total length, in characters, of the titles of the window's tabs. The
          titles themselves are not recorded.

  close_duplicate_tabs_completed:
    type: event
    description: |
      Recorded when the search for duplicate tabs finishes, before the user is
      asked to confirm closing them.
    bugs: *atg_bugs
    data_reviews: *atg_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      tabs: *atg_tabs
      duplicate_tabs: &atg_duplicate_tabs
        type: quantity
        unit: tabs
        description: >
          Number of tabs found to be duplicates of another open tab.
      success: *atg_success
      error_type: *atg_error_type
      time: *atg_time

  duplicate_tabs_closed:
    type: event
    description: |
      Recorded after the duplicate tabs have been closed. Nothing is recorded if
      the user declines the confirmation prompt, so a completed search with no
      close means they backed out.
    bugs: *atg_bugs
    data_reviews: *atg_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      duplicate_tabs:
        type: quantity
        unit: tabs
        description: >
          Number of duplicate tabs that were closed.
      success: *atg_success
      error_type: *atg_error_type

  form_fill_classify_request:
    type: event
    description: |
      Sent when the context free classification request is dispatched; also the
      invocation record.
    bugs: &smart_form_fill_bugs
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2055066
    data_reviews: &smart_form_fill_data_reviews
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2055066
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      flow_id: &smart_form_fill_flow_id
        type: string
        description: >
          Unique id for this fill invocation; correlates all of its events.
      trigger:
        type: string
        description: >
          How the fill was invoked. Currently only: autofill_menu.
      fields_total:
        type: quantity
        unit: fields
        description: >
          Number of fillable fields detected in the form.
      model:
        type: string
        description: >
          Model used for the classification request.
      prompt_version:
        type: string
        description: >
          Version of the classification prompt config.

  form_fill_classify_response:
    type: event
    description: |
      The classification request completes.
    bugs: *smart_form_fill_bugs
    data_reviews: *smart_form_fill_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      flow_id: *smart_form_fill_flow_id
      page_type:
        type: string
        description: >
          Form type the model classified from the page title and url. One of: travel, registration,
          product_search, or other. Absent when the request failed, and while the
          model does not classify the page yet.
      fields_typed:
        type: quantity
        unit: fields
        description: >
          Number of the fields sent that came back with a valid field type, so neither missing
          nor other/unknown. Absent when the request failed.
      fields_unknown:
        type: quantity
        unit: fields
        description: >
          Number of the fields sent that the model explicitly declined to name, so came back
          as other or unknown. A field with no type at all counts in neither this nor
          fields_typed, so fields_total minus both is how many the response left out.
          Absent when the request failed.
      latency_ms:
        type: quantity
        unit: ms
        description: >
          Time in ms from request to response.
      error:
        type: boolean
        description: >
          True if an error happened.
      error_message:
        type: string
        description: >
          What the failure is attributed to, from a closed set of reasons shared
          with the chat: connectionFailure, fxaTokenUnavailable,
          modelConfigUnavailable, offline, promptLoadFailure or
          remoteSettingsUnavailable. Anything else, including a bug of our own,
          is genericError. Never a free form message, and absent on success.

  form_fill_generate_request:
    type: event
    description: |
      Sent when value generation for a form, which includes browsing context, is dispatched.
      Fields are sent in batches of at most 20, so one event can cover more than one
      model request.
    bugs: *smart_form_fill_bugs
    data_reviews: *smart_form_fill_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      flow_id: *smart_form_fill_flow_id
      tokens_available:
        type: quantity
        unit: tokens
        description: >
          Number of fields for which the client offered a typed value token.
      tabs:
        type: quantity
        unit: tabs
        description: >
          Number of open tabs included as context.
      memories:
        type: quantity
        unit: memories
        description: >
          Number of memories included as context.
      memories_similarity_min:
        type: quantity
        unit: percent
        description: >
          Lowest similarity score of memories included as context, as a percentage rounded to
          the nearest whole one. The score is what memory retrieval ranked the
          memory as. Absent when no memory was included.
      memories_similarity_max:
        type: quantity
        unit: percent
        description: >
          Highest similarity score of those memories, in the same units as
          memories_similarity_min. Absent when no memory was included.
      memories_similarity_avg:
        type: quantity
        unit: percent
        description: >
          Mean similarity score of those memories, in the same units as
          memories_similarity_min. Absent when no memory was included.
      model:
        type: string
        description: >
          Model used for the generation request.
      prompt_version:
        type: string
        description: >
          Version of the generation prompt config.
      threshold:
        type: string
        description: >
          Minimum model confidence a value must clear to be filled.
          A string. One of: low, medium or high.

  form_fill_generate_response:
    type: event
    description: |
      The generation request completes.
    bugs: *smart_form_fill_bugs
    data_reviews: *smart_form_fill_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      flow_id: *smart_form_fill_flow_id
      fields_filled:
        type: quantity
        unit: fields
        description: >
          Number of fields ultimately filled.
      memories_used:
        type: quantity
        unit: memories
        description: >
          Number of memories the model reports having used. Absent when the
          generation failed, since no answer came back to report it.
      memories_used_similarity_min:
        type: quantity
        unit: percent
        description: >
          Lowest similarity score among the memories the model reports having
          used, as a percentage rounded to the nearest whole one. Absent when the
          model used no memory, and when none of the memories it named could be
          matched back to one that was sent.
      memories_used_similarity_max:
        type: quantity
        unit: percent
        description: >
          Highest similarity score among those memories, in the same units as
          memories_used_similarity_min. Absent for the same reasons.
      memories_used_similarity_avg:
        type: quantity
        unit: percent
        description: >
          Mean similarity score among those memories, in the same units as
          memories_used_similarity_min. Absent for the same reasons.
      tabs_used:
        type: quantity
        unit: tabs
        description: >
          Number of the context tabs the model reports having used, out of the
          tabs counted by the request's tabs. Absent when the generation failed,
          since no answer came back to report it.
      batches_total:
        type: quantity
        unit: requests
        description: >
          Number of model requests the fields were split across. Absent when the
          whole generation failed, since the count does not survive the error.
      batches_failed:
        type: quantity
        unit: requests
        description: >
          Number of those requests that failed. A value above 0 with no error
          means the form was only partly filled. Absent when the whole
          generation failed, since the count does not survive the error.
      latency_ms:
        type: quantity
        unit: ms
        description: >
          Time in ms from request to response.
      error:
        type: boolean
        description: >
          True if an error happened.
      error_message:
        type: string
        description: >
          What the failure is attributed to, from a closed set of reasons shared
          with the chat: connectionFailure, fxaTokenUnavailable,
          modelConfigUnavailable, offline, promptLoadFailure or
          remoteSettingsUnavailable. Anything else, including a bug of our own,
          is genericError. Never a free form message, and absent on success..

  form_fill_field:
    type: event
    description: |
      Recorded once per field with the model's decision for it.
    bugs: *smart_form_fill_bugs
    data_reviews: *smart_form_fill_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      flow_id: *smart_form_fill_flow_id
      field_seq:
        type: quantity
        unit: count
        description: >
          Index of the field within the form, to join with its outcome event
          (not a name or content).
      input_type:
        type: string
        description: >
          The field's input type, e.g. text, search, email, tel, or textarea.
      field_kind:
        type: string
        description: >
          Model's inferred field classification from the classification request,
          from a closed enum defined with the models team. Absent when the field
          was not classified.
      pre_llm_field_kind:
        type: string
        description: >
          What the existing autofill system named the field before being sent to
          an LLM. A field name from autofill's own vocabulary, e.g. email, tel or
          given-name. Absent when the autofill system named nothing.
      pre_llm_source:
        type: string
        description: >
          Which autofill heuristic produced pre_llm_field_kind. One of:
          autocomplete, ml, fathom, regex-heuristic, update-heuristic or
          update-heuristic-alternate. Absent when the autofill system named
          nothing.
      pre_llm_confidence:
        type: quantity
        unit: percent
        description: >
          How confident that heuristic was, as a percentage rounded to the
          nearest whole one. Only fathom reports one, so this is absent for
          every other pre_llm_source.
      token_available:
        type: boolean
        description: >
          Boolean, whether the client offered a typed value token for this field.
      token_kind:
        type: string
        description: >
          Type of the offered token, a type and never a value. Absent when no
          token was offered for the field, which token_available also reports.
      source:
        type: string
        description: >
          The model's decision from the generation request. One of: token, generated, or none.
      confidence:
        type: string
        description: >
          Model confidence for this field. A string. One of: low, medium or high.
          Absent when the model returned no decision for the field.
      filled:
        type: boolean
        description: >
          Boolean, whether the field was filled

  form_fill_field_review_outcome:
    type: event
    description: |
      Recorded once per generated field when the user submits the review
      dialog's fill, capturing what the user did with each field.
    bugs: *smart_form_fill_bugs
    data_reviews: *smart_form_fill_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      flow_id: *smart_form_fill_flow_id
      field_seq:
        type: quantity
        unit: count
        description: >
          Index of the field, to join with its decision event.
      outcome:
        type: string
        description: >
          What the user did with the generated value before submitting it. One
          of: kept, edited, or cleared.
      generated_length:
        type: quantity
        unit: characters
        description: >
          Character count of the value the model generated. Only sent when the outcome is edited.
      reviewed_length:
        type: quantity
        unit: characters
        description: >
          Character count of the value the user submitted. Read against
          generated_length it says whether the user cut the generated value down
          or added to it. Only sent when the outcome is edited, as above.

  form_fill_field_outcome:
    type: event
    description: |
      Recorded once per filled field when the fill is torn down (blur, submit, or navigation),
      capturing whether the user kept the value.
    bugs: *smart_form_fill_bugs
    data_reviews: *smart_form_fill_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      flow_id: *smart_form_fill_flow_id
      field_seq:
        type: quantity
        unit: count
        description: >
          Index of the field, to join with its decision event.
      field_kind:
        type: string
        description: >
          Model's inferred field classification, same enum as form_fill_field.
          Absent when the field was not classified.
      source:
        type: string
        description: >
          What filled the field. One of: token or generated.
      confidence:
        type: string
        description: >
          Model confidence for this field. A string. One of: low, medium or high.
          Absent when the model returned no decision for the field.
      outcome:
        type: string
        description: >
          Whether the user kept the value. One of: kept, edited, or cleared.
      filled_length:
        type: quantity
        unit: characters
        description: >
          Character count of the value the fill wrote into the field. This is
          the value as approved in the review dialog, which is not necessarily
          the value the model generated. Sent alongside final_length to give
          that count something to be read against, so only sent when the
          outcome is edited.
      final_length:
        type: quantity
        unit: characters
        description: >
          Character count of the value the field was left with. Read against
          filled_length it says whether the user cut the filled value down or
          added to it, so a value that was consistently too long or too short can
          be told from one that was simply the wrong value. Only sent when the
          outcome is edited, as above.

  form_relevant_tabs_request:
    type: event
    description: |
      Recorded when a request to find relevant tabs for generation is dispatched.
      The request is sent on initialization or when the form is updated.
    bugs: *smart_form_fill_bugs
    data_reviews: *smart_form_fill_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      flow_id: *smart_form_fill_flow_id
      model:
        type: string
        description: >
          Model used for the relevant tabs request.
      prompt_version:
        type: string
        description: >
          Version of the relevant tabs prompt config.
      tabs_sent:
        type: quantity
        unit: tabs
        description: >
          How many tabs were sent in the request.
      threshold:
        type: string
        description: >
          Minimum relevance a tab must reach to be selected as context.
          A string. One of: low, medium or high.

  form_relevant_tabs_response:
    type: event
    description: |
      Recorded when the relevant tabs request is completed.
    bugs: *smart_form_fill_bugs
    data_reviews: *smart_form_fill_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      flow_id: *smart_form_fill_flow_id
      latency_ms:
        type: quantity
        unit: ms
        description: >
          Time in ms from request to response.
      error:
        type: boolean
        description: >
          True if an error happened.
      error_message:
        type: string
        description: >
          What the failure is attributed to, from a closed set of reasons shared
          with the chat: connectionFailure, fxaTokenUnavailable,
          modelConfigUnavailable, offline, promptLoadFailure or
          remoteSettingsUnavailable. Anything else, including a bug of our own,
          is genericError. Never a free form message, and absent on success.
      tabs_selected:
        type: quantity
        unit: tabs
        description: >
          Number of tabs the model returned. Absent when the request failed, or
          when the answer carried no tab list at all.
      tabs_used:
        type: quantity
        unit: tabs
        description: >
          Number of those tabs that were actually included as context.
          Lower than tabs_selected when the model repeated a tab, named
          one that was never offered, rated a tab below the relevance
          threshold, or picked more than the client accepts. Absent when
          the request failed.
      tabs_high:
        type: quantity
        unit: tabs
        description: >
          How many of the tabs the model rated as highly relevant to the form.
          Absent when the request failed.
      tabs_medium:
        type: quantity
        unit: tabs
        description: >
          How many tabs the model rated as medium relevance. Absent when the request
          failed.
      tabs_low:
        type: quantity
        unit: tabs
        description: >
          How many tabs the model rated as low relevance. Absent when the request failed.

  form_relevant_tabs_outcome:
    type: event
    description: |
      Recorded when a fill starts, reporting what the user did with the tabs the
      model picked. A fill the user never started reports nothing. Sent just
      before the round's form_fill_generate_request, so a round whose generation
      never reached the model still reports what the user chose.
    bugs: *smart_form_fill_bugs
    data_reviews: *smart_form_fill_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      flow_id: *smart_form_fill_flow_id
      tabs_final:
        type: quantity
        unit: tabs
        description: >
          Number of tabs the fill actually ran with.
      tabs_kept:
        type: quantity
        unit: tabs
        description: >
          How many of the model's tabs survived into that selection.
      tabs_removed:
        type: quantity
        unit: tabs
        description: >
          How many of the model's tabs the user took out.
      tabs_added:
        type: quantity
        unit: tabs
        description: >
          How many tabs the user added that the model had not picked. The user
          can only add a tab the model chose from, so an addition always means
          the model saw that tab and passed on it.
      editor_opens:
        type: quantity
        unit: opens
        description: >
          How many times the user opened the source editor before this fill
          started.
      editor_result:
        type: string
        description: >
          How the last open of the source editor ended. One of done, cancel, or
          aborted. Absent when the editor was never opened.

  aitab_create_initiate:
    type: event
    description: |
      Recorded when generation of a new AI Tab page starts.
    bugs: &aitab_bugs
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2069132
    data_reviews: &aitab_data_reviews
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2069132
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      num_tabs: &aitab_num_tabs
        type: quantity
        unit: tabs
        description: >
          Number of tabs referenced explicitly. If 0, other page content is
          used.
      how_initiated:
        type: string
        description: >
          How the generation was requested: tab_list, tab_group, chat, or
          chat_followup
      raw_content_len: &aitab_raw_content_len
        type: quantity
        unit: characters
        description: >
          Length in characters of the raw_content argument sent in the
          request, or 0 if missing
      num_tabs_total_attempted:
        type: quantity
        unit: tabs
        description: >
          Number of tabs originally requested, before the tab limit is applied

  aitab_edit_initiate:
    type: event
    description: |
      Recorded when a modification of an existing AI Tab page starts.
    bugs: *aitab_bugs
    data_reviews: *aitab_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys:
      num_tabs: *aitab_num_tabs
      how_initiated:
        type: string
        description: >
          How the modification was requested: chat, refresh, or chat_followup
      raw_content_len: *aitab_raw_content_len

  aitab_create_complete:
    type: event
    description: |
      Recorded when generation of a new AI Tab page finishes, successfully or
      not.
    bugs: *aitab_bugs
    data_reviews: *aitab_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys: &aitab_complete_extra_keys
      is_success:
        type: boolean
        description: >
          Whether a valid page was generated
      error:
        type: string
        description: >
          Canonical error code, or absent on success: no_content, canceled,
          page_load_failed, page_not_found, conversation_unavailable,
          pages_unreadable, nothing_to_change, history_limit, empty_response,
          invalid_json, content_related, invalid_format, or generation_failed
      components_used:
        type: string
        description: >
          JSON-encoded array of the component types in the generated page, in
          the order they are used, each formatted as component_layout (or just
          component when it has no layout). An empty array on failure.
      num_chars_read:
        type: quantity
        unit: characters
        description: >
          Number of characters sent to the model outside of the prompt
          template (page content, focus and modification instructions)
      num_chars_out:
        type: quantity
        unit: characters
        description: >
          Number of characters returned by the model
      seconds_elapsed:
        type: quantity
        unit: seconds
        description: >
          Time taken to generate the page

  aitab_edit_complete:
    type: event
    description: |
      Recorded when a modification of an existing AI Tab page finishes,
      successfully or not.
    bugs: *aitab_bugs
    data_reviews: *aitab_data_reviews
    data_sensitivity:
      - interaction
    notification_emails: *emails
    expires: never
    extra_keys: *aitab_complete_extra_keys
