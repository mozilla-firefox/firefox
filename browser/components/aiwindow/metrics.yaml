  launch_command_invoked:
    type: event
    description: |
      Recorded when a Smart Window launch is requested by a user with Smart
      Window not blocked by AI controls, before any Firefox Accounts sign-in
      flow runs. Captures the intent to use Smart Window, so it can be compared
      against open_window, which is only recorded once the window opens.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2065555
    data_reviews:
      - https://phabricator.services.mozilla.com/D321341
    data_sensitivity:
      - interaction
    notification_emails: *emails
    extra_keys:
      trigger:
        type: string
        description: >
          The entry point that requested the launch. One of: switch, menu,
          keyboard_shortcut, startup, settings, bedrock, asrouter, or other.
          Messaging surfaces may supply their own value instead of asrouter
      fxa:
        type: boolean
        description: >
          Whether the user is signed in to their Firefox Account when the launch
          is requested. False means the launch sends the user through the
          sign-in flow first
      new_window:
        type: boolean
        description: >
          Whether the launch opens a new window instead of switching the current
          window to Smart Window
    expires: never

  signin_flow_started:
    type: event
    description: |
      Recorded when Smart Window sends the user into the Firefox Accounts
      sign-in flow, before the sign-in page is requested. Always paired with a
      signin_flow_completed, which records how the flow ended.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2070652
    data_reviews:
      - https://phabricator.services.mozilla.com/D324742
    data_sensitivity:
      - interaction
    notification_emails: *emails
    extra_keys:
      reason:
        type: string
        description: >
          Why Smart Window access was denied, which is what made the sign-in
          flow necessary. One of: signed_out, no_consent (signed in but has not
          accepted the terms of service), both, or none (the flow was requested
          directly while access was already allowed)
    expires: never

  signin_flow_completed:
    type: event
    description: |
      Recorded when the Firefox Accounts sign-in flow that Smart Window started
      ends, whatever the result. Always follows a signin_flow_started.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2070652
    data_reviews:
      - https://phabricator.services.mozilla.com/D324742
    data_sensitivity:
      - interaction
    notification_emails: *emails
    extra_keys:
      outcome:
        type: string
        description: >
          How the flow ended. One of: completed (the user signed in), abandoned
          (the user closed the sign-in tab or window without finishing), blocked
          (an account cannot be connected, so the sign-in page was never shown),
          or error (the flow threw)
    expires: never

