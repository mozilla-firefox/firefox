[DEFAULT]
prefs = [
  # The Create AI Tab menus open a chat in a background tab, which can
  # otherwise take the preloaded new tab page.
  "browser.newtab.preload=false",
  # head.js sets this only during each test; model requests from the Smart
  # Window new tab page outside one, as in verify reruns, must stay local too.
  "browser.smartwindow.endpoint=http://localhost:0/v1",
]
support-files = [
  "head.js",
]
skip-if = [
  "os == 'linux' && os_version == '24.04' && arch == 'x86_64' && display == 'x11' && tsan", # Bug 2057552
]

["browser_aitab_context_tab_limit.js"]
support-files = [
  "!/browser/components/aiwindow/ui/test/browser/head.js",
  "!/browser/components/aiwindow/ui/test/browser/head_aitab.js",
]
["browser_aitab_context_urls.js"]
support-files = [
  "!/browser/components/aiwindow/ui/test/browser/head.js",
  "!/browser/components/aiwindow/ui/test/browser/head_aitab.js",
]
["browser_aitab_heading_font.js"]
["browser_aitab_page_group_menu_triggers.js"]
support-files = [
  "!/browser/components/aiwindow/ui/test/browser/head.js",
  "!/browser/components/aiwindow/ui/test/browser/head_aitab.js",
  "!/browser/components/aiwindow/ui/test/browser/test_context_url_page.html",
]
["browser_aitab_sidebar.js"]
support-files = ["!/browser/components/aiwindow/ui/test/browser/head.js"]
["browser_aitab_tab_menu_triggers.js"]
support-files = [
  "!/browser/components/aiwindow/ui/test/browser/head.js",
  "!/browser/components/aiwindow/ui/test/browser/head_aitab.js",
]
["browser_aitab_telemetry.js"]
