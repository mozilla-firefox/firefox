# AI window shell, chat and tab tests.
# Smart Window UI tests belong in browser_smartwindow.toml, which runs as a
# separate browser session so neither manifest exhausts a 32-bit address space.
[DEFAULT]
prefs = [
  "browser.newtab.preload=false",
  "browser.search.suggest.enabled=false",
  "browser.urlbar.suggest.searches=false",
  "browser.smartwindow.endpoint=http://localhost:0/v1"
]
support-files = [
  "head.js",
  "head_aitab.js",
  "head_aiwindow_group_tabs_button.js",
  "head_smartformfill_autocomplete.js",
  "head_history_thumbnails.js",
  "head_smartformfill_form_review.js",
  "head_smartformfill_telemetry.js",
  "test_agent_monitor_item_page.html",
  "test_agent_monitor_item.mjs",
  "test_ai_action_result_page.html",
  "test_ai_action_result.mjs",
  "test_ai_action_confirmation_page.html",
  "test_ai_action_confirmation.mjs",
  "test_aitab_table_page.html",
  "test_aitab_table.mjs",
  "test_assistant_message_footer_page.html",
  "test_applied_memories_page.html",
  "test_chat_assistant_citations_page.html",
  "test_chat_assistant_citations.mjs",
