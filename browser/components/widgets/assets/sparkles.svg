<svg xmlns="http://www.w3.org/2000/svg" width="58" height="58" fill="none" viewBox="0 0 58 58">
  <style>
    #Fluid_Sparkle {
      transform-origin: 28.7px 28.7px;
      animation:
        fluid-sparkle-move 2s infinite,
        fluid-sparkle-scale 2s infinite,
        fluid-sparkle-fade 2s infinite;
    }

    #Vector,
    #Vector_2 {
      transform-origin: 26.815px 39.27px;
    }

    #Vector_3,
    #Vector_4 {
      transform-origin: 35.132px 13.567px;
    }

    #Vector {
      animation:
        vector-move 2s infinite,
        vector-scale 2s infinite,
        vector-fade 2s infinite;
    }

    #Vector_2 {
      animation:
        vector-2-move 2s infinite,
        vector-2-scale 2s infinite,
        vector-2-fade 2s infinite;
    }

    #Vector_3 {
      animation:
        vector-3-move 2s infinite,
        vector-3-scale 2s infinite,
        vector-3-fade 2s infinite;
    }

    #Vector_4 {
      animation:
        vector-4-move 2s infinite,
        vector-4-scale 2s infinite,
        vector-4-fade 2s infinite;
    }

    @keyframes fluid-sparkle-move {
      0% {
        translate: 0 15px;
        animation-timing-function: ease;
      }
      50%,
      100% {
        translate: none;
      }
    }

    @keyframes fluid-sparkle-scale {
      0% {
        scale: 0.85;
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      50%,
      100% {
        scale: none;
      }
    }

    @keyframes fluid-sparkle-fade {
      0% {
        opacity: 0;
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      40%,
      100% {
        opacity: 1;
      }
    }

    @keyframes vector-move {
      0% {
        translate: 0 20px;
        rotate: -0.14rad;
        animation-timing-function: ease;
      }
      45%,
      100% {
        translate: none;
        rotate: none;
      }
    }

    @keyframes vector-scale {
      0% {
        scale: 0.6;
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      45%,
      100% {
        scale: none;
      }
    }

    @keyframes vector-fade {
      0% {
        opacity: 0;
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      27%,
      100% {
        opacity: 1;
      }
    }

    @keyframes vector-2-move {
      0%,
      10% {
        translate: 0 25px;
        rotate: 0.105rad;
        animation-timing-function: ease;
      }
      55%,
      100% {
        translate: none;
        rotate: none;
      }
    }

    @keyframes vector-2-scale {
      0%,
      10% {
        scale: 0.6;
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      55%,
      100% {
        scale: none;
      }
    }

    @keyframes vector-2-fade {
      0%,
      10% {
        opacity: 0;
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      37%,
      100% {
        opacity: 1;
      }
    }

    @keyframes vector-3-move {
      0%,
      20% {
        translate: 0 18px;
        rotate: -0.087rad;
        animation-timing-function: ease;
      }
      65%,
      100% {
        translate: none;
        rotate: none;
      }
    }

    @keyframes vector-3-scale {
      0%,
      20% {
        scale: 0.6;
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      65%,
      100% {
        scale: none;
      }
    }

    @keyframes vector-3-fade {
      0%,
      20% {
        opacity: 0;
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      47%,
      100% {
        opacity: 1;
      }
    }

    @keyframes vector-4-move {
      0%,
      27.5% {
        translate: 0 22px;
        rotate: 0.122rad;
        animation-timing-function: ease;
      }
      72.5%,
      100% {
        translate: none;
        rotate: none;
      }
    }

    @keyframes vector-4-scale {
      0%,
      27.5% {
        scale: 0.6;
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      72.5%,
      100% {
        scale: none;
      }
    }

    @keyframes vector-4-fade {
      0%,
      27.5% {
        opacity: 0;
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      54.5%,
      100% {
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #Fluid_Sparkle,
      #Vector,
      #Vector_2,
      #Vector_3,
      #Vector_4 {
        animation: none;
      }
    }
  </style>
