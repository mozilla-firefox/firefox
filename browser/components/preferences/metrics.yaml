aboutpreferences:
  show_initial:
    type: event
    description: >
      This is recorded when a pane is shown direclty. This happens
      with or without a hash in the URL. The "general" pane loads
      without such a hash, when the pane is loaded via the "main"
      entrypoints in the menu system or with shortcuts.
      This event was generated to correspond to the Legacy Telemetry event
      aboutpreferences.show#initial.
    bugs: &aboutpreferences_show_bugs
      - https://bugzil.la/1738187
    data_reviews: &aboutpreferences_show_data_reviews
      - https://bugzil.la/1738187
    notification_emails: &aboutpreferences_show_emails
      - pdahiya@mozilla.com
      - gijs@mozilla.com
    expires: never
    extra_keys: &aboutpreferences_show_extra
      value:
        description: >
          identifier of pane shown.
        type: string
      session:
        description: Identifier for this tab.
        type: string
    telemetry_mirror: Aboutpreferences_Show_Initial

  show_click:
    type: event
    description: >
      This is recorded when a pane is shown when user clicks category
      name inside about:preferences.
      This event was generated to correspond to the Legacy Telemetry event
      aboutpreferences.show#click.
    bugs: *aboutpreferences_show_bugs
    data_reviews: *aboutpreferences_show_data_reviews
    notification_emails: *aboutpreferences_show_emails
    expires: never
    extra_keys: *aboutpreferences_show_extra
    telemetry_mirror: Aboutpreferences_Show_Click

  show_hash:
    type: event
    description: >
      This is recorded when a pane is shown via a hash change in url.
      This event was generated to correspond to the Legacy Telemetry event
      aboutpreferences.show#hash.
    bugs: *aboutpreferences_show_bugs
    data_reviews: *aboutpreferences_show_data_reviews
    notification_emails: *aboutpreferences_show_emails
    expires: never
    extra_keys: *aboutpreferences_show_extra
    telemetry_mirror: Aboutpreferences_Show_Hash

  change:
    type: event
    description: >
      This is recorded when a setting is changed.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2024011
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2024011
    notification_emails:
      - mstriemer@mozilla.com
      - gharp@mozilla.com
    expires: never
    extra_keys:
      setting:
        description: Identifier for the setting.
        type: string
      session:
        description: Identifier for this tab.
        type: string
      pane:
        description: >
          Identifier for the page (paneGeneral, paneSearchResults, etc).
        type: string

  close:
    type: event
    description: >
      This is recorded when the preferences tab is unloaded.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2024011
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2024011
    notification_emails:
      - mstriemer@mozilla.com
      - gharp@mozilla.com
    expires: never
    extra_keys:
      session:
        description: Identifier for this tab.
        type: string

security.preferences.warnings:
  warnings_shown:
    type: event
    description: >
      Recorded when the security warnings card is possibly added to the page
      in about:preferences#privacy. This tracks the count of visible
      security warning items to understand how many issues users are seeing.
      This only fires once per time the settings page is loaded.
    bugs:
      - https://bugzilla.mozilla.org/2007918
    data_reviews:
      - https://bugzilla.mozilla.org/2007918
    notification_emails:
      - bvandersloot@mozilla.com
    expires: never
    extra_keys:
      count:
        description: The number of visible security warning items in the card
        type: quantity
  warning_fixed:
    type: event
    description: >
      Recorded when the user interacts with the "fix" button in the issue box
      item.
    bugs:
      - https://bugzilla.mozilla.org/2007918
    data_reviews:
      - https://bugzilla.mozilla.org/2007918
    notification_emails:
      - bvandersloot@mozilla.com
    expires: never
  warning_dismissed:
    type: event
    description: >
      Recorded when the user interacts with the dismiss button in the issue box
      item.
    bugs:
      - https://bugzilla.mozilla.org/2007918
    data_reviews:
      - https://bugzilla.mozilla.org/2007918
    notification_emails:
      - bvandersloot@mozilla.com
    expires: never

window_lock:
  toggled:
    type: event
    description: >
      Recorded when the user toggles locking private windows when the OS
      session gets locked, starts the screensaver or goes to sleep, through
      the setting in Privacy & Security.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2082471
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2082471
    data_sensitivity:
      - interaction
    notification_emails:
      - mraiber@mozilla.com
    expires: never
    extra_keys:
      checked:
        description: Whether locking private windows got enabled
        type: boolean
