[DEFAULT]
support-files = ["head.js"]
prefs = [
  "browser.highlightToSearch.callout.seen=true",
  "browser.ml.chat.enabled=true",
  "browser.ml.chat.openSidebarOnProviderChange=false",
  "browser.ml.linkPreview.collapsed=false",
  "browser.ml.linkPreview.optin=true",
  "browser.ml.linkPreview.prefetchOnEnable=false",
  "browser.ml.linkPreview.shiftAlt=true",
  "browser.ml.pageAssist.enabled=true",
]

["browser_chat_contextmenu.js"]

["browser_chat_nimbus.js"]

["browser_chat_page.js"]

["browser_chat_page_menus.js"]

["browser_chat_promo.js"]

["browser_chat_prompt.js"]

["browser_chat_request.js"]
support-files = [
  "file_chat-autosubmit.html",
]

["browser_chat_shortcuts.js"]

["browser_chat_shortcuts_callout.js"]

["browser_chat_shortcuts_copy.js"]

["browser_chat_shortcuts_dropdown.js"]

["browser_chat_shortcuts_more_actions.js"]

["browser_chat_shortcuts_search.js"]

["browser_chat_shortcuts_suppression.js"]

["browser_chat_shortcuts_telemetry.js"]

["browser_chat_sidebar.js"]

["browser_chat_sidebar_permissions.js"]
support-files = [
  "file_chat-webrtc.html",
]

["browser_chat_telemetry.js"]
skip-if = [
  "os == 'win' && os_version == '11.26200' && arch == 'x86_64' && opt && verify-standalone",
]

["browser_genai_actors.js"]

["browser_genai_init.js"]

["browser_link_preview.js"]
support-files = [
  "data/readableFr.html",
  "data/readableEn.html",
  "data/encodingWithShiftJIS.html"
]

["browser_link_preview_aifeature_lifecycle.js"]

["browser_link_preview_nimbus.js"]

["browser_link_preview_optin.js"]
support-files = [
  "data/readableFr.html",
  "data/readableEn.html"
]

["browser_link_preview_telemetry.js"]
support-files = [
  "data/readableFr.html",
  "data/readableEn.html"
]

["browser_page_assist_actors.js"]
support-files = [
  "data/readableEn.html"
]

["browser_page_assist_sidebar.js"]
