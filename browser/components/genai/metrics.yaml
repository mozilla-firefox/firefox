      provider:
        type: string
        description: Selected provider id.
      selection:
        type: quantity
        description: Selected text length.
      smart_window:
        type: boolean
        description: Whether the prompt was sent from Smart Window.
      source:
        type: string
        description: Entrypoint for the request, e.g., callout, footer, page.

  provider_change:
    type: event
    description: >
      Chatbot provider UI changed providers.
    bugs:
