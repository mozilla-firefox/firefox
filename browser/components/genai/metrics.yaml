genai.linkpreview:
  # metrics

  ai_optin:
    type: boolean
    lifetime: application
    description: >
      Records if the user has opted-in to use AI for key points generation
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1969012
    data_reviews:
      - https://phabricator.services.mozilla.com/D251779
    data_sensitivity:
      - interaction
    expires: 180
    notification_emails:
      - elee@mozilla.com
    send_in_pings:
      - metrics

  enabled:
    type: boolean
    lifetime: application
    description: >
      Records if the user has link previews enabled
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1951148
    data_reviews:
      - https://phabricator.services.mozilla.com/D243790
    data_sensitivity:
      - interaction
    expires: 180
    notification_emails:
      - elee@mozilla.com
    send_in_pings:
      - metrics

  key_points:
    type: boolean
    lifetime: application
    description: >
      Records if the user defaults to expanded state for key point generation
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1969012
    data_reviews:
      - https://phabricator.services.mozilla.com/D251779
    data_sensitivity:
      - interaction
    expires: 180
    notification_emails:
      - elee@mozilla.com
    send_in_pings:
      - metrics

  shortcut:
    type: string
    lifetime: application
    description: >
      Records which type of shortcut the user selected for Link Previews (comma separated if more than one)
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1969012
    data_reviews:
      - https://phabricator.services.mozilla.com/D251779
    data_sensitivity:
      - interaction
    expires: 180
    notification_emails:
      - elee@mozilla.com
    send_in_pings:
      - metrics

  # events

  card_ai_consent:
    type: event
    description: >
      Recorded when the user interacts with the AI consent dialog
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1951146
    data_reviews:
      - https://phabricator.services.mozilla.com/D249104
    data_sensitivity:
      - interaction
    expires: 180
    notification_emails:
      - elee@mozilla.com
    send_in_pings:
      - events
    extra_keys:
      option:
        type: string
        description: User's response - cancel, continue, or learn

  card_close:
    type: event
    description: >
      Recorded when the user closes the card
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1951148
    data_reviews:
      - https://phabricator.services.mozilla.com/D243790
    data_sensitivity:
      - interaction
    expires: 180
    notification_emails:
      - elee@mozilla.com
    send_in_pings:
      - events
    extra_keys:
      duration:
        type: quantity
        description: Milliseconds the card stayed open
      tab:
        type: string
        description: The type of tab where the event occurred. Potential values home, newtab

  card_link:
    type: event
    description: >
      Recorded when the user clicks on a link from the card
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1951148
    data_reviews:
      - https://phabricator.services.mozilla.com/D243790
    data_sensitivity:
      - interaction
    expires: 180
    notification_emails:
      - elee@mozilla.com
    send_in_pings:
      - events
    extra_keys:
      key_points:
        type: boolean
        description: Whether key points were visible when the link was clicked.
      source:
        type: string
        description: Which link, e.g., error, retry, title, visit
      tab:
        type: string
        description: The type of tab where the event occurred. Potential values home, newtab

  fetch:
    type: event
    description: >
      Recorded when the browser fetches the page to be previewed
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1951148
    data_reviews:
      - https://phabricator.services.mozilla.com/D243790
    data_sensitivity:
      - interaction
    expires: 180
    notification_emails:
      - elee@mozilla.com
    send_in_pings:
      - events
    extra_keys:
      description:
        type: boolean
        description: Description detected
      image:
        type: boolean
        description: Image detected
      length:
        type: quantity
        description: Length of the article
      outcome:
        type: string
        description: success or error
      sitename:
        type: boolean
        description: Site name detected
      skipped:
        type: boolean
        description: Skipped for newer fetch
      tab:
        type: string
        description: The type of tab where the event occurred. Potential values home, newtab
      time:
        type: quantity
        description: Milliseconds to fetch and extract page
      title:
        type: boolean
        description: Title detected

  generate:
    type: event
    description: >
      Recorded when the model finishes generating the preview
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1951148
    data_reviews:
      - https://phabricator.services.mozilla.com/D243790
    data_sensitivity:
      - interaction
    expires: 180
    notification_emails:
      - elee@mozilla.com
    send_in_pings:
      - events
    extra_keys:
      delay:
        type: quantity
        description: Milliseconds waiting on previous
      download:
        type: quantity
        description: Milliseconds to finish download
      latency:
        type: quantity
        description: Milliseconds to output first sentence
      outcome:
        type: string
        description: success or prefetch or error
      sentences:
        type: quantity
        description: Number of sentences generated
      time:
        type: quantity
        description: Milliseconds to generate full result

  smoke_test:
    type: event
    description: >
      This tests whether SmolLM2-360M is producing the correct output when set in greedy mode,
      which is done to produce deterministic results.  This fires at most once per build ID per install.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2047026
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2047026
    data_sensitivity:
      - technical
    expires: 170
    notification_emails:
      - firefox-ai-and-ml@mozilla.com
    send_in_pings:
      - events
    extra_keys:
      flow_id:
        type: string
        description: >
          Joins to sibling firefox.ai.runtime.engine_run and
          run_inference_success_flow events for the same inference.
      output_hash:
        type: string
        description: >
          SHA-256 of the greedy output. Analysts bucket users whose output
          drifted the same way by grouping on this hash.
      matches_pinned:
        type: boolean
        description: Whether output_hash equalled the pinned reference.
      model_id:
        type: string
        description: Model identifier used by the smoke test run.
      model_revision:
        type: string
        description: Model revision used by the smoke test run.

  key_points_toggle:
    type: event
    description: >
      Recorded when the user toggles the key points section
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1961215
    data_reviews:
      - https://phabricator.services.mozilla.com/D249851
    data_sensitivity:
      - interaction
    expires: 180
    notification_emails:
      - elee@mozilla.com
    send_in_pings:
      - events
    extra_keys:
      expand:
        type: boolean
        description: Link preview card is expanded

  onboarding_card:
    type: event
    description: >
      Recorded when the link preview onboarding is displayed and how the user interacts with it.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1961212
    data_reviews:
      - https://phabricator.services.mozilla.com/D249855
    data_sensitivity:
      - interaction
    expires: 180
    notification_emails:
      - elee@mozilla.com
    send_in_pings:
      - events
    extra_keys:
      action:
        type: string
        description: User's action on the dialogue - "view" (impression), "try_it_now", "close"
      type:
        type: string
        description: The type of onboarding trigger, e.g. "longPress" or "shiftKey".

  pref_changed:
    type: event
    description: >
      Recorded when the user toggles prefs
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1951148
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1969012
    data_reviews:
      - https://phabricator.services.mozilla.com/D243790
      - https://phabricator.services.mozilla.com/D251779
    data_sensitivity:
      - interaction
    expires: 180
    notification_emails:
      - elee@mozilla.com
    send_in_pings:
      - events
    extra_keys:
      enabled:
        type: boolean
        description: New/current state is enabled
      pref:
        type: string
        description: Which checkbox was clicked. Potential values link_previews, key_points, shift, shift_option, long_press

  start:
    type: event
    description: >
      Recorded when the user initiates a link preview
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1951148
    data_reviews:
      - https://phabricator.services.mozilla.com/D243790
    data_sensitivity:
      - interaction
    expires: 180
    notification_emails:
      - elee@mozilla.com
    send_in_pings:
      - events
    extra_keys:
      cached:
        type: boolean
        description: Reusing existing panel
      source:
        type: string
        description: Entrypoint shortcut (longpress, shift, shift-alt), context, onboarding
      tab:
        type: string
        description: The type of tab where the event occurred. Potential values home, newtab

selection_menu:
  displayed:
    type: event
    description: >
      The text selection actions menu was shown for a selection. This is the
      denominator for the menu's action clicks.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2069144
    data_reviews:
      - https://phabricator.services.mozilla.com/D328221
    data_sensitivity:
      - interaction
    expires: never
    notification_emails:
      - scunnane@mozilla.com
      - fx-search-telemetry@mozilla.com
    send_in_pings:
      - events
    extra_keys:
      delay:
        type: quantity
        description: Milliseconds from mousedown to showing.
      selection:
        type: quantity
        description: Selected text length.
      smart_window:
        type: boolean
        description: Whether the menu was shown in Smart Window.

  action_click:
    type: event
    description: >
      An action in the text selection actions menu was clicked.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2069144
    data_reviews:
      - https://phabricator.services.mozilla.com/D328221
    data_sensitivity:
      - interaction
    expires: never
    notification_emails:
      - scunnane@mozilla.com
      - fx-search-telemetry@mozilla.com
    send_in_pings:
      - events
    extra_keys:
      action:
        type: string
        description: Which action was clicked, e.g., ai, search, copy.
      selection:
        type: quantity
        description: Selected text length.
      smart_window:
        type: boolean
        description: Whether the menu was shown in Smart Window.

  dismissed:
    type: event
    description: >
      The text selection actions menu was closed. Paired one-to-one with
      displayed.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2083259
    data_reviews:
      - https://phabricator.services.mozilla.com/D334905
    data_sensitivity:
      - interaction
    expires: never
    notification_emails:
      - scunnane@mozilla.com
      - fx-search-telemetry@mozilla.com
    send_in_pings:
      - events
    extra_keys:
      interacted:
        type: boolean
        description: Whether the user completed an action from the menu.
      duration:
        type: quantity
        description: Milliseconds the menu was shown.
      smart_window:
        type: boolean
        description: Whether the menu was shown in Smart Window.

  suppressed:
    type: event
    description: >
      The text selection actions menu was not shown, or was hidden, because the
      page is on a site that shows its own menu for selected text or showed its
      own floating menu next to the selection.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2083889
    data_reviews:
      - https://phabricator.services.mozilla.com/D335446
    data_sensitivity:
      - interaction
    expires: never
    notification_emails:
      - scunnane@mozilla.com
      - fx-search-telemetry@mozilla.com
    send_in_pings:
      - events
    extra_keys:
      reason:
        type: string
        description: Why the menu was suppressed, one of site_list or page_menu.

  option_toggled:
    type: event
    description: >
      An action in the text selection actions menu, or the menu itself, was
      turned on or off.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2069167
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2069167
    data_sensitivity:
      - interaction
    expires: never
    notification_emails:
      - scunnane@mozilla.com
      - fx-search-telemetry@mozilla.com
    send_in_pings:
      - events
    extra_keys:
      action:
        type: string
        description: Which action was toggled, e.g., ai, search, copy, master.
      enabled:
        type: boolean
        description: Whether the action was turned on or off.
      source:
        type: string
        description: >
          Where the toggle happened, e.g., menu, settings, uncheck_all,
          context_menu. uncheck_all is the menu turning itself off because
          its last action was turned off.

  menu_shown:
    type: event
    description: >
      The three-dot menu of the text selection actions menu was opened. Each
      extra says whether that action's toggle was on, off or absent from the
      menu. This is the denominator for the toggles in option_toggled.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2069164
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2069164
    data_sensitivity:
      - interaction
    expires: never
    notification_emails:
      - scunnane@mozilla.com
      - fx-search-telemetry@mozilla.com
    send_in_pings:
      - events
    extra_keys:
      ai:
        type: string
        description: State of the AI toggle, one of on, off or absent.
      search:
        type: string
        description: State of the search toggle, one of on, off or absent.
      copy:
        type: string
        description: State of the copy toggle, one of on, off or absent.

  menu_click:
    type: event
    description: >
      An entry of the three-dot menu of the text selection actions menu, other
      than its toggles, was clicked.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2069165
    data_reviews:
      - https://phabricator.services.mozilla.com/D335856
    data_sensitivity:
      - interaction
    expires: never
    notification_emails:
      - scunnane@mozilla.com
      - fx-search-telemetry@mozilla.com
    send_in_pings:
      - events
    extra_keys:
      item:
        type: string
        description: Which entry was clicked, e.g., settings.

  search_enabled:
    type: boolean
    lifetime: application
    description: >
      Indicates if the text selection actions menu would show the search
      action.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2069167
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2069167
    data_sensitivity:
      - interaction
    expires: never
    notification_emails:
      - scunnane@mozilla.com
      - fx-search-telemetry@mozilla.com
    send_in_pings:
      - metrics

  enabled:
    type: boolean
    lifetime: application
    description: >
      Indicates if the text selection actions menu is turned on in the user's
      settings. Always false while the Highlight to Search feature gate is off.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2069156
    data_reviews:
      - https://phabricator.services.mozilla.com/D334183
    data_sensitivity:
      - interaction
    expires: never
    notification_emails:
      - scunnane@mozilla.com
      - fx-search-telemetry@mozilla.com
    send_in_pings:
      - metrics

  copy_enabled:
    type: boolean
    lifetime: application
    description: >
      Indicates if the text selection actions menu would show the copy
      action.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2069152
    data_reviews:
      - https://phabricator.services.mozilla.com/D332275
    data_sensitivity:
      - interaction
    expires: never
    notification_emails:
      - scunnane@mozilla.com
      - fx-search-telemetry@mozilla.com
    send_in_pings:
      - metrics
