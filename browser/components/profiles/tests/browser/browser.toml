[DEFAULT]
support-files = ["head.js"]
prefs = ["browser.profiles.enabled=true","browser.profiles.created=false",]

["browser_activate.js"]
run-if = [
  "os != 'linux'", # This seems to mess up focus on Linux for some reason.
]

["browser_appmenu.js"]

["browser_appmenu_menuitem_updates.js"]
head = "../unit/head.js head.js"

["browser_create_profile_page_test.js"]
skip-if = [
  "os == 'win' && os_version == '11.26200' && arch == 'x86' && debug && verify-standalone", # Bug 1995208
]

["browser_custom_avatar_test.js"]

["browser_delete_profile_page_test.js"]

["browser_desktop_shortcut_test.js"]
run-if = [
  "os == 'win'", # Desktop shortcuts are only supported on Windows.
]

["browser_edit_profile_test.js"]

["browser_edit_profile_theme_picker_test.js"]

["browser_empty_name_beforeunload_test.js"]

["browser_fxa_menu_profiles.js"]

["browser_fxa_menu_profiles_telemetry.js"]

["browser_icon_avatar_test.js"]

["browser_menubar_profiles.js"]
head = "../unit/head.js head.js"

["browser_moveTabToProfile.js"]

["browser_notify_changes.js"]
run-if = [
  "os != 'linux'", # Linux clients cannot remote themselves.
]
skip-if = [
  "os == 'mac' && os_version == '15.30' && arch == 'aarch64' && opt", # Bug 1929273
]

["browser_preferences.js"]

["browser_profiles_theme_picker_shown_telemetry_test.js"]

["browser_refresh_button.js"]

["browser_test_last_tab.js"]

["browser_test_profile_selector.js"]

["browser_update_profile_on_window_switch.js"]

["browser_window_title_test.js"]
