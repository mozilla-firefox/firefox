[DEFAULT]
support-files = [
  "head.js",
  "mini-window-crop-target.html",
  "mini-window-redirect.html",
]
prefs = [
  "browser.mini-window.enabled=true",
  "browser.mini-window.log=true",
]

["browser_chooser_panel.js"]

["browser_cropped_navigation.js"]

["browser_framing.js"]

["browser_framing_resize.js"]

["browser_last_tab.js"]

["browser_open_close.js"]

["browser_origin_close.js"]

["browser_overlap.js"]
skip-if = [
  "os == 'linux' && os_version == '22.04' && arch == 'x86_64' && display == 'wayland'", # Wayland doesn't let windows move themselves
  "os == 'linux' && os_version == '24.04' && arch == 'x86_64' && display == 'x11'", # X11/XWayland report unreliable window positions
]

["browser_placement.js"]

["browser_region_entry.js"]

["browser_restore_vs_close.js"]

["browser_reveal.js"]

["browser_sessionstore.js"]

["browser_sessionstore_taskbartabs.js"]
run-if = [
  "os == 'win'",
]

["browser_sidebar.js"]

["browser_telemetry.js"]

["browser_toolbar.js"]

["browser_toolbar_button.js"]

["browser_zoom.js"]
