[DEFAULT]
support-files = ["head.js"]
run-if = [
  "os == 'win'",
  "os == 'linux'",
]
prefs = [
  "browser.taskbarTabs.enabled=true",
  # Ensure the page action isn't hidden by default except when we mock it out.
  # (This can affect Linux.)
  "browser.shell.desktop-entry-api=filesystem",
]

["browser_taskbarTabs_chromeTest.js"]
skip-if = [
  "os == 'linux' && os_version == '24.04' && arch == 'x86_64' && ccov", # Bug 2057867
]

["browser_taskbarTabs_cmd.js"]

["browser_taskbarTabs_content.js"]

["browser_taskbarTabs_icons.js"]
support-files = [
  "../../../../../dom/manifest/test/red-50.png",
  "../../../../../dom/manifest/test/blue-150.png",
]

["browser_taskbarTabs_manifest.js"]

["browser_taskbarTabs_nimbus.js"]

["browser_taskbarTabs_pageAction.js"]

["browser_taskbarTabs_pin.js"]

["browser_taskbarTabs_telemetry.js"]

["browser_taskbarTabs_title.js"]

["browser_taskbarTabs_uriTest.js"]

["browser_taskbarTabs_windowClass.js"]
run-if = ["os == 'linux'"]

["browser_taskbarTabs_windowManager.js"]
support-files = [
  "../../../places/tests/browser/favicon-normal16.png",
]

["browser_taskbarTabs_windowTracker.js"]
