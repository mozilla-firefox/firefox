[DEFAULT]
run-if = [
  "os != 'android'",
]
head = "../../unit/head.js head.js"
firefox-appdir = "browser"
prefs = [
  'browser.newtabpage.activity-stream.discoverystream.ohttp.relayURL=',
  'browser.newtabpage.activity-stream.discoverystream.ohttp.configURL=',
]

["test_merinoClient.js"]

["test_merinoClient_sessions.js"]
requesttimeoutfactor = 2  # Slow on Windows

["test_merinoClient_weather.js"]

["test_pickedSearchSuggestion.js"]

["test_quicksuggest.js"]

["test_quicksuggest_addons.js"]

["test_quicksuggest_amp.js"]

["test_quicksuggest_defaultPrefs.js"]
requesttimeoutfactor = 10  # Checks all regions and locales where Suggest is enabled, takes a long time

["test_quicksuggest_dynamicSuggestions.js"]

["test_quicksuggest_exposures.js"]
requesttimeoutfactor = 2  # Slow on Mac in verify mode

["test_quicksuggest_exposures_locales.js"]
requesttimeoutfactor = 2  # Slow on Mac in verify mode

["test_quicksuggest_flight_status.js"]

["test_quicksuggest_importantDatesSuggestions.js"]
requesttimeoutfactor = 2  # Slow on Mac in verify mode

["test_quicksuggest_impressionCaps.js"]
