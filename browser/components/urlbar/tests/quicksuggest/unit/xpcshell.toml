["test_quicksuggest_merinoSessions.js"]

["test_quicksuggest_migrateBlockedDigests.js"]

["test_quicksuggest_migrate_v1.js"]

["test_quicksuggest_migrate_v2.js"]

["test_quicksuggest_migrate_v4.js"]

["test_quicksuggest_migrate_v5.js"]

["test_quicksuggest_migrate_v6.js"]

["test_quicksuggest_migrate_v7.js"]

["test_quicksuggest_relevanceRanking.js"]

["test_quicksuggest_remoteSettingsFilter.js"]

["test_quicksuggest_scoreMap.js"]

["test_quicksuggest_sports.js"]

["test_quicksuggest_temporal.js"]

["test_quicksuggest_temporalResults.js"]
requesttimeoutfactor = 2  # Slow on Mac in verify mode

["test_quicksuggest_topPicks.js"]

["test_quicksuggest_wikipedia.js"]

["test_quicksuggest_yelp.js"]
requesttimeoutfactor = 2  # Slow on Linux and Windows

["test_quicksuggest_yelp_ml.js"]

["test_quicksuggest_yelp_realtime.js"]

