[package]
name = "megazord"
version = "0.1.0"
authors = ["Sync Team <sync-team@mozilla.com>"]
edition = "2021"
license = "MPL-2.0"

[lib]
# "staticlib" needed for the m-c build environment, "cdylib" needed while in the application-services repo.
crate-type = ["staticlib", "cdylib"]

[dependencies]
fxa-client = { path = "../../components/fxa-client" }
logins = { path = "../../components/logins" }
tabs = { path = "../../components/tabs/" }
sync_manager = { path = "../../components/sync_manager/" }
# TODO: Uncomment this code when webext-storage component is integrated in android
# webext-storage = { path = "../../components/webext-storage/" }
places = { path = "../../components/places" }
push = { path = "../../components/push" }
remote_settings = { path = "../../components/remote_settings", features=["telemetry-submission"] }
rust-log-forwarder = { path = "../../components/support/rust-log-forwarder" }
viaduct = { path = "../../components/viaduct", features = ["ohttp"] }
nimbus-sdk = { path = "../../components/nimbus" }
autofill = { path = "../../components/autofill" }
fxcontainers = { path = "../../components/fxcontainers" }
crashtest = { path = "../../components/crashtest" }
error-support = { path = "../../components/support/error" }
suggest = { path = "../../components/suggest" }
search = { path = "../../components/search" }
tracing-support = { path = "../../components/support/tracing" }

lazy_static = "1.4"
init_rust_components = { path = "../../components/init_rust_components", features = ["nss"] }
merino = { path = "../../components/merino" }
relay = { path = "../../components/relay" }
ads-client = { path = "../../components/ads-client" }
mozilla-central-workspace-hack = { version = "0.1", features = ["megazord"], optional = true }
glean-sym = { version = "71" }
uniffi = { version = "0.32" }

# Direct dep so this crate can forward the mozbuild-rustlib feature down the
# NSS link chain. The megazord cdylib produces a self-contained Rust artifact
# and needs static mozpkix + pure_virtual on top of the NSS dylibs.
rc_crypto = { path = "../../components/support/rc_crypto" }
db-crypto = { path = "../../components/support/db-crypto" }
context_id = { path = "../../components/context_id" }

[target.'cfg(target_os = "android")'.dependencies]
# Only activate glean-sym when we're building for Android
#
# Other targets are used for unit tests where we don't have access to libxul.
# Metrics reporting will fail with a linker error.
glean-sym = { version = "71", features = ["active"] }

[features]
mozbuild-rustlib = ["rc_crypto/mozbuild-rustlib"]
