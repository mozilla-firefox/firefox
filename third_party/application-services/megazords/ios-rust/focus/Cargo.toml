[package]
name = "megazord_focus"
edition = "2021"
version = "0.1.0"
authors = ["Sync Team <sync-team@mozilla.com>"]
license = "MPL-2.0"

[lib]
crate-type = ["staticlib"]

[dependencies]
rust-log-forwarder = { path = "../../../components/support/rust-log-forwarder" }
viaduct = { path = "../../../components/viaduct" }
nimbus-sdk = { path = "../../../components/nimbus" }
error-support = { path = "../../../components/support/error" }
remote_settings = { path = "../../../components/remote_settings" }
ads-client = { path = "../../../components/ads-client" }
mozilla-central-workspace-hack = { version = "0.1", features = ["megazord_focus"], optional = true }
rc_crypto = { path = "../../../components/support/rc_crypto", optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
viaduct-backend-rust = { path = "../../../components/support/viaduct-backend-rust" }

[features]
mozbuild-rustlib = ["dep:rc_crypto", "rc_crypto/mozbuild-rustlib"]
