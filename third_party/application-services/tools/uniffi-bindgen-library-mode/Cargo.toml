[package]
name = "uniffi-bindgen-library-mode"
version = "0.1.0"
authors = ["The Firefox Sync Developers <sync-team@mozilla.com>"]
edition = "2021"
license = "MPL-2.0"

[[bin]]
name = "uniffi-bindgen-library-mode"
path = "src/main.rs"

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
uniffi_bindgen = { version = "0.32" }
clap = {version = "4.2", default-features = false, features = ["std", "derive", "help", "usage", "error-context"]}
cargo_metadata = "0.23"
camino = "1"
anyhow = "1"
mozilla-central-workspace-hack = { version = "0.1", features = ["uniffi-bindgen-library-mode"], optional = true }
