version: 1.0.0
about:
  description: An app menu with objects
features:
  app-menu:
    description: Represents the app-menu feature
    variables:
      all-menu-items:
        description: All the menu items
        type: List<MenuItem>
        default:
        - label: Start Game
          deeplink: deeplink://start
        - label: Resume Game
          deeplink: deeplink://start?continue=true
      item-enabled:
        description: A map of booleans
        type: Map<MenuItemId, Boolean>
        default:
          start-game: true
          settings: true
          resume-game: false
          community: false
      item-ordering:
        description: The ordering of the items in the menu
        type: List<MenuItemId>
        default:
        - resume-game
        - start-game
        - community
        - settings
      items:
        description: The menu items
        type: Map<MenuItemId, MenuItem>
        default:
          start-game:
            label: Start Game
            deeplink: deeplink://start
          resume-game:
            label: Resume Game
            deeplink: deeplink://start?continue=true
          settings:
            label: Settings
            deeplink: deeplink://settings
          community:
            label: Community
            deeplink: deeplink://community
      profile-items:
        description: The menu items for each of the profiles
        type: Map<PlayerProfile, Map<MenuItemId, MenuItem>>
        default:
          child:
            start-game:
              label: start child-friendly game
              deeplink: deeplink://start
            resume-game:
              label: resume child-friendly game
              deeplink: deeplink://start?continue=true
            settings:
              label: child-friendly tweaks
              deeplink: deeplink://settings
            community:
              label: child-friendly community engagement!
              deeplink: deeplink://community
          adult:
            start-game:
              label: START
              deeplink: deeplink://start
            resume-game:
              label: RESUME
              deeplink: deeplink://start?continue=true
            settings:
              label: SETTINGS
              deeplink: deeplink://settings
            community:
              label: COMMUNITY
              deeplink: deeplink://community
      profile-ordering:
        description: ''
        type: List<Map<PlayerProfile, MenuItemId>>
        default:
        - child: start-game
          adult: settings
        - adult: settings
          child: resume-game
enums:
  MenuItemId:
    description: The menu items id
    variants:
      community:
        description: Visit scary people online
      resume-game:
        description: Jump back in
      settings:
        description: Tweaks to set settings to set
      start-game:
        description: Start the game
  PlayerProfile:
    description: The sections of the homescreen
    variants:
      adult:
        description: The user is over an age
      child:
        description: The user is under an age
objects:
  MenuItem:
    description: An object defining a menu item
    fields:
      deeplink:
        description: The applink where the user is taken if the user taps it.
        type: String
        default: UNSET
      label:
        description: The label that the user sees
        type: String
        default: UNSET
