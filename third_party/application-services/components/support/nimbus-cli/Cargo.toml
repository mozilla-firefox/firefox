[package]
name = "nimbus-cli"
version = "0.5.0"
edition = "2021"
authors = ["Nimbus SDK Engineering"]
license = "MPL-2.0"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["server"]
server = ["dep:axum", "dep:tokio", "dep:tower-http", "dep:tower-livereload", "dep:local-ip-address"]

[dependencies]
clap = {version = "4.2", default-features = false, features = ["std", "derive", "error-context", "help"]}
anyhow = "1.0.44"
remote_settings = { path = "../../remote_settings" }
nimbus-fml = { path = "../nimbus-fml", features = ["client-lib"] }
serde_json = "1"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
unicode-segmentation = "1.8.0"
viaduct = { path = "../../viaduct" }
viaduct-backend-rust = { path = "../../support/viaduct-backend-rust" }
glob = "0.3.1"
heck = "0.5"
whoami = "1.4.0"
update-informer = { version = "1.0.0", default-features = false }
serde_yaml = "0.9.21"
percent-encoding = "2.3.0"
copypasta = "0.8.2"
chrono = "0.4.26"
axum = { version = "0.8", optional = true }
tokio = { version = "1.49", optional = true, features = ["sync", "net", "rt", "macros", "rt-multi-thread"] }
tower-http = { version = "0.6", optional = true, features = ["set-header"] }
tower-livereload = { version = "0.10", optional = true }
local-ip-address = { version = "0.5.4", optional = true }
cfg-if = "1.0.0"
termcolor = "1.4.1"
tempfile = "3.1"

[dev-dependencies]
# The server tests only talk plain HTTP to 127.0.0.1, so `default-features = false` keeps TLS and
# h2 out of the dependency tree entirely.
reqwest = { version = "0.13", default-features = false }
