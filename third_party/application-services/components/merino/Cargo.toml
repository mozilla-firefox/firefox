[package]
name = "merino"
version = "0.1.0"
edition = "2021"
exclude = ["/android"]

[dependencies]
uniffi = { version = "0.32" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
viaduct = { path = "../viaduct", features = ["ohttp"] }
error-support = { path = "../support/error" }
thiserror = "2"
parking_lot = "0.12"
uuid = { version = "1.3", features = ["v4"] }

[build-dependencies]
uniffi = { version = "0.32", features = ["build"] }
