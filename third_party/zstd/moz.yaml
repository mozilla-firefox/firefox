schema: 1

bugzilla:
  product: Toolkit
  component: "General"

origin:
  name: zstd
  description: generic-purpose lossless compression algorithm

  url: https://github.com/facebook/zstd

  release: v1.6.0 (2026-11-23T17:40:52-05:00).
  revision: v1.6.0

  license: "BSD-3-Clause"
  license-file: "LICENSE"

vendoring:
  url: https://github.com/facebook/zstd
  source-hosting: github
  tracking: tag

  keep:
    - preprocess_asm.py

  exclude:
    - ".*"
    - ".circleci"
    - "*"
    - build
    - examples
    - tests
    - zlibWrapper
    - programs
    - contrib
    - doc
    - lib/legacy
    - lib/dll
    - lib/deprecated
    - lib/dictBuilder
    - lib/compress

  include:
    - lib/
    - LICENSE
    - COPYING

updatebot:
  maintainer-bz: rjesup@jesup.org
  maintainer-phab: "#necko-reviewers"
  tasks:
    - type: vendoring
      enabled: true
      frequency: release
