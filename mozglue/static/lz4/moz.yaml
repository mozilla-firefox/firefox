schema: 1

bugzilla:
  product: Core
  component: mozglue

origin:
  name: lz4
  description: Extremely fast compression algorithm

  url: https://github.com/lz4/lz4

  release: v1.11.0 (2026-11-03T16:58:16-08:00).
  revision: v1.11.0

  license: BSD-2-Clause
  license-file: LICENSE

vendoring:
  url: https://github.com/lz4/lz4
  source-hosting: github
  tracking: tag

  exclude:
    - "**"

  include:
    - lib/LICENSE
    - lib/README.md
    - lib/lz4*.c
    - lib/lz4*.h

  update-actions:
    - action: move-dir
      from: '{vendor_dir}/lib'
      to: '{vendor_dir}'
    - action: delete-path
      path: '{vendor_dir}/lib'

updatebot:
  maintainer-phab: glandium
  maintainer-bz: mh+mozilla@glandium.org
  fuzzy-query: "'gtest | 'xpcshell | 'reftest | 'mochitest-chrome !nofis !swr !-dc !msix !web-platform !talos !source-test"
  tasks:
    - type: vendoring
      enabled: true
      frequency: every
