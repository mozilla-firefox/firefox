[DEFAULT]
head = "head.js"
firefox-appdir = "browser"
support-files = [
  "propertyLists/bug710259_propertyListBinary.plist",
  "propertyLists/bug710259_propertyListXML.plist",
  "chromeappsstore.sqlite",
  "corrupt.sqlite",
  "zips/dummy_gmp.zip",
  "zips/zen.zip",
  "regions/mls-lookup-results.csv",
  "regions/world.geojson",
  "regions/world-buffered.geojson",
]

["test_AllowedAppSources.js"]
run-if = [
  "os == 'win'", # Test of a Windows-specific feature
]
tags = "os_integration"

["test_BinarySearch.js"]

["test_BrowserUtils.js"]

["test_BrowserUtils_callModulesFromCategory.js"]
support-files = [
  "my_catman_1.sys.mjs",
  "my_catman_2.sys.mjs",
]

["test_BrowserUtils_urlFormatting.js"]

["test_CanonicalJSON.js"]

["test_Color.js"]

["test_CreditCard.js"]

["test_DateNormalizationUtils.js"]

["test_DeferredTask.js"]
skip-if = [
  "os == 'android'",
  "os == 'mac' && os_version == '10.15' && arch == 'x86_64'", # osx: Bug 1550141
  "os == 'mac' && os_version == '15.30' && arch == 'aarch64'", # osx: Bug 1550141
]

["test_DeferredTask_gc.js"]

["test_DeferredTask_window.js"]
support-files = ["test_DeferredTask_window/*"]

["test_E10SUtils_getRemoteTypeForURIObject.js"]

["test_EventEmitter.js"]

["test_FileUtils.js"]
skip-if = [
  "os == 'android'",
]

["test_FinderIterator.js"]

["test_GMPInstallManager.js"]
skip-if = [
  "os == 'android'",
]
support-files = [
  "../../../mozapps/extensions/test/xpcshell/data/productaddons/content_signing_aus_ee.pem",
  "../../../mozapps/extensions/test/xpcshell/data/productaddons/content_signing_int.pem",
  "../../../mozapps/extensions/test/xpcshell/data/productaddons/bad.xml",
  "../../../mozapps/extensions/test/xpcshell/data/productaddons/good.xml",
  "../../../mozapps/extensions/test/xpcshell/data/productaddons/missing.xml",
  "../../../mozapps/extensions/test/xpcshell/data/productaddons/empty.xml",
  "../../../mozapps/extensions/test/xpcshell/data/productaddons/singleaddon.xml",
  "../../../mozapps/extensions/test/xpcshell/data/productaddons/sizedaddon.xml",
  "../../../mozapps/extensions/test/xpcshell/data/productaddons/invalidaddons.xml",
  "../../../mozapps/extensions/test/xpcshell/data/productaddons/updatesaddons.xml",
]

["test_IgnoreList.js"]
tags = "remote-settings"

["test_Integration.js"]

["test_JSONFile.js"]

["test_JsonSchema.js"]

["test_Log.js"]

["test_LogManager.js"]

["test_Log_double_ext.js"]

["test_Log_nsIStackFrame.js"]

["test_Log_stackTrace.js"]

["test_MatchURLFilters.js"]

["test_NewTabUtils.js"]
skip-if = [
  "os == 'android'",
]

["test_ObjectUtils.js"]

["test_PermissionsUtils.js"]

["test_PrefUtils.js"]

["test_Preferences.js"]

["test_PrivacyLevel.js"]

["test_ProfileAge.js"]

["test_ProfileKekPassword.js"]
# Every set / change / remove cycle runs 800k-iteration PBKDF2 derivations
# back-to-back; the cumulative wall time exceeds the default per-test budget
# on slower hardware.
requesttimeoutfactor = 5
# TSan instruments every NSS lock acquisition along the PBKDF2 path, which
# blows out the per-task budget even with the factor above (bug 1892964),
# the same way it does for security/lockstore's own xpcshell test.
skip-if = ["tsan"]

["test_Region.js"]

["test_RegionLocaleMap.js"]

["test_Region_geocoding.js"]
requesttimeoutfactor = 4  # Slow and high CPU use on debug builds

["test_RustSharedRemoteSettingsService.js"]
skip-if = [
  "os == 'android'",
]

["test_ScheduledTask.js"]
skip-if = [
  "os == 'android'",
]

["test_SelectionUtils.js"]

["test_Services.js"]

["test_URLKeywordAnalyzer.js"]

