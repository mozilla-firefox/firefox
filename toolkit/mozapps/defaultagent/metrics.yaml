---
$schema: moz://mozilla.org/schemas/glean/metrics/2-0-0
$tags:
  - 'Toolkit :: Default Browser Agent'

system:
  os_version:
    type: string
    description: >
      The current Windows OS version, usually as a dotted quad ("x.y.z.w") with
      Windows Update Build Revision (UBR), but potentially as a dotted triple
      ("x.y.z") without UBR.
    lifetime: application
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1850149
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1850149
    data_sensitivity:
      - technical
    notification_emails:
      - install-update@mozilla.com
    expires: never
    send_in_pings:
      - default-agent
    no_lint:
      - UNKNOWN_PING_REFERENCED  # Bug 2097441

  previous_os_version:
    type: string
    description: >
      The Windows OS version before it was changed to the current setting. The
      possible values are the same as for `system.os_version`.

      The OS does not keep track of the previous OS version, so the agent
      records this information itself. That means that it will be inaccurate
      until the first time the default is changed after the agent task begins
      running. Before then, the value of `previous_os_version` will be the same
      as `os_version`.

      This value is updated every time the Default Agent runs, so when the
      default browser is first changed the values for `os_version` and
      `previous_os_version` will be different. But on subsequent executions of
      the Default Agent, the two values will be the same.
    lifetime: application
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1850149
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1850149
    data_sensitivity:
      - technical
    notification_emails:
      - install-update@mozilla.com
    expires: never
    send_in_pings:
      - default-agent
    no_lint:
      - UNKNOWN_PING_REFERENCED  # Bug 2097441

system_default:
  browser:
    type: string
    description: >
      Which browser is currently set as the system default web browser. This is
      simply a string with the name of the browser binned to a fixed set of
      known browsers.

      Possible values currently include the following (from
      [DefaultBrowser.cpp](https://searchfox.org/firefox-main/source/toolkit/mozapps/defaultagent/DefaultBrowser.cpp)):
      * "error"
      * "" (unknown)
      * "firefox"
      * "chrome"
      * "edge"
      * "edge-chrome"
      * "ie"
      * "opera"
      * "brave"
      * "yandex"
      * "qq-browser"
      * "360-browser"
      * "sogou"
      * "duckduckgo"
    lifetime: application
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1838755
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1621293
    data_sensitivity:
      - technical
    notification_emails:
      - install-update@mozilla.com
    expires: never
    send_in_pings:
      - default-agent
    no_lint:
      - UNKNOWN_PING_REFERENCED  # Bug 2097441

  previous_browser:
    type: string
    description: >
      Which browser was set as the system default before it was changed to the
      current setting. The possible values are the same as for
      `system_default.browser`.

      The OS does not keep track of previous default settings, so the agent
      records this information itself. That means that it will be inaccurate
      until the first time the default is changed after the agent task begins
      running. Before then, the value of `previous_browser` will be the same
      as `browser`.

      This value is updated every time the Default Agent runs, so when the
      default browser is first changed the values for `browser` and
      `previous_browser` will be different. But on subsequent executions of
      the Default Agent, the two values will be the same.
    lifetime: application
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1838755
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1621293
    data_sensitivity:
      - technical
    notification_emails:
      - install-update@mozilla.com
    expires: never
    send_in_pings:
      - default-agent
    no_lint:
      - UNKNOWN_PING_REFERENCED  # Bug 2097441

  pdf_handler:
    type: string
    description: >
      Which pdf handler is currently set as the system default handler. This is
      simply a string with the name of the handler binned to a fixed set of
      known handlers.

      Possible values currently include the following (from
      [DefaultPDF.cpp](https://searchfox.org/firefox-main/source/toolkit/mozapps/defaultagent/DefaultPDF.cpp)):
      * "Error"
      * "" (unknown)
      * "Firefox"
      * "Microsoft Edge"
      * "Google Chrome"
      * "Adobe Acrobat"
      * "WPS"
      * "Nitro"
      * "Foxit"
      * "PDF-XChange"
      * "Avast"
      * "Sumatra"
    lifetime: application
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1756900
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1756900
    data_sensitivity:
      - technical
    notification_emails:
      - install-update@mozilla.com
    expires: never
    send_in_pings:
      - default-agent
    no_lint:
      - UNKNOWN_PING_REFERENCED  # Bug 2097441

notification:
  show_success:
    type: boolean
    description: >
      Whether a notification was shown or not. Possible value include "shown" and "error".
    notification_emails:
        - install-update@mozilla.com
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1838755
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1621293
    expires: never
    send_in_pings:
      - default-agent
    no_lint:
      - UNKNOWN_PING_REFERENCED  # Bug 2097441

  action:
    type: string
    description: >
      The action that the user took in response to the notification. Possible
      values currently include the following:
      * “dismissed-by-timeout”
      * “dismissed-to-action-center”
      * “dismissed-by-button”
      * “dismissed-by-application-hidden”
      * “make-firefox-default-button”
      * “toast-clicked”

      Many of the values correspond to buttons on the notification and should be
      pretty self explanatory, but a few are less so.
      * “dismissed-to-action-center” will be used if the user clicks the arrow in
        the top right corner of the notification to dismiss it to the
        action center.
      * “dismissed-by-application-hidden” is provided because that is a method of
        dismissal that the notification API could give but, in practice, should
        never be seen.
      * “dismissed-by-timeout” indicates that the user did not interact with the
        notification and it timed out.
    notification_emails:
        - install-update@mozilla.com
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1838755
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1621293
    expires: never
    send_in_pings:
      - default-agent
    no_lint:
      - UNKNOWN_PING_REFERENCED  # Bug 2097441

system_pin:
  is_taskbar_pinned:
    type: string
    description: >
      Whether Firefox is currently pinned to the Windows taskbar.

      Possible values:
      * "IsPinned"
      * "NotPinned"
      * "Error"
    lifetime: application
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2041932
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2041932
    data_sensitivity:
      - technical
    notification_emails:
      - install-update@mozilla.com
    expires: never
    send_in_pings:
      - default-agent
    no_lint:
      - UNKNOWN_PING_REFERENCED  # Bug 2097441

  previous_is_taskbar_pinned:
    type: string
    description: >
      Whether Firefox was pinned to the Windows taskbar as of the previous ping.

      Possible values are the same as for `system_pin.is_taskbar_pinned`.

      The OS does not keep track of previous pin state, so the agent records
      this information itself. That means that it will be inaccurate until the
      first time the pin state changes after the agent task begins running.
      Before then, the value of `previous_is_taskbar_pinned` will be the same
      as `is_taskbar_pinned`.

      This value is updated only when a ping is actually sent, so transitions
      are not missed across rate-limited runs.
    lifetime: application
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2041932
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2041932
    data_sensitivity:
      - technical
    notification_emails:
      - install-update@mozilla.com
    expires: never
    send_in_pings:
      - default-agent
    no_lint:
      - UNKNOWN_PING_REFERENCED  # Bug 2097441

defaultagent:
  days_since_last_app_launch:
    type: quantity
    description: >
      Number of days since the app last launched. Once this reaches 90 days, the installation
      will stop running the default browser agent.
    notification_emails:
        - install-update@mozilla.com
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1843667
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1843667
    data_sensitivity:
      - technical
    expires: never
    send_in_pings:
      - default-agent
    unit: days
    no_lint:
      - UNKNOWN_PING_REFERENCED  # Bug 2097441

install:
  has_win_package_id:
    type: boolean
    description: >
      Whether this installation is a packaged (MSIX) install, such as one from
      the Microsoft Store. The same value as `system.has_win_package_id` in the
      main browser's pings.
    lifetime: application
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2079741
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2079741
    data_sensitivity:
      - technical
    notification_emails:
      - install-update@mozilla.com
    expires: never
    send_in_pings:
      - default-agent
    no_lint:
      - UNKNOWN_PING_REFERENCED  # Bug 2097441

  win_package_family_name:
    type: string
    description: >
      The Windows package family name of this installation, which identifies
      the MSIX package it came from, for example the Microsoft Store package.
      Only recorded for packages published by Mozilla, that is, family names
      starting with "Mozilla." or "MozillaCorporation.", as for
      `system.win_package_family_name` in the main browser's pings.
    lifetime: application
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2079741
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2079741
    data_sensitivity:
      - technical
    notification_emails:
      - install-update@mozilla.com
    expires: never
    send_in_pings:
      - default-agent
    no_lint:
      - UNKNOWN_PING_REFERENCED  # Bug 2097441

  installer_type:
    type: string
    description: >
      How this installation was installed, with the same values as
      `installation.first_seen.installer_type` in the main browser's pings:
      * "stub" for the stub installer
      * "full" for the full installer, including MSI installs
      * "msix" for MSIX packages

      Not recorded if it could not be determined, for example because
      `installation_telemetry.json` is missing from the installation directory.
    lifetime: application
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2079741
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2079741
    data_sensitivity:
      - technical
    notification_emails:
      - install-update@mozilla.com
    expires: never
    send_in_pings:
      - default-agent
    no_lint:
      - UNKNOWN_PING_REFERENCED  # Bug 2097441

  from_msi:
    type: boolean
    description: >
      Whether this installation was installed from an MSI package. Only
      recorded when `install.installer_type` is "full".
    lifetime: application
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2079741
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2079741
    data_sensitivity:
      - technical
    notification_emails:
      - install-update@mozilla.com
    expires: never
    send_in_pings:
      - default-agent
    no_lint:
      - UNKNOWN_PING_REFERENCED  # Bug 2097441

  silent:
    type: boolean
    description: >
      Whether this installation was a silent install, as used for managed
      deployments. Only recorded when `install.installer_type` is "full".
    lifetime: application
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2079741
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2079741
    data_sensitivity:
      - technical
    notification_emails:
      - install-update@mozilla.com
    expires: never
    send_in_pings:
      - default-agent
    no_lint:
      - UNKNOWN_PING_REFERENCED  # Bug 2097441
