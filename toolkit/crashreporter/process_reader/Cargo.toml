[package]
name = "process_reader"
version = "0.1.0"
authors = ["Gabriele Svelto"]
edition = "2018"
license = "MPL-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
goblin = { version = "0.9", features = ["elf32", "elf64", "pe32", "pe64"] }
log = "0.4"
thiserror = "2"

[target."cfg(any(target_os = \"linux\", target_os = \"android\"))".dependencies]
libc = "0.2"
process-backend = { git = "https://github.com/rust-minidump/minidump-writer.git", rev = "d5ec275ce1276947f09f205a581fe2b3cf90178f", features = ["postcard", "unix_stream"] }
scroll = "0.12"

[target."cfg(target_os = \"windows\")".dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_ProcessStatus",
] }
mozilla-central-workspace-hack = { version = "0.1", optional = true }

[target."cfg(target_os = \"macos\")".dependencies]
mach2 = { version = "0.6" }
