[db_crypto.async_wrappers]
ManagedEncryptorDecryptor = "AsyncWrapped"
NSSKeyManager = "AsyncWrapped"
StaticKeyManager = "AsyncWrapped"
"check_canary" = "AsyncWrapped"
"create_canary" = "AsyncWrapped"
"create_key" = "AsyncWrapped"
# Constructing the key manager and the encryptor/decryptor is in-memory work.
"create_managed_encdec" = "Sync"
"create_static_key_manager" = "Sync"
# Trait interfaces, whose vtable methods cannot be async-wrapped. Both are pure
# in-memory work with the key passed in, so running them on the caller's thread
# is fine (cf. autofill's crypto helpers).
"EncryptorDecryptor.decrypt" = "Sync"
"EncryptorDecryptor.encrypt" = "Sync"
"KeyManager.get_key" = "Sync"

[logins.async_wrappers]
# Every LoginStore method performs DB I/O, and so does creating the store, so
# the whole interface is async-wrapped to keep that work off the main thread.
LoginStore = "AsyncWrapped"
