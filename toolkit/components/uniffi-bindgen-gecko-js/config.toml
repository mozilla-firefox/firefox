type_name = "URL"
lift = "new URL({})"
lower = "{}.toString()"

[uniffi_bindings_tests.custom_types.TimeIntervalMs]
# Convert milliseconds to Date
type_name = "Date"
lift = "new Date({})"
lower = "{}.getTime()"

[uniffi_bindings_tests.custom_types.TimeIntervalSecDbl]
# Convert seconds (as float) to Date
type_name = "Date"
lift = "new Date({} * 1000)"
lower = "{}.getTime() / 1000"

