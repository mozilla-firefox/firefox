[package]
edition = "2015"
name = "gkrust-uniffi-components"
version = "0.1.0"
authors = ["The Mozilla Project Developers"]
license = "MPL-2.0"
description = "UniFFI-enabled Rust components for libxul"

[lib]
crate-type = ["rlib", "staticlib"]
path = "lib.rs"
test = false
doctest = false
bench = false
doc = false
harness = false

[dependencies]
uniffi = { workspace = true }

ads-client = "0.1"
autofill = { version = "0.1", features = ["keydb"] }
fxcontainers = "0.1"
context_id = "0.1"
filter_adult = "0.1"
tabs = "0.1"
search = "0.1"
suggest = "0.1"
relevancy = "0.1"
webext-storage = "0.1"
error-support = { version = "0.1", features = ["glean-sym", "glean-fog"] }
tracing-support = "0.1"
logins = { version = "0.1", features = ["keydb", "allow_empty_passwords", "ignore_form_action_origin_validation_errors", "perform_additional_origin_fixups", "fixup_invalid_guids"] }
init_rust_components = { version = "0.1", features = ["keydb"] }
breach-alerts = { version = "0.1" }
db-crypto = { version = "0.1", features = ["keydb"] }

rc_crypto = { path = "../../../../third_party/application-services/components/support/rc_crypto", optional = true }

mozilla-central-workspace-hack = { version = "0.1", features = ["gkrust-uniffi-components"], optional = true }

[features]
# Should we depend on xpcom crates?
xpcom = []
mozbuild = ["dep:rc_crypto"]
