["test_GeneratedWidgetsProvider.js"]
# Prevent a failure due to the per-file timeout killing the test file while it is running.
requesttimeoutfactor = 2
firefox-appdir = "browser"
skip-if = [
  "os == 'android'",
  "appname == 'thunderbird'", # Thunderbird doesn't register the generated-widget manifest schema.
  "!nightly_build",
]

