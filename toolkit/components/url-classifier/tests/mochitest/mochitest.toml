[DEFAULT]
tags = "condprof"
# These tests exercise url-classifier's own tracking protection features, so
# keep it as the channel classifier even where the content classifier is the
# default engine.
prefs = [
  "browser.safebrowsing.only_top_level=false",
  "privacy.trackingprotection.content.mirror.mode=0",
  "privacy.trackingprotection.urlclassifier.disable_for_channel_classifier=false",
]
support-files = [
  "classifierCommon.js",
  "classifierFrame.html",
  "classifierHelper.js",
  "clean.worker.js",
  "good.js",
  "head.js",
  "evil.css",
  "evil.css^headers^",
  "evil.js",
  "evil.js^headers^",
  "evil.worker.js",
  "import.css",
  "import2.css",
  "raptor.jpg",
  "track.html",
  "trackerFrame.html",
  "trackerFrame.sjs",
  "trackingRequest.js",
  "trackingRequest.js^headers^",
  "unwanted.worker.js",
  "vp9.webm",
  "whitelistFrame.html",
  "workerFrame.html",
  "ping.sjs",
  "basic.vtt",
  "basic.vtt^headers^",
  "dnt.html",
  "dnt.sjs",
  "update.sjs",
  "bad.css",
  "bad.css^headers^",
  "gethash.sjs",
  "gethashFrame.html",
  "seek.webm",
  "cache.sjs",
  "features.js",
  "sw_register.html",
  "sw_unregister.html",
  "sw_worker.js",
  "sandboxed.html",
  "sandboxed.html^headers^",
]
# The http2 and http3 variants upgrade every load to https, which leaves the
# plain-http entries these tests seed the classifier with unmatched.
run-if = [
  "!http2 && !http3",
]

["test_annotation_vs_TP.html"]

["test_bug1254766.html"]

["test_cachemiss.html"]
skip-if = [
  "verify-standalone",
]

["test_classifier.html"]

["test_classifier_match.html"]

["test_classifier_worker.html"]

["test_classify_by_default.html"]
skip-if = [
  "http2",
  "http3",
]

["test_classify_only_top_context.html"]

["test_classify_ping.html"]

["test_classify_top_sandboxed.html"]

["test_classify_track.html"]

["test_cryptomining.html"]

["test_cryptomining_annotate.html"]

["test_emailtracking.html"]

["test_fingerprinting.html"]

["test_fingerprinting_annotate.html"]

["test_gethash.html"]

["test_lookup_completion_telemetry.html"]
support-files = ["telemetryFrame.html"]

["test_socialtracking.html"]

["test_socialtracking_annotate.html"]
