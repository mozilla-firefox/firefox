[DEFAULT]
head = "head_urlclassifier.js"
# These tests exercise url-classifier's own tracking protection features, so
# keep it as the channel classifier even where the content classifier is the
# default engine.
prefs = [
  "privacy.trackingprotection.content.mirror.mode=0",
  "privacy.trackingprotection.urlclassifier.disable_for_channel_classifier=false",
]
tags = "condprof"
skip-if = [
  "os == 'android'",
]
support-files = ["data/**"]

["test_addsub.js"]

["test_backoff.js"]

["test_bug1274685_unowned_list.js"]

["test_canonicalization.js"]

["test_channelClassifierService.js"]

["test_dbservice.js"]
skip-if = [
  "condprof", # Bug 1769828
]

["test_digest256.js"]

["test_exceptionListService.js"]
prefs = ["security.storage.encryption.sqlite.enabled=false"]
tags = "remote-settings"

["test_features.js"]

["test_hashcompleter.js"]

["test_hashcompleter_v4.js"]

["test_listmanager.js"]
run-sequentially = ["true"] # fails 85% of the time in parallel

["test_listmanager_v5_update_timing.js"]
run-sequentially = ["true"] # shares the list manager singleton

["test_malwaretable_pref.js"]

["test_partial.js"]

["test_platform_specific_threats.js"]

["test_pref.js"]

["test_prefixset.js"]

["test_provider_url.js"]

["test_rsListService.js"]
prefs = ["security.storage.encryption.sqlite.enabled=false"]
tags = "remote-settings"

["test_safebrowsing_protobuf.js"]

["test_shouldclassify.js"]

["test_streamupdater.js"]

["test_threat_type_conversion.js"]

["test_urlClassifierExceptionList.js"]
