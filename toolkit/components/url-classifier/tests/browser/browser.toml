[DEFAULT]
# These tests exercise url-classifier's own tracking protection features, so
# keep it as the channel classifier even where the content classifier is the
# default engine.
prefs = [
  "privacy.trackingprotection.content.mirror.mode=0",
  "privacy.trackingprotection.urlclassifier.disable_for_channel_classifier=false",
]
support-files = [
  "head.js",
  "page.html",
  "raptor.jpg",
]

["browser_antifraud_annotation.js"]

["browser_check_channel_helper_telemetry.js"]

["browser_consentmanager_annotation.js"]

["browser_defer_annotation_pref.js"]

["browser_defer_annotation_suspend_resume.js"]

["browser_emailtracking_telemetry.js"]

["browser_popup_tracker.js"]

["browser_realtime_lookup.js"]

["browser_realtime_simulation.js"]

["browser_third_party_only_annotations.js"]

["browser_v5_completion.js"]
support-files = ["gethashV5.sjs"]
