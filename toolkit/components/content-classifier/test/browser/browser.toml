[DEFAULT]
# These tests drive the content classifier prefs directly; the two that cover
# the ETP pref mirror turn it on themselves.
prefs = ["privacy.trackingprotection.content.mirror.mode=0"]
support-files = [
  "head.js",
  "page.html",
  "block_list.txt",
  "annotate_list.txt",
  "empty_script.js",
]

["browser_about_url_classifier.js"]

["browser_content_classifier_blocking.js"]

["browser_content_classifier_content_script.js"]

["browser_content_classifier_engines_pref.js"]

["browser_content_classifier_fingerprinters_passive.js"]

["browser_content_classifier_first_party.js"]

["browser_content_classifier_harmful_addon.js"]

["browser_content_classifier_memory_reporter.js"]

["browser_content_classifier_partitioned_cookies.js"]
support-files = ["!/toolkit/components/antitracking/test/browser/cookies.sjs"]

["browser_content_classifier_pref_mirror.js"]

["browser_content_classifier_remote_settings.js"]

["browser_content_classifier_subdomain_rules.js"]

["browser_content_classifier_test_trackers_engines.js"]

["browser_urlclassifier_disable_for_channel_classifier.js"]
