---
$schema: moz://mozilla.org/schemas/glean/metrics/2-0-0
$tags:
  - 'Toolkit :: Form Manager'

autocomplete:
  record_interaction:
    type: event
    description: >
      Recorded when the user clicks or activates the secondary action of a
      saved record in the autocomplete dropdown.
    data_sensitivity:
      - interaction
    bugs:
      - https://bugzil.la/2077190
      - https://bugzil.la/2085010
    data_reviews:
      - https://bugzil.la/2077190
      - https://bugzil.la/2085010
    notification_emails:
      - passwords-dev@mozilla.org
      - autofill@lists.mozilla.org
      - issozi@mozilla.com
    expires: never
    extra_keys:
      record_type:
        description: >
          The type of saved record the action applies to: "formhistory",
          "address", "payment" or "password".
        type: string
      interaction_type:
        description: >
          The secondary action that was activated: "delete" or "edit".
        type: string
      flow_id:
        description: >
          The flow_id of the dropdown the action was taken in, shared with its
          dropdown_shown and dropdown_closed events.
        type: string

  record_dialog_interaction:
    type: event
    description: >
      Recorded when the user responds to the confirmation dialog shown before
      a saved record is removed from the autocomplete dropdown. Intended to
      capture whether or not the user confirms the removal.
    data_sensitivity:
      - interaction
    bugs:
      - https://bugzil.la/2077190
      - https://bugzil.la/2085010
    data_reviews:
      - https://bugzil.la/2077190
      - https://bugzil.la/2085010
    notification_emails:
      - passwords-dev@mozilla.org
      - autofill@lists.mozilla.org
      - issozi@mozilla.com
    expires: never
    extra_keys:
      record_type:
        description: >
          The type of saved record the dialog is about: "address", "payment"
          or "password".
        type: string
      interaction_type:
        description: >
          How the user responded to the dialog: "confirm" or "cancel".
        type: string
      update_type:
        description: >
          The change the dialog asked to confirm. Only "delete" is supported
          right now.
        type: string
      flow_id:
        description: >
          The flow_id of the dropdown the removal was started from. The
          dropdown is hidden while the dialog is open, so this links the
          dialog to the dropdown_closed ("removal_prompt") event before it and
          the dropdown_shown event after it.
        type: string

  dropdown_shown:
    type: event
    description: >
      Recorded when the autocomplete dropdown opens on a field.
    data_sensitivity:
      - interaction
    bugs:
      - https://bugzil.la/2081366
      - https://bugzil.la/2085010
    data_reviews:
      - https://bugzil.la/2081366
      - https://bugzil.la/2085010
    notification_emails:
      - passwords-dev@mozilla.org
      - autofill@lists.mozilla.org
      - issozi@mozilla.com
    expires: never
    extra_keys:
      record_type:
        description: >
          The type of saved record shown in the dropdown: "formhistory",
          "address", "payment" or "password".
        type: string
      flow_id:
        description: >
          An id generated when the dropdown opened, letting this event be
          correlated with the matching dropdown_closed event (and any
          interactions in between), to measure things like how often a
          shown dropdown leads to a removal. It is reused when the dropdown
          reopens after a record removal prompt, so one flow can contain
          several dropdown_shown/dropdown_closed pairs.
        type: string
      reopened_after_removal:
        description: >
          True when this is the automatic reopen after a record removal
          prompt, false otherwise.
        type: boolean

  dropdown_closed:
    type: event
    description: >
      Recorded when the autocomplete dropdown closes.
    data_sensitivity:
      - interaction
    bugs:
      - https://bugzil.la/2081366
      - https://bugzil.la/2085010
      - https://bugzil.la/2088399
    data_reviews:
      - https://bugzil.la/2081366
      - https://bugzil.la/2085010
    notification_emails:
      - passwords-dev@mozilla.org
      - autofill@lists.mozilla.org
      - issozi@mozilla.com
    expires: never
    extra_keys:
      record_type:
        description: >
          The type of saved record shown in the dropdown: "formhistory",
          "address", "payment" or "password".
        type: string
      close_reason:
        description: >
          Why the dropdown closed: "selected" (the user picked a suggestion),
          "dismissed" (clicked elsewhere or pressed Escape without picking
          anything), "typed_through" (kept typing until no saved records
          remained, even if non-record rows such as a footer kept the
          dropdown open),
          "removal_prompt" (hidden because a record removal reauthentication
          or confirmation prompt took focus; usually followed by a
          dropdown_shown with the same flow_id) or "left_page" (navigated away
          or closed the tab while the dropdown was open). "left_page" is best-effort on desktop: the native
          nsFormFillController closes the dropdown through the same path as
          "dismissed" before this code gets a chance to see the navigation,
          so most desktop page-leaves are reported as "dismissed" instead.
        type: string
      flow_id:
        description: >
          An id generated when the dropdown opened, shared with the matching
          dropdown_shown event so the two can be correlated. It is reused when
          the dropdown reopens after a record removal prompt.
        type: string
