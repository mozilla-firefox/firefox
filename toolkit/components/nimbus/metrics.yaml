nimbus_events:
  enrollment:
    type: event
    description: >
      Recorded when a user has met the conditions and is first bucketed into an
      experiment (i.e. targeting matched and they were randomized into a bucket
      and branch of the experiment). Expected a maximum of once per experiment
      per user.
    extra_keys:
      experiment:
        type: string
        description: The slug/unique identifier of the experiment
      branch:
        type: string
        description: The branch slug/identifier that was randomly chosen
      experiment_type:
        type: string
        description: Indicates whether this is an experiment or rollout
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1773563
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1781953
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1773563
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1781953
    data_sensitivity:
      - technical
    notification_emails:
      - tlong@mozilla.com
      - project-nimbus@mozilla.com
    expires: never
    send_in_pings:
      - background-update
      - events
  enroll_failed:
    type: event
    description: >
      Recorded when an enrollment fails, including the reason for the failure.
    extra_keys:
      experiment:
        type: string
        description: The slug/unique identifier of the experiment
      reason:
        type: string
        description: The reason for the enrollment failure
      branch:
        type: string
        description: If reason == "invalid-branch", this is the invalid branch.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1773563
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1781953
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1997467
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1773563
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1781953
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1997467
    data_sensitivity:
      - technical
    notification_emails:
      - tlong@mozilla.com
      - project-nimbus@mozilla.com
    expires: never
    send_in_pings:
      - background-update
      - events
  unenrollment:
    type: event
    description: >
      Recorded when either telemetry is disabled, or the experiment has run
      for its designed duration (i.e. it is no longer present in the Nimbus
      Remote Settings collection)
    extra_keys:
      experiment:
        type: string
        description: The slug/unique identifier of the experiment
      branch:
        type: string
        description: The branch slug/identifier that was randomly chosen
      reason:
        type: string
        description: The reason for the unenrollment
      changed_pref:
        type: string
        description: >
          If reason == "changed-pref", then this contains the name of the pref
          that changed that caused the unenrollment.
      conflicting_slug:
        type: string
        description: >
          If reason == "prefFlips-conflict", the slug of the conflicting
          experiment that caused the unenrollment.
      pref_name:
        type: string
        description: >
          If reason == "prefFlips-failed", the name of the pref that failed to set.
      pref_type:
        type: string
        description: >
          If reason == "prefFlips-failed", The type of the existing pref value
          (one of "bool", "string", "int", or "invalid").
      locale:
        type: string
        description: >
          If reason == "l10n-missing-entry" or "l10n-missing-locale" this is the
          locale we failed to find in the set of available translations.
      about_config_change:
        description: >
          If reason == "changed-pref", whether or not the change was triggerd
          via about:config.
        type: string
      migration:
        description: >
          If reason == "migration", the migration that triggered the unenrollment.
        type: string
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1773563
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1781953
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1843126
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1896718
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1907649
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1976329
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1993057
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1773563
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1781953
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1843126
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1896718
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1907649
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1976329
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1993057
    data_sensitivity:
      - technical
    notification_emails:
      - tlong@mozilla.com
      - project-nimbus@mozilla.com
    expires: never
    send_in_pings:
      - background-update
      - events
  unenroll_failed:
    type: event
    description: >
      Recorded when an unenrollment fails, including the reason for the failure.
    extra_keys:
      experiment:
        type: string
        description: The slug/unique identifier of the experiment
      reason:
        type: string
        description: The reason for the unenrollment failure
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1773563
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1781953
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1773563
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1781953
    data_sensitivity:
      - technical
    notification_emails:
      - tlong@mozilla.com
      - project-nimbus@mozilla.com
    expires: never
    send_in_pings:
      - background-update
      - events
  exposure:
    type: event
    description: >
      Recorded when a user actually observes an experimental treatment, or
      would have observed an experimental treatment if they had been in a
      branch that would have shown one.
    extra_keys:
      experiment:
        type: string
        description: The slug/unique identifier of the experiment
      branch:
        type: string
        description: The branch slug/identifier that was randomly chosen
      feature_id:
        type: string
        description: A unique identifier for the feature that was exposed
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1773563
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1781953
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1773563
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1781953
    data_sensitivity:
      - technical
    notification_emails:
      - tlong@mozilla.com
      - project-nimbus@mozilla.com
    expires: never
    send_in_pings:
      - background-update
      - events
  validation_failed:
    type: event
    description: >
      This records when validation of a recipe fails.
    extra_keys:
      experiment:
        type: string
        description: The slug/unique identifier of the experiment
      reason:
        type: string
        description: >
          Why the validation failed.

          This will be one of the following reasons:

          - "invalid-recipe": the recipe failed schema validation;
          - "invalid-branch": a branch value failed schema validation;
          - "l10n-missing-locale": the recipe is missing localizations for a
            specific locale;
          - "l10n-missing-entry": the recipe is missing specific localization
            entries for a specific locale;
      branch:
        type: string
        description: >
          If reason == invalid-branch, the branch that failed validation.
      locale:
        type: string
        description: >
          If reason == missing-locale, the locale that was missing from the
          localization table.
          If reason == missing-l10n-entry, the locale that was missing the
          localization entries.
      l10n_ids:
        type: string
        description: >
          If reason == missing-l10n-entry, a comma-separated list of missing
          localization entries.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1762652
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1781953
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1821092
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1928476
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1953530
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1762652
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1781953
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1821092
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1928476
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1953530
    data_sensitivity:
      - technical
    notification_emails:
      - beth@mozilla.com
      - project-nimbus@mozilla.com
    expires: never
    send_in_pings:
      - background-update
      - events

  is_ready:
    type: event
    description: >
      An event sent when Nimbus is ready — sent upon completion of each update of the recipes.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1875510
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1875510
    data_sensitivity:
      - technical
    notification_emails:
      - chumphreys@mozilla.com
      - project-nimbus@mozilla.com
    expires: 180

  enrollment_status:
    type: event
    description: >
      Recorded for each enrollment status each time the SDK completes application of pending experiments.
    extra_keys:
      slug:
        type: string
        description: The slug/unique identifier of the experiment
      status:
        type: string
        description: The status of this enrollment
      reason:
        type: string
        description: The reason the client is in the noted status
      branch:
        type: string
        description: The branch slug/identifier that was randomly chosen (if the client is enrolled)
      error_string:
        type: string
        description: If the enrollment resulted in an error, the associated error string
      conflict_slug:
        type: string
        description: If the enrollment hit a feature conflict, the slug of the conflicting experiments/rollouts
      migration:
        type: string
        description: If the unenrollment was caused by a migration, the name of the migration.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1817481
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1955169
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1997467
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2006752
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2036433
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1817481
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1955169
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1997467
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2006752
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2036433
    data_sensitivity:
      - technical
    notification_emails:
      - beth@mozilla.com
      - project-nimbus@mozilla.com
    expires: never
    send_in_pings: *targeting_context_pings

  migration:
    type: event
    description: >
      Triggered whenever a Nimbus migration is attempted, whether or not it succeeds.
    extra_keys:
      migration_id:
        type: string
        description: The name of the migration that ran.

      success:
        type: boolean
        description: Whether or not the migration succeeded.

      error_reason:
        type: string
        description: >
          A string describing the error that occurred.

          Reasons include:

          - "unknown": an unknown exception occurred.
          - one of the reasons documented in
            `nimbus_events.remote_settings_sync_error`.

      duration:
        description: How long the migration took (in milliseconds).
        type: quantity

      is_first_startup:
        description: >
          Dis this migration occur during first startup (FirstStartup.sys.mjs)?
        type: boolean
    bugs:

      - https://bugzilla.mozilla.org/show_bug.cgi?id=1937169
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1985079
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2043752
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1937169
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1985079
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2043752
    data_sensitivity:
      - technical
    notification_emails:
      - beth@mozilla.com
      - project-nimbus@mozilla.com
    expires: never

  database_write:
    type: event
    description: >
      Emitted when writing to the NimbusEnrollments database table.
    extra_keys:
      success:
        type: boolean
        description: Whether or not the write suceeded.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1956079
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1956080
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1956079
    notification_emails:
      - beth@mozilla.com
      - project-nimbus@mozilla.com
    data_sensitivity:
     - technical
    expires: never

  remote_settings_sync_error:
    type: event
    description: >
      Triggered when Nimbus fails to get recipes from remote settings collections.

    extra_keys:
      collection:
        type: string
        description: The name of the collection.

      force_sync:
        type: boolean
        description: Whether or not the sync was forced.

      trigger:
        type: string
        description: What triggered the sync.

      reason:
        type: string
        description: >
          What caused the error. One of:

          - `backwards-sync`: The collection would have synced backwards.
          - `empty`: The collection is empty. (This is not strictly speaking an
            error, but there is usually at least one live experiment or rollout
            in each collection.)
          - `get-exception`: RemoteSettingsClient.get() threw an exception.
          - `invalid-data`: The collection did not return an array.
          - `invalid-last-modified`: The collection returned an invalid value
            for lastModified.
          - `last-modified-exception`: Asking the collection for the lastModified
            triggered an exception.
          - `null-last-modified`: The collection was empty but lastModified was
            null (i.e., not synced).
          - `missing-signature`: Signature verification failed.

    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1985079
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2053781
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1985079
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2053781

    data_sensitivity:
      - technical
    notification_emails:
      - beth@mozilla.com
      - project-nimbus@mozilla.com
    expires: never

  update_error:
    type: event
    description: >
      Triggered when Nimbus fails to complete an update.

    extra_keys:
      trigger:
        type: string
        description: >
          The trigger for the update. In practice this is one of "timer" or
          "enable".

      during_shutdown:
        type: boolean
        description: Whether the error occured during shutdown.

      error:
        type: string
        description: >
          A description of the error; one of:

          - DOMException:{name} (e.g., DOMException:AbortError)
          - NS_ERROR_*
          - the error constructor's name
          - the string "(unknown)"

    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2063425
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2063425

    data_sensitivity:
      - technical
    notification_emails:
      - beth@mozilla.com
      - project-nimbus@mozilla.com
    expires: never

  rollouts_opt_out:
    type: event
    description: >
      Emitted when a user opts out of rollouts (remote improvements).

    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2081293
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2081293

    data_sensitivity:
      - interaction
    notification_emails:
      - beth@mozilla.com
      - project-nimbus@mozilla.com
    expires: never

  studies_opt_out:
    type: event
    description: >
      Emitted when a user opts out of studies (experiments).

    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2081293
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2081293

    data_sensitivity:
      - interaction
    notification_emails:
      - beth@mozilla.com
      - project-nimbus@mozilla.com
    expires: never

normandy:
  expose_nimbus_experiment:
    type: event
    description: >
      This records an event at the moment the user is exposed to an
      experiment treatment. The event is triggered either by the code
      checking that a certain experiment feature is enabled or when that
      feature value is used. This is different from enrollment or
      experiment activation because it registers when a user actually gets
      exposed to the experiment feature.
      This event was generated to correspond to the Legacy Telemetry event
      normandy.expose#nimbus_experiment.
    bugs:
      - https://bugzil.la/1675104
    data_reviews:
      - https://bugzil.la/1675104
    notification_emails:
      - omc-core@mozilla.com
    expires: never
    extra_keys:
      value:
        description: >
          The `value` of the event. Mirrors to the Legacy Telemetry
          event's `value` parameter.
          The experiment slug.
        type: string
      branchSlug:
        description: >
          The slug for the branch the user is enrolled in.
        type: string
      featureId:
        description: >
          The type of experiment variant the user was enrolled into.
        type: string
    telemetry_mirror: Normandy_Expose_NimbusExperiment

  enroll_nimbus_experiment:
    type: event
    description: >
      Sent when applying a Normandy recipe of the above types has
      succeeded.
      This event was generated to correspond to the Legacy Telemetry event
      normandy.enroll#nimbus_experiment.
    bugs:
      - https://bugzil.la/1443560
      - https://bugzil.la/2084356
    data_reviews:
      - https://bugzil.la/1443560
    notification_emails:
      - project-nimbus@mozilla.com
    expires: never
    extra_keys:
      value:
        description: >
          The `value` of the event. Mirrors to the Legacy Telemetry
          event's `value` parameter.
        type: string
      experimentType:
        description: >
          For preference_study and nimbus_experiment recipes, the type of experiment this is ("exp" or "exp-highpop").

        type: string
      branch:
        description: >
          The slug of the branch that was chosen for this client.

        type: string
      addonId:
        description: >
          For addon_study recipes, the ID of the addon that was installed.
        type: string
      addonVersion:
        description: >
          For addon_study recipes, the version of the addon that was installed.
        type: string
    telemetry_mirror: Normandy_Enroll_NimbusExperiment

  enroll_failed_nimbus_experiment:
    type: event
    description: >
      Sent when applying a Normandy recipe of the above types has failed.
      This event was generated to correspond to the Legacy Telemetry event
      normandy.enrollFailed#nimbus_experiment.
    bugs:
      - https://bugzil.la/1443560
      - https://bugzil.la/2084356
    data_reviews:
      - https://bugzil.la/1443560
    notification_emails:
      - project-nimbus@mozilla.com
    expires: never
    extra_keys:
      value:
        description: >
          The `value` of the event. Mirrors to the Legacy Telemetry
          event's `value` parameter.
        type: string
      reason:
        description: >
          An error code describing the failure.
        type: string
      preference:
        description: >
          For preference_rollout when reason=conflict, the name of the preference that was going to be modified.

        type: string
      detail:
        description: >
          For addon_study and branched_addon study, extra text describing the failure.

        type: string
      branch:
        description: >
          The branch that failed to enroll.

        type: string
      addonId:
        description: >
          The ID of the addon for the rollout when reason=conflict.
        type: string
      conflictingSlug:
        description: >
          The slug for the conflicting rollout.
        type: string
      enrollmentId:
        description: >
          The enrollment ID of the conflicting rollout.
        type: string
      prefBranch:
        description: >
          For preference_study when reason=invalid-branch, the branch that was invalid.
        type: string
    telemetry_mirror: Normandy_Enrollfailed_NimbusExperiment

  unenroll_nimbus_experiment:
    type: event
    description: >
      Sent when a Normandy recipe of certain types "ends".  N.B. For
      preference_rollback, this is fired when the recipe is fired (the
      recipe that "ends" is a corresponding preference_rollout).
      This event was generated to correspond to the Legacy Telemetry event
      normandy.unenroll#nimbus_experiment.
    bugs:
      - https://bugzil.la/1443560
      - https://bugzil.la/1843126
      - https://bugzil.la/1896718
      - https://bugzil.la/1907649
      - https://bugzil.la/2084356
    data_reviews:
      - https://bugzil.la/1443560
      - https://bugzil.la/1843126
      - https://bugzil.la/1896718
      - https://bugzil.la/1907649
    notification_emails:
      - project-nimbus@mozilla.com
    expires: never
    extra_keys:
      value:
        description: >
          The `value` of the event. Mirrors to the Legacy Telemetry
          event's `value` parameter.
        type: string
      reason:
        description: >
          A code describing the reason why the recipe ended.
        type: string
      didResetValue:
        description: >
          For preference_study, "true" or "false" according to whether we put the preference back the way it was.

        type: string
      addonId:
        description: >
          For addon_study, the ID of the addon that ended.
        type: string
      addonVersion:
        description: >
          For addon_study, the version of the addon for which the recipe ended.
        type: string
      branch:
        description: >
          The branch of the experiment that this client was on.
        type: string
      enrollmentId:
        description: >
          A unique ID for this enrollment that will be included in all related Telemetry.
        type: string
      changedPref:
        description: >
          For preference_study or nimbus_experiment, the preference that was detected to change that caused the unenrollment.

        type: string
      conflictingSlug:
        description: >
          For nimbus_experiment, if reason == "prefFlips-conflict", the conflicting experiment that caused the unenrollment.

        type: string
      prefName:
        description: >
          For nimbus_experiment, if reason == "prefFlips-failed", the name of the pref that failed to set.

        type: string
      prefType:
        description: >
          For nimbus_experiment, if reason = "prefFlips-failed", the type of the existing pref value (one of "bool", "string", "int", or "invalid").

        type: string
    telemetry_mirror: Normandy_Unenroll_NimbusExperiment

  unenroll_failed_nimbus_experiment:
    type: event
    description: >
      Sent when unenrolling a user fails (see the unenroll event).
      This event was generated to correspond to the Legacy Telemetry event
      normandy.unenrollFailed#nimbus_experiment.
    bugs:
      - https://bugzil.la/1443560
      - https://bugzil.la/1693402
      - https://bugzil.la/2084356
    data_reviews:
      - https://bugzil.la/1443560
      - https://bugzil.la/1693402
    notification_emails:
      - project-nimbus@mozilla.com
    expires: never
    extra_keys:
      value:
        description: >
          The `value` of the event. Mirrors to the Legacy Telemetry
          event's `value` parameter.
        type: string
      reason:
        description: >
          A code describing the reason the unenroll failed.
        type: string
      enrollmentId:
        description: >
          A unique ID for this enrollment that will be included in all related Telemetry.
        type: string
      changedPref:
        description: >
          For preference_study, the preference that was detected to change that caused the attempted unenrollment.
        type: string
      caller:
        description: >
          The function that caused the stop to happen, included on Nightly to aid debugging.
        type: string
      originalReason:
        description: >
          The code that would had been used for the unenrollment, had it not failed.
        type: string
    telemetry_mirror: Normandy_Unenrollfailed_NimbusExperiment

  validation_failed_nimbus_experiment:
    type: event
    description: >
      This records when validation of a recipe fails.
      This event was generated to correspond to the Legacy Telemetry event
      normandy.validationFailed#nimbus_experiment.
    bugs:
      - https://bugzil.la/1762652
      - https://bugzil.la/1960370
      - https://bugzil.la/2084356
    data_reviews:
      - https://bugzil.la/1762652
      - https://bugzil.la/1960370
    notification_emails:
      - beth@mozilla.com
      - project-nimbus@mozilla.com
    expires: never
    extra_keys:
      value:
        description: >
          The `value` of the event. Mirrors to the Legacy Telemetry
          event's `value` parameter (i.e., the experiment slug).
        type: string
      reason:
        description: >
          Why the validation failed.

          This will be one of the following reasons:

          - "invalid-recipe": the recipe failed schema validation;
          - "invalid-branch": a branch value failed schema validation;
          - "l10n-missing-locale": the recipe is missing localizations for a
            specific locale;
          - "l10n-missing-entry": the recipe is missing specific localization
            entries for a specific locale;
        type: string
      branch:
        description: >
          If reason == invalid-branch, the branch that failed validation.
        type: string
      locale:
        description: >
          If reason == missing-locale, the locale that was missing from the
          localization table.
          If reason == missing-l10n-entry, the locale that was missing the
          localization entries.
        type: string
      l10n_ids:
        description: >
          If reason == missing-l10n-entry, a comma-separated list of missing localization entries.
        type: string
    telemetry_mirror: Normandy_Validationfailed_NimbusExperiment

heartbeat:
  flow_id:
    type: uuid
    description: |
      An identifier for the rating flow, generated on the client.
    bugs:
      - https://bugzilla.mozilla.org/1963706
    data_reviews:
      - https://bugzilla.mozilla.org/1963706
    data_sensitivity:
      - technical
    notification_emails:
      - project-nimbus@mozilla.com
    expires: never
    send_in_pings:
      - heartbeat

  offered:
    type: datetime
    time_unit: millisecond
    description: |
      When the survey was shown to the user.
    bugs:
      - https://bugzilla.mozilla.org/1963706
    data_reviews:
      - https://bugzilla.mozilla.org/1963706
    data_sensitivity:
      - technical
    notification_emails:
      - project-nimbus@mozilla.com
    expires: never
    send_in_pings:
      - heartbeat

  learn_more:
    type: datetime
    time_unit: millisecond
    description: |
      When the user clicked on the "Learn More" link.
    bugs:
      - https://bugzilla.mozilla.org/1963706
    data_reviews:
      - https://bugzilla.mozilla.org/1963706
    data_sensitivity:
      - technical
    notification_emails:
      - project-nimbus@mozilla.com
    expires: never
    send_in_pings:
      - heartbeat

  voted:
