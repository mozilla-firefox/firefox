[DEFAULT]
# Places is not included on Android. Additionally, it is not worth
# running conditioned profiles on these migration tests for databases.
# See discussion in bug 1838791.
run-if = [
  "os != 'android' && !condprof",
]
head = "head_migration.js"
# SQLite at-rest encryption (Bug 1996558): these tests migrate pre-built
# PLAINTEXT places.sqlite fixtures, which an encrypting build cannot read (there
# is no plaintext->encrypted migration by design, and obfsvfs cannot ingest a
# plaintext database). Schema migration is VFS-agnostic and is covered with
# encryption off, so run these tests with encryption disabled.
prefs = ["security.storage.encryption.sqlite.enabled=false"]

support-files = [
  "favicons_v41.sqlite",
  "places_outdated.sqlite",
  "places_v52.sqlite",
  "places_v54.sqlite",
  "places_v66.sqlite",
  "places_v68.sqlite",
  "places_v69.sqlite",
  "places_v70.sqlite",
  "places_v72.sqlite",
  "places_v74.sqlite",
  "places_v77.sqlite",
  "places_v78.sqlite",
  "places_v79.sqlite",
  "places_v81.sqlite",
  "places_v82.sqlite",
  "places_v83.sqlite",
  "places_v85.sqlite",
  "places_v86.sqlite",
  "places_v87.sqlite",
  "places_v88.sqlite",
  "places_v89.sqlite",
]

