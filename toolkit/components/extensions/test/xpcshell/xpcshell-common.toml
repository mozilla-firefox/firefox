["test_ext_storage_local_corrupted_idb.js"]
# Recreates the corrupted-database scenario by tampering with the storage.local
# IndexedDB sqlite3 file directly (opening it and dropping the object store), so
# it requires the on-disk format to be plaintext SQLite; pin encryption off.
