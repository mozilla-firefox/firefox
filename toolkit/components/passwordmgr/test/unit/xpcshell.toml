[DEFAULT]
head = "head.js"
run-if = [
  "os != 'android'", # Not supported on GV because we can't add/remove from storage.
]
support-files = ["data/**"]
# The common head copies a fixture key4.db that is incompatible with at-rest
# encryption's NSS initialization, so disable SQLite at-rest encryption here.
prefs = ["security.storage.encryption.sqlite.enabled=false"]

["test_BreachAlertStore.js"]

["test_BreachAlertsData.js"]

["test_CSVParser.js"]

["test_LoginManagerParent_doAutocompleteSearch.js"]
run-if = [
  "os != 'android'", # Password generation not packaged/used on Android
]

["test_LoginManagerParent_getGeneratedPassword.js"]
run-if = [
  "os != 'android'", # Password generation not packaged/used on Android
]

["test_LoginManagerParent_onPasswordEditedOrGenerated.js"]
run-if = [
  "os != 'android'", # Password generation not packaged/used on Android
]

["test_LoginManagerParent_searchAndDedupeLogins.js"]
run-if = [
  "os != 'android'", # schemeUpgrades aren't supported
]

["test_LoginManagerPrompter_getUsernameSuggestions.js"]
run-if = [
  "os != 'android'", # Tests desktop's prompter
]

["test_LoginStorageMigrator.js"]
run-if = [
  "os != 'android'", # The migrator only runs on desktop
]

["test_LoginStorageMigrator_nimbus.js"]
run-if = [
  # The migrator only runs on desktop browser builds.
  "os != 'android' && buildapp == 'browser'",
]

["test_OSCrypto_win.js"]
run-if = [
  "os == 'win'",
]

["test_PasswordGenerator.js"]
run-if = [
  "os != 'android'", # Not packaged/used on Android
]

["test_PasswordRulesManager_generatePassword.js"]

["test_context_menu.js"]
skip-if = [
  "os == 'android'", # The context menu isn't used on Android.
]
# LoginManagerContextMenu is only included for MOZ_BUILD_APP == 'browser'.
run-if = [
  "buildapp == 'browser'",
]

