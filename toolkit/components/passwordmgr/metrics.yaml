  rust_migration_status:
    type: event
    description: >
      One record per migration run, recording duration, login and vulnerable
      password counts, the resulting state and any fatal error. Also recorded,
      with the end state "Deferred", on a startup on which the migration did
      not run because the primary password was not entered.
    bugs:
      - https://bugzil.la/1985800
      - https://bugzil.la/2087534
    data_reviews:
      - https://bugzil.la/1985800
      - https://bugzil.la/2087534
    data_sensitivity:
      - technical
    notification_emails:
      - passwords-dev@mozilla.org
    expires: never
    extra_keys:
      metric_version:
        type: string
        description: Identifier for rust migration telemetry version
      run_id:
        type: string
        description: Unique identifier for the migration run.
      duration_ms:
        description: >
          Duration of the migration in milliseconds.
        type: quantity
      number_of_logins_to_migrate:
        description: >
          Total number of logins to be migrated during this run.
        type: quantity
      number_of_logins_migrated:
        description: >
          Number of logins migrated during this run.
        type: quantity
      number_of_logins_quarantined:
        description: >
          Number of logins quarantined during this run.
        type: quantity
      number_of_vulnerable_passwords:
        description: >
          Number of potentially vulnerable passwords migrated during this run.
        type: quantity
      attempt:
        description: >
          Number of prior migration attempts across sessions (0 on the first
          attempt).
        type: quantity
      end_state:
        description: >
          Migrator state after the run, e.g. "RustPrimary" when the migration
          completed or "MigrationPending" when it did not, or "Deferred" when
          it did not run because the primary password was not entered.
        type: string
      primary_password_set:
        description: >
          Whether a Primary Password was set at the time of the run.
        type: boolean
      primary_password_deferrals:
        description: >
          How many startups in a row the primary password prompt for the
          migration had been canceled: on a run, before it started; on a
          deferred startup, including this one.
        type: quantity
      deferral_reason:
        description: >
          Why the migration was deferred, only set with the end state
          "Deferred": "primary_password_canceled" when the user canceled the
          primary password prompt, or "primary_password_limit" when it was not
          shown because it had been canceled too often.
        type: string
      error_message:
        description: >
          The fatal error that aborted the run, or empty if the run completed.
        type: string

  rust_migration_login_error:
    type: event
    description: >
      Records one event per login that could not be migrated, with the
      normalized error message.
    bugs:
      - https://bugzil.la/1991676
    data_reviews:
      - https://bugzil.la/1991676
    data_sensitivity:
      - technical
    notification_emails:
      - passwords-dev@mozilla.org
    expires: never
    extra_keys:
      metric_version:
        type: string
        description: Identifier for rust migration telemetry version
      run_id:
        type: string
        description: Unique identifier for the migration run
      error_message:
        description: >
          The error message or exception string from the failure.
        type: string

  rust_restore_status:
    type: event
    description: >
      One record per run that restores logins out of the deactivated Rust
      store back into the JSON store, recording duration, login counts and
      any fatal error.
    bugs:
      - https://bugzil.la/2065593
      - https://bugzil.la/2072278
    data_reviews:
      - https://bugzil.la/2065593
      - https://bugzil.la/2072278
    data_sensitivity:
      - technical
    notification_emails:
      - passwords-dev@mozilla.org
    expires: never
    extra_keys:
      metric_version:
        type: string
        description: Identifier for rust migration telemetry version
      run_id:
        type: string
        description: Unique identifier for the restore run.
      duration_ms:
        description: >
          Duration of the restore in milliseconds, measured with a monotonic
          clock.
        type: quantity
      restore_version:
        description: >
          The restore pass this record belongs to, from
          signon.storage.rust.restoreTargetVersion. The attempt budget is
          counted per version.
        type: quantity
      attempt:
        description: >
          Number of prior restore attempts across sessions (0 on the first
          attempt). Restores stop being attempted once this reaches its
          budget.
        type: quantity
      state:
        description: >
          Migrator state when the restore started: "RevertPending" the first
          time the Rust backend is deactivated, "JSONPrimary" for a later
          startup retrying a restore that did not complete.
        type: string
      number_of_logins_to_restore:
        description: >
          Number of logins found in the Rust store. Reported for every run,
          including the ones that give up before reading the store, so
          "TooManyLogins" says how many logins it left behind.
        type: quantity
      number_of_logins_added:
        description: >
          Number of logins that did not exist in the JSON store and were added.
        type: quantity
      number_of_logins_updated:
        description: >
          Number of logins whose credentials were newer in the Rust store and
          were written back to the JSON store.
        type: quantity
      number_of_logins_skipped:
        description: >
          Number of logins left untouched because the JSON store already held
          the same or newer credentials.
        type: quantity
      number_of_logins_failed:
        description: >
          Number of logins that could not be restored. The Rust store is kept
          instead of wiped when this is non-zero, so the next startup retries.
        type: quantity
      number_of_logins_to_delete:
        description: >
          Number of logins the JSON store holds that the Rust store no longer
          has, which is what carrying the deletions made under the Rust
          backend over to the JSON store would delete. The restore deletes
          nothing, and the number still includes any login the migration
          failed to copy; telling those two apart is what it is collected for.
          Absent from records written before bug 2072278.
        type: quantity
      end_state:
        description: >
          Outcome of the run: "Restored" when every login made it into the JSON
          store, "Incomplete" when individual logins failed, "Deferred" when
          the primary password was locked and the restore is waiting for the
          unlock, "Aborted" when the browser shut down mid-run,
          "TooManyLogins" when the Rust store held implausibly many logins,
          "Failed" when a fatal error aborted the run. The Rust database is
          never touched. "Restored" and "TooManyLogins" are final, the others
          mean a later startup tries again.
        type: string
      primary_password_set:
        description: >
          Whether a Primary Password was set at the time of the run.
        type: boolean
      error_message:
        description: >
          The fatal error that aborted the run, or empty if the run completed.
        type: string

  rust_restore_login_error:
    type: event
    description: >
      Records one event per login that could not be restored from the
      deactivated Rust store, with the normalized error message.
    bugs:
      - https://bugzil.la/2065593
    data_reviews:
      - https://bugzil.la/2065593
    data_sensitivity:
      - technical
    notification_emails:
      - passwords-dev@mozilla.org
    expires: never
    extra_keys:
      metric_version:
        type: string
        description: Identifier for rust migration telemetry version
      run_id:
        type: string
        description: Unique identifier for the restore run
      error_message:
        description: >
          The error message or exception string from the failure.
        type: string

  storage_operation_time:
    type: event
    description: >
      One record per login storage operation performed through LoginManager,
      with the backend that served it and how long the caller waited. Not
      recorded when the operation fails, so event counts are not success rates.
      The duration includes a primary password prompt when the operation
      triggered one; those samples can be excluded in analysis using
      pwmgr.primary_password_prompt events that overlap the operation window.
    bugs:
      - https://bugzil.la/2070146
    data_reviews:
      - https://bugzil.la/2070146
    data_sensitivity:
      - technical
    notification_emails:
      - passwords-dev@mozilla.org
    expires: never
    extra_keys:
      backend:
        type: string
        description: >
          The storage backend that served the call: "json", "rust" or
          "geckoview".
      operation:
        type: string
        description: >
          "search", "list", "count" or "record_password_use".
      duration_ms:
        type: quantity
        description: >
          Duration of the call as seen by the caller, measured in LoginManager
          around the delegation to the active backend.

  rust_init_status:
    type: event
    description: >
      One record per login storage initialization, with the duration of each
      phase, the backend the migrator selected and any fatal error. Migration
      traffic has its own event, rust_migration_status.
    bugs:
      - https://bugzil.la/2070152
    data_reviews:
      - https://bugzil.la/2070152
    data_sensitivity:
      - technical
    notification_emails:
      - passwords-dev@mozilla.org
    expires: never
    extra_keys:
      init_rust_components_ms:
        type: quantity
        description: Duration of initializing the shared Rust components.
      create_rust_store_ms:
        type: quantity
        description: >
          Duration of creating/opening the Rust login store, including opening
          the SQLite database and running schema initialization.
      total_ms:
        type: quantity
        description: Duration of the complete initialization.
      backend:
        type: string
        description: >
          The backend the migrator selected as active for this session, "json"
          or "rust". Both stores are initialized on every startup; this also
          says which store number_of_logins was counted from.
      result:
        type: string
        description: >
          "ok", or "error" when initialization aborted with a fatal error.
      error_kind:
        type: string
        description: >
          Name of the error that aborted initialization, or empty when it
          completed.

