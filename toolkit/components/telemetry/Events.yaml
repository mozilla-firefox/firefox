        "manage_devices" (opened device management).

messaging_experiments:
  reach:
    objects: [
      "cfr",
      "moments_page",
      "infobar",
      "spotlight",
      "featureCallout",
      "fxms_bmb_button",
      "fxms_message",
      "fxms_message_1",
      "fxms_message_2",
      "fxms_message_3",
      "fxms_message_4",
      "fxms_message_5",
      "fxms_message_6",
      "fxms_message_7",
      "fxms_message_8",
      "fxms_message_9",
      "fxms_message_10",
      "fxms_message_11",
      "fxms_message_12",
      "fxms_message_13",
      "fxms_message_14",
      "fxms_message_15",
      "fxms_message_16",
      "fxms_message_17",
      "fxms_message_18",
      "fxms_message_19",
      "fxms_message_20",
      "fxms_message_21",
      "fxms_message_22",
      "fxms_message_23",
      "fxms_message_24",
      "fxms_message_25"
    ]
    methods: ["reach"]
    release_channel_collection: opt-out
    products:
      - "firefox"
    record_in_processes: ["main"]
    description: >
      This records whether a branch's targeting is satisfied for Messaging System
      experiments. All qualified branch ID(s) will be recorded in the 'extra_keys'
      for each active experiment, and the event 'value' will be the experiment ID
    bug_numbers: [1471318]
    notification_emails: ["omc-core@mozilla.com"]
    expiry_version: "never"
    extra_keys:
      branches: The slug for the branch the message came from.
      message_id: The ID of the message that triggered this reach event.
  targeting:
    objects:
      - attribute_error
      - attribute_timeout
    methods:
      - targeting
    extra_keys:
      source: "Source of targeting expression: experiment slug or message id"
    release_channel_collection: opt-out
    products:
      - firefox
    record_in_processes:
      - main
    description: >
      Record generic JEXL errors that result from issues with experiment or
      message targeting expressions. The value field contains the namespace and
      attribute name that caused the error.
    bug_numbers:
      - 1644743
    notification_emails:
      - omc-core@mozilla.com
    expiry_version: never

# This category contains event entries used for Telemetry tests.
# They will not be sent out with any pings.
telemetry.test:
  test:
    methods: ["test1", "test2"]
    objects: ["object1", "object2"]
    bug_numbers: [1286606]
    notification_emails: ["telemetry-client-dev@mozilla.com"]
    products:
      - "firefox"
      - "fennec"
      - "thunderbird"
    record_in_processes: ["main"]
    description: This is a test entry for Telemetry.
    expiry_version: never
    extra_keys:
      key1: This is just a test description.
      key2: This is another test description.
  optout:
    objects: ["object1", "object2"]
    bug_numbers: [1286606]
    notification_emails: ["telemetry-client-dev@mozilla.com"]
    release_channel_collection: opt-out
    products:
      - "firefox"
      - "fennec"
      - "thunderbird"
    record_in_processes: ["main"]
    description: This is an opt-out test entry.
    expiry_version: never
    extra_keys:
      key1: This is just a test description.
  expired_version:
    objects: ["object1", "object2"]
    bug_numbers: [1286606]
    notification_emails: ["telemetry-client-dev@mozilla.com"]
    products:
      - "firefox"
      - "fennec"
      - "thunderbird"
    record_in_processes: ["main"]
    description: This is a test entry with an expired version.
    expiry_version: "3"
  not_expired_optout:
    objects: ["object1"]
    bug_numbers: [1286606, 1685406]
    notification_emails: ["telemetry-client-dev@mozilla.com"]
    description: This is an opt-out test entry with unexpired date and version.
    release_channel_collection: opt-out
    products:
      - "firefox"
      - "fennec"
      - "thunderbird"
    record_in_processes: ["main", "content"]
