---
$schema: moz://mozilla.org/schemas/glean/metrics/2-0-0
$tags:
  - 'Firefox :: Translations'

translations:
  request_count:
    type: labeled_counter
    labels:
      - full_page
      - select
      - about_translations
    description: >
      The count of translation requests, along with their type.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1900432
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1999999
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1900432
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1999999
    data_sensitivity:
      - technical
    notification_emails:
      - translations-telemetry-alerts@mozilla.com
    expires: never

  error:
    type: event
    description: >
      The specific translations error that caused a full_page translation failure.
    extra_keys:
      flow_id: &flow_id
        type: string
        description: A uuid to relate events associated with the current panel session.
      reason:
        type: string
        description: The reason for the error.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1836436
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1841366
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1845428
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1861319
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1836436#c4
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1841366#c11
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1845428
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1861319
    data_sensitivity:
      - technical
    notification_emails:
      - translations-telemetry-alerts@mozilla.com
    expires: never

  identify_page_language:
    type: event
    description: >
      Triggers when the language of a page is identified for Translations.
    extra_keys:
      html_lang_attribute:
        type: string
        description: The language tag of the page specified within the HTML.
      identified_language:
        type: string
        description: The language tag that was identified via detection.
      lang_tags_match:
        type: boolean
        description: Whether the identified language matches the HTML lang attribute.
      is_lang_attribute_valid:
        type: boolean
        description: Whether the language tag of the page is a valid language tag.
      extracted_code_units:
        type: quantity
        description: The length of the page text sample that was used for detection.
      identification_time:
        type: quantity
        description: The time it took to identify a language from the extracted text, in ms.
      confident:
        type: boolean
        description: Whether the language detection was confident in the result.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1861698
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1861698
    data_sensitivity:
      - interaction
    notification_emails:
      - translations-telemetry-alerts@mozilla.com
    expires: never


  translation_request:
    type: event
    description: >
      Triggers when a translation request is sent.
    extra_keys:
      flow_id: *flow_id
      from_language: &from_language
        type: string
        description: The language being translated from.
      to_language: &to_language
        type: string
        description: The language being translated to.
      document_language: &document_language
        type: string
        description: The detected BCP-47 language tag of the document.
      request_target:
        type: string
        description: >
          The target of the translation request, whether it is
          "full_page", "select", or "about_translations".
      source_text_code_units:
        type: quantity
        description: The length of the source text to be translated in UTF-16 code units.
      source_text_word_count:
        type: quantity
        description: The number of words in the source-language text to be translated.
      auto_translate:
        type: boolean
        description: >
          True if this translation was triggered automatically
          due to configured always-translate-language settings.
          False if this translation was triggered manually.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1836381
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1841366
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1845428
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1847150
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1861319
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1870367
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1999999
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1836381#c4
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1841366#c11
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1845428#c16
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1847150#c4
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1861319#c6
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1870367
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1999999
    data_sensitivity:
      - interaction
    notification_emails:
      - translations-telemetry-alerts@mozilla.com
    expires: never

  restore_page:
    type: event
    description: >
      Triggers when the a restore-page event is triggered.
    extra_keys:
      flow_id: *flow_id
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1845428
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1861319
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1845428
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1861319
    data_sensitivity:
      - interaction
    notification_emails:
      - translations-telemetry-alerts@mozilla.com
    expires: never

  engine_performance:
    type: event
    description: >
      Metrics related to the performance of the TranslationsEngine.
    extra_keys:
      from_language: *from_language
      to_language: *to_language
      average_words_per_request:
        type: quantity
        description: The average count of words that this engine translated per request.
      average_words_per_second:
        type: quantity
        description: The average words per second that this engine translated per request.
      total_completed_requests:
        type: quantity
        description: The count of translation requests that were completed by this engine.
      total_inference_seconds:
        type: quantity
        description: The total seconds this engine spent in active translation inference.
      total_translated_words:
        type: quantity
        description: The total number of words translated by this engine.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1943132
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1943132
    data_sensitivity:
      - interaction
    notification_emails:
      - translations-telemetry-alerts@mozilla.com
    expires: never

