security.ui.neterror:
  load_aboutneterror:
    type: event
    description: >
      The about:neterror page is loaded with a network error (not a
      certificate error, TLS error, or DoH warning). The error code is
      recorded in the value extra key.
    bugs:
      - https://bugzil.la/2022590
      - https://bugzil.la/2048027
    data_reviews:
      - https://bugzil.la/2022590
      - https://bugzil.la/2048027
    notification_emails:
      - jaws@mozilla.com
      - seceng-telemetry@mozilla.com
    expires: never
    data_sensitivity:
      - technical
    extra_keys:
      value:
        description: >
          The error code string (e.g. dnsNotFound, connectionFailure,
          netTimeout). Truncated to 40 characters.
        type: string
      is_frame:
        description: >
          If the error page is loaded in an iframe.
        type: boolean
      channel_status:
        description: >
          The status of the failed channel, as an nsresult.
        type: quantity
      no_connectivity:
        description: >
          Whether Firefox considers the device offline (OS link bit is down).
          Only true for dnsNotFound when RPMHasConnectivity() returns false.
        type: boolean
      captive_portal_state:
        description: >
          The captive portal service state at page load time: unknown,
          not_captive, unlocked_portal, or locked_portal. not_captive is
          the only value that confirms the user is actually online.
        type: string
      trr_only:
        description: >
          Whether this is a TRR-only (DoH strict mode) DNS failure.
        type: boolean

  click_try_again_button:
    type: event
    description: >
      User clicked the Try Again button on the network error page.
    bugs: &security_ui_neterror_click_bugs
