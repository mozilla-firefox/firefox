  <script class="testbody" type="application/javascript">
  <![CDATA[

const { AppConstants } = ChromeUtils.importESModule(
  "resource://gre/modules/AppConstants.sys.mjs"
);
const { Assert } = ChromeUtils.importESModule(
  "resource://testing-common/Assert.sys.mjs"
);
const assert = new Assert((err, message) =>
  ok(!err, err ? err.message : message)
);

async function openAndCollectErrors(id, onShown) {
  let errors = [];
  let sentinel = new Promise(resolve => {
    SpecialPowers.registerConsoleListener(msg => {
      if (msg.message == "SENTINEL") {
        resolve();
      } else if (msg.errorMessage?.startsWith("AccessKeyConflictError:")) {
        errors.push(msg.errorMessage);
      }
    });
  });
  let popup = document.getElementById(id);
  let shown = new Promise(resolve =>
    popup.addEventListener(
      "popupshown",
      () => {
        onShown?.();
        resolve();
      },
      { once: true }
    )
  );
  popup.openPopup(document.getElementById("anchor"), "after_start");
  await shown;
  if (document.hasPendingL10nMutations) {
    await new Promise(resolve =>
      document.addEventListener("L10nMutationsFinished", resolve, {
        once: true,
      })
    );
  }
  // The check runs in a system-group listener, after this one.
  await new Promise(resolve => SimpleTest.executeSoon(resolve));
  let hidden = new Promise(resolve =>
    popup.addEventListener("popuphidden", resolve, { once: true })
  );
  popup.hidePopup();
  await hidden;
  SpecialPowers.postConsoleSentinel();
  await sentinel;
  return errors;
}

add_setup(async function setup() {
  // The check skips native menus, so open the test menus as XUL popups on
  // macOS. testNativeMenuSkipped opens a native one.
  await SpecialPowers.pushPrefEnv({
    set: [["widget.macos.native-anchored-menus", false]],
  });
  L10nRegistry.getInstance().registerSources([
    L10nFileSource.createMock(
      "accesskey-test",
      "app",
      ["en-US"],
      "/localization/{locale}/",
      [
        {
          path: "/localization/en-US/accesskey-test.ftl",
          source: `
undo =
  .label = Undo
  .accesskey = u
redo =
  .label = Redo
  .accesskey = r
`,
        },
      ]
    ),
  ]);
  SimpleTest.registerCleanupFunction(() =>
    L10nRegistry.getInstance().removeSources(["accesskey-test"])
  );
  let link = document.createElementNS("http://www.w3.org/1999/xhtml", "link");
  link.rel = "localization";
  link.href = "accesskey-test.ftl";
  document.documentElement.append(link);
});

add_task(async function testDistinctAccessKeys() {
  is(
    (await openAndCollectErrors("distinct")).length,
    0,
    "Distinct accesskeys on every item are fine, submenu items don't count"
  );
});

add_task(async function testNoAccessKeys() {
  is(
    (await openAndCollectErrors("none")).length,
    0,
    "No accesskey on any item is fine"
  );
});

add_task(async function testDuplicateAccessKey() {
  let errors = await openAndCollectErrors("duplicate");
  is(errors.length, 1, "A shared accesskey is reported once");
  assert.stringContains(
    errors[0],
    `menupopup#duplicate: accesskey "t" is shared by "Two", "Three"`,
    "Message names the key and both items"
  );
  assert.stringContains(
    errors[0],
    "Fix a shared accesskey",
    "Message recommends remedies for the problem it found"
  );
  ok(
    !errors[0].includes("Fix a missing accesskey"),
    "Message recommends nothing for a problem it didn't find"
  );
});

add_task(async function testIntendedDuplicate() {
  let errors = await openAndCollectErrors("intended");
  is(errors.length, 1, "Unmarked items sharing the key are still reported");
  assert.stringContains(
    errors[0],
    `accesskey "o" is shared by "One", "Three"`,
    "Unmarked items sharing the key are reported"
  );
  ok(
    !errors[0].includes("Two"),
    "An item with intended-duplicate-accesskey is left out"
  );
  is(
    (await openAndCollectErrors("intended-only")).length,
    0,
    "A key shared only with a marked item is not a conflict"
  );
});

add_task(async function testIntendedDuplicateEmpty() {
  let errors = await openAndCollectErrors("intended-empty");
  is(errors.length, 1, "An empty intended-duplicate-accesskey is reported");
  assert.stringContains(
    errors[0],
    `"Two" has an empty intended-duplicate-accesskey`,
    "Message names the item"
  );
  assert.stringContains(
    errors[0],
    "Fix intended-duplicate-accesskey",
    "Message recommends a remedy for the empty value"
  );
});

add_task(async function testWebExtensionItems() {
  is(
    (await openAndCollectErrors("webextension")).length,
    0,
    "WebExtension items are left out of the shared-key check, with or without an empty intended-duplicate-accesskey"
  );
});

add_task(async function testIntendedDuplicateIds() {
  is(
    (await openAndCollectErrors("intended-named")).length,
    0,
    "Ids naming items with the same accesskey, hidden or not, are accepted"
  );
  let errors = await openAndCollectErrors("intended-stale");
  is(errors.length, 1, "Stale ids are reported once");
  assert.stringContains(
    errors[0],
    `"Two" names "stale-one" in intended-duplicate-accesskey, which has accesskey "n"`,
    "An id naming an item with a different accesskey is reported"
  );
  assert.stringContains(
    errors[0],
    `"Two" names "stale-missing" in intended-duplicate-accesskey, which is not an item of this menu`,
    "An id naming no element is reported"
  );
  assert.stringContains(
    errors[0],
    `"Two" names "stale-nested" in intended-duplicate-accesskey, which is not an item of this menu`,
    "An id naming an item of a submenu is reported"
  );
  assert.stringContains(
    errors[0],
    "Fix intended-duplicate-accesskey",
    "Message recommends a remedy for stale ids"
  );
  ok(
    !errors[0].includes("Fix a shared accesskey"),
    "Message recommends nothing for a problem it didn't find"
  );
});

add_task(async function testMixedAccessKeys() {
  let errors = await openAndCollectErrors("mixed");
  is(errors.length, 1, "Mixing items with and without an accesskey is reported once");
  assert.stringContains(
    errors[0],
    `"Two", "Three" have no accesskey while "One" does`,
    "Message names the items on both sides, including one in a menugroup"
  );
  assert.stringContains(
    errors[0],
    "Fix a missing accesskey",
    "Message recommends remedies for the problem it found"
  );
  ok(
    !errors[0].includes("Fix a shared accesskey"),
    "Message recommends nothing for a problem it didn't find"
  );
});

add_task(async function testHiddenItemIgnored() {
  is(
    (await openAndCollectErrors("hidden")).length,
    0,
    "A hidden item doesn't count as an item without an accesskey"
  );
});

add_task(async function testTrackedMenuSkipped() {
  is(
    (await openAndCollectErrors("tracked")).length,
    0,
    "A menu naming its accesskey-conflicts bug is skipped"
  );
});

add_task(async function testAutoAccessKeys() {
  let items = [...document.querySelectorAll("#auto [auto-accesskey]")];
  is(
    (await openAndCollectErrors("auto")).length,
    0,
    "An item with auto-accesskey may share its accesskey"
  );
  assert.deepEqual(
    items.map(item => item.getAttribute("accesskey")),
    ["c", "Q", "F", "E", "f", "S"],
    "Each item gets its label's first typeable letter, skipping punctuation, emoji, IME scripts, superscript digits and modifier letters"
  );
  items[0].setAttribute("label", "Paste");
  await openAndCollectErrors("auto");
  is(
    items[0].getAttribute("accesskey"),
    "P",
    "The accesskey follows a changed label when the popup opens again"
  );
});

add_task(async function testAutoAccessKeysNestedAndAdded() {
  let popup = document.getElementById("auto-nested");
  let added = document.createXULElement("menuitem");
  added.setAttribute("label", "Added");
  added.setAttribute("auto-accesskey", "");
  popup.addEventListener("popupshowing", () => popup.append(added), {
    once: true,
  });
  await openAndCollectErrors("auto-nested");
  is(
    popup.querySelector("menugroup [auto-accesskey]").getAttribute("accesskey"),
    "N",
    "An item inside a nested menugroup gets an accesskey"
  );
  is(
    added.getAttribute("accesskey"),
    "A",
    "An item added by a popupshowing listener gets an accesskey"
  );
  added.remove();
});

add_task(async function testAutoAccessKeysDisabledItems() {
  await SpecialPowers.pushPrefEnv({
    set: [["ui.skipNavigatingDisabledMenuItem", 1]],
  });
  await openAndCollectErrors("auto-disabled");
  is(
    document
      .querySelector("#auto-disabled [auto-accesskey]")
      .getAttribute("accesskey"),
    "2",
    "A disabled item's accesskey stays taken"
  );
  await openAndCollectErrors("auto-disabled-keyed");
  is(
    document
      .querySelector("#auto-disabled-keyed [auto-accesskey]")
      .getAttribute("accesskey"),
    "R",
    "A disabled item with an accesskey counts as another item with an accesskey"
  );
  await SpecialPowers.popPrefEnv();
});

add_task(async function testAutoAccessKeysOthersUnkeyed() {
  let item = document.querySelector("#auto-others-unkeyed [auto-accesskey]");
  is(
    (await openAndCollectErrors("auto-others-unkeyed")).length,
    0,
    "A menu without accesskeys gets none for its auto-accesskey items"
  );
  ok(
    !item.hasAttribute("accesskey"),
    "The item doesn't take the first letter of another item's label"
  );
});

add_task(async function testAutoAccessKeysAfterTranslation() {
  let popup = document.getElementById("auto-translated");
  popup.addEventListener(
    "popupshowing",
    () => {
      document.l10n.setAttributes(
        document.getElementById("auto-translated-item"),
        "redo"
      );
    },
    { once: true }
  );
  is(
    (await openAndCollectErrors("auto-translated")).length,
    0,
    "The auto-accesskey item may share the translated item's accesskey"
  );
  is(
    popup.querySelector("[auto-accesskey]").getAttribute("accesskey"),
    "R",
    "The item gets an accesskey once the other items' translations arrive"
  );
});

add_task(async function testAutoAccessKeyDigits() {
  let items = [...document.querySelectorAll("#auto-digits [auto-accesskey]")];
  is(
    (await openAndCollectErrors("auto-digits")).length,
    0,
    "Items without a typeable letter get accesskeys"
  );
  assert.deepEqual(
    items.map(item => item.getAttribute("accesskey")),
    ["3", "2", "4"],
    "Each item without a typeable letter or digit gets the lowest unused digit"
  );
});

add_task(async function testAutoAccessKeyDigitMode() {
  let items = [
    ...document.querySelectorAll("#auto-digit-mode [auto-accesskey]"),
  ];
  is(
    (await openAndCollectErrors("auto-digit-mode")).length,
    0,
    "Items with auto-accesskey=digit may share their accesskeys"
  );
  assert.deepEqual(
    items.map(item => item.getAttribute("accesskey")),
    ["2", "3", "4", "5", "6", "7", "8", "9", "0", "3"],
    "Each digit item gets the next unused digit, starting over once they run out"
  );
});

add_task(async function testNativeMenuSkipped() {
  if (AppConstants.platform != "macosx") {
    ok(true, "Only macOS shows menus natively");
    return;
  }
  if (Services.env.get("MOZ_HEADLESS")) {
    ok(true, "Menus aren't native in headless mode");
    return;
  }
  await SpecialPowers.pushPrefEnv({
    set: [["widget.macos.native-anchored-menus", true]],
  });
  let popup = document.getElementById("duplicate");
  // Opening the popup with native menus off marked it nonnative, which would
  // keep it non-native.
  popup.removeAttribute("nonnative");
  let isNative;
  let errors = await openAndCollectErrors("duplicate", () => {
    isNative = popup.isNativeMenu;
  });
  await SpecialPowers.popPrefEnv();
  ok(isNative, "The menu opens natively");
  is(errors.length, 0, "A native menu is skipped");
});

add_task(async function testDisabledItems() {
  let errors = await openAndCollectErrors("disabled");
  is(errors.length, 1, "Disabled items are checked like any other");
  assert.stringContains(
    errors[0],
    `accesskey "o" is shared by "One", "Three"`,
    "A disabled item counts for a shared accesskey"
  );
  assert.stringContains(
    errors[0],
    `"Two" has no accesskey`,
    "A disabled item counts for a missing accesskey"
  );
  ok(!errors[0].includes("Note"), "A disabled note counts for neither");
});

add_task(async function testUnlabeledItems() {
  let errors = await openAndCollectErrors("unlabeled");
  is(errors.length, 1, "Items without a label are checked for shared accesskeys");
  assert.stringContains(
    errors[0],
    `accesskey "f" is shared by "Forward", "Full Screen"`,
    "An item without a label counts for a shared accesskey"
  );
  ok(
    !errors[0].includes("Back"),
    "An item without a label doesn't count for a missing accesskey"
  );
});

add_task(async function testPendingTranslation() {
  let item = document.getElementById("translated-item");
  let errors = await openAndCollectErrors("translated", () => {
    document.l10n.setAttributes(item, "undo");
    ok(document.hasPendingL10nMutations, "Translation is pending at popupshown");
  });
  is(item.getAttribute("label"), "Undo", "The item got its translation");
  is(errors.length, 1, "The check waits for the pending translation");
  assert.stringContains(
    errors[0],
    `accesskey "u" is shared by "Undo", "Undo"`,
    "The translated item is compared"
  );
});

add_task(async function testPendingRetranslation() {
  let item = document.getElementById("retranslated-item");
  let errors = await openAndCollectErrors("retranslated", () => {
    document.l10n.setAttributes(item, "redo");
    ok(document.hasPendingL10nMutations, "Translation is pending at popupshown");
  });
  is(item.getAttribute("label"), "Redo", "The item got its translation");
  is(
    errors.length,
    0,
    "The check compares the translation, not the label it replaces"
  );
});
