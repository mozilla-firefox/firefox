schema: 1

bugzilla:
  product: Core
  component: "General"

origin:
  name: brotli
  description: generic-purpose lossless compression algorithm

  url: https://github.com/google/brotli

  release: fed075f48eaffa447243a8e0452a88b103506118 (2026-11-20T14:22:23Z).
  revision: fed075f48eaffa447243a8e0452a88b103506118

  license: MIT

updatebot:
  maintainer-phab: jesup
  maintainer-bz: rjesup@jesup.org
  fuzzy-query: "'xpcshell | 'web-platform-tests | 'reftest !webrtc !webcodecs !eme !webgpu !canvas !nofis !swr !msix !-dc !nogpu !isolated !java-media !verify !-pb !-s- !csp-next"
  fuzzy-paths:
    - layout/reftests/font-face
    - netwerk/test/unit
    - testing/web-platform/tests/compression
    - testing/web-platform/tests/css/WOFF2
    - testing/web-platform/tests/fetch/compression-dictionary
    - testing/web-platform/tests/fetch/content-encoding
  tasks:
    - type: vendoring
      enabled: true
      frequency: 1 week

vendoring:
  url: https://github.com/google/brotli
  source-hosting: github
  tracking: commit

  exclude:
    - ".*"
    - "*"
    - docs
    - go
    - python
    - scripts
    - java
    - tests
    - c/tools

  include:
    - c/include/
    - c/common/
    - c/dec/
    - c/enc/

  keep:
    - LICENSE

  update-actions:
    - action: move-dir
      from: '{vendor_dir}/c/include'
      to: '{vendor_dir}/include'
    - action: move-dir
      from: '{vendor_dir}/c/common'
      to: '{vendor_dir}/common'
    - action: move-dir
      from: '{vendor_dir}/c/dec'
      to: '{vendor_dir}/dec'
    - action: move-dir
      from: '{vendor_dir}/c/enc'
      to: '{vendor_dir}/enc'
    - action: delete-path
      path: '{vendor_dir}/c'
