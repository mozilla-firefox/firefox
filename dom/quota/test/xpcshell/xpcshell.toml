["test_tempMetadataCleanup.js"]

["test_temporaryStorageCleanup.js"]
# This test requires precise control over the storage repository contents,
# including exact origin metadata (usage, persistence, and access time).
# Conditioned profiles contain pre-existing data that would invalidate these
# assumptions, so the test must run only on a clean profile.
run-if = ["!condprof"]
# The test cannot function correctly with incremental origin initialization
# enabled because incremental origin initialization automatically triggers
# lazy initialization of all temporary origins after temporary storage
# initialization is complete. The cleanup is simply not triggered in that case
# at present.
#
# The test can be updated once incremental origin initialization is fully
# implemented and its behavior is finalized.
skip-if = [
  "inc_origin_init",
]

["test_temporaryStorageEviction.js"]
# This test requires precise control over storage size, which isn't compatible
# with conditioned profiles that use a much larger default size. While the test
# could clear storage at the start, doing so would defeat the purpose of using
# a conditioned profile in the first place.
run-if = [
  "!condprof",
]

["test_temporaryStorageRFP.js"]

["test_unaccessedOrigins.js"]

["test_underflowStoragePressure.js"]
# The underflow trips the QM_ASSERT_NOT_NEGATIVE assertions.
skip-if = ["debug"]
prefs = [
  "dom.storage.testing=true",
  "dom.storage.client_validation=false",
]

["test_underflowedCacheRescan.js"]
# The rescan logic is gated on NIGHTLY_BUILD || DEBUG in C++.
run-if = [
  "nightly_build",
  "debug",
]
# dom.storage.testing is needed for LocalStorageUtils.createStorage() to work
# from an xpcshell (non-content) context, and dom.storage.client_validation
# needs to be disabled since it can't be satisfied from such a context either.
prefs = [
  "dom.storage.testing=true",
  "dom.storage.client_validation=false",
]

["test_unknownFiles.js"]
prefs = ["security.storage.encryption.sqlite.enabled=false"]

["test_unsetLastAccessTime.js"]
support-files = ["unsetLastAccessTime_profile.zip"]

["test_validOrigins.js"]
