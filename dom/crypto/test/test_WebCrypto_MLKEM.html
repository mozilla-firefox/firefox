<script>/* <![CDATA[*/
"use strict";

TestArray.addTest(
  "decapsulateBits with a key imported from a known ML-KEM-768 seed",
  function() {
    var keyAlg = { name: "ML-KEM-768" };

    crypto.subtle.importKey("raw-seed", tv.ml_kem_768.privateSeed, keyAlg,
                            false, ["decapsulateBits"])
    .then(function(privateKey) {
      return crypto.subtle.decapsulateBits(keyAlg, privateKey,
                                           tv.ml_kem_768.sampleCiphertext);
    })
    .then(memcmp_complete(this, tv.ml_kem_768.expectedSharedSecret),
          error(this));
  }
);

TestArray.addTest(
  "an exported ML-KEM-768 seed re-derives the same key",
  function() {
    var keyAlg = { name: "ML-KEM-768" };
    var publicKey, expected;

    crypto.subtle.generateKey(keyAlg, true,
                              ["encapsulateBits", "decapsulateBits"])
    .then(function(pair) {
      publicKey = pair.publicKey;
      return crypto.subtle.exportKey("raw-seed", pair.privateKey);
    })
    .then(function(seed) {
      return crypto.subtle.importKey("raw-seed", seed, keyAlg, false,
                                     ["decapsulateBits"]);
    })
    .then(function(reimported) {
      return crypto.subtle.encapsulateBits(keyAlg, publicKey)
      .then(function(encapsulated) {
        expected = encapsulated.sharedKey;
        return crypto.subtle.decapsulateBits(keyAlg, reimported,
                                             encapsulated.ciphertext);
      });
    })
    .then(complete(this, function(decapsulated) {
      return util.memcmp(expected, decapsulated);
    }), error(this));
  }
);

TestArray.addTest(
  "encapsulateKey/decapsulateKey derive the same AES-GCM key for ML-KEM-768",
  function() {
    var keyAlg = { name: "ML-KEM-768" };
    var sharedKeyAlg = { name: "AES-GCM", length: 256 };
    var encapsulated;

    crypto.subtle.generateKey(keyAlg, true,
                              ["encapsulateKey", "decapsulateKey"])
    .then(function(pair) {
      return crypto.subtle.encapsulateKey(keyAlg, pair.publicKey, sharedKeyAlg,
                                          true, ["encrypt", "decrypt"])
      .then(function(result) {
        encapsulated = result;
        return crypto.subtle.decapsulateKey(keyAlg, pair.privateKey,
                                            result.ciphertext, sharedKeyAlg,
                                            true, ["encrypt", "decrypt"]);
      });
    })
    .then(function(decapsulated) {
      return Promise.all([
        crypto.subtle.exportKey("raw", encapsulated.sharedKey),
        crypto.subtle.exportKey("raw", decapsulated),
      ]);
    })
    .then(complete(this, function(exports) {
      return util.memcmp(exports[0], exports[1]);
    }), error(this));
  }
);

TestArray.addTest(
  "wrapKey/unwrapKey round trip for an ML-KEM-768 public key as raw-public",
  function() {
    var wrapAlg = { name: "AES-GCM", iv: new Uint8Array(12), tagLength: 128 };
    var keyAlg = { name: "ML-KEM-768" };
    var wrappingKey, original, exported;

    crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, false,
                              ["wrapKey", "unwrapKey"])
    .then(function(k) {
      wrappingKey = k;
      return crypto.subtle.generateKey(keyAlg, true,
                                       ["encapsulateBits", "decapsulateBits"]);
    })
    .then(function(pair) {
      original = pair.publicKey;
      return crypto.subtle.exportKey("raw-public", original);
    })
    .then(function(raw) {
      exported = raw;
      return crypto.subtle.wrapKey("raw-public", original, wrappingKey, wrapAlg);
    })
    .then(function(wrapped) {
      return crypto.subtle.unwrapKey("raw-public", wrapped, wrappingKey,
                                     wrapAlg, keyAlg, true,
                                     ["encapsulateBits"]);
    })
    .then(function(unwrapped) {
      return crypto.subtle.exportKey("raw-public", unwrapped);
    })
    .then(complete(this, function(reexported) {
      return util.memcmp(exported, reexported);
    }), error(this));
  }
);

TestArray.addTest(
  "wrapKey/unwrapKey round trip for an ML-KEM-768 private key as raw-seed",
  function() {
    var wrapAlg = { name: "AES-GCM", iv: new Uint8Array(12), tagLength: 128 };
    var keyAlg = { name: "ML-KEM-768" };
    var wrappingKey, original, exported;

    crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, false,
                              ["wrapKey", "unwrapKey"])
    .then(function(k) {
      wrappingKey = k;
      return crypto.subtle.generateKey(keyAlg, true,
                                       ["encapsulateBits", "decapsulateBits"]);
    })
    .then(function(pair) {
      original = pair.privateKey;
      return crypto.subtle.exportKey("raw-seed", original);
    })
    .then(function(raw) {
      exported = raw;
      return crypto.subtle.wrapKey("raw-seed", original, wrappingKey, wrapAlg);
    })
    .then(function(wrapped) {
      return crypto.subtle.unwrapKey("raw-seed", wrapped, wrappingKey, wrapAlg,
                                     keyAlg, true, ["decapsulateBits"]);
    })
    .then(function(unwrapped) {
      return crypto.subtle.exportKey("raw-seed", unwrapped);
    })
    .then(complete(this, function(reexported) {
      return util.memcmp(exported, reexported);
    }), error(this));
  }
);

TestArray.addTest(
  "exportKey raw-seed on an ML-KEM-768 public key throws InvalidAccessError",
  function() {
    var that = this;
    crypto.subtle.generateKey({ name: "ML-KEM-768" }, true,
                              ["decapsulateBits"])
    .then(function(pair) {
      return crypto.subtle.exportKey("raw-seed", pair.publicKey);
    })
    .then(function() {
      that.complete(false);
    }, function(err) {
      that.complete(err.name == "InvalidAccessError");
    });
  }
);

TestArray.addTest(
  "exportKey raw-public on an ML-KEM-768 private key throws InvalidAccessError",
  function() {
    var that = this;
    crypto.subtle.generateKey({ name: "ML-KEM-768" }, true,
                              ["decapsulateBits"])
    .then(function(pair) {
      return crypto.subtle.exportKey("raw-public", pair.privateKey);
    })
    .then(function() {
      that.complete(false);
    }, function(err) {
      that.complete(err.name == "InvalidAccessError");
    });
  }
);

TestArray.addTest(
  "encapsulateBits and decapsulateBits reject the wrong key type",
  function() {
    var keyAlg = { name: "ML-KEM-768" };
    function nameOf(promise) {
      return promise.then(function() {
        return "resolved";
      }, function(err) {
        return err.name;
      });
    }

    crypto.subtle.generateKey(keyAlg, true,
                              ["encapsulateBits", "decapsulateBits"])
    .then(function(pair) {
      return Promise.all([
        nameOf(crypto.subtle.encapsulateBits(keyAlg, pair.privateKey)),
        nameOf(crypto.subtle.decapsulateBits(keyAlg, pair.publicKey,
                                             tv.ml_kem_768.sampleCiphertext)),
      ]);
    })
    .then(complete(this, function(errors) {
      return errors.every(function(name) {
        return name == "InvalidAccessError";
      });
    }), error(this));
  }
);

TestArray.addTest(
  "an ML-KEM-768 private key exported as pkcs8 re-imports and decapsulates",
  function() {
    var keyAlg = { name: "ML-KEM-768" };

    crypto.subtle.importKey("raw-seed", tv.ml_kem_768.privateSeed, keyAlg,
                            true, ["decapsulateBits"])
    .then(function(privateKey) {
      return crypto.subtle.exportKey("pkcs8", privateKey);
    })
    .then(function(pkcs8) {
      return crypto.subtle.importKey("pkcs8", pkcs8, keyAlg, false,
                                     ["decapsulateBits"]);
    })
    .then(function(reimported) {
      return crypto.subtle.decapsulateBits(keyAlg, reimported,
                                           tv.ml_kem_768.sampleCiphertext);
    })
    .then(memcmp_complete(this, tv.ml_kem_768.expectedSharedSecret),
          error(this));
  }
);

TestArray.addTest(
  "spki export and import round-trip an ML-KEM-768 public key",
  function() {
    var spki, rawPublic;
    crypto.subtle.generateKey({ name: "ML-KEM-768" }, true,
                              ["encapsulateBits", "decapsulateBits"])
    .then(function(pair) {
      return Promise.all([
        crypto.subtle.exportKey("spki", pair.publicKey),
        crypto.subtle.exportKey("raw-public", pair.publicKey),
      ]);
    })
    .then(function(exported) {
      spki = exported[0];
      rawPublic = exported[1];
      return crypto.subtle.importKey("spki", spki, { name: "ML-KEM-768" },
                                     true, ["encapsulateBits"]);
    })
    .then(function(imported) {
      return crypto.subtle.exportKey("raw-public", imported);
    })
    .then(complete(this, function(reexported) {
      return spki.byteLength > rawPublic.byteLength &&
             util.memcmp(rawPublic, reexported);
    }), error(this));
  }
);

TestArray.addTest(
  "importKey spki rejects an ML-KEM-768 key imported as ML-KEM-1024",
  function() {
    var that = this;
    crypto.subtle.generateKey({ name: "ML-KEM-768" }, true,
                              ["encapsulateBits", "decapsulateBits"])
    .then(function(pair) {
      return crypto.subtle.exportKey("spki", pair.publicKey);
    })
    .then(function(spki) {
      return crypto.subtle.importKey("spki", spki, { name: "ML-KEM-1024" },
                                     true, ["encapsulateBits"]);
    })
    .then(function() {
      that.complete(false);
    }, function(err) {
      that.complete(err.name == "DataError");
    });
  }
);

TestArray.addTest(
  "importKey rejects malformed pkcs8 and jwk for ML-KEM-768",
  function() {
    function nameOf(promise) {
      return promise.then(function() {
        return "resolved";
      }, function(err) {
        return err.name;
      });
    }

    var alg = { name: "ML-KEM-768" };

    crypto.subtle.generateKey(alg, true, ["encapsulateBits", "decapsulateBits"])
    .then(function(pair) {
      return crypto.subtle.exportKey("jwk", pair.publicKey);
    })
    .then(function(jwk) {
      var badPub = Object.assign({}, jwk, { pub: "AAAA" });
      var badKty = Object.assign({}, jwk, { kty: "OKP" });
      var badAlg = Object.assign({}, jwk, { alg: "ML-KEM-512" });
      return Promise.all([
        nameOf(crypto.subtle.importKey("pkcs8", new Uint8Array(64), alg, true,
                                       ["decapsulateBits"])),
        nameOf(crypto.subtle.importKey("jwk", badPub, alg, true,
                                       ["encapsulateBits"])),
        nameOf(crypto.subtle.importKey("jwk", badKty, alg, true,
                                       ["encapsulateBits"])),
        nameOf(crypto.subtle.importKey("jwk", badAlg, alg, true,
                                       ["encapsulateBits"])),
      ]);
    })
    .then(complete(this, function(errors) {
      return errors.every(function(name) {
        return name == "DataError";
      });
    }), error(this));
  }
);

TestArray.addTest(
  "an ML-KEM-768 jwk use other than enc only matters with usages",
  function() {
    function nameOf(promise) {
      return promise.then(function() {
        return "resolved";
      }, function(err) {
        return err.name;
      });
    }

    var alg = { name: "ML-KEM-768" };

    crypto.subtle.generateKey(alg, true, ["encapsulateBits", "decapsulateBits"])
    .then(function(pair) {
      return crypto.subtle.exportKey("jwk", pair.publicKey);
    })
    .then(function(jwk) {
      var sig = Object.assign({}, jwk, { use: "sig" });
      delete sig.key_ops;
      return Promise.all([
        nameOf(crypto.subtle.importKey("jwk", sig, alg, true, [])),
        nameOf(crypto.subtle.importKey("jwk", sig, alg, true,
                                       ["encapsulateBits"])),
      ]);
    })
    .then(complete(this, function(results) {
      return results[0] == "resolved" && results[1] == "DataError";
    }), error(this));
  }
);

TestArray.addTest(
  "structured clone round trip for an extractable ML-KEM-768 key pair",
  function() {
    var original;

    crypto.subtle.generateKey({ name: "ML-KEM-768" }, true,
                              ["encapsulateBits", "decapsulateBits"])
    .then(function(pair) {
      original = pair;
      return util.clone(pair);
    })
    .then(function(clone) {
      return Promise.all([
        crypto.subtle.exportKey("raw-public", original.publicKey),
        crypto.subtle.exportKey("raw-public", clone.publicKey),
        crypto.subtle.exportKey("raw-seed", original.privateKey),
        crypto.subtle.exportKey("raw-seed", clone.privateKey),
      ]);
    })
    .then(complete(this, function(exports) {
      return util.memcmp(exports[0], exports[1]) &&
             util.memcmp(exports[2], exports[3]);
    }), error(this));
  }
);

TestArray.addTest(
  "structured clone round trip for a non-extractable ML-KEM-768 private key",
  function() {
    var keyAlg = { name: "ML-KEM-768" };
    var original, ciphertext, expected;

    crypto.subtle.generateKey(keyAlg, false,
                              ["encapsulateBits", "decapsulateBits"])
    .then(function(pair) {
      original = pair;
      return crypto.subtle.encapsulateBits(keyAlg, pair.publicKey);
    })
    .then(function(encapsulated) {
      ciphertext = encapsulated.ciphertext;
      expected = encapsulated.sharedKey;
      return util.clone(original.privateKey);
    })
    .then(function(clone) {
      return crypto.subtle.decapsulateBits(keyAlg, clone, ciphertext);
    })
    .then(complete(this, function(decapsulated) {
      return util.memcmp(expected, decapsulated);
    }), error(this));
  }
);

TestArray.addTest(
  "an ML-KEM-768 private key exported as JWK re-imports and decapsulates",
  function() {
    var keyAlg = { name: "ML-KEM-768" };

    crypto.subtle.importKey("raw-seed", tv.ml_kem_768.privateSeed, keyAlg,
                            true, ["decapsulateBits"])
    .then(function(privateKey) {
      return crypto.subtle.exportKey("jwk", privateKey);
    })
    .then(function(jwk) {
      if (jwk.kty != "AKP" || jwk.alg != "ML-KEM-768" || !jwk.priv ||
          !jwk.pub) {
        throw new Error("unexpected JWK: " + JSON.stringify(jwk));
      }
      return crypto.subtle.importKey("jwk", jwk, keyAlg, false,
                                     ["decapsulateBits"]);
    })
    .then(function(reimported) {
      return crypto.subtle.decapsulateBits(keyAlg, reimported,
                                           tv.ml_kem_768.sampleCiphertext);
    })
    .then(memcmp_complete(this, tv.ml_kem_768.expectedSharedSecret),
          error(this));
  }
);

TestArray.addTest(
  "an ML-KEM-768 public key exported as JWK omits priv and re-imports",
  function() {
    var keyAlg = { name: "ML-KEM-768" };
    var privateKey, expected;

    crypto.subtle.generateKey(keyAlg, true,
                              ["encapsulateBits", "decapsulateBits"])
    .then(function(pair) {
      privateKey = pair.privateKey;
      return crypto.subtle.exportKey("jwk", pair.publicKey);
    })
    .then(function(jwk) {
      if (jwk.kty != "AKP" || jwk.alg != "ML-KEM-768" || !jwk.pub ||
          "priv" in jwk) {
        throw new Error("unexpected JWK: " + JSON.stringify(jwk));
      }
      return crypto.subtle.importKey("jwk", jwk, keyAlg, false,
                                     ["encapsulateBits"]);
    })
    .then(function(reimported) {
      return crypto.subtle.encapsulateBits(keyAlg, reimported);
    })
    .then(function(encapsulated) {
      expected = encapsulated.sharedKey;
      return crypto.subtle.decapsulateBits(keyAlg, privateKey,
                                           encapsulated.ciphertext);
    })
    .then(complete(this, function(decapsulated) {
      return util.memcmp(expected, decapsulated);
    }), error(this));
  }
);

TestArray.addTest(
  "ML-KEM-768 importKey checks usages before parsing the key data",
  function() {
    function nameOf(promise) {
      return promise.then(function() {
        return "resolved";
      }, function(err) {
        return err.name;
      });
    }

    var alg = { name: "ML-KEM-768" };

    Promise.all([
      nameOf(crypto.subtle.importKey("raw-seed", new Uint8Array(63), alg,
                                     false, ["encapsulateBits"])),
      nameOf(crypto.subtle.importKey("spki", new Uint8Array(8), alg, false,
                                     ["decapsulateBits"])),
    ])
    .then(complete(this, function(names) {
      return names[0] == "SyntaxError" && names[1] == "SyntaxError";
    }), error(this));
  }
);
