<!DOCTYPE HTML>
<html>
<head>
  <meta charset="utf-8">
</head>
<body>
<script>
const configs = [{
  initDataTypes: ["keyids"],
  videoCapabilities: [{ contentType: "video/mp4" }],
}];

async function run() {
  let access;
  try {
    access = await navigator.requestMediaKeySystemAccess("com.widevine.alpha",
                                                         configs);
  } catch (e) {
    return { result: "unsupported", name: e.name, message: e.message };
  }

  try {
    await access.createMediaKeys();
    return { result: "resolved" };
  } catch (e) {
    return { result: "rejected", name: e.name, message: e.message };
  }
}

run().then(r => parent.postMessage(r, "*"));
</script>
</body>
</html>
