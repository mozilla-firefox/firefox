<!DOCTYPE HTML>
<html>
<head>
  <script type="application/javascript" src="pc.js"></script>
  <script type="application/javascript" src="/tests/dom/canvas/test/captureStream_common.js"></script>
</head>
<body>
<pre id="test">
<script type="application/javascript">
  createHTML({
    bug: "2092617",
    title: "Receive VP9 with spatial layers across a key frame requested mid-stream",
  });

  // Large enough for libwebrtc to configure three spatial layers: 320x180,
  // 640x360 and 1280x720.
  const WIDTH = 1280;
  const HEIGHT = 720;

  // Inter-layer prediction is only used on key pictures by default, so the
  // single layer case has nothing to test here.
  const CASES = [
    {spatial: 3, temporal: 1},
    {spatial: 2, temporal: 2},
    {spatial: 3, temporal: 3},
  ];

  // Passes every frame through. On a message, it requests a key frame from the
  // sender and reports when the request was sent and when a key frame arrived.
  const WORKER_SOURCE = `
    onrtctransform = ({transformer}) => {
      const {port} = transformer.options;
      let wantKeyFrame = false;
      port.onmessage = () => {
        wantKeyFrame = true;
        transformer.sendKeyFrameRequest().then(
          () => port.postMessage("requested"),
          e => port.postMessage("failure: " + e.name)
        );
      };
      transformer.readable
        .pipeThrough(new TransformStream({
          transform(frame, controller) {
            if (wantKeyFrame && frame.type == "key") {
              wantKeyFrame = false;
              port.postMessage("key frame");
            }
            controller.enqueue(frame);
          },
        }))
        .pipeTo(transformer.writable);
    };
  `;

  // The colour of the whole source alternates every second. libwebrtc's VP9
  // encoder only sends key frames when asked to, so the changes are encoded as
  // inter frames in every spatial layer.
  function startColourSource(helper, colours) {
    const canvas = helper.createAndAppendElement("canvas", "source");
    const start = performance.now();
    const {stop} = helper.startDrawing(() => {
      const colour =
        colours[Math.floor((performance.now() - start) / 1000) % colours.length];
      helper.drawColor(canvas, colour,
                       {offsetX: 0, offsetY: 0, width: WIDTH, height: HEIGHT});
    });
    return {
      stream: canvas.captureStream(30),
      stop: () => {
        stop();
        canvas.remove();
      },
    };
  }

  async function connect(pc1, pc2, track) {
    pc1.onicecandidate = e => e.candidate && pc2.addIceCandidate(e.candidate);
    pc2.onicecandidate = e => e.candidate && pc1.addIceCandidate(e.candidate);
    const transceiver = pc1.addTransceiver(track, {direction: "sendonly"});
    transceiver.setCodecPreferences(
      RTCRtpReceiver.getCapabilities("video").codecs.filter(
        c => c.mimeType == "video/VP9"
      )
    );
    const ontrack = new Promise(r => (pc2.ontrack = r));
    await pc1.setLocalDescription();
    await pc2.setRemoteDescription(pc1.localDescription);
    await pc2.setLocalDescription();
    await pc1.setRemoteDescription(pc2.localDescription);
    return ontrack;
  }

  async function inboundVideoStats(pc) {
    const stats = [...(await pc.getStats()).values()].filter(
      stat => stat.type == "inbound-rtp" && stat.kind == "video"
    );
    is(stats.length, 1, "One inbound video stream");
    return stats[0];
  }

  async function checkOnlyTopLayerShown(video) {
    const sizes = new Set();
    try {
      await timeout(new Promise(resolve => {
        let frames = 0;
        const onFrame = (now, {width, height}) => {
          sizes.add(`${width}x${height}`);
          if (++frames == 20) {
            resolve();
            return;
          }
          video.requestVideoFrameCallback(onFrame);
        };
        video.requestVideoFrameCallback(onFrame);
      }), 10000, "Timed out");
    } catch (e) {
      ok(false, `Fewer than 20 frames were shown, sizes ${[...sizes]}`);
    }
    is([...sizes].join(), `${WIDTH}x${HEIGHT}`,
       "Only frames of the top spatial layer are shown");
  }

  async function checkDecodedContent(helper, video) {
    // A decoder that mishandles the references of a spatial layer after a
    // key frame outputs corrupt frames at the next inter frame of that layer.
    for (const colour of [helper.red, helper.blue, helper.red]) {
      try {
        await timeout(
          helper.pixelMustBecome(video, colour, {
            threshold: 64,
            infoString: `Remote video becomes ${colour.name}`,
          }),
          10000,
          "Timed out"
        );
      } catch (e) {
        ok(false, `Remote video should become ${colour.name}, but is ` +
           `${helper.getPixel(video)}`);
        return;
      }
    }
  }

  async function requestKeyFrame(port) {
    const messages = [];
    let notify;
    port.onmessage = ({data}) => {
      messages.push(data);
      notify?.();
    };
    const nextMessage = async () => {
      while (!messages.length) {
        await new Promise(r => (notify = r));
      }
      return messages.shift();
    };
    port.postMessage("request");
    try {
      is(await timeout(nextMessage(), 10000, "Timed out"), "requested",
         "Key frame request is sent");
      is(await timeout(nextMessage(), 10000, "Timed out"), "key frame",
         "Key frame is received");
    } catch (e) {
      ok(false, `Key frame should be requested and received: ${e}`);
    }
  }

  async function runCase(workerUrl, {spatial, temporal}) {
    info(`Testing ${spatial} spatial and ${temporal} temporal layers`);
    await pushPrefs(
      // Only the libwebrtc VP9 encoder supports spatial layers.
      ["media.webrtc.encoder_creation_strategy", 0],
      ["media.peerconnection.video.svc.spatial", spatial],
      ["media.peerconnection.video.svc.temporal", temporal],
      ["media.peerconnection.video.lock_scaling", true],
      // Start the bandwidth estimate, and not only the encoder, high enough for
      // the top layer to be sent from the first frame.
      ["media.peerconnection.video.min_bitrate_estimate", 2500],
      ["media.peerconnection.video.start_bitrate", 2500],
      ["media.peerconnection.video.max_bitrate", 5000],
    );

    const helper = new CaptureStreamTestHelper2D(WIDTH, HEIGHT);
    const source = startColourSource(helper, [helper.red, helper.blue]);
    const pc1 = new RTCPeerConnection();
    const pc2 = new RTCPeerConnection();
    const worker = new Worker(workerUrl);
    const {port1, port2} = new MessageChannel();
    const video = createMediaElement("video", "remote");
    const checkContent = !navigator.userAgent.includes("Android");
    try {
      const metadata = haveEvent(video, "loadedmetadata");
      const {track, receiver} =
        await connect(pc1, pc2, source.stream.getVideoTracks()[0]);
      receiver.transform =
        new RTCRtpScriptTransform(worker, {port: port2}, [port2]);
      video.srcObject = new MediaStream([track]);
      try {
        await timeout(metadata, 10000, "Timed out");
      } catch (e) {
        ok(false, "Remote video should load its metadata");
        return;
      }
      is(video.videoWidth, WIDTH, "First remote frame has the top layer width");
      is(video.videoHeight, HEIGHT,
         "First remote frame has the top layer height");
      if (checkContent) {
        // TODO: enable on Android when bug 1526207 is fixed.
        await checkDecodedContent(helper, video);
      }

      const {keyFramesDecoded} = await inboundVideoStats(pc2);
      await requestKeyFrame(port1);
      try {
        await timeout(
          (async () => {
            while ((await inboundVideoStats(pc2)).keyFramesDecoded <=
                   keyFramesDecoded) {
              await wait(100);
            }
          })(),
          10000,
          "Timed out"
        );
        ok(true, "Requested key frame is decoded");
      } catch (e) {
        ok(false, `keyFramesDecoded should increase from ${keyFramesDecoded}`);
      }

      await checkOnlyTopLayerShown(video);
      const stats = await inboundVideoStats(pc2);
      is(stats.frameWidth, WIDTH, "Inbound frameWidth is the top layer");
      is(stats.frameHeight, HEIGHT, "Inbound frameHeight is the top layer");
      if (checkContent) {
        await checkDecodedContent(helper, video);
      }
    } finally {
      pc1.close();
      pc2.close();
      worker.terminate();
      video.srcObject = null;
      video.remove();
      source.stop();
      await SpecialPowers.popPrefEnv();
    }
  }

  runNetworkTest(async () => {
    const workerUrl = URL.createObjectURL(
      new Blob([WORKER_SOURCE], {type: "text/javascript"})
    );
    try {
      for (const c of CASES) {
        await runCase(workerUrl, c);
      }
    } finally {
      URL.revokeObjectURL(workerUrl);
    }
  });
</script>
</pre>
</body>
</html>
