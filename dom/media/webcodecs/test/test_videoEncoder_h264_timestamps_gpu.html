<!DOCTYPE HTML>
<html>
<head>
<title>Test that H.264 encoding preserves timestamp-to-picture association</title>
<script src="/tests/SimpleTest/SimpleTest.js"></script>
<link rel="stylesheet" type="text/css" href="/tests/SimpleTest/test.css"/>
<script type="application/javascript">

const WIDTH = 640;
const HEIGHT = 480;
const DOT_SIZE = 20;
const DOT_SPACING = 60;
const CODECS = {
  baseline: "avc1.42001f",
  main: "avc1.4d001f",
  high: "avc1.64001f",
};
const HARDWARE_ACCELERATIONS = [
  "prefer-hardware",
  "no-preference",
  "prefer-software",
];
const TIMINGS = {
  "zero start": [
    { timestamp: 0, duration: 500 },
    { timestamp: 500, duration: 250 },
  ],
  "variable durations and a forced keyframe": [
    { timestamp: 10000, duration: 500 },
    { timestamp: 12000, duration: 250 },
    { timestamp: 17000, duration: 750 },
    { timestamp: 24000, duration: 33333, keyFrame: true },
    { timestamp: 60000, duration: 16667 },
    { timestamp: 80000, duration: 50000 },
    { timestamp: 140000, duration: 1000 },
    { timestamp: 145000, duration: 2000 },
  ],
};

function dotCenter(index) {
  return [DOT_SPACING / 2 + index * DOT_SPACING, HEIGHT / 2];
}

// Frame N of a sequence has N black dots on a white background, so that
// consecutive frames differ a little, which lets encoders use B-frames.
function createFrame(dots, { timestamp, duration }) {
  const canvas = new OffscreenCanvas(WIDTH, HEIGHT);
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "white";
  ctx.fillRect(0, 0, WIDTH, HEIGHT);
  ctx.fillStyle = "black";
  for (let i = 0; i < dots; i++) {
    const [x, y] = dotCenter(i);
    ctx.fillRect(x - DOT_SIZE / 2, y - DOT_SIZE / 2, DOT_SIZE, DOT_SIZE);
  }
  return new VideoFrame(canvas, { timestamp, duration });
}

function countDots(frame) {
  const canvas = new OffscreenCanvas(WIDTH, HEIGHT);
  const ctx = canvas.getContext("2d");
  ctx.drawImage(frame, 0, 0);
  const { data } = ctx.getImageData(0, 0, WIDTH, HEIGHT);
  let dots = 0;
  while (dots < WIDTH / DOT_SPACING) {
    const [x, y] = dotCenter(dots);
    if (data[(y * WIDTH + x) * 4] > 127) {
      break;
    }
    dots++;
  }
  return dots;
}

async function encodeAndDecode(config, inputs) {
  const chunks = [];
  const pictures = new Map();
  const decoder = new VideoDecoder({
    output: frame => {
      pictures.set(frame.timestamp, countDots(frame));
      frame.close();
    },
    error: e => ok(false, `Decoder error: ${e}`),
  });
  const encoder = new VideoEncoder({
    output: (chunk, metadata) => {
      chunks.push({ timestamp: chunk.timestamp, duration: chunk.duration });
      if (metadata?.decoderConfig) {
        decoder.configure(metadata.decoderConfig);
      }
      decoder.decode(chunk);
    },
    error: e => ok(false, `Encoder error: ${e}`),
  });
  encoder.configure(config);
  inputs.forEach((input, index) => {
    const frame = createFrame(index + 1, input);
    encoder.encode(frame, { keyFrame: input.keyFrame ?? false });
    frame.close();
  });
  await encoder.flush();
  const { encoderName } =
    await SpecialPowers.wrap(encoder).mozRequestDebugInfo();
  encoder.close();
  await decoder.flush();
  decoder.close();
  return { encoderName, chunks, pictures };
}

add_task(async function testH264TimestampToPictureAssociation() {
  for (const [profile, codec] of Object.entries(CODECS)) {
    for (const hardwareAcceleration of HARDWARE_ACCELERATIONS) {
      const config = {
        codec,
        width: WIDTH,
        height: HEIGHT,
        latencyMode: "quality",
        hardwareAcceleration,
      };
      const { supported } = await VideoEncoder.isConfigSupported(config);
      if (!supported) {
        info(`Skipping unsupported configuration ${JSON.stringify(config)}`);
        continue;
      }
      for (const [timingName, inputs] of Object.entries(TIMINGS)) {
        const label = `${profile}, ${hardwareAcceleration}, ${timingName}`;
        const { encoderName, chunks, pictures } = await encodeAndDecode(
          config,
          inputs
        );
        info(
          `${label}: ${JSON.stringify({
            encoderName,
            input: inputs,
            output: chunks,
            pictures: [...pictures],
          })}`
        );
        isDeeply(
          chunks.map(chunk => chunk.timestamp).sort((a, b) => a - b),
          inputs.map(input => input.timestamp),
          `${label}: chunks keep their input timestamps`
        );
        inputs.forEach((input, index) => {
          const chunk = chunks.find(c => c.timestamp === input.timestamp);
          is(
            chunk?.duration,
            input.duration,
            `${label}: chunk ${input.timestamp} keeps its duration`
          );
          is(
            pictures.get(input.timestamp),
            index + 1,
            `${label}: picture ${input.timestamp} is the frame encoded with that timestamp`
          );
        });
      }
    }
  }
});

</script>
</head>
<body>
</body>
</html>
