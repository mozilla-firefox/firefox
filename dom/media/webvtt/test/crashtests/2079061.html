const S = { armed: false, playing: false, done: false, w: 300 };
S.A = document.getElementById("vA");
S.B = document.getElementById("vB");
S.a = document.getElementById("a");
S.C = document.createElement("video");

function waitWithSyncXHR(ms) {
  const end = performance.now() + ms;
  while (performance.now() < end) {
    const xhr = new XMLHttpRequest();
    xhr.open("GET", location.href, false);
    xhr.send();
  }
}

function collect(n) {
  for (let i = 0; i < n; i++) {
    SpecialPowers.forceGC();
    SpecialPowers.forceCC();
  }
}

function finish() {
  S.done = true;
  clearTimeout(S.fallback);
  setTimeout(() => document.documentElement.removeAttribute("class"), 0);
}

function arm() {
  S.armed = true;
  S.a.style.animation = "k 100s";
  S.a.getAnimations()[0].finished.catch(onMicro);
  S.a.style.animation = "none";
  S.w = S.w == 300 ? 310 : 300;
  S.B.style.width = S.w + "px";
}

function teardown() {
  S.C.appendChild(S.tr);
  S.A.remove();
  S.A = null;
  S.tr = null;
  waitWithSyncXHR(300);
  collect(4);
  waitWithSyncXHR(50);
  collect(3);
  finish();
}

function onMicro() {
  S.armed = false;
  if (S.done || !S.A) {
    return;
  }
  if (S.playing && S.A.paused) {
    S.done = true;
    teardown();
  }
}

const mc = new MessageChannel();
mc.port1.onmessage = () => {
  if (S.done) {
    return;
  }
  if (!S.armed) {
    arm();
  }
  mc.port2.postMessage(0);
};

function start() {
  S.tr = document.createElement("track");
  S.tr.kind = "subtitles";
  S.A.appendChild(S.tr);
  const t = S.tr.track;
  t.mode = "showing";
  const c1 = new VTTCue(0, 0.3, "one");
  c1.pauseOnExit = true;
  t.addCue(c1);
  t.addCue(new VTTCue(0.3, 100, "two"));
  S.A.addEventListener("playing", () => {
    S.playing = true;
  });
  S.A.addEventListener("pause", () => {
    S.playing = false;
    if (!S.done && S.A) {
      S.A.currentTime = 0;
      S.A.play().catch(() => {});
    }
  });
  S.A.muted = true;
  S.A.src = WEBM;
  S.A.play().catch(() => {});
  mc.port2.postMessage(0);
  S.fallback = setTimeout(() => {
    dump("fallback timeout\n");
    finish();
  }, 10000);
}

window.addEventListener("load", start);
</script>
