# Adding a new metric? We have docs for that!
# https://firefox-source-docs.mozilla.org/toolkit/components/glean/user/new_definitions_file.html

---
$schema: moz://mozilla.org/schemas/glean/metrics/2-0-0
$tags:
  - 'Core :: Graphics: Canvas2D'

canvas:
  used_2d:
    type: labeled_counter
    description: >
      2D canvas used
    labels:
      - "false"
      - "true"
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1935420
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2089154
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1935420
    notification_emails:
      - gfx-telemetry-alerts@mozilla.com
    expires: never

  webgl_accl_failure_id:
    type: labeled_counter
    description: >
      Track the failure IDs that lead us to reject attempting to create an
      accelerated context. canvas.webgl_failure_id reports the overall WebGL
      status with the attempt to fallback.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1272808
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2089154
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1272808
    notification_emails:
      - gfx-telemetry-alerts@mozilla.com
      - rhunt@mozilla.com
    expires: never

  webgl_failure_id:
    type: labeled_counter
    description: >
      WebGL runtime and dynamic failure IDs. This will record a count for each
      context creation success or failure. Each failure id is a unique
      identifier that can be traced back to a particular failure branch or
      blocklist rule.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1272808
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2089154
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1272808
    notification_emails:
      - gfx-telemetry-alerts@mozilla.com
      - rhunt@mozilla.com
    expires: never

  webgl_success:
    type: labeled_counter
    description: >
      WebGL1 creation success
    labels:
      - "false"
      - "true"
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1247327
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1529352
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2089154
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1247327
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1529352
    notification_emails:
      - gfx-telemetry-alerts@mozilla.com
      - rhunt@mozilla.com
    expires: never

  webgl_used:
    type: labeled_counter
    description: >
      WebGL canvas used
    labels:
      - "false"
      - "true"
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1935420
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2089154
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1935420
    notification_emails:
      - gfx-telemetry-alerts@mozilla.com
    expires: never

  webgl2_success:
    type: labeled_counter
    description: >
      WebGL2 creation success
    labels:
      - "false"
      - "true"
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1247327
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2089154
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1247327
    notification_emails:
      - gfx-telemetry-alerts@mozilla.com
      - rhunt@mozilla.com
    expires: never
