# Tests for WebGPU behavior when `dom.webgpu.enabled` is not explicitly set.
#
# - On Windows, Mac aarch64, or in nightly, `dom.webgpu.enabled` is true by
#   default and we run the two `enabled` tests.
# - On Linux beta or release, or on Mac x86_64, `dom.webgpu.enabled` is false
#   by default, and we run the `disabled` test.

[DEFAULT]
subsuite = "webgpu"
dupe-manifest = true # duplicates mochitest-disabled.toml

run-if = [
  "!verify", # `test-verify` jobs don't guarantee a GPU.
]

prefs = [
  "gfx.webgpu.ignore-blocklist=true", # https://bugzilla.mozilla.org/show_bug.cgi?id=1985348
]

# WebGPU is only ever available in secure contexts.
#
# See spec WebIDL, like this: https://www.w3.org/TR/webgpu/#navigatorgpu
scheme = "https"

["test_adapter_enabled.html"]
skip-if = [
  "os == 'linux' && os_version == '24.04' && arch == 'x86_64' && display == 'x11' && !nightly_build",
  "os == 'mac' && os_version == '14.70' && arch == 'x86_64'",
]

["test_enabled.html"]
skip-if = [
  "os == 'linux' && os_version == '24.04' && arch == 'x86_64' && display == 'x11' && !nightly_build",
  "os == 'mac' && os_version == '14.70' && arch == 'x86_64'",
]

["test_gpu_disabled.html"]
skip-if = [
  "nightly_build",
  "os == 'mac' && os_version == '15.30' && arch == 'aarch64'",
]
