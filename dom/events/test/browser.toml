[DEFAULT]
prefs = [
  "dom.event.mouse.xbuttons.enabled=true",
]

["browser_alt_keyup_in_content.js"]
skip-if = [
  "os == 'mac' && os_version == '15.30' && arch == 'aarch64'",
]

["browser_beforeinput_by_execCommand_in_contentscript.js"]
support-files = [
  "file_beforeinput_by_execCommand_in_contentscript.html",
  "../../../browser/base/content/test/browser-general/head.js",
]

["browser_bug1539497.js"]

["browser_dragdrop_invalid_remote_drag.js"]
support-files = [
  "file_empty.html",
]

["browser_dragdrop_protected_diff_origin.js"]
support-files = [
  "browser_dragdrop_impl.js",
  "browser_dragdrop_inner.html",
  "browser_dragdrop_outer.html",
]

["browser_dragdrop_protected_same_origin.js"]
support-files = [
  "browser_dragdrop_impl.js",
  "browser_dragdrop_inner.html",
  "browser_dragdrop_outer.html",
]

["browser_dragdrop_shadow.js"]
support-files = [
  "browser_dragdrop_impl.js",
  "browser_dragdrop_shadow_inner.html",
  "browser_dragdrop_shadow_outer.html",
]
skip-if = [
  "true", # bug 1932955
]

["browser_dragdrop_unprotected_diff_origin.js"]
support-files = [
  "browser_dragdrop_impl.js",
  "browser_dragdrop_inner.html",
  "browser_dragdrop_outer.html",
]

["browser_dragdrop_unprotected_same_origin.js"]
support-files = [
  "browser_dragdrop_impl.js",
  "browser_dragdrop_inner.html",
  "browser_dragdrop_outer.html",
]

["browser_dragimage.js"]
support-files = [
  "dragimage.html",
  "green.png",
]

["browser_dragsession_end_without_dragend.js"]

["browser_mouse_click_screenXY.js"]
support-files = ["../../../browser/base/content/test/browser-general/dummy_page.html"]

["browser_mouse_enterleave_switch_tab.js"]
support-files = ["../../../browser/base/content/test/browser-general/dummy_page.html"]
fail-if = [
  "a11y_checks", # Bug 1854502 clicked tabbrowser-tabpanels may not be accessible
]

["browser_mouse_x_buttons.js"]

support-files = ["file_mouse_x_buttons.html"]

["browser_mouseout_notification_panel.js"]


["browser_shortcutkey_ctrlf5_prevent_default.js"]
skip-if = [
  "os == 'mac'" # On macOS, Ctrl+F5 is not the reload shortcut (Cmd+R is)
]

["browser_shortcutkey_modifier_conflicts_with_content_accesskey_modifier.js"]

["browser_touch_target_new_session.js"]
