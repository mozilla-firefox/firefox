[DEFAULT]
support-files = [
  "head.js",
  "!/gfx/layers/apz/test/mochitest/apz_test_native_event_utils.js",
  "!/gfx/layers/apz/test/mochitest/apz_test_utils.js",
]

["browser_clipboard_source_url.js"]
support-files = ["simple_page_ext.html"]
skip-if = [
  "headless", # HeadlessClipboard doesn't support text/x-moz-url-priv
]

["browser_document_command_copy.js"]

["browser_document_command_cut.js"]

["browser_document_command_paste.js"]

["browser_document_command_paste_contextmenu.js"]
skip-if = [
  "headless", # bug 1989339
]

["browser_document_command_paste_contextmenu_event_loop.js"]
skip-if = [
  "os == 'linux' && debug && artifact", # bug 1945658
]

["browser_document_command_paste_contextmenu_ext.js"]
skip-if = [
  "headless", # bug 1989339
]

["browser_document_command_paste_contextmenu_suppression.js"]
skip-if = [
  "os == 'linux' && os_version == '22.04' && arch == 'x86_64' && display == 'wayland'", # Bug 2057876
]

["browser_document_command_paste_contextmenu_suppression_ext.js"]

["browser_document_command_paste_contextmenu_suppression_key.js"]
skip-if = [
  "headless",
]

["browser_navigator_clipboard_clickjacking.js"]
support-files = ["simple_navigator_clipboard_keydown.html"]
run-if = [
  "os != 'win'", # The popupmenus dismiss when access keys for disabled items are pressed on windows
]

["browser_navigator_clipboard_contextmenu_dismiss.js"]
support-files = [
  "file_toplevel.html",
  "file_iframe.html",
]
skip-if = [
  "headless", # bug 1989339
]

["browser_navigator_clipboard_contextmenu_suppression.js"]
support-files = [
  "file_toplevel.html",
  "file_iframe.html",
]
skip-if = [
  "headless", # bug 1989339
]

["browser_navigator_clipboard_contextmenu_suppression_ext.js"]
support-files = [
  "file_toplevel.html",
  "file_iframe.html",
]

["browser_navigator_clipboard_read.js"]
support-files = ["simple_navigator_clipboard_read.html"]
skip-if = [
  "headless", # bug 1989339
]

["browser_navigator_clipboard_readText.js"]
support-files = ["simple_navigator_clipboard_readText.html"]
skip-if = [
  "headless", # bug 1989339
]

["browser_navigator_clipboard_readText_ext.js"]
support-files = ["simple_page_ext.html"]
skip-if = [
  "headless", # bug 1989339
]

["browser_navigator_clipboard_readText_multiple.js"]
support-files = [
  "file_toplevel.html",
  "file_iframe.html",
]
skip-if = [
  "headless", # bug 1989339
]

["browser_navigator_clipboard_read_custom_format_origin.js"]
skip-if = [
  "headless", # HeadlessClipboard does not support web custom formats
]

["browser_navigator_clipboard_read_ext.js"]
support-files = ["simple_page_ext.html"]
skip-if = [
  "headless", # bug 1989339
]

["browser_navigator_clipboard_touch.js"]
support-files = ["simple_navigator_clipboard_readText.html"]
