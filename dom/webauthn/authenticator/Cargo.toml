[package]
name = "authenticator"
version = "0.6.2"
authors = [ "Dana Keeler <dkeeler@mozilla.com>", "J.C. Jones <jc@mozilla.com>", "John Schanck <jschanck@mozilla.com>", "Kyle Machulis <kyle@nonpolynomial.com>", "Martin Sirringhaus <martin.sirringhaus@suse.com", "Tim Taubert <ttaubert@mozilla.com>" ]
license = "MPL-2.0"
description = "Library for interacting with CTAP1/2 security keys for Web Authentication. Used by Firefox."
edition = "2018"
rust-version.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libudev = "^0.2"

[target.'cfg(target_os = "freebsd")'.dependencies]
devd-rs = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies.winapi]
version = "^0.3"
features = [
    "handleapi",
    "hidclass",
    "hidpi",
    "hidusage",
    "setupapi",
]

[dependencies]
rand = "0.8"
log = "0.4"
libc = "0.2"
runloop = "0.1.0"
bitflags = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_cbor = { package = "serde_cbor_2", version = "0.13" }
serde_json = "1.0"
base64 = "^0.21"
sha2 = "^0.10.0"
pkcs11-bindings = "0.1.4"

[dependencies.icu_segmenter]
version = "2.0"
default-features = false
features = ["auto", "compiled_data"]

[dependencies.nss-rs]
git = "https://github.com/mozilla/nss-rs"
version = "0.16"
default-features = false
features = ["gecko"]

[build-dependencies]
mozbuild = { path = "../../../build/rust/mozbuild" }

[dev-dependencies]
env_logger = { version = "0.10", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
