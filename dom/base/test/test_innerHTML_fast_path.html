// The fast path scans text 16 code units at a time, so put characters it has
// to stop at, and characters that only share their low byte with those, at
// every position around the stride boundaries.
const TEXT = "abcdefghijklmnopqrstuvwxyz0123456789ABCD";
for (const [insert, accepted] of [
  ["&amp;", true], ["&#x1F600;", true], ["& ", true], ["\r", false], ["\0", false], ["<b>x</b>", true], ["<!--c-->", true],
  ["</span>", false], ["ļ", true], ["Ħ", true], ["č", true], ["Ā", true],
  ["\u{1F600}", true],
]) {
  for (let i = 0; i <= TEXT.length; i++) {
    (accepted ? ACCEPTED : REJECTED).push(
      `<span>${TEXT.slice(0, i)}${insert}${TEXT.slice(i)}</span>`);
  }
}
// The same for quoted attribute values, which it scans 16 code units at a time
// after their first 16.
for (const quote of ["\"", "'"]) {
  const other = quote == "\"" ? "'" : "\"";
  for (const [insert, accepted] of [
    ["&amp;", true], ["&#x1F600;", true], ["& ", true], ["\r", false],
    ["\0", false], [quote, false],
    [other, true], ["<b>x</b>", true], ["Ģ", true], ["Ħ", true], ["ħ", true],
    ["č", true], ["Ā", true], ["\u{1F600}", true],
  ]) {
    for (let i = 0; i <= TEXT.length; i++) {
      (accepted ? ACCEPTED : REJECTED).push(
        `<span title=${quote}${TEXT.slice(0, i)}${insert}${TEXT.slice(i)}${quote}>x</span>`);
    }
  }
}

const CONTEXTS = ["div", "ul", "ol", "li", "span", "p", "label", "button", "a",
                  "b", "footer", "section", "template", "h2", "em", "code",
                  "article", "header", "blockquote", "fieldset", "details", "font",
                  "ins", "dl", "video"];
const UNSUPPORTED_CONTEXTS = ["td", "custom-el", "input", "img", "svg:a", "math:mi", "dt", "output"];
const NAMESPACES = {
  svg: "http://www.w3.org/2000/svg",
  math: "http://www.w3.org/1998/Math/MathML",
};

function describe(root) {
  const out = [];
  for (const el of root.querySelectorAll("*")) {
    const d = { tag: el.localName, ctor: el.constructor.name };
    if (el instanceof HTMLInputElement) {
      Object.assign(d, { checked: el.checked, defaultChecked: el.defaultChecked,
                         value: el.value, type: el.type,
                         valid: el.validity.valid, matchesInvalid: el.matches(":invalid"),
                         uaWidget: !!SpecialPowers.wrap(el).openOrClosedShadowRoot });
    }
    if (el instanceof HTMLButtonElement) {
      d.type = el.type;
    }
    for (const cls of el.classList) {
      d["matches." + cls] = root.querySelectorAll("." + CSS.escape(cls)).length;
    }
    if (el.id) {
      d.byId = el.ownerDocument.getElementById(el.id) == el;
    }
    out.push(d);
  }
  return JSON.stringify(out);
}

function describeNodes(root) {
  const out = [];
  const walker = document.createTreeWalker(root);
  for (let node = walker.nextNode(); node; node = walker.nextNode()) {
    out.push(node.nodeType == Node.ELEMENT_NODE ? node.nodeName
             : `${node.nodeType}:${JSON.stringify(node.data)}`);
  }
  return out.join(" ");
}

function parse(context, markup) {
  const container = document.getElementById("contexts");
  const [prefix, localName] = context.includes(":") ? context.split(":") : [null, context];
  const el = prefix ? document.createElementNS(NAMESPACES[prefix], localName)
                    : document.createElement(localName);
  container.append(el);
  const before = utils.innerHTMLFastPathCount;
  el.innerHTML = markup;
  const fast = utils.innerHTMLFastPathCount != before;
  const root = el.content ?? el;
  const result = { html: el.innerHTML, dom: describe(root), nodes: describeNodes(root), fast };
  el.remove();
  return result;
}

add_task(async function test_fast_path_matches_full_parser() {
  const cases = [];
  for (const context of [...CONTEXTS, ...UNSUPPORTED_CONTEXTS]) {
    const supported = CONTEXTS.includes(context);
    for (const markup of ACCEPTED) {
      cases.push({ context, markup, fast: supported });
    }
    for (const markup of REJECTED) {
      cases.push({ context, markup, fast: false });
    }
  }
  await SpecialPowers.pushPrefEnv({ set: [[PREF, false]] });
  const expected = cases.map(c => parse(c.context, c.markup));
  await SpecialPowers.popPrefEnv();
  await SpecialPowers.pushPrefEnv({ set: [[PREF, true]] });
  const actual = cases.map(c => parse(c.context, c.markup));
  await SpecialPowers.popPrefEnv();

  let mismatches = 0;
  for (const [i, c] of cases.entries()) {
    const name = `<${c.context}>.innerHTML = ${JSON.stringify(c.markup)}`;
    for (const key of ["html", "dom", "nodes"]) {
      if (actual[i][key] !== expected[i][key]) {
        is(actual[i][key], expected[i][key], `${name}: ${key}`);
        mismatches++;
      }
    }
    if (actual[i].fast !== c.fast) {
      is(actual[i].fast, c.fast, `${name}: parsed by the fast path`);
      mismatches++;
    }
    if (expected[i].fast) {
      ok(false, `${name}: parsed by the fast path with the pref disabled`);
      mismatches++;
    }
  }
  is(mismatches, 0, `${cases.length} cases match`);
});

// Markup that only DOMParser treats differently: whitespace and comments
// before the first content, and the tags that make the document's structure.
const DOCUMENT_ACCEPTED = [
  ...TEXT_WITHOUT_MARKUP,

  "x",
  " x <b>y</b> ",
  "<strong>3</strong> items left",

  "<p>a</p><!--c-->",
];
const DOCUMENT_REJECTED = [
  "<!--c-->x",
  "  <!--c--><p>x</p>",
  "<!---->",
  "<?pi>x",
  "<!DOCTYPE html><p>x</p>",
  "<html><p>x</p>",
  "<head><title>t</title></head>x",
  "<body class=a>x",
  "<title>t</title>",
  "<meta charset=utf-8><p>x</p>",
  "<link rel=stylesheet href=a.css><p>x</p>",
  "<style>p {}</style><p>x</p>",
  "<script>x<\/script>",
  "<noscript><p>x</p></noscript>",
  "<template><p>x</p></template>",
  "<frameset></frameset>",
  "</p>x",
  "&#10;",
  " &#32;<header></header>",
  "&#9;x",
];

function parseDocument(markup) {
  const before = utils.innerHTMLFastPathCount;
  const doc = new DOMParser().parseFromString(markup, "text/html");
  const fast = utils.innerHTMLFastPathCount != before;
  return {
    html: doc.documentElement.outerHTML,
    dom: describe(doc),
    nodes: describeNodes(doc),
    state: JSON.stringify([doc.compatMode, doc.readyState, doc.characterSet,
                           doc.contentType, !!doc.head, !!doc.body]),
    fast,
  };
}

add_task(async function test_domparser_matches_full_parser() {
  const startsWithNonContent = markup =>
    /^(<!|<\?|<\/|&)/.test(markup.replace(/^[\t\n\f\r ]+/, ""));
  const cases = [
    ...[...ACCEPTED, ...DOCUMENT_ACCEPTED].map(markup =>
      ({ markup, fast: !startsWithNonContent(markup) })),
    ...[...REJECTED.filter(markup => !TEXT_WITHOUT_MARKUP.includes(markup)),
        ...DOCUMENT_REJECTED].map(markup => ({ markup, fast: false })),
  ];
  await SpecialPowers.pushPrefEnv({ set: [[PREF, false]] });
  const expected = cases.map(c => parseDocument(c.markup));
  await SpecialPowers.popPrefEnv();
  await SpecialPowers.pushPrefEnv({ set: [[PREF, true]] });
  const actual = cases.map(c => parseDocument(c.markup));
  await SpecialPowers.popPrefEnv();

  let mismatches = 0;
  for (const [i, c] of cases.entries()) {
    const name = `DOMParser ${JSON.stringify(c.markup)}`;
    for (const key of ["html", "dom", "nodes", "state"]) {
      if (actual[i][key] !== expected[i][key]) {
        is(actual[i][key], expected[i][key], `${name}: ${key}`);
        mismatches++;
      }
    }
    if (actual[i].fast !== c.fast) {
      is(actual[i].fast, c.fast, `${name}: parsed by the fast path`);
      mismatches++;
    }
    if (expected[i].fast) {
      ok(false, `${name}: parsed by the fast path with the pref disabled`);
      mismatches++;
    }
  }
  is(mismatches, 0, `${cases.length} DOMParser cases match`);
});

add_task(async function test_mutation_records() {
  const markup = "<div id=rec>x</div><span>y</span><input value=x><img src='x.png'>";
  // Template contents belong to the template contents owner, a document of
  // their own.
  for (const localName of ["div", "template"]) {
    const results = [];
    for (const enabled of [false, true]) {
      await SpecialPowers.pushPrefEnv({ set: [[PREF, enabled]] });
      const el = document.createElement(localName);
      document.body.append(el);
      el.innerHTML = "<b>old</b>";
      const target = localName == "template" ? el.content : el;
      const observer = new MutationObserver(() => {});
      observer.observe(target, { childList: true, subtree: true });
      el.innerHTML = markup;
      const records = observer.takeRecords().map(r => ({
        type: r.type,
        target: r.target == target,
        added: [...r.addedNodes].map(n => n.nodeName),
        removed: [...r.removedNodes].map(n => n.nodeName),
      }));
      observer.disconnect();
      results.push(JSON.stringify(records));
      el.remove();
      await SpecialPowers.popPrefEnv();
    }
    is(
      results[1],
      results[0],
      `same mutation records in a ${localName} with and without the fast path`
    );
  }
});

add_task(async function test_form_ancestor() {
  const form = document.getElementById("form");
  const results = [];
  for (const enabled of [false, true]) {
    await SpecialPowers.pushPrefEnv({ set: [[PREF, enabled]] });
    const fieldset = document.createElement("fieldset");
    fieldset.disabled = true;
    const div = document.createElement("div");
    fieldset.append(div);
    form.append(fieldset);
    const before = utils.innerHTMLFastPathCount;
    div.innerHTML = "<input name=a><button>b</button><input type=radio name=f checked><input type=radio name=f checked><input form=other><img name=i>";
    is(utils.innerHTMLFastPathCount - before, enabled ? 1 : 0,
       `markup inside a form parsed by the fast path: ${enabled}`);
    results.push(JSON.stringify({
      controls: [...div.querySelectorAll("input, button")].map(el => ({
        form: el.form?.id ?? null,
        disabled: el.matches(":disabled"),
        checked: el.checked,
      })),
      elements: [...form.elements].map(el => el.name || el.localName),
      named: form.elements.namedItem("a")?.localName ?? null,
      // Images are associated with the form for its named properties.
      img: form.i == div.querySelector("img"),
    }));
    fieldset.remove();
    await SpecialPowers.popPrefEnv();
  }
  is(results[1], results[0], "same form association, disabled and checked state");
});

    existing.type = "radio";

    document.body.append(existing, div);
    div.innerHTML = "<input type=radio name=doc-group checked><input type=radio name=doc-group>";

                                 ...[...div.querySelectorAll("input")].map(el => el.checked)]));

    await SpecialPowers.popPrefEnv();

  is(results[1], results[0], "same radio group state as the full parser");
});

    host.remove();
    await SpecialPowers.popPrefEnv();
  }
});
