<!DOCTYPE HTML>
<html>
<head>
  <title>Test for console messages localized with Fluent</title>
  <script src="/tests/SimpleTest/SimpleTest.js"></script>
  <link rel="stylesheet" type="text/css" href="/tests/SimpleTest/test.css"/>
</head>
<body>
<script>
add_task(async function test_get_element_by_id_empty_param() {
  const consoleDone = new Promise(resolve =>
    SimpleTest.monitorConsole(resolve, [
      { errorMessage: "Empty string passed to getElementById()." },
    ])
  );
  document.getElementById("");
  SimpleTest.endMonitorConsole();
  await consoleDone;
});

add_task(async function test_message_with_argument() {
  const consoleDone = new Promise(resolve =>
    SimpleTest.monitorConsole(resolve, [
      { errorMessage: "Ignoring unsupported entryTypes: invalid." },
    ])
  );
  new PerformanceObserver(() => {}).observe({ entryTypes: ["invalid", "mark"] });
  SimpleTest.endMonitorConsole();
  await consoleDone;
});
</script>
</body>
</html>
