---
$schema: moz://mozilla.org/schemas/glean/metrics/2-0-0
$tags:
  - 'Core :: DOM: Core & HTML'

perf:
  largest_contentful_paint:
    type: timing_distribution
    time_unit: millisecond
    description: >
        Time from navigation start to largest contentful paint.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1862939
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1862939#c5
    notification_emails:
      - perf-telemetry-alerts@mozilla.com
    expires: never
    metadata:
      monitor:
        alert: False
        lower_is_better: True
        platforms:
          - All

  largest_contentful_paint_from_response_start:
    type: timing_distribution
    time_unit: millisecond
    description: >
        Time from response start to largest contentful paint.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1862939
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1862939#c5
    notification_emails:
      - perf-telemetry-alerts@mozilla.com
    expires: never
  page_load:
    type: event
    description: >
        Recorded when a top level content document has been loaded.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1759744
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1799727
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1834774
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1862939
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1892231
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1923894
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1954216
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1949038
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2063750
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1759744#c5
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1799727#c4
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1834774#c3
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1862939#c5
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1892231#c3
    notification_emails:
      - perf-telemetry-alerts@mozilla.com
      - dpalmeiro@mozilla.com
    expires: never
    extra_keys:
      load_time:
        description: |
          Time between loadEventStart and navigationStart, in ms.
        type: quantity
        unit: ms
      dns_lookup_time:
        description: |
          Time taken to perform dns lookup of the top level document, in ms.
        type: quantity
        unit: ms
      time_to_request_start:
        description: |
          Time between requestStart and navigationStart, in ms.
        type: quantity
        unit: ms
      response_time:
        description: |
          Time between responseStart and navigationStart, in ms.
        type: quantity
        unit: ms
      fcp_time:
        description: |
          Time between firstContentfulPaint and navigationStart, in ms.
        type: quantity
        unit: ms
      lcp_time:
        description: |
          Time between largestContentfulPaint and navigationStart, at the point of onLoad firing, in ms. This may differ from the final LCP value as reported through the LCP histogram.
        type: quantity
        unit: ms
      js_exec_time:
        description: |
          Time spent executing JS during page load, in ms.
        type: quantity
        unit: ms
      delazify_time:
        description: |
          Time spent delazifying JS during page load, in ms.
        type: quantity
        unit: ms
      redirect_time:
        type: quantity
        description: |
          Time spent in redirections for the top level document.
        unit: ms
      tls_handshake_time:
        type: quantity
        description: |
          Time spent in TLS handshake for the top level document.
        unit: ms
      redirect_count:
        description: |
          Number of redirections for the top level document.
        type: quantity
        unit: integer
      load_type:
        description: |
          One of normal,reload,stop,link,history,error or other.
        type: string
      same_origin_nav:
        description: |
          If true, a normal navigation was performed on the same origin.
        type: boolean
      using_webdriver:
        description: |
          If true, a webdriver is running on the client.
        type: boolean
      http_ver:
        description: |
          Version of HTTP protocol used.
        type: quantity
        unit: integer
      trr_domain:
        description: |
          TRR domain used.
        type: string
      document_features:
        description: >
          Bitfield of web features in use within this document:
            1 - fetchpriority applied to images
        type: quantity
        unit: integer
      user_features:
        description: >
          Bitfield of features the user is enabling:
            1 - assistive technology in use
        type: quantity
        unit: integer
      has_ssd:
        description: |
          Whether the user has SSD in their hardware or not. Only available on Windows, after startup-idle-tasks are done
        type: boolean
      cache_disposition:
        description: |
          cache disposition for the top level document
        type: quantity
        unit: integer
      script_from_necko_text:
        description: |
          Number of scripts fetched from necko as text
        type: quantity
        unit: integer
      script_from_necko_serialized:
        description: |
          Number of scripts fetched from necko as serialized stencil
        type: quantity
        unit: integer
      script_memory_cache_use:
        description: |
          Number of scripts retrieved from memory cache, non-dirsty
        type: quantity
        unit: integer
      script_memory_cache_revived:
        description: |
          Number of scripts retrieved from memory cache, dirty, but revived
          after the response from necko
        type: quantity
        unit: integer
      script_memory_cache_evicted_dirty:
        description: |
          Number of scripts retrieved from memory cache, dirty, and evicted
          after the response from necko
        type: quantity
        unit: integer
      network_type:
        description: |
          Network link type from nsINetworkLinkService, only available on android. Values as:
            - 0 unknown
            - 1 ethernet
            - 2 usb
            - 3 wifi
            - 4 wifimax
            - 9 mobile
        type: quantity
        unit: integer
      android_app_link_launch_type:
        description: |
          AppLink launch type, android only.
            - 0 UNKNOWN: not an applink navigation
            - 1 COLD: process and activity created from scratch
            - 2 WARM: process alive but target activity created fresh
            - 3 HOT: process alive and existing target activity instance reused
        type: quantity
        unit: integer
      android_app_link_to_navigation_start:
        type: quantity
        description:
          "For android navigations, the time from application launch (i.e parent process start) to navigation start. Only meaningful with android_app_link_launch_type = COLD"
        unit: ms
      android_isolation_category:
        description: |
          Process isolation category: 0=other, 1=shared_web, 2=site_isolated, 3=coop_isolated
        type: quantity
        unit: integer
      interaction_count:
        description: |
          Number of distinct user interactions on the page, per the W3C event
          timing spec (window.performance.interactionCount).
        type: quantity
        unit: integer
      inp_longest:
        description: |
          Longest dispatch-to-next-paint duration among events with a
          non-zero interactionId and duration >= 40 ms (matching the
          web-vitals.js INP threshold for RUM comparability), in ms.
          Candidate INP proxy.
        type: quantity
        unit: ms
      inp_p98:
        description: |
          98th percentile of dispatch-to-next-paint durations across the
          events used for inp_longest. Approximates Chrome's INP for pages
          with >= 50 such events; collapses to inp_longest otherwise.
        type: quantity
        unit: ms
      inp_p75:
        description: |
          75th percentile of the same set used for inp_p98.
        type: quantity
        unit: ms
      keypress_max_duration:
        description: |
          Longest dispatch-to-next-paint duration among keydown, keypress,
          or keyup events of at least 40 ms, in ms.
        type: quantity
        unit: ms
      mouse_click:
        description: |
          Longest dispatch-to-next-paint duration among pointer click
          events of at least 40 ms, in ms.
        type: quantity
        unit: ms
      is_active_client:
        description: |
          Whether this profile looks like it belongs to a real person rather
          than to automation: its browsing history reaches back at least three
          days and holds at least five distinct pages. False in every other
          scenario, including when history is disabled or unavailable. Not
          reported on GeckoView, where history lives in the embedding app.
        type: boolean
    send_in_pings:
      - pageload
  page_load_domain:
    type: event
    description: >
        Recorded when a top level content document has been loaded.
        Includes ETLD+1 information and sent with ohttp.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1967780
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2063750
    data_reviews:
      - https://phabricator.services.mozilla.com/D250521
    notification_emails:
      - perf-telemetry-alerts@mozilla.com
      - dpalmeiro@mozilla.com
    expires: never
    extra_keys:
      lcp_time:
        description: |
          Time between largestContentfulPaint and navigationStart, at the point of onLoad firing, in ms. This may differ from the final LCP value as reported through the LCP histogram.
        type: quantity
        unit: ms
      load_type:
        description: |
          One of normal,reload,stop,link,history,error or other.
        type: string
      same_origin_nav:
        description: |
          If true, a normal navigation was performed on the same origin.
        type: boolean
      http_ver:
        description: |
          Version of HTTP protocol used.
        type: quantity
        unit: integer
      document_features:
        description: >
          Bitfield of web features in use within this document:
            1 - fetchpriority applied to images
        type: quantity
        unit: integer
      domain:
        description: |
          ETLD+1 domain of website visited. For a small allowlist of
          well-known public domains, the full hostname is recorded instead
          (e.g. docs.google.com, mail.google.com, support.microsoft.com).
        type: string
      is_first_daily_load:
        description: |
          Reports true if domain has not been visited yet today by this
          user, and false for any other scenario (i.e. failure, no browsing
          history, etc).
        type: boolean
      channel:
        description: |
          Release channel of the build. Either "nightly" or "release" only.
        type: string
      app_version_major:
        description: |
          Major version number.
        type: quantity
        unit: integer
      country:
        description: |
          ISO 3166-1 alpha-2 country code determined from local GeoIP data.
          Only set on release builds, and only for a limited set of countries
          with a large enough user base to avoid fingerprinting risk:
          US, DE, FR, GB, CA, PL, JP, IN, BR, ID, MX, IT, ES, NL.
        type: string
      is_active_client:
        description: |
          Whether this profile looks like it belongs to a legitimate user: its
          browsing history reaches back at least three days and holds at least
          five distinct pages. False in every other scenario, including when
          history is disabled or unavailable. Not reported on GeckoView, where
          history lives in the embedding app.
        type: boolean
    send_in_pings:
      - pageload-base-domain

  dns_first_byte:
    type: labeled_timing_distribution
    description: >
      The time from a top-level document's HTTP channel open to the first byte
      of the reply is received (ms). Keyed by TRR domain for DoH or 'Native'
      otherwise
    time_unit: millisecond
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1803671
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2037081
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1803671
    notification_emails:
      - necko@mozilla.com
      - acreskey@mozilla.com
    expires: never

  cold_applink_process_launch_to_load_uri:
    type: timing_distribution
    time_unit: millisecond
    description: |
      The duration from cold process launch to load URI for an android cold applink.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1990344
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1990344
    data_sensitivity:
      - technical
    notification_emails:
      - perf-telemetry-alerts@mozilla.com
      - android-probes@mozilla.com
    expires: never

  cold_applink_main_to_load_uri:
    type: timing_distribution
    time_unit: millisecond
    description: |
      The duration from StartupTimeline::MAIN to load URI for an android cold applink.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1991160
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1991160
    data_sensitivity:
      - technical
    notification_emails:
      - perf-telemetry-alerts@mozilla.com
      - android-probes@mozilla.com
    expires: never

performance.pageload:
  load_time:
    type: timing_distribution
    time_unit: millisecond
    description: >
      Time in milliseconds from navigationStart to loadEventStart
      for the foreground http or https root content document.
      (Migrated from the geckoview metric of the same name).
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1671729
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1877842
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1671729#c7
    notification_emails:
      - dpalmeiro@mozilla.com
      - perf-telemetry-alerts@mozilla.com
    expires: never
    metadata:
      monitor:
        alert: False
        lower_is_better: True
        platforms:
          - All

  load_time_responsestart:
    type: timing_distribution
    time_unit: millisecond
    description: >
      Time in milliseconds from responseStart to loadEventStart
      for the foreground http or https root content document.
      (Migrated from the geckoview metric of the same name).
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1671729
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1877842
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1671729#c7
    notification_emails:
      - dpalmeiro@mozilla.com
      - perf-telemetry-alerts@mozilla.com
    expires: never

  fcp:
    type: timing_distribution
    time_unit: millisecond
    description: >
      The time between navigationStart and the first contentful paint
      of a foreground http or https root content document, in
      milliseconds. The contentful paint timestamp is taken during
      display list building and does not include rasterization or
      compositing of that paint.
      (Migrated from the geckoview metric of the same name).
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1671729
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1877842
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1671729#c7
    notification_emails:
      - dpalmeiro@mozilla.com
      - perf-telemetry-alerts@mozilla.com
    expires: never
    metadata:
      monitor:
        alert: False
        lower_is_better: True
        platforms:
          - All

  fcp_responsestart:
    type: timing_distribution
    time_unit: millisecond
    description: >
      The time between responseStart and the first contentful paint
      of a foreground http or https root content document, in
      milliseconds. The contentful paint timestamp is taken during
      display list building and does not include rasterization or
      compositing of that paint.
      (Migrated from the geckoview metric of the same name).
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1671729
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1877842
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1671729#c7
    notification_emails:
      - dpalmeiro@mozilla.com
      - perf-telemetry-alerts@mozilla.com
    expires: never

