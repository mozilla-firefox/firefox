schema: 1

bugzilla:
  product: Core
  component: "Graphics: Text"

origin:
  name: graphite2
  description: smart font system developed specifically to handle the complexities of lesser-known languages of the world

  url: https://graphite.sil.org/

  release: 1.3.15 (2026-06-01T04:03:26+07:00).
  revision: 1.3.15

  license: LGPL-2.1
  license-file: LICENSE

vendoring:
  url: https://github.com/silnrsi/graphite
  source-hosting: github
  tracking: tag

  exclude:
    - "**"

  include:
    - ChangeLog
    - COPYING
    - LICENSE
    - include
    - README.md
    - src

  keep:
    - geckoextra
    - src/MozGrMalloc.h
    - src/sources.mozbuild

  patches:
    - geckoextra/patches/0001-slotmap-end-sentinel.patch
    - geckoextra/patches/0002-temp-copy.patch
