# To initialize the container, run `distrobox assemble create` in this directory.
# To enter the container, run `distrobox enter wrench-dev`
[dev-wrench]
additional_packages="git build-essential cmake pkg-config libfreetype-dev libexpat1-dev libfontconfig-dev ninja-build python3-pip python3-mako llvm-14-dev bison flex"
# The container shares $HOME with the host, and its Mesa is older than the
# host's. Mesa >= 24.1 sizes ~/.cache/mesa_shader_cache/index for 32-byte
# BLAKE3 keys, older Mesa for 20-byte SHA-1 keys, and each truncates the file
# to its own size on open -- which SIGBUSes any process that already has the
# larger version mapped, e.g. the host browser. Keep the container's cache to
# itself. Mesa only learnt the MESA_SHADER_CACHE_DIR spelling in 21.x, and the
# OSMesa wrench builds is older than that, so set both.
additional_flags="--env MESA_SHADER_CACHE_DIR=/var/tmp/wrench-mesa-cache --env MESA_GLSL_CACHE_DIR=/var/tmp/wrench-mesa-cache"
image=debian:12
# Debian 12 ships meson 1.0.1; osmesa-src needs the version install-meson.sh pins.
init_hooks="pip3 install --break-system-packages meson==1.1.0"
init=false
replace=true
