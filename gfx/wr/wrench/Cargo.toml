[package]
name = "wrench"
version = "0.3.0"
authors = ["Vladimir Vukicevic <vladimir@pobox.com>"]
build = "build.rs"
license = "MPL-2.0"
edition = "2018"

# Required by cargo-apk to build for Android
[lib]
crate-type = ["lib", "cdylib"]
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
env_logger = { version = "0.10", optional = true, default-features = false }
gleam = { workspace = true }
glutin = { version = "0.32", default-features = false }
glutin-winit = "0.5"
clap = { version = "3.1", features = ["yaml"] }
glsl-lang = { version = "0.2", features = ["lexer-v2-full"] }
log = "0.4"
yaml-rust = { version = "0.10", package = "yaml-rust2" }
serde_json = "1.0"
chrono = "0.4"
crossbeam = "0.2"
osmesa-sys = { version = "0.1.2", optional = true }
osmesa-src = { rev = "6bf6cc406646ab6ad37e5f24b51c6ef92ffd9cce", git = "https://github.com/glandium/osmesa-src", optional = true }
webrender = { path = "../webrender", features = ["capture", "replay", "png", "tracy", "dynamic_freetype", "leak_checks"] }
webrender_build = { path = "../webrender_build" }
winit = "0.30"
serde = { version = "1.0", features = ["derive"] }
semver = "1.0.12"
swgl = { path = "../swgl", optional = true }
tracy-rs = "0.1.2"

[dependencies.image]
version = "0.23"
default-features = false
features = ["png"]

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
core-foundation = "0.9"

[features]
default = [ "env_logger" ]
headless = [ "osmesa-sys", "osmesa-src" ]
software = [ "swgl", "webrender/sw_compositor" ]
debugger = [ "webrender/debugger" ]

[target.'cfg(target_os = "windows")'.dependencies]
dwrote = "0.11.5"
mozangle = { version = "0.5.2", features = ["egl"] }

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.14"

[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
font-loader = "0.11"

# Configuration information used when building wrench as an APK.
[package.metadata.android]
package = "org.mozilla.wrench"
build_targets = [ "aarch64-linux-android", "x86_64-linux-android" ]
opengles_version_major = 3
opengles_version_minor = 0

[package.metadata.android.sdk]
# keep it in sync with android-sdk-version in android-sdk.configure
target_sdk_version = 37
min_sdk_version = 26

[package.metadata.android.application]
label = "Wrench"
debuggable = true

[build-dependencies]
cc = "1.0"
