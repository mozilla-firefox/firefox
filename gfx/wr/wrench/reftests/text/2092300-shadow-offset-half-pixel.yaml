---
# A shadow offset of exactly half a device pixel moves the shadow the way
# pixel aligned content would have snapped on its own: -0.5 to 0 and 0.5 to 1,
# whatever the shadowed content's sub-pixel phase (bug 2092300).
root:
  items:
    - type: shadow
      bounds: [0, 0, 400, 600]
      blur-radius: 0
      offset: [0, -0.5]
      color: [0, 0, 0, 1]
