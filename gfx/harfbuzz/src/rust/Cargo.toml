[package]
name = "harfbuzz_rust"
edition = "2021"
rust-version = "1.87.0"

[dependencies]
harfrust = { version = "0.15.0", optional = true }
# harfrust = { git = "https://github.com/harfbuzz/harfrust", optional = true }
read-fonts = { version = "0.46.*", optional = true }
skrifa = { version = "0.49.*", optional = true, default-features = false, features = ["std"] }
smallvec = { version = "1.*", optional = true }

[lib]
name = "harfbuzz_rust"
path = "lib.rs"
crate-type = ["staticlib"]

[features]
default = ["paint", "draw", "hb-allocator"]
# Core font functions, including bitmap and COLR extents, require only
# read-fonts.
font = ["read-fonts"]
shape = ["dep:harfrust", "dep:smallvec"]
read-fonts = ["dep:read-fonts"]
paint = ["read-fonts"]
# Skrifa draws outlines.
draw = ["read-fonts", "dep:skrifa"]
hb-allocator = []

[profile.release]
strip = true
panic = "abort"
overflow-checks = false
lto = "fat"
codegen-units = 1

[profile.debugoptimized]
inherits = "dev"
panic = "abort"
overflow-checks = false
lto = "fat"
codegen-units = 1
