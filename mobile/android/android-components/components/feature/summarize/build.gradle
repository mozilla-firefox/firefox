plugins {
    id 'com.android.library'
    alias(libs.plugins.dependency.analysis)
    alias(libs.plugins.kotlin.compose)
}

android {
    defaultConfig {
        buildConfigField("String", "LIBRARY_VERSION", "\"" + config.componentsVersion + "\"")
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }

    namespace = 'mozilla.components.feature.summarize'
}

dependencies {
    implementation platform(libs.androidx.compose.bom)
    implementation project(':components:compose-base')
    implementation project(':components:concept-ai-controls')
    implementation project(':components:concept-llm')
    implementation project(':components:lib-shake')
    implementation project(':components:lib-state')
    implementation project(':components:ui-icons')
    api project(':components:ui-richtext')

    implementation libs.androidx.compose.foundation
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.androidx.core
    implementation libs.androidx.datastore
    implementation libs.androidx.datastore.preferences
    debugImplementation libs.androidx.compose.ui.tooling

    testImplementation libs.androidx.compose.ui.test
    testImplementation libs.androidx.compose.ui.test.manifest
    testImplementation libs.androidx.test.junit
    testImplementation libs.kotlin.test
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.robolectric

    testImplementation project(':components:support-test-fakes')
}

apply from: '../../../common-config.gradle'
apply from: '../../../publish.gradle'
ext.configurePublish(config.componentsGroupId, project.name, project.ext.description)
