import static org.mozilla.conventions.BuildConfigKt.updateExtensionVersion

plugins {
    id 'com.android.library'
    alias(libs.plugins.dependency.analysis)
}

android {
    namespace = 'mozilla.components.feature.readerview'
}

tasks.register("updateBuiltInExtensionVersion", Copy) { task ->
    updateExtensionVersion(task, 'src/main/assets/extensions/readerview', rootProject.ext.config.componentsVersion)
}

// Make sure DAGP asset-source exploding happens after ExtensionVersion tasks
tasks.matching { it.name.startsWith("explodeAssetSource") }.configureEach { t ->
    t.dependsOn(tasks.named("updateBuiltInExtensionVersion"))
}

dependencies {
    implementation project(':components:browser-state')
    implementation project(':components:concept-engine')
    implementation project(':components:support-base')
    implementation project(':components:support-ktx')
    implementation project(':components:support-utils')
    implementation project(':components:support-webextensions')
    implementation project(':components:ui-icons')

    implementation libs.androidx.constraintlayout
    implementation libs.androidx.core
    implementation libs.kotlinx.coroutines

    testImplementation project(':components:support-test')
    testImplementation project(':components:support-test-libstate')

    testImplementation libs.androidx.test.core
    testImplementation libs.androidx.test.junit
    testImplementation libs.kotlin.test
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.robolectric
}

apply from: '../../../common-config.gradle'
apply from: '../../../publish.gradle'
ext.configurePublish(config.componentsGroupId, project.name, project.ext.description)

preBuild.dependsOn updateBuiltInExtensionVersion
