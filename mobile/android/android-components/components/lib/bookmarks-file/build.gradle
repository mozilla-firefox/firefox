plugins {
    id 'com.android.library'
}

android {
    namespace = 'mozilla.components.lib.bookmarks.file'
}

dependencies {
    api project(':components:concept-file-importer')
    api project(':components:concept-file-parser')
    api project(':components:concept-storage-bookmarks')
    api project(':components:lib-bookmark-parser-jsoup')
    implementation libs.kotlinx.coroutines

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit4
    testImplementation libs.robolectric
    testImplementation libs.kotlin.test
    testImplementation libs.kotlinx.coroutines.test
}

apply from: '../../../common-config.gradle'
apply from: '../../../publish.gradle'
ext.configurePublish(config.componentsGroupId, project.name, project.ext.description)
