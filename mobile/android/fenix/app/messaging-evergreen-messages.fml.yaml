---
# This file configures "evergreen" messages that are displayed via
# the Nimbus Messaging system.
#
# They are "evergreen" in that they apply to all users, and shipped with the app.
#
# This file is intended to grow new messages once messages have been tested via
# experiment, rolled out to everyone in the release, and are ready to be rolled out
# without the remote prompting from Experimenter.
#
# When adding new messages to this file, please add the experiment (and/or rollout) URLs used to
# validate them.
#
# Triggers, actions and styles are configured in messaging-fenix.fml.yaml.

# Keep `nimbus.manifestDependencies` in `build.gradle` in sync when changing `includes` or `import`.
import:
  - path: ../../android-components/components/service/nimbus/messaging.fml.yaml
    channel: release
    features:
      messaging:
        # This message displays on the homescreen, asking the user to set Firefox as the default.
        # It is triggered after a minimum of 4 launches of the app.
        - value:
            messages:
              default-browser:
                title: default_browser_experiment_card_title
                text: default_browser_experiment_card_text
                surface: homescreen
                action: "MAKE_DEFAULT_BROWSER"
                trigger-if-all:
                  - USER_ESTABLISHED_INSTALL
                  - ANDROID_API_BELOW_29
                exclude-if-any:
                  - I_AM_DEFAULT_BROWSER
                style: PERSISTENT
                button-label: preferences_set_as_default_browser
            triggers:
              USER_ESTABLISHED_INSTALL: "number_of_app_launches >=4"
              ANDROID_API_BELOW_29: "android_version < 29"

        # This message displays as a 'push' notification, asking the user to set Firefox as the default.
        # It is triggered three days after install.
        - value:
            messages:
              default-browser-notification:
                title: nimbus_notification_default_browser_title
                text: nimbus_notification_default_browser_text
                surface: notification
                style: NOTIFICATION
                trigger-if-all:
                  - DAY_3_AFTER_INSTALL
                exclude-if-any:
                  - I_AM_DEFAULT_BROWSER
                action: MAKE_DEFAULT_BROWSER

        - value:
            messages:
              # This message displays the "sign in" VPN prompt when the user is using VPN without an account
              vpn-gpi-sign-in-upsell:
                title: ip_protection_settings_message_gpi_upsell_title
                text: VPN_MESSAGE_EMPTY_BODY
                button-label: ip_protection_settings_message_gpi_upsell_action
                settings-vpn-config:
                  title-args: [fxa_data_limit_gb] # real value resolved at runtime
                surface: settings_vpn
                action: FXA_BEGIN_AUTH
                action-params:
                  entry_point: vpn_integration_android_settings_upsell
                  service: vpn
                style: SETTINGS_CARD_PERSISTENT
                trigger-if-all:
                  - VPN_READY
                  - VPN_AUTH_PROVIDER_GPI

              # This message displays the "data reset" VPN prompt when the user is using VPN without an account
              # and has just received a data refresh
              vpn-gpi-usage-reset-upsell:
                title: ip_protection_settings_message_gpi_reset_upsell_title
                text: ip_protection_settings_message_gpi_reset_upsell_message
                button-label: ip_protection_settings_message_gpi_upsell_action
                settings-vpn-config:
                  title-args: [ gpi_data_limit_gb ] # real value resolved at runtime
                surface: settings_vpn
                action: FXA_BEGIN_AUTH
                action-params:
                  entry_point: vpn_integration_android_settings_upsell
                  service: vpn
                style: SETTINGS_CARD_HIGH_PRIORITY
                trigger-if-all:
                  - VPN_READY
                  - VPN_AUTH_PROVIDER_GPI
                  - VPN_RESET_PROMPT_PENDING

        # Continuous onboarding, driven by the Messaging System instead of `ContinuousOnboardingFeature`, for installs
        # that completed initial onboarding with `continuous-onboarding.messaging-system-enabled` set.
        # See `onboarding/continuous/Continuous-onboarding-via-messaging.md`.
        #
        # All the messages are on the `continuous_onboarding` surface, which selects at most one of them at a time.
        # A message's action decides how `ContinuousOnboardingMessagingBinding` presents it:
        # - MAKE_DEFAULT_BROWSER: the system's default browser role request,
        # - REQUEST_NOTIFICATION_PERMISSION, TURN_ON_SYNC: an onboarding card,
        # - OPEN_SETTINGS_IP_PROTECTION: the IP Protection onboarding prompt,
        # - CONTINUOUS_ONBOARDING_STAGE_COMPLETED: nothing, the message only records that a stage is over.
        #
        # The triggers, `CO_*` in messaging-fenix.fml.yaml, do the sequencing. The binding records
        # `onboarding.<message-id>.displayed` when it presents a message, `.clicked` when a card's primary button is
        # used, and `.dismissed` when a message is dismissed.
        #
        # Each stage ends with an event that later stages are timed from, exactly as `ContinuousOnboardingFeature`
        # times each stage from the previous stage's completion:
        # - days 2 and 3: a stage-completed message, displayed (silently) once the role request has been shown and the
        #   notification card has been answered, or they have nothing to ask for,
        # - day 5: the sync card being dismissed, or a stage-completed message when the user is already signed in,
        # - day 7: the VPN prompt, or a stage-completed message when the user is ineligible or the prompt is no longer
        #   allowed.
        - value:
            messages:
              # Day 2: the default browser role request, then the notification card. As in
              # `ContinuousOnboardingFeature`, the card comes back until one of its buttons is used.
              co-default-browser-1:
                text: CONTINUOUS_ONBOARDING_MESSAGE_EMPTY_BODY
                surface: continuous_onboarding
                action: MAKE_DEFAULT_BROWSER
                style: CONTINUOUS_ONBOARDING
                trigger-if-all:
                  - CO_ENABLED
                  - CO_DAY_2_DUE
                  - CO_DEFAULT_BROWSER_REQUESTABLE
                exclude-if-any:
                  - CO_DAY_2_DONE
                  - CO_DEFAULT_BROWSER_1_DISPLAYED

              co-notifications-1:
                title: nova_onboarding_notifications_title
                text: nova_onboarding_notifications_subtitle
                button-label: nova_onboarding_notifications_button
                surface: continuous_onboarding
                action: REQUEST_NOTIFICATION_PERMISSION
                style: CONTINUOUS_ONBOARDING_REPEATING
                trigger-if-all:
                  - CO_ENABLED
                  - CO_DAY_2_DUE
                  - CO_DEFAULT_BROWSER_1_RESOLVED
                  - CO_NOTIFICATIONS_REQUESTABLE
                exclude-if-any:
                  - CO_DAY_2_DONE
                  - CO_NOTIFICATIONS_1_ANSWERED

              co-day-2-complete:
                text: CONTINUOUS_ONBOARDING_MESSAGE_EMPTY_BODY
                surface: continuous_onboarding
                action: CONTINUOUS_ONBOARDING_STAGE_COMPLETED
                style: CONTINUOUS_ONBOARDING
                trigger-if-all:
                  - CO_ENABLED
                  - CO_DAY_2_DUE
                  - CO_DEFAULT_BROWSER_1_RESOLVED
                  - CO_NOTIFICATIONS_1_RESOLVED
                exclude-if-any:
                  - CO_DAY_2_DONE

              # Day 3: a retry of day 2, at least a day after it.
              co-default-browser-2:
                text: CONTINUOUS_ONBOARDING_MESSAGE_EMPTY_BODY
                surface: continuous_onboarding
                action: MAKE_DEFAULT_BROWSER
                style: CONTINUOUS_ONBOARDING
                trigger-if-all:
                  - CO_ENABLED
                  - CO_DAY_3_DUE
                  - CO_DEFAULT_BROWSER_REQUESTABLE
                exclude-if-any:
                  - CO_DAY_3_DONE
                  - CO_DEFAULT_BROWSER_2_DISPLAYED

              co-notifications-2:
                title: nova_onboarding_notifications_title
                text: nova_onboarding_notifications_subtitle
                button-label: nova_onboarding_notifications_button
                surface: continuous_onboarding
                action: REQUEST_NOTIFICATION_PERMISSION
                style: CONTINUOUS_ONBOARDING_REPEATING
                trigger-if-all:
                  - CO_ENABLED
                  - CO_DAY_3_DUE
                  - CO_DEFAULT_BROWSER_2_RESOLVED
                  - CO_NOTIFICATIONS_REQUESTABLE
                exclude-if-any:
                  - CO_DAY_3_DONE
                  - CO_NOTIFICATIONS_2_ANSWERED

              co-day-3-complete:
                text: CONTINUOUS_ONBOARDING_MESSAGE_EMPTY_BODY
                surface: continuous_onboarding
                action: CONTINUOUS_ONBOARDING_STAGE_COMPLETED
                style: CONTINUOUS_ONBOARDING
                trigger-if-all:
                  - CO_ENABLED
                  - CO_DAY_3_DUE
                  - CO_DEFAULT_BROWSER_2_RESOLVED
                  - CO_NOTIFICATIONS_2_RESOLVED
                exclude-if-any:
                  - CO_DAY_3_DONE

              # Day 5: the sync card. As in `ContinuousOnboardingFeature`, "Start syncing" does not end the stage:
              # the card comes back until it is dismissed, or the user is signed in.
              co-sync:
                title: nova_onboarding_sync_title
                text: nova_onboarding_sync_subtitle
                button-label: nova_onboarding_sync_button
                surface: continuous_onboarding
                action: TURN_ON_SYNC
                style: CONTINUOUS_ONBOARDING_REPEATING
                trigger-if-all:
                  - CO_ENABLED
                  - CO_DAY_5_DUE
                  - CO_NOT_SIGNED_IN
                exclude-if-any:
                  - CO_DAY_5_DONE

              co-day-5-skipped:
                text: CONTINUOUS_ONBOARDING_MESSAGE_EMPTY_BODY
                surface: continuous_onboarding
                action: CONTINUOUS_ONBOARDING_STAGE_COMPLETED
                style: CONTINUOUS_ONBOARDING
                trigger-if-all:
                  - CO_ENABLED
                  - CO_DAY_5_DUE
                  - CO_SIGNED_IN
                exclude-if-any:
                  - CO_DAY_5_DONE

              # Day 7: the IP Protection prompt. Its content is chosen by the IP Protection feature. While eligibility
              # is unknown, none of these messages is eligible, so the stage waits, as in `ContinuousOnboardingFeature`.
              co-vpn:
                text: CONTINUOUS_ONBOARDING_MESSAGE_EMPTY_BODY
                surface: continuous_onboarding
                action: OPEN_SETTINGS_IP_PROTECTION
                style: CONTINUOUS_ONBOARDING
                trigger-if-all:
                  - CO_ENABLED
                  - CO_DAY_7_DUE
                  - CO_VPN_ELIGIBLE
                  - CO_VPN_PROMPT_ALLOWED
                exclude-if-any:
                  - CO_DAY_7_DONE

              co-day-7-ineligible:
                text: CONTINUOUS_ONBOARDING_MESSAGE_EMPTY_BODY
                surface: continuous_onboarding
                action: CONTINUOUS_ONBOARDING_STAGE_COMPLETED
                style: CONTINUOUS_ONBOARDING
                trigger-if-all:
                  - CO_ENABLED
                  - CO_DAY_7_DUE
                  - CO_VPN_INELIGIBLE
                exclude-if-any:
                  - CO_DAY_7_DONE

              co-day-7-satisfied:
                text: CONTINUOUS_ONBOARDING_MESSAGE_EMPTY_BODY
                surface: continuous_onboarding
                action: CONTINUOUS_ONBOARDING_STAGE_COMPLETED
                style: CONTINUOUS_ONBOARDING
                trigger-if-all:
                  - CO_ENABLED
                  - CO_DAY_7_DUE
                  - CO_VPN_ELIGIBLE
                  - CO_VPN_PROMPT_NOT_ALLOWED
                exclude-if-any:
                  - CO_DAY_7_DONE

        # This message displays as a microsurvey prompt after the user taps on the `Print` menu.
        - channel: developer
          value:
            messages:
              microsurvey-printing-example:
                title: microsurvey_prompt_printing_title
                text: microsurvey_survey_printing_title
                surface: microsurvey
                trigger-if-all:
                  - RECENTLY_PRINTED
                style: MICROSURVEY
                microsurvey-config:
                  utm-content: "homepage"
                  icon: ic_print
                  answers:
                    - text: likert_scale_option_1
                      ordering: 0
                    - text: likert_scale_option_2
                      ordering: 1
                    - text: likert_scale_option_3
                      ordering: 2
                    - text: likert_scale_option_4
                      ordering: 3
                    - text: likert_scale_option_5
                      ordering: 4
                    - text: likert_scale_option_6
                      ordering: 5

              # This message displays as a microsurvey prompt after the user taps on the Uninstall app shortcut.
              microsurvey-uninstall-survey:
                title: microsurvey_uninstall_survey_title
                text: microsurvey_uninstall_survey_title
                surface: microsurvey
                trigger-if-all:
                  - NEVER
                style: MICROSURVEY
                microsurvey-config:
                  utm-content: "uninstall_shortcut"
                  icon: ic_delete_black
                  answers:
                    - text: uninstall_survey_option_1_v2
                      ordering: 0
                    - text: uninstall_survey_option_2_v2
                      ordering: 1
                    - text: uninstall_survey_option_3_v2
                      ordering: 2
                    - text: uninstall_survey_option_4_v2
                      ordering: 3
                    - text: uninstall_survey_option_5_v2
                      ordering: 4
                    - text: uninstall_survey_option_6_v2
                      ordering: 5

        # This message displays as a microsurvey prompt after the user taps on the `Print` menu.
        - channel: nightly
          value:
            messages:
              microsurvey-printing-example-nightly:
                title: microsurvey_prompt_printing_title
                text: microsurvey_survey_printing_title
                surface: microsurvey
                trigger-if-all:
                  - RECENTLY_PRINTED
                style: MICROSURVEY
                microsurvey-config:
                  utm-content: "homepage"
                  icon: ic_print
                  answers:
                    - text: likert_scale_option_1
                      ordering: 0
                    - text: likert_scale_option_2
                      ordering: 1
                    - text: likert_scale_option_3
                      ordering: 2
                    - text: likert_scale_option_4
                      ordering: 3
                    - text: likert_scale_option_5
                      ordering: 4
                    - text: likert_scale_option_6
                      ordering: 5

              # This message displays as a microsurvey prompt after the user taps on the Uninstall app shortcut.
              microsurvey-uninstall-survey:
                title: microsurvey_uninstall_survey_title
                text: microsurvey_uninstall_survey_title
                surface: microsurvey
                trigger-if-all:
                  - NEVER
                style: MICROSURVEY
                microsurvey-config:
                  utm-content: "uninstall_shortcut"
                  icon: ic_delete_black
                  answers:
                    - text: uninstall_survey_option_1_v2
                      ordering: 0
                    - text: uninstall_survey_option_2_v2
                      ordering: 1
                    - text: uninstall_survey_option_3_v2
                      ordering: 2
                    - text: uninstall_survey_option_4_v2
                      ordering: 3
                    - text: uninstall_survey_option_5_v2
                      ordering: 4
                    - text: uninstall_survey_option_6_v2
                      ordering: 5
