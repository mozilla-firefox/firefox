<script>
  /* This Source Code Form is subject to the terms of the Mozilla Public

  /* global Quitter */

  var defaultTimeout = 2 * 1000;
  var extendedTimeout = 2 * 60 * 1000;
  var superExtendedTimeout = 5 * 60 * 1000;
  var hasExtendedCorpus =
    new URLSearchParams(location.search).get("extendedCorpus") == "true";
  // Android trains on a subset of the corpus, and has no Quitter extension, see
  // testing/mozharness/scripts/android_emulator_pgo.py. Its test runner also
  // keeps new windows off-screen, so items are loaded in a frame covering this
  // page instead, to show them in the training video.
  var isAndroid = new URLSearchParams(location.search).get("android") == "true";
  // Benchmarks can't finish on slow emulators, such as the x86 one running ARM
  // builds, so they are given a fixed time there instead, see
  // testing/mozharness/scripts/android_emulator_pgo.py.
  var isSlowEmulator =
    new URLSearchParams(location.search).get("slowEmulator") == "true";
  var slowEmulatorBenchmarkTimeout = 6 * 60 * 1000;

  // How long to keep an item open after it is done, so that trailing work such
  // as painting still gets profiled.
  var doneGracePeriod = 500;

  function waitTimeout(time, win = window) {
    return new Promise(resolve => {
      win.setTimeout(() => {
        resolve();
      }, time);
    });
  }

  function isLoaded(subWindow) {
    return (
      subWindow.location.href != "about:blank" &&
      subWindow.document.readyState == "complete"
    );
  }

  // Resolves when condition() is true. It is checked on load of subWindow, since
  // the listener added to the initial about:blank window is kept when it is
  // reused for the page, and polled in case it isn't.
  function waitForCondition(subWindow, condition) {
    return new Promise(resolve => {
      let check = () => {
        let met = false;
        try {
          met = !subWindow.closed && !!condition();
        } catch (e) {}
        if (met || subWindow.closed) {
          window.clearInterval(poll);
        }
        if (met) {
          resolve();
        }
      };
      let poll = window.setInterval(check, 100);
      subWindow.addEventListener("load", check);
    });
  }

  // Tell whether the loaded window of an item is done, see Item.
  var isReported = w => w.pgoReported;
  var isSpeedometer2Done = w =>
    w.document.querySelector(
      "#summarized-results.selected, #detailed-results.selected"
    );
  var isSpeedometer3Done = w => w.benchmarkClient?._hasResults;
  var isWebAudioDone = w => w.sessionStorage.getItem("benchmark_results");
  var isJetStreamDone = w => w.JetStream?.isDone;
  var isImageDecodingDone = w => w.pgoImageDecodingDone;

  // Tell whether a done benchmark ran into an error, see Benchmark.
  var hasSpeedometer3Failed = w =>
    !Object.keys(w.benchmarkClient._metrics).length;
  var hasJetStreamFailed = w => w.JetStream.errors.length;
  var hasImageDecodingFailed = w => w.pgoImageDecodingFailed;

  /**
   * An item in the PGO training corpus
   */
  class Item {
    url;
    timeout;
    isDone;

    /**
     * @param {string} url URL to open.
     * @param {number} timeout Maximum time to keep the item open.
     * @param {Function|null} isDone Called with the window of the item once it
     *   has loaded, returns whether it is done so that it can be closed before
     *   the timeout. null to always wait for the full timeout.
     */
    constructor(url, timeout = defaultTimeout, isDone = () => true) {
      this.url = url;
      this.timeout = timeout;
      this.isDone = isDone;
    }

    /**
     * @param {Window} subWindow The window of the item.
     * @param {boolean} done Whether the item was done before its timeout.
     * @returns {string|null} Why the item failed training, or null.
     */
    // eslint-disable-next-line no-unused-vars
    getError(subWindow, done) {
      return null;
    }

    /**
     * @returns {{done: boolean, error: string|null}} Whether the item was done
     *   before its timeout, and see getError.
     */
    async run() {
      let frame = null;
      let subWindow;
      if (isAndroid) {
        frame = document.createElement("iframe");
        frame.style.cssText =
          "position: fixed; inset: 0; width: 100%; height: 100%; border: none; background: white;";
        frame.src = this.url;
        document.body.append(frame);
        subWindow = frame.contentWindow;
      } else {
        subWindow = window.open(this.url);
      }

      // Prevent the perf-reftest-singletons from calling alert()
      subWindow.tpRecordTime = () => (subWindow.pgoReported = true);

      // Wait until the timeout is finished, or until the item is done
      let finished = waitTimeout(this.timeout).then(() => false);
      if (this.isDone) {
        let done = waitForCondition(
          subWindow,
          () => isLoaded(subWindow) && this.isDone(subWindow)
        );
        finished = Promise.race([finished, done.then(() => true)]);
      }
      let done = await finished;
      let error;
      try {
        error = this.getError(subWindow, done);
      } catch (e) {
        error = String(e);
      }
      // On desktop, this page is in a background tab while items run, where its
      // timers are clamped, so use the timers of the item's window for the grace
      // period.
      if (done) {
        await waitTimeout(doneGracePeriod, subWindow);
      }

      if (frame) {
        frame.remove();
      } else {
        subWindow.close();
      }
      return { done, error };
    }
  }

  /**
   * A benchmark in the PGO training corpus. It fails training if it isn't done
   * before its timeout, so that a benchmark update that breaks isDone doesn't
   * go unnoticed.
   */
  class Benchmark extends Item {
    hasFailed;

    /**
     * @param {string} url See Item.
     * @param {number} timeout See Item.
     * @param {Function} isDone See Item.
     * @param {Function} hasFailed Called with the window of the benchmark once
     *   it is done, returns whether it ran into an error.
     */
    constructor(url, timeout, isDone, hasFailed = () => false) {
      super(url, timeout, isDone);
      this.hasFailed = hasFailed;
    }

    getError(subWindow, done) {
      if (!done) {
        return isSlowEmulator ? null : `not done after ${this.timeout / 1000}s`;
      }
      return this.hasFailed(subWindow) ? "failed" : null;
    }
  }

  // Tell profileserver.py how long an item took and whether it was done before
  // its timeout, so that it records it in the task's resource usage profile.
  async function reportItem(item, start, outcome) {
    try {
      await fetch("/pgo-item", {
        method: "POST",
        body: JSON.stringify({
          url: item.url,
          ms: Math.round(performance.now() - start),
          outcome,
        }),
      });
    } catch (e) {}
  }

  var defaultItemUrls = [
    "blueprint/elements.html",
    "blueprint/forms.html",
    "blueprint/grid.html",
    "blueprint/sample.html",
    "js-input/3d-thingy.html",
    "js-input/crypto-otp.html",
    "js-input/collator_bench.html",
    "js-input/normalizer_bench.html",
    "js-input/sunspider/3d-cube.html",
    "js-input/sunspider/3d-morph.html",
    "js-input/sunspider/3d-raytrace.html",
    "js-input/sunspider/access-binary-trees.html",
    "js-input/sunspider/access-fannkuch.html",
    "js-input/sunspider/access-nbody.html",
    "js-input/sunspider/access-nsieve.html",
    "js-input/sunspider/bitops-3bit-bits-in-byte.html",
    "js-input/sunspider/bitops-bits-in-byte.html",
    "js-input/sunspider/bitops-bitwise-and.html",
    "js-input/sunspider/bitops-nsieve-bits.html",
    "js-input/sunspider/controlflow-recursive.html",
    "js-input/sunspider/crypto-aes.html",
    "js-input/sunspider/crypto-md5.html",
    "js-input/sunspider/crypto-sha1.html",
    "js-input/sunspider/date-format-tofte.html",
    "js-input/sunspider/date-format-xparb.html",
    "js-input/sunspider/math-cordic.html",
    "js-input/sunspider/math-partial-sums.html",
    "js-input/sunspider/math-spectral-norm.html",
    "js-input/sunspider/regexp-dna.html",
    "js-input/sunspider/string-base64.html",
    "js-input/sunspider/string-fasta.html",
    "js-input/sunspider/string-tagcloud.html",
    "js-input/sunspider/string-unpack-code.html",
    "js-input/sunspider/string-validate-input.html",
    "talos/tests/perf-reftest-singletons/abspos-reflow-1.html",
    "talos/tests/perf-reftest-singletons/attr-selector-1.html",
    "talos/tests/perf-reftest-singletons/bidi-resolution-1.html",
    "talos/tests/perf-reftest-singletons/bloom-basic-2.html",
    "talos/tests/perf-reftest-singletons/bloom-basic.html",
    "talos/tests/perf-reftest-singletons/coalesce-1.html",
    "talos/tests/perf-reftest-singletons/coalesce-2.html",
    "talos/tests/perf-reftest-singletons/display-none-1.html",
    "talos/tests/perf-reftest-singletons/external-string-pass.html",
    "talos/tests/perf-reftest-singletons/getElementById-1.html",
    "talos/tests/perf-reftest-singletons/id-getter-1.html",
    "talos/tests/perf-reftest-singletons/id-getter-2.html",
    "talos/tests/perf-reftest-singletons/id-getter-3.html",
    "talos/tests/perf-reftest-singletons/id-getter-4.html",
    "talos/tests/perf-reftest-singletons/id-getter-5.html",
    "talos/tests/perf-reftest-singletons/id-getter-6.html",
    "talos/tests/perf-reftest-singletons/id-getter-7.html",
    "talos/tests/perf-reftest-singletons/inline-style-cache-1.html",
    "talos/tests/perf-reftest-singletons/line-iterator.html",
    "talos/tests/perf-reftest-singletons/link-style-cache-1.html",
    "talos/tests/perf-reftest-singletons/nth-index-1.html",
    "talos/tests/perf-reftest-singletons/nth-index-2.html",
    "talos/tests/perf-reftest-singletons/only-children-1.html",
    "talos/tests/perf-reftest-singletons/parent-basic-singleton.html",
    "talos/tests/perf-reftest-singletons/resize-lengthy-textarea.html",
    "talos/tests/perf-reftest-singletons/scrollbar-styles-1.html",
    "talos/tests/perf-reftest-singletons/slow-selector-1.html",
    "talos/tests/perf-reftest-singletons/slow-selector-2.html",
    "talos/tests/perf-reftest-singletons/style-attr-1.html",
    "talos/tests/perf-reftest-singletons/style-sharing-style-attr.html",
    "talos/tests/perf-reftest-singletons/style-sharing.html",
    "talos/tests/perf-reftest-singletons/svg-text-textLength-1.html",
    "talos/tests/perf-reftest-singletons/svg-text-getExtentOfChar-1.html",
    "talos/tests/perf-reftest-singletons/tiny-traversal-singleton.html",
    "talos/tests/perf-reftest-singletons/window-named-property-get.html",
  ];

  // Start with items with the default timeout
  var items = defaultItemUrls
    .filter(x => !isAndroid || !x.includes("perf-reftest-singletons"))
    .map(x => {
      if (x.includes("perf-reftest-singletons")) {
        return new Item(x, defaultTimeout, isReported);
      }
      // This page animates continuously, so it never finishes on its own.
      if (x.endsWith("3d-thingy.html")) {
        return new Item(x, defaultTimeout, null);
      }
      return new Item(x);
    });

  // Add items that needs longer timeouts
  items.push(
    new Benchmark(
      "webkit/PerformanceTests/Speedometer/index.html",
      isSlowEmulator ? slowEmulatorBenchmarkTimeout : extendedTimeout,
      isSpeedometer2Done
    ),
    new Benchmark(
      "webkit/PerformanceTests/Speedometer3/index.html?startAutomatically=true",
      isSlowEmulator ? slowEmulatorBenchmarkTimeout : superExtendedTimeout,
      isSpeedometer3Done,
      hasSpeedometer3Failed
    )
  );
  if (!isAndroid) {
    items.push(
      new Benchmark(
        "webkit/PerformanceTests/webaudio/index.html?raptor&rendering-buffer-length=30",
        extendedTimeout,
        isWebAudioDone
      ),
      new Benchmark(
        "image_decoding.html",
        extendedTimeout,
        isImageDecodingDone,
        hasImageDecodingFailed
      )
    );
  }

  // Add optional items if there is a 'pgo-extended-corpus' provided. JetStream
  // runs first, since it needs most of the address space of 32-bit builds and
  // can run out of it after the other items.
  if (hasExtendedCorpus) {
    items.unshift(
      new Benchmark(
        "JetStream/index.html?startAutomatically=true&testIterationCount=3&worstCaseCount=1",
        superExtendedTimeout,
        isJetStreamDone,
        hasJetStreamFailed
      )
    );
  }

  // Report the items that failed to the server, which then fails the task, see
  // PGOServer.training_errors in build/pgo/pgoserver.py.
  window.onload = async function () {
    let errors = [];
    for (let item of items) {
      let start = performance.now();
      let { done, error } = await item.run();
      await reportItem(item, start, done || !item.isDone ? "done" : "timeout");
      if (error) {
        errors.push(`${item.url}: ${error}`);
      }
    }
    try {
      await fetch("/pgo-report", {
        method: "POST",
        body: JSON.stringify({ errors }),
      });
    } finally {
      if (isAndroid) {
        window.pgoTrainingDone = true;
      } else {
        Quitter.quit();
      }
    }
  };

  for (let item of items) {
    // eslint-disable-next-line no-unsanitized/method
    document.write(item.url);
    document.write("<br>");
  }
</script>
