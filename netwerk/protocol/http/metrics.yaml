---
$schema: moz://mozilla.org/schemas/glean/metrics/2-0-0
$tags:
  - 'Core :: Networking: HTTP'


netwerk:
  parent_connect_timeout:
    type: counter
    description: >
      Counts how often the parent-connect-timeout timer is necessary to clear up EarlyHintPreloader
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1813630
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1813630
    notification_emails:
      - necko@mozilla.com
      - manuel@mozilla.com
    expires: never

  http3_0rtt_state:
    type: labeled_counter
    description: >
      Gather the outcome of 0-RTT usage:
      - "not_used": 0RTT_NOT_USED
      - "succeeded": 0RTT_USED_SUCCESS
      - "rejected": 0RTT_USED_REJECT
      - "conn_error": 0RTT_USED_CONN_ERROR
      - "conn_closed_by_necko": 0RTT_CONN_CLOSED_BY_NECKO
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1688850
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1905939
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1905939
    notification_emails:
      - necko@mozilla.com
    expires: never
    labels:
      - not_used
      - succeeded
      - rejected
      - conn_error
      - conn_closed_by_necko

  http3_0rtt_state_duration:
    type: labeled_timing_distribution
    time_unit: millisecond
    description: >
      The time a connection was in the 0-RTT state
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1688850
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1905939
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1905939
    notification_emails:
      - necko@mozilla.com
    labels:
      - succeeded
      - rejected
      - conn_error
      - conn_closed_by_necko
      - not_used
    expires: never

  http3_time_to_reuse_idle_connection:
    type: labeled_timing_distribution
    time_unit: millisecond
    description: >
      The time to reuse an idle connection in HTTP3 (ms); keyed by the transaction reusing an idle connection has succeeded or failed
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1655566
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1906360
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2037081
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1655566
    notification_emails:
      - necko@mozilla.com
    labels:
      - succeeded
      - failed
    expires: never

  happy_eyeballs_dns_resolution_time:
    type: labeled_custom_distribution
    description: >
      Happy Eyeballs: time in milliseconds to resolve each DNS record type
      (A, AAAA, HTTPS).
    range_min: 1
    range_max: 10000
    bucket_count: 100
    histogram_type: exponential
    unit: ms
    labels:
      - a
      - aaaa
      - https
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2026606
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2026606
    notification_emails:
      - necko@mozilla.com
    expires: never

  happy_eyeballs_dns_answer_spread:
    type: custom_distribution
    description: >
      Happy Eyeballs: time in milliseconds between the first positive DNS
      answer and the last positive DNS answer received before the first
      connection attempt of a single algorithm run, across the A, AAAA and
      HTTPS queries (a positive answer is one that carried at least one address
      or service info). Answers arriving after racing begins are excluded,
      since the resolution delay no longer applies to them. This is the window
      during which additional, possibly preferred-family, addresses keep
      arriving after the first usable answer. Used to tune the resolution delay
      (network.http.happy_eyeballs_resolution_delay): the delay should cover
      most of this spread so the preferred address family is usually available
      before the connection phase begins. A run with a single positive answer
      records 0.
    range_min: 1
    range_max: 10000
    bucket_count: 100
    histogram_type: exponential
    unit: ms
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2055890
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2055890
    notification_emails:
      - necko@mozilla.com
    expires: never

  happy_eyeballs_connection_attempt_count:
    type: labeled_custom_distribution
    description: >
      Happy Eyeballs: number of connection attempts started before one
      succeeded or all failed, keyed by whether the algorithm ultimately
      succeeded or failed.
    range_min: 1
    range_max: 50
    bucket_count: 50
    histogram_type: linear
    unit: attempts
    labels:
      - succeeded
      - failed
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2026606
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2046018
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2026606
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2046018
    notification_emails:
      - necko@mozilla.com
    expires: never

  happy_eyeballs_end_to_end_time_succeeded:
    type: custom_distribution
    description: >
      Happy Eyeballs: end-to-end time in milliseconds for the whole algorithm
      run, from algorithm start to a successful connection.
    range_min: 1
    range_max: 10000
    bucket_count: 100
    histogram_type: exponential
    unit: ms
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2026606
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2046018
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2048168
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2026606
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2046018
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2048168
    notification_emails:
      - necko@mozilla.com
    expires: never

  happy_eyeballs_end_to_end_time_failed:
    type: custom_distribution
    description: >
      Happy Eyeballs: end-to-end time in milliseconds for the whole algorithm
      run, from algorithm start to final failure (all connection attempts
      failed).
    range_min: 1
    range_max: 10000
    bucket_count: 100
    histogram_type: exponential
    unit: ms
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2026606
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2046018
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2048168
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2026606
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2046018
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2048168
    notification_emails:
      - necko@mozilla.com
    expires: never

  happy_eyeballs_winning_attempt_index:
    type: custom_distribution
    description: >
      Happy Eyeballs: 1-based index of the connection attempt that ultimately
      succeeded (e.g. 1 = first attempt won).
    range_min: 1
    range_max: 50
    bucket_count: 50
    histogram_type: linear
    unit: index
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2026606
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2026606
    notification_emails:
      - necko@mozilla.com
    expires: never


  happy_eyeballs_cancelled_attempt_count:
    type: custom_distribution
    description: >
      Happy Eyeballs: number of in-flight connection attempts cancelled when
      the winning attempt succeeded.
    range_min: 0
    range_max: 50
    bucket_count: 50
    histogram_type: linear
    unit: attempts
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2026606
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2026606
    notification_emails:
      - necko@mozilla.com
    expires: never

  happy_eyeballs_time_to_first_attempt:
    type: custom_distribution
    description: >
      Happy Eyeballs: time in milliseconds from algorithm start to the first
      connection attempt being dispatched. Captures DNS wait time before
      racing begins.
    range_min: 1
    range_max: 10000
    bucket_count: 100
    histogram_type: exponential
    unit: ms
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2026606
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2026606
    notification_emails:
      - necko@mozilla.com
    expires: never

  happy_eyeballs_h3_discovery:
    type: labeled_counter
    description: >
      Happy Eyeballs: how HTTP/3 (h3) reachability was advertised for a
      connection, crossing whether an Alt-Svc header advertised h3 with
      whether an HTTPS DNS record advertised h3 in its ALPN set. The
      "altsvc_only" bucket is the case where a site advertises h3 via Alt-Svc
      but publishes no h3-capable HTTPS record: the first connection cannot
      use h3 and must spend an extra round trip discovering it, where an
      HTTPS record would have allowed h3 immediately.
    labels:
      - none
      - altsvc_only
      - https_rr_only
      - both
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2043832
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2043832
    notification_emails:
      - necko@mozilla.com
    expires: never

  happy_eyeballs_h3_discovery_by_resolver:
    type: dual_labeled_counter
    description: >
      Happy Eyeballs: how HTTP/3 (h3) reachability was advertised for a
      connection (the same crossing of Alt-Svc h3 and HTTPS-record h3 as
      happy_eyeballs_h3_discovery), split by the resolver type (DoH/TRR vs
      native) that resolved the connection. Only the HTTPS-record axis
      (https_rr_only, both) depends on the resolver; Alt-Svc comes from a prior
      response header and is resolver-independent, so altsvc_only and none serve
      as control categories. Used to measure how often each resolver yields a
      first-connection-capable h3 opportunity, and to tell a resolver mechanism
      apart from site/network selection. The resolver is attributed from whether
      any of the connection's DNS records were resolved via TRR. This is the
      resolver-split companion of happy_eyeballs_h3_discovery.
    dual_labels:
      key:
        labels:
          - doh
          - native
        description: The resolver type that resolved the connection.
      category:
        labels:
          - none
          - altsvc_only
          - https_rr_only
          - both
        description: How h3 reachability was advertised for the connection.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2054503
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2054503
    notification_emails:
      - necko@mozilla.com
    expires: never

  happy_eyeballs_https_rr_features:
    type: labeled_counter
    description: >
      Happy Eyeballs: which connection-bootstrapping features the HTTPS DNS
      records carried, combined across all HTTPS records received for a
      connection (the union of features over every record, not per record).
      The "total" label is incremented once per connection that saw at least
      one non-empty HTTPS record and serves as the denominator; each feature
      label is incremented once per connection whose combined records carried
      that feature. "ech" and the address hints can only be delivered ahead
      of the first connection via the DNS record, not via an Alt-Svc header.
    labels:
      - total
      - h3_alpn
      - ech
      - ipv4hint
      - ipv6hint
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2043832
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2043832
    notification_emails:
      - necko@mozilla.com
    expires: never

  happy_eyeballs_https_rr_features_by_resolver:
    type: dual_labeled_counter
    description: >
      Happy Eyeballs: which connection-bootstrapping features the HTTPS DNS
      records carried, combined across all HTTPS records received for a
      connection (the union of features over every record, not per record),
      split by the resolver type (DoH/TRR vs native) that produced the HTTPS
      response. The "total" category is incremented once per connection that
      saw at least one non-empty HTTPS record and serves as the denominator;
      each feature category is incremented once per connection whose combined
      records carried that feature. "ech" and the address hints can only be
      delivered ahead of the first connection via the DNS record, not via an
      Alt-Svc header. Used to compare how often DoH versus native resolution
      yields a usable (and h3-capable) HTTPS record. This is the resolver-split
      companion of happy_eyeballs_https_rr_features.
    dual_labels:
      key:
        labels:
          - doh
          - native
        description: The resolver type that produced the HTTPS DNS response.
      category:
        labels:
          - total
          - h3_alpn
          - ech
          - ipv4hint
          - ipv6hint
        description: Which bootstrapping feature the HTTPS records carried.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2043832
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2043832
    notification_emails:
      - necko@mozilla.com
    expires: never

network:
  byte_range_request:
    type: labeled_counter
    labels:
      - cacheable
      - not_cacheable
    description: >
      Counts of cacheable/non-cacheable byte-range requests
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1898737
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1898737
    notification_emails:
      - necko@mozilla.com
    expires: never

  no_vary_search_header_received:
    type: counter
    description: >
      Number of cacheable HTTP responses that carried a No-Vary-Search
      response header. Only counts responses that reach the cache-write
      path; headers on non-cacheable responses are not counted.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2038028
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2038028
    notification_emails:
      - necko@mozilla.com
    expires: 166

  no_vary_search_match:
    type: labeled_counter
    labels:
      - matched
      - not_matched
    description: >
      Outcome of a No-Vary-Search secondary cache lookup, recorded only when
      the secondary index had at least one candidate for the request's base
      path. 'matched' means an equivalent cached entry was found and used as a
      cache hit that exact-URL matching would have missed; 'not_matched' means
      candidates existed but none were equivalent.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2038028
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2038028
    notification_emails:
      - necko@mozilla.com
    expires: 166

  no_vary_search_rule_type:
    type: labeled_counter
    labels:
      - exact_match
      - ignore_all
      - blocklist
      - allowlist
    description: >
      The parsed variation rule of each received No-Vary-Search header,
      recorded once per cacheable response. 'exact_match' includes both
      key-order-only headers and headers that failed to parse.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2038028
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2038028
    notification_emails:
      - necko@mozilla.com
    expires: 166

  no_vary_search_parse_error:
    type: counter
    description: >
      Number of received No-Vary-Search headers (on cacheable responses) that
      failed to parse and fell back to exact-match behavior.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2038028
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2038028
    notification_emails:
      - necko@mozilla.com
    expires: 166

  no_vary_search_hit_by_rule:
    type: labeled_counter
    labels:
      - exact_match
      - ignore_all
      - blocklist
      - allowlist
    description: >
      Breakdown by variation rule of the cache hits won via No-Vary-Search
      (the 'matched' outcome of no_vary_search_match). The sum across labels
      equals no_vary_search_match['matched'].
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2038028
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2038028
    notification_emails:
      - necko@mozilla.com
    expires: 166

  cache_read_time:
    type: timing_distribution
    time_unit: millisecond
    description: >
      In the HTTP page channel, time from connection cache read start to cache read end.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1877839
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2037081
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1877839
    notification_emails:
      - necko@mozilla.com
    expires: never

  complete_load:
    type: timing_distribution
    time_unit: millisecond
    description: >
      In the HTTP page channel, time from connection open to complete load (cache read end/until the last byte received)
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1877839
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2062940
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1877839
    notification_emails:
      - necko@mozilla.com
    expires: never

  complete_load_cached:
    type: timing_distribution
    time_unit: millisecond
    description: >
      In the HTTP page channel, time from connection open to cache read end.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1877839
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2037081
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1877839
    notification_emails:
      - necko@mozilla.com
    expires: never

  complete_load_net:
    type: timing_distribution
    time_unit: millisecond
    description: >
      In the HTTP page channel, time from connection open to the last byte received.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1877839
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2037081
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1877839
    notification_emails:
      - necko@mozilla.com
    expires: never

  cors_authorization_header:
    type: labeled_counter
    labels:
      - allowed
      - disallowed
      - covered_by_wildcard
    description: >
      Count how many times we see `Authorization` header in
      `Access-Control-Request-Headers` header and the possible outcomes.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1687364
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1902182
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1958158
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2057071
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1687364
    notification_emails:
      - necko@mozilla.com
      - kershaw@mozilla.com
    expires: 169

  cache_hit_time:
    type: timing_distribution
    time_unit: millisecond
    description: >
      Time to open existing cache entry file.
      (Migrated from the geckoview metric of the same name).
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1489524
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1580077
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1877839
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2037081
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1580077#c10
    notification_emails:
      - necko@mozilla.com
    expires: never

  cache_miss_time:
    type: timing_distribution
    time_unit: millisecond
    description: >
      Time spent to find out a cache entry file is missing.
      (Migrated from the geckoview metric of the same name).
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1489524
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1580077
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1922661
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2037081
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1580077#c10
    notification_emails:
      - necko@mozilla.com
    expires: never

  cache_hit_miss_stat_per_cache_size:
    type: labeled_counter
    description: >
      Hit/Miss count split by cache size in file count Hit 0-5000, Miss 0-5000, Hit 5001-10000, ...
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1131600
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1922661
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1131600
    notification_emails:
      - necko@mozilla.com
    expires: never

  cache_hit_rate_per_cache_size:
    type: labeled_custom_distribution
    description: >
      Hit rate for a specific cache size in file count. The hit rate is split into 20 buckets. The key is the cacheSize (20 buckets) and the value is between 0 and 100.
    bucket_count: 20
    range_min: 0
    range_max: 100
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1131600
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1922661
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1131600
    notification_emails:
      - necko@mozilla.com
    expires: never

  font_download_end:
    type: timing_distribution
    time_unit: millisecond
    description: >
      Time after navigationStart that all webfont downloads are completed.
      (Migrated from the geckoview metric of the same name).
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1877839
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1580077
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1877839
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2037081
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1580077#c10
    notification_emails:
      - perf-telemetry-alerts@mozilla.com
      - necko@mozilla.com
      - bdekoz@mozilla.com
    expires: never

  first_from_cache:
    type: timing_distribution
    time_unit: millisecond
    description: >
      In the HTTP page channel, time from connection open to cache read start.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1580077
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1877839
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2062940
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1580077#c10
    notification_emails:
      - necko@mozilla.com
    expires: never

  tcp_connection:
    type: timing_distribution
    time_unit: millisecond
    description: >
      In the HTTP page channel, time from the TCP SYN packet is received to
      the connection is established and ready for HTTP.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=772589
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1580077
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1877839
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2062940
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1580077#c10
    notification_emails:
      - necko@mozilla.com
      - vgosu@mozilla.com
    expires: never
    metadata:
      monitor:
        alert: False
        lower_is_better: True
        platforms:
          - All
        bugzilla_notification_emails:
          - acreskey@mozilla.com
          - necko@mozilla.com

  dns_start:
    type: timing_distribution
    time_unit: millisecond
    description: >
      In the HTTP page channel, time from connection open to the DNS request
      being issued.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1580077
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1877839
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2062940
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1580077#c10
    notification_emails:
      - necko@mozilla.com
