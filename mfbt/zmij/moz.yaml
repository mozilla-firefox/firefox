schema: 1

bugzilla:
  product: Core
  component: JavaScript Engine

origin:
  name: zmij
  description: A fast floating-point-to-string conversion library for C and C++

  url: https://github.com/vitaut/zmij

  release: f97cc4f65fc293dd9cebb1bba846f879f041687e (2026-11-17T01:26:26Z).
  revision: f97cc4f65fc293dd9cebb1bba846f879f041687e

  license: MIT
  license-file: LICENSE

vendoring:
  url: https://github.com/vitaut/zmij
  source-hosting: github
  vendor-directory: mfbt/zmij
  tracking: commit
  patches:
    - patches/write_ecmascript.patch
    - patches/mfbt_api_markers.patch

  keep:
    - test/baseline.txt
    - test/stub-include/mozilla/Types.h
    - test/verify-baseline.sh
    - test/verify-ecma-format.mjs
    - test/write-baseline.cpp

  exclude:
    - .clang-format
    - .cmake-format
    - .github
    - CMakeLists.txt
    - README.md
    - example.cc
    - test
    - zmij-c.h
    - zmij-int.cc
    - zmij-to-chars.h
    - zmij.c

  include:
    - LICENSE
    - test/boundary-bits.h
    - zmij.cc
    - zmij.h

  # After re-vendoring and patching, the library should produce the exact same
  # output as its previous version did. Do not update the baseline file (i.e.
  # don't run verify-baseline.sh --update) unless there is a good reason why the
  # output should be different.
  #
  # NOTE: If the patches require a nontrivial rebase, it's probably a good idea
  # to verify them on x86 and arm64, to test both the SSE4 and NEON configs!
  post-patch-actions:
    - action: run-script
      script: '{yaml_dir}/test/verify-baseline.sh'
      cwd: '{yaml_dir}'
    - action: run-command
      command: node
      args:
        - test/verify-ecma-format.mjs
      cwd: '{yaml_dir}'
