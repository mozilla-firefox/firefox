      received, or none were extracted due to parsing errors.
    range_min: 0
    range_max: 10
    bucket_count: 11
    histogram_type: linear
    data_sensitivity:
      - technical
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1985598
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1985598
    notification_emails:
      - seceng-telemetry@mozilla.com
      - jschanck@mozilla.com
    expires: never

oskeystore:
  return_codes:
    type: event
    description: >
      Collects return codes from the different implementations of the key store
      API. These are sometimes poorly documented and collection is the only way
      to discover them.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1958791
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1958791
    notification_emails:
      - simon@mozilla.com
    expires: never
    extra_keys:
      function:
        description: >
          Which function returned the value.
        type: string
      result:
        description: >
          The error code, converted to a string.
        type: string

