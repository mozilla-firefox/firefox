---
$schema: moz://mozilla.org/schemas/glean/metrics/2-0-0
$tags:
  - 'Core :: Security: PSM'

data_storage:
  alternate_services:
    type: quantity
    description:
      The number of entries stored in the AlternateServices nsIDataStorage
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1873080
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1873080
    data_sensitivity:
      - interaction
    notification_emails:
      - dkeeler@mozilla.com
    expires: never
    unit: entries
  client_auth_remember_list:
    type: quantity
    description:
      The number of entries stored in the ClientAuthRememberList nsIDataStorage
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1873080
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1873080
    data_sensitivity:
      - interaction
    notification_emails:
      - dkeeler@mozilla.com
    expires: never
    unit: entries
  site_security_service_state:
    type: quantity
    description:
      The number of entries stored in the SiteSecurityServiceState nsIDataStorage
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1873080
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1873080
    data_sensitivity:
      - interaction
    notification_emails:
      - dkeeler@mozilla.com
    expires: never
    unit: entries
  site_integrity_service_state:
    type: quantity
    description:
      The number of entries stored in the SiteIntegrityServiceState nsIDataStorage
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1873080
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1873080
    data_sensitivity:
      - interaction
    notification_emails:
      - dkeeler@mozilla.com
    expires: never
    unit: entries

tls:
  auth_algorithm:
    type: labeled_counter
    description: >
      Algorithm used to authenticate the full TLS handshake.
      See SSLAuthType in sslt.h.
    labels:
      - none
      - rsa_key_exchange
      - dsa
      - kea_unused
      - ecdsa
      - ecdh_rsa
      - ecdh_ecdsa
      - rsa_sign
      - rsa_pss
      - psk
      - tls13_any
      - mldsa44
      - mldsa65
      - mldsa87
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1862062
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2050189
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2066588
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1862062
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2050189
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2066588
    notification_emails:
      - seceng-telemetry@mozilla.com
    expires: never

  auth_ecdsa_curve:
    type: labeled_counter
    description: ECDSA signature curve for TLS_*_ECDSA_* in full TLS handshake
    labels:
      - p256
      - p384
      - p521
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1862062
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2050189
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2063132
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1862062
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2050189
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2063132
    notification_emails:
      - seceng-telemetry@mozilla.com
    expires: never

  certificate_verifications:
    type: counter
    description: >
      The total number of successful TLS server certificate verifications.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1876435
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1876435
    notification_emails:
      - dkeeler@mozilla.com
    expires: never

  cipher_suite:
    type: custom_distribution
    description: >
      Negotiated cipher suite in TLS handshake (see key in AccumulateCipherSuite
      in nsNSSCallbacks.cpp)

      This metric was generated to correspond to the Legacy Telemetry enumerated
      histogram TLS_CIPHER_SUITE.
    range_min: 0
    range_max: 64
    bucket_count: 65
    histogram_type: linear
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1862062
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1862062
    notification_emails:
      - seceng-telemetry@mozilla.com
    expires: never

  kea_ecdhe_curve:
    type: labeled_counter
    description: ECDHE KEA (TLS_ECDHE_*) curve in full TLS handshake
    labels:
      - p256
      - p384
      - p521
      - curve25519
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1862062
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2050189
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1862062
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2050189
    notification_emails:
      - seceng-telemetry@mozilla.com
    expires: never

  key_exchange_algorithm:
    type: dual_labeled_counter
    description: Key Exchange Algorithm for TLS handshake
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1862062
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2050189
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1862062
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2050189
    notification_emails:
      - seceng-telemetry@mozilla.com
    expires: never
    dual_labels:
      key:
        description: The type of handshake (full or resumed)
        labels:
          - full
          - resumed
      category:
        description: The key exchange algorithm (see SSLKEAType in sslt.h)
        labels:
          - rsa
          - dh
          - dh_psk
          - ecdh
          - ecdh_psk
          - ecdh_hybrid
          - ecdh_hybrid_psk
          - kem
          - kem_psk

  npn_type:
    type: labeled_counter
    description: NPN (next protocol negotiation) results
    labels:
      - none
      - negotiated
      - no-overlap
      - alpn
      - in0rtt
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1935420
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2050189
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1935420
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2050189
    notification_emails:
      - seceng-telemetry@mozilla.com
    expires: never

  reasons_for_not_false_starting:
    type: labeled_counter
    description: >
      Collection of reasons we did not false start when libssl would have let us.
    labels:
      - none
      - kea
      - cipherSuite
      - cipherSuite_kea
      - version
      - version_kea
      - version_cipherSuite
      - version_cipherSuite_kea
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1862062
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2050189
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1862062
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2050189
    notification_emails:
      - seceng-telemetry@mozilla.com
    expires: never

cert_compression:
    failures:
      type: labeled_counter
      description:
        The number of times each certificate compression algorithm returned an error.
      data_sensitivity:
        - interaction
      bugs:
        - https://bugzilla.mozilla.org/show_bug.cgi?id=1881027
        - https://bugzilla.mozilla.org/show_bug.cgi?id=1933864
      data_reviews:
        - https://bugzilla.mozilla.org/1881027
      notification_emails:
        - anna.weine@mozilla.com
      expires: never
      labels:
        - zlib
        - brotli
        - zstd

verification_used_cert_from:
  tls_handshake:
    type: rate
    description: >
      How many successfully-built certificate chains used a certificate from the TLS handshake.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1876435
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1876435
    notification_emails:
      - dkeeler@mozilla.com
    expires: never
    denominator_metric: tls.certificate_verifications
  preloaded_intermediates:
    type: rate
    description: >
      How many successfully-built certificate chains used a certificate from preloaded intermediates.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1876435
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1876435
    notification_emails:
      - dkeeler@mozilla.com
    expires: never
    denominator_metric: tls.certificate_verifications
  third_party_certificates:
    type: rate
    description: >
      How many successfully-built certificate chains used a third-party certificate from the OS.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1876435
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1876435
    notification_emails:
      - dkeeler@mozilla.com
    expires: never
    denominator_metric: tls.certificate_verifications
  nss_cert_db:
    type: rate
    description: >
      How many successfully-built certificate chains used a certificate from the NSS cert DB.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1876435
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1876435
    notification_emails:
      - dkeeler@mozilla.com
    expires: never
    denominator_metric: tls.certificate_verifications
  built_in_roots_module:
    type: rate
    description: >
      How many successfully-built certificate chains used a certificate from the built-in roots module.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1876435
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1876435
    notification_emails:
      - dkeeler@mozilla.com
    expires: never
    denominator_metric: tls.certificate_verifications
  pkcs11_module:
    type: rate
    description: >
      How many successfully-built certificate chains used a certificate from a third-party PKCS#11 module.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2088996
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2088996
    notification_emails:
      - dkeeler@mozilla.com
    expires: never
    denominator_metric: tls.certificate_verifications

pkcs11:
  third_party_modules_loaded:
    type: quantity
    description:
      The number of third-party PKCS#11 modules loaded.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1905453
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1905453
    data_sensitivity:
      - interaction
    notification_emails:
      - dkeeler@mozilla.com
    expires: never
    unit: modules
    metadata:
      permit_non_commutative_operations_over_ipc: true

  third_party_module_signature_type:
    type: event
    description: >
      The filename (leaf name only) and macOS code signature type of a
      third-party PKCS#11 module collected when the module is first loaded and
      added to the profile. Only collected on macOS.
    data_sensitivity:
      - interaction
    lifetime: ping
    send_in_pings:
      - default
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1905453
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2068820
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1905453
    notification_emails:
      - haftandilian@mozilla.com
    expires: 185
    extra_keys:
      filename:
        type: string
        description: Filename
      signature:
        type: string
        description: Code signature type (Ad-hoc, App Store, Developer ID, etc.)

  third_party_module_profile_entries:
    type: string_list
    description: >
      A list of PKCS#11 module filenames (leaf names only) that are in the
      profile at launch time.
    data_sensitivity:
      - interaction
    lifetime: ping
    send_in_pings:
      - default
    notification_emails:
      - haftandilian@mozilla.com
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1905453
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2068820
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1905453
    expires: 185

  builtin_roots_module_source:
    type: labeled_counter
    description: >
      Which source the built-in roots (CKBI) module was loaded from.

      `xul` is the usual case, and means the roots linked in to libxul were used.
      `gre_directory` means a `libnssckbi.so` sitting next to the Firefox binary
      was loaded instead, which some distributions arrange in order to substitute
      the system trust store. `os_library_path` and `nss3_directory` are only
      reachable in builds configured with `--with-system-nss`, and likewise
      indicate that the trust anchors came from the system trust store rather
      than from Firefox. `none` means no built-in roots module could be loaded at
      all.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2058733
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2058733
    data_sensitivity:
      - technical
    notification_emails:
      - jschanck@mozilla.com
      - dkeeler@mozilla.com
    expires: never
    labels:
      - os_library_path
      - nss3_directory
      - gre_directory
      - xul
      - none

  fips_enabled:
    type: boolean
    description: >
      Whether the NSS internal PKCS#11 module is in FIPS mode after NSS
      initialization, as reported by `PK11_IsFIPS()`.

      Note that this is always `false` in builds that use the in-tree copy of
      NSS, which is compiled with `disable_fips=1` (`NSS_FIPS_DISABLED`): that
      disables both the `/proc/sys/crypto/fips_enabled` check and the ability to
      toggle FIPS mode from the device manager. This is only ever `true` in
      builds configured with `--with-system-nss`, where the system NSS may have
      been built with FIPS support and forces FIPS mode on when the host is in
      FIPS mode.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2058730
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2058730
    data_sensitivity:
      - technical
    notification_emails:
      - jschanck@mozilla.com
      - dkeeler@mozilla.com
    expires: never

cert_verification_time:
  success:
    type: timing_distribution
    time_unit: microsecond
    description: >
      The time it takes to successfully verify a certificate in a TLS handshake.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1862062
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1913794
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1862062
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1913794
    data_sensitivity:
      - technical
    notification_emails:
      - seceng-telemetry@mozilla.com
      - dkeeler@mozilla.com
    expires: never

  failure:
    type: timing_distribution
    time_unit: microsecond
    description: >
      The time it takes to fail to verify a certificate in a TLS handshake.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1862062
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1913794
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1862062
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1913794
    data_sensitivity:
      - technical
    notification_emails:
      - seceng-telemetry@mozilla.com
      - dkeeler@mozilla.com
    expires: never

ocsp_request_time:
  success:
    type: timing_distribution
    time_unit: millisecond
    description: >
      The time it takes to make an OCSP request that succeeded.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1862062
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1913794
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1862062
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1913794
    data_sensitivity:
      - technical
    notification_emails:
      - seceng-telemetry@mozilla.com
      - dkeeler@mozilla.com
    expires: never

  failure:
    type: timing_distribution
    time_unit: millisecond
    description: >
      The time it takes to make an OCSP request that failed.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1862062
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1913794
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1862062
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1913794
    data_sensitivity:
      - technical
    notification_emails:
      - seceng-telemetry@mozilla.com
      - dkeeler@mozilla.com
    expires: never

  cancel:
    type: timing_distribution
    time_unit: millisecond
    description: >
      The time it takes to make an OCSP request that was cancelled.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1862062
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1913794
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1862062
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1913794
    data_sensitivity:
      - technical
    notification_emails:
      - seceng-telemetry@mozilla.com
      - dkeeler@mozilla.com
    expires: never

networking:
  nss_initialization:
    type: quantity
    description: >
      The time in milliseconds to initialize the NSS component in the
      parent process.
      This metric was generated to correspond to the Legacy Telemetry
      scalar networking.nss_initialization.
    bugs:
      - https://bugzil.la/1628734
    data_reviews:
      - https://bugzil.la/1628734
    notification_emails:
      - mconley@mozilla.com
      - dkeeler@mozilla.com
    expires: never
    unit: millisecond

  loading_certs_task:
    type: quantity
    description: >
      The time in milliseconds to load any external certificates. This
      occurs off of the main-thread, but can block main-thread operations.
      This metric was generated to correspond to the Legacy Telemetry
      scalar networking.loading_certs_task.
    bugs:
      - https://bugzil.la/1628734
    data_reviews:
      - https://bugzil.la/1628734
    notification_emails:
      - mconley@mozilla.com
      - dkeeler@mozilla.com
    expires: never
    unit: millisecond

security:
  client_auth_cert_usage:
    type: labeled_counter
    description: >
      Measures how many servers have requested a client authentication
      certificate (key: "requested") and how many times the user has opted
      to send one in response (key: "sent").
      This metric was generated to correspond to the Legacy Telemetry
      scalar security.client_auth_cert_usage.
    bugs:
      - https://bugzil.la/1749884
    data_reviews:
      - https://bugzil.la/1749884
    notification_emails:
      - dkeeler@mozilla.com
    expires: never

  addon_signature_verification_status:
    type: custom_distribution
    description: >
      Records the result of App Signature Verification. See the comments in
      OpenSignedAppFile.

      This metric was generated to correspond to the Legacy Telemetry enumerated
      histogram ADDON_SIGNATURE_VERIFICATION_STATUS.
    range_min: 0
    range_max: 32
    bucket_count: 33
    histogram_type: linear
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1771523
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1771523
    notification_emails:
      - seceng-telemetry@mozilla.com
    expires: never

  content_signature_verification_status:
    type: custom_distribution
    description: >
      What was the result of the content signature verification? 0=valid,
      1=invalid, 2=noCertChain, 3=createContextFailedWithOtherError,
      4=expiredCert, 5=certNotValidYet, 6=buildCertChainFailed,
      7=eeCertForWrongHost, 8=extractKeyError, 9=vfyContextError

      This metric was generated to correspond to the Legacy Telemetry enumerated
      histogram CONTENT_SIGNATURE_VERIFICATION_STATUS.
    range_min: 0
    range_max: 20
    bucket_count: 21
    histogram_type: linear
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1258647
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1862062
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1258647
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1862062
    notification_emails:
      - seceng-telemetry@mozilla.com
    expires: never

  content_signature_verification_errors:
    type: dual_labeled_counter
    description: >
      Result of the content signature verification keyed by application
      (certificate fingerprint).
    dual_labels:
      key:
        description: application (certificate fingerprint).
      category:
        labels:
          - invalid
          - otherError
          - expiredCert
          - certNotValidYet
          - buildCertChainFailed
          - eeCertForWrongHost
          - extractKeyError
          - vfyContextError
        description: Possible signature verification errors.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1435713
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1862062
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1435713
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1862062
    notification_emails:
      - seceng-telemetry@mozilla.com
    expires: never

  ntlm_module_used:
    type: custom_distribution
    description: >
      The module used for the NTLM protocol (Windows_API, Kerberos, Samba_auth
      or Generic) and whether or not the authentication was used to connect to a
      proxy server. This data is collected only once per session (at first NTLM
      authentification) ; fixed version.

      This metric was generated to correspond to the Legacy Telemetry enumerated
      histogram NTLM_MODULE_USED_2.
    range_min: 0
    range_max: 8
    bucket_count: 9
    histogram_type: linear
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1956726
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1956726
    notification_emails:
      - seceng-telemetry@mozilla.com
    expires: never

cert:
  ev_status:
    type: custom_distribution
    description: >
      EV status of a certificate, recorded on each TLS connection. 0=invalid,
      1=DV, 2=EV

      This metric was generated to correspond to the Legacy Telemetry enumerated
      histogram CERT_EV_STATUS.
    range_min: 0
    range_max: 10
    bucket_count: 11
    histogram_type: linear
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1254653
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1862062
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1254653
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1862062
    notification_emails:
      - seceng-telemetry@mozilla.com
    expires: never

  validation_success_by_ca_2:
    type: custom_distribution
    description: >
      Successful SSL server cert validations by CA (see KnownRootHashes.txt for
      names of CAs).
    range_min: 0
    range_max: 256
    bucket_count: 257
    histogram_type: linear
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1364159
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1369747
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1441550
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1909978
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1972339
    data_reviews:
