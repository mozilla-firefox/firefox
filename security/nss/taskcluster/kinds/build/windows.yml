task-defaults:
    worker-type: b-win2022
    worker:
        taskcluster-proxy: true
        artifacts:
            - type: directory
              path: public/build
    scopes: ["project:releng:services/tooltool/api/download/internal"]

win-x64/debug-make:
    description: "Windows x64 (debug, make)"
    attributes:
        make: true

win-x86/debug-make:
    description: "Windows x86 (debug, make)"
    attributes:
        make: true

win-x64/opt:
    description: "Windows x64 (opt)"

win-x64/debug:
    description: "Windows x64 (debug)"

win-x64-asan/debug:
    description: "Windows x64 (ASan, debug)"
    worker:
        env:
            UBSAN_OPTIONS: "print_stacktrace=1"
            NSS_DISABLE_ARENA_FREE_LIST: "1"
            NSS_DISABLE_UNLOAD: "1"
            CFLAGS: "-O2"
    attributes:
        asan: true

win-x64/opt-static:
    description: "Windows x64 Static (opt)"
    attributes:
        static: true

win-x86/opt:
    description: "Windows x86 (opt)"

win-x86/debug:
    description: "Windows x86 (debug)"

# Cross-compiled from the x64 builder; the certs and test tasks that consume
# these run on the native ARM64 pools. See the `cross` attribute in
# nss_taskgraph.transforms.build.
win-aarch64/opt:
    description: "Windows AArch64 (opt)"
    attributes:
        cross: true

win-aarch64/debug:
    description: "Windows AArch64 (debug)"
    attributes:
        cross: true

