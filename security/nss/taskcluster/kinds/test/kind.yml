---

loader: taskgraph.loader.transform:loader

transforms:
  - taskgraph.transforms.from_deps
  - nss_taskgraph.transforms.from_deps_task_name
  - nss_taskgraph.transforms.platforms
  - nss_taskgraph.transforms.treeherder
  - taskgraph.transforms.run
  # Has to see the env that taskgraph.transforms.run sets.
  - nss_taskgraph.transforms.hg_store
  - taskgraph.transforms.task

kind-dependencies:
  - build
  - certs

task-defaults:
    from-deps:
        copy-attributes: true
        set-name: false
        # Nothing here can run a cross-compiled (android, ios) build. This
        # merges into every task's with-attributes, including tasks-from files.
        with-attributes:
            target_os: [false]
    worker:
        env:
            NSS_MAX_MP_PBE_ITERATION_COUNT: "100"
        max-run-time: 3600
        docker-image: {in-tree: base}
    run:
        using: run-task
        checkout:
            nss:
                path: nss
        command:
            by-platform:
                win.*: "${VCS_PATH}/nss/automation/taskcluster/windows/run_tests.sh"
                default: "${VCS_PATH}/nss/automation/taskcluster/scripts/run_tests.sh"
    attributes:
        retrigger: true
    worker-type:
        by-platform:
            linux-aarch64.*: t-linux-aarch64
            # Matches x86 linux only; the lookahead keeps it from also matching
            # linux-aarch64 (keyed-by forbids a platform matching two arms).
            linux(?!-aarch64).*: t-linux
            mac.*: b-osx
            win-aarch64.*: t-win-aarch64
            win(?!-aarch64).*: b-win2022

tasks-from:
    - cipher.yml
    - gtest.yml

tasks:
    # Schedule tests that do NOT need certificates. This is defined as
    # the test itself not needing certs AND not running under the upgradedb
    # cycle (which itself needs certs). If cycle is not defined, default is all.
    gtests-tlsfuzz:
        description: Gtests
        from-deps:
            kinds: [build]
            with-attributes:
                tlsfuzz: [true]
        worker:
            env:
                NSS_CYCLES: standard
                NSS_TESTS: ssl_gtests gtests
                TC_PARENT_TASK_ID: {task-reference: "<build>"}
                GTESTFILTER: "*Fuzz*"
            docker-image: {in-tree: fuzz}
        treeherder:
            symbol: Gtest

    bogo:
        description: Bogo tests
        from-deps:
            kinds: [build]
            with-attributes:
                build_platform:
                    - linux-x86
                    - linux-x86-make
                    - linux-x64
                    - linux-x64-make
                    - linux-x64-asan
                    - linux-aarch64
                    - linux-aarch64-asan
                nspr: [false]
                dbm: [false]
                cc: [false]
                modular: [false]
                make-fips: [false]
                fuzz: [false]
                tsan: [false]
        worker:
            docker-image: {in-tree: builds}
            env:
                TC_PARENT_TASK_ID: {task-reference: "<build>"}
                NSS_CYCLES: standard
                NSS_TESTS: bogo
        treeherder:
            symbol: Bogo

    tlsfuzzer:
        description: tlsfuzzer tests
        from-deps:
            kinds:
                - build
            with-attributes:
                build_platform:
                    - linux-x86
                    - linux-x86-make
                    - linux-x64
                    - linux-x64-make
                    - linux-x64-asan
                    - linux-aarch64
                    - linux-aarch64-asan
                nspr: [false]
                dbm: [false]
                cc: [false]
                modular: [false]
                fuzz: [false]
                tsan: [false]
        worker:
            env:
                TC_PARENT_TASK_ID: {task-reference: "<build>"}
                NSS_CYCLES: standard
                NSS_TESTS: tlsfuzzer
        treeherder:
            symbol: tlsfuzzer

    tlsinterop-gnutls:
        description: tlsinterop-gnutls tests
        from-deps:
            kinds:
                - build
            with-attributes:
                build_platform:
                    - linux-x86
                    - linux-x86-make
                    - linux-x64
                    - linux-x64-make
                    - linux-x64-asan
                    - linux-aarch64
                    - linux-aarch64-asan
                nspr: [false]
                dbm: [false]
                cc: [false]
                modular: [false]
                fuzz: [false]
                tsan: [false]
        worker:
            docker-image: {in-tree: tlsinterop}
            env:
                TC_PARENT_TASK_ID: {task-reference: "<build>"}
                NSS_CYCLES: standard
                NSS_TESTS: tlsinterop-gnutls
        treeherder:
            symbol: tlsinterop-gnutls

    tlsinterop-openssl:
        description: tlsinterop-openssl tests
        from-deps:
            kinds:
                - build
            with-attributes:
                build_platform:
                    - linux-x86
                    - linux-x86-make
                    - linux-x64
                    - linux-x64-make
                    - linux-x64-asan
                    - linux-aarch64
                    - linux-aarch64-asan
                nspr: [false]
                dbm: [false]
                cc: [false]
                modular: [false]
                fuzz: [false]
                tsan: [false]
        worker:
            docker-image: {in-tree: tlsinterop}
            env:
                TC_PARENT_TASK_ID: {task-reference: "<build>"}
                NSS_CYCLES: standard
                NSS_TESTS: tlsinterop-openssl
        treeherder:
            symbol: tlsinterop-openssl

    mpi:
        description: MPI tests
        treeherder:
            symbol: MPI
        worker:
            env:
                TC_PARENT_TASK_ID: {task-reference: "<build>"}
                NSS_CYCLES: standard
                NSS_TESTS: mpi
        from-deps:
            kinds: [build]
            with-attributes:
                nspr: [false]
                dbm: [false]
                cc: [false]
                modular: [false]
                fuzz: [false]
                tsan: [false]

    # chains.sh builds its own PKI from scratch and reads nothing from cert.sh.
    chains:
        description: Chains tests
        from-deps:
            kinds: [build]
            with-attributes:
                dbm: [false]
                cc: [false]
                modular: [false]
                make-fips: [false]
                # Only old make builds have -Ddisable_libpkix=0 and can run chain tests.
                make: [true]
        worker:
            env:
                TC_PARENT_TASK_ID: {task-reference: "<build>"}
                NSS_TESTS: chains
            max-run-time:
                by-platform:
                    win.*: 7200
                    default: 3600
        treeherder:
            symbol: Chains

    # ec.sh, lowhash.sh, sdr.sh and policy.sh use no cert.sh output either;
    # sdr.sh creates its own profile DB.
    ec:
        description: EC tests
        from-deps:
            kinds: [build]
            with-attributes:
                nspr: [false]
                dbm: [false]
                cc: [false]
                modular: [false]
                make-fips: [false]
                fuzz: [false]
                tsan: [false]
        treeherder:
            symbol: EC
        worker:
            env:
                TC_PARENT_TASK_ID: {task-reference: "<build>"}
                NSS_TESTS: ec

    lowhash:
        description: Lowhash tests
        from-deps:
            kinds: [build]
            with-attributes:
                nspr: [false]
                dbm: [false]
                cc: [false]
                modular: [false]
                make-fips: [false]
                fuzz: [false]
                tsan: [false]
        treeherder:
            symbol: Lowhash
        worker:
            env:
                TC_PARENT_TASK_ID: {task-reference: "<build>"}
                NSS_TESTS: lowhash

    sdr:
        description: SDR tests
        from-deps:
            kinds: [build]
            with-attributes:
                nspr: [false]
                dbm: [false]
                cc: [false]
                modular: [false]
                make-fips: [false]
                fuzz: [false]
                tsan: [false]
        treeherder:
            symbol: SDR
        worker:
            env:
                TC_PARENT_TASK_ID: {task-reference: "<build>"}
                NSS_TESTS: sdr

    policy:
        description: Policy tests
        from-deps:
            kinds: [build]
            with-attributes:
                nspr: [false]
                dbm: [false]
                cc: [false]
                modular: [false]
                make-fips: [false]
                fuzz: [false]
                tsan: [false]
        treeherder:
            symbol: Policy
        worker:
            env:
                TC_PARENT_TASK_ID: {task-reference: "<build>"}
                NSS_TESTS: policy

    # Tests that do need cert.sh output.
    db:
        description: DB tests
        from-deps:
            kinds: [certs]
            with-attributes:
                dbm: [false]
                make-fips: [false]
                tsan: [false]
        treeherder:
            symbol: DB
        worker:
            env:
                TC_PARENT_TASK_ID: {task-reference: "<certs>"}
                NSS_TESTS: dbtests

    merge:
        description: Merge tests
        from-deps:
            kinds: [certs]
            with-attributes:
                dbm: [false]
                make-fips: [false]
                tsan: [false]
        treeherder:
            symbol: Merge
        worker:
            env:
                TC_PARENT_TASK_ID: {task-reference: "<certs>"}
                NSS_TESTS: merge

    smime:
        description: S/MIME tests
        from-deps:
            kinds: [certs]
            with-attributes:
                dbm: [false]
                make-fips: [false]
                tsan: [false]
        treeherder:
            symbol: SMIME
        worker:
            env:
                TC_PARENT_TASK_ID: {task-reference: "<certs>"}
                NSS_TESTS: smime

    tools:
        description: Tools tests
        from-deps:
            kinds: [certs]
            with-attributes:
                dbm: [false]
                make-fips: [false]
                tsan: [false]
        treeherder:
            symbol: Tools
        worker:
            env:
                TC_PARENT_TASK_ID: {task-reference: "<certs>"}
                NSS_TESTS: tools

    # all.sh only runs fips.sh on builds with neither NSS_FIPS_DISABLED nor
    # NSS_NO_INIT_SUPPORT. Of the builds with certs, that's the gyp
    # --enable-fips build.
    fips:
        description: FIPS tests
        from-deps:
            kinds: [certs]
            with-attributes:
                build_type: [opt-fips]
                dbm: [false]
        treeherder:
            symbol: FIPS
        worker:
            env:
                TC_PARENT_TASK_ID: {task-reference: "<certs>"}
                NSS_TESTS: fips

    # SSL tests, need certificates too.
    ssl-standard:
        description: SSL tests (standard)
        from-deps:
            kinds: [certs]
            with-attributes:
                dbm: [false]
                make-fips: [false]
                tsan: [false]
        treeherder:
            symbol: SSL(standard)
        worker:
            env:
                TC_PARENT_TASK_ID: {task-reference: "<certs>"}
                NSS_TESTS: ssl
                NSS_CYCLES: standard
                NSS_SSL_TESTS: crl iopr policy normal_normal

    ssl-pkix:
        description: SSL tests (pkix)
        from-deps:
            kinds: [certs]
            with-attributes:
                dbm: [false]
                make-fips: [false]
                tsan: [false]
        treeherder:
            symbol: SSL(pkix)
        worker:
            env:
                TC_PARENT_TASK_ID: {task-reference: "<certs>"}
                NSS_TESTS: ssl
                NSS_CYCLES: pkix
                NSS_SSL_TESTS: crl iopr policy normal_normal

    # The SSL tests with one side's token in FIPS mode. Other builds either
    # define NSS_FIPS_DISABLED or have no certs.
    ssl-fips:
        description: SSL tests (FIPS)
        from-deps:
            kinds: [certs]
            with-attributes:
                build_type: [opt-fips]
                dbm: [false]
        treeherder:
            symbol: SSL(fips)
        worker:
            env:
                TC_PARENT_TASK_ID: {task-reference: "<certs>"}
                NSS_TESTS: ssl
                NSS_CYCLES: standard
                NSS_SSL_TESTS: fips_normal normal_fips

    ssl-stress:
        description: SSL tests (stress)
        from-deps:
            kinds: [certs]
            with-attributes:
                dbm: [false]
                make-fips: [false]
                tsan: [true]
        treeherder:
            symbol: SSL(stress)
        worker:
            env:
                TC_PARENT_TASK_ID: {task-reference: "<certs>"}
                NSS_TESTS: ssl
                NSS_CYCLES: sharedb
                NSS_SSL_RUN: stress
                NSS_SSL_TESTS: normal_normal
            max-run-time: 7200
