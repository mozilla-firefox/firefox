# Section 5 of RFC 9935 stipulates that ML-KEM certificates can
# only assert keyEncipherment in the keyUsage extension. This test
# ensures NSS accepts such a certificate for an e-mail recipient (usage 5),
# and rejects one that asserts keyAgreement instead.

scenario MLKEMLeaf

entity Root
  type Root
  ctype mldsa:ML-DSA-65

entity KeyEncipherment
  type EE
  ctype mlkem:ML-KEM-768
  issuer Root
    ku keyEncipherment

entity KeyAgreement
  type EE
  ctype mlkem:ML-KEM-768
  issuer Root
    ku keyAgreement

db All

import Root::,C,

verify KeyEncipherment:Root
  usage 5
  result pass

verify KeyAgreement:Root
  usage 5
  result fail

