<!doctype html>
<html class="reftest-wait">
<head>
<meta charset="utf-8">
<title>Test for painting caret after the last preformatted line break of the preformatted Text</title>
<style>
span[contenteditable] {
  white-space: pre-wrap;
  outline: none;
}
</style>
<script>
"use strict";

addEventListener("load", () => {
  const editingHost = document.querySelector("span[contenteditable]");
  const br = document.querySelector("br");
  const newLinefeed = document.createTextNode("\n");
  editingHost.insertBefore(newLinefeed, br);
  editingHost.focus();
  getSelection().collapse(editingHost, 2);
  document.documentElement.removeAttribute("class");
}, {once: true});
</script>
</head>
<body>
  <span contenteditable>ABC<br></span>
</body>
</html>
