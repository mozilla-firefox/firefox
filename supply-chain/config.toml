
# cargo-vet config file

[cargo-vet]
version = "0.10"

[imports.bytecode-alliance]
url = "https://raw.githubusercontent.com/bytecodealliance/wasmtime/main/supply-chain/audits.toml"

[imports.embark-studios]
url = "https://raw.githubusercontent.com/EmbarkStudios/rust-ecosystem/main/audits.toml"

[imports.google]
url = "https://raw.githubusercontent.com/google/supply-chain/main/audits.toml"

[imports.isrg]
url = "https://raw.githubusercontent.com/divviup/libprio-rs/main/supply-chain/audits.toml"

[imports.mozilla]
url = "https://raw.githubusercontent.com/mozilla/supply-chain/main/audits.toml"

[policy.allocator-api2]
audit-as-crates-io = true
notes = "This is the upstream code with a fix for rust 1.89."

[policy.any_all_workaround]
audit-as-crates-io = true
notes = "This is the upstream code plus the ARM intrinsics workaround from qcms, see bug 1882209."

[policy.authenticator]
audit-as-crates-io = false
notes = "This is a first-party crate which is no longer published through crates.io."

[policy.autocfg]
audit-as-crates-io = true
notes = "This is the upstream code plus a few local fixes, see bug 1685697."

[policy."bindgen:0.72.0@git:5274da5a06411accb266c10819b989ac25a81b7d"]
audit-as-crates-io = true
notes = "This is the upstream code not yet released plus a local fix"

[policy.cose]
audit-as-crates-io = true
notes = "This is upstream plus a warning fix from bug 1823866."

[policy.cssparser]
audit-as-crates-io = true
notes = "Upstream not yet published changes"

[policy.cssparser-macros]
audit-as-crates-io = true
notes = "Upstream not yet published changes"

[policy.encoding_rs]
audit-as-crates-io = true
notes = "This is upstream plus a build fix for bug 2033279."

[policy.firefox-on-glean]
audit-as-crates-io = false
notes = "The crates.io version of this is just a placeholder to allow public crates to depend on firefox-on-glean."

[policy.geckodriver]
audit-as-crates-io = false
criteria = "safe-to-run"
notes = "This is a first-party crate which is also published to crates.io. We certify audits for this crate as part of the documented release process, but that step happens after the version bump lands on central so we don't enforce it here. It's also used only for automation, so its subtree can be safe-to-run."

[policy.gkrust-gtest]
criteria = "safe-to-run"
notes = "Used for testing."

[policy.gkrust-shared]
dependency-criteria = { tokio-reactor = [], tokio-threadpool = [] }
notes = "The dependencies on tokio-reactor and tokio-threadpools are just a hack to pin the version used by audioipc-{client,server}. Suppress vetting on those for the same reasons behind the policy entries."

[policy."gl_generator:0.14.0@git:71c792dbfe0ec5caeb242fc90937e19098386342"]
audit-as-crates-io = true
notes = "This is upstream plus a build fix from rust-windowing/gl-rs#566. Can be removed once PR is merged upstream and gleam is updated to include the fix."

[policy."gleam:0.15.1@git:68ca4e5cc31135b843af07ff213a94b9ddce64cf"]
audit-as-crates-io = true
notes = "This is upstream plus servo/gleam#235. Can be removed once PR is merged upstream."

[policy.glean-sym]
audit-as-crates-io = false
notes = "crates.io release is a placeholder for the moment. glean-sym is consumed via git"

[policy.gluesmith]
criteria = "safe-to-run"
notes = "Used for fuzzing."

[policy.harfbuzz]
audit-as-crates-io = true
notes = "Patched version of upstream to fix Android build"

[policy.harfbuzz-sys]
audit-as-crates-io = true
notes = "Patched version of upstream to remove bundled HarfBuzz"

[policy.harfbuzz-traits]
audit-as-crates-io = true
notes = "Vendored with harfbuzz to avoid duplicates"

[policy.http3server]
criteria = "safe-to-run"
notes = "Used for testing."

[policy.icu_capi]
audit-as-crates-io = true
