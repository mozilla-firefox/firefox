modules:
  - name: firefox-toplevel
    description: The top level directory for the Firefox/Gecko tree. Owned by the
      TLMC
    includes:
      - README.md
    meta:
      owners_emeritus:
        - Ben Bangert
        - Brendan Eich
        - Kate Hudson
    owners:
      - *bholley
      - *overholt
      - *jthomas
      - *mossop
      - *nalexander
      - *nika
    peers: []
    machine_name: _firefoxtoplevel
    submodules:

      - name: Code Review Policy
        description: Submodule governing the code review process, ensuring adherence
          to coding standards and quality requirements.
        owners:
          - *TLMC
        peers: []
        machine_name: code_review_policy

      - name: Performance Regression Policy
        description: Submodule focused on preventing and addressing performance regressions,
          ensuring stable and optimized performance.
        owners:
          - *TLMC
        peers: []
        machine_name: performance_regression_policy

      - name: Security Architecture
        description: Submodule responsible for driving security architecture decisions,
          performing security reviews, and guiding security decisions.
        owners:
          - *decoder
        peers:
          - *dveditz
          - *freddy
          - *tjr
          - *bholley
          - *ckerschb
          - *sfriedberger
        machine_name: security_architecture

  - machine_name: ai_for_development
    name: AI for Development
    description: Integration of AI tools for Firefox development, including AI coding
      assistants.
    includes:
      - .agents/**/*
      - AGENTS.md
      - docs/ai-agent-tools/**/*
      - CLAUDE.md
      - .claude/**/*
      - .codex/**/*
      - .mcp.json
      - https://github.com/mozilla/bugbug
    excludes: []
    owners:
      - *marco
      - *padenot
      - *suhaib
    peers: []
    meta:
      group: ai4dev-reviewers
      components:
        - Developer Infrastructure::AI for Development
      review_group: ai4dev-reviewers
  - machine_name: android_components
    name: Android Components
    description: A collection of independent, reusable Android library components
      to make it easier to build browsers and browser-like applications.
    includes:
      - mobile/android/android-components/**/*
    excludes: []
    owners:
      - *jonalmeida
      - *matttighe
    peers:
      - *kaya
    meta:
      review_group: android-reviewers
  - machine_name: code_coverage
    name: Code Coverage
    description: Tools for code coverage instrumentation, and coverage data parsing
      and management.
    includes:
      - tools/code-coverage/**/*
      - python/mozbuild/mozbuild/codecoverage/**/*
      - testing/mozharness/mozharness/mozilla/testing/codecoverage.py
    excludes: []
    owners:
      - *marco
    peers:
      - *calixte
      - *jmaher
    meta:
      components:
        - 'Testing :: Code Coverage'

  - name: 'Core: Accessibility'
    description: Support for platform accessibility APIs. Accessibility APIs are used
      by 3rd party software like screen readers, screen magnifiers, and voice dictation
      software, which need information about document content and UI controls, as
      well as important events like changes of focus.
    includes:
      - accessible/**/*
    meta:
      owners_emeritus:
        - Aaron Leventhal
        - Alexander Surkov
      peers_emeritus:
        - David Bolter
        - Trevor Saunders
        - Ginn Chen
        - Yan Evan
        - Yura Zenevich
        - *MarcoZ
      group: dev-accessibility
      url: <https://developer.mozilla.org/docs/Web/Accessibility>
      components:
        - Core::Disability Access APIs
      review_group: accessibility-platform-reviewers
    owners:
      - *Jamie
    peers:
      - *eeejay
      - *morgan
      - *nlapre
    machine_name: core_accessibility

  - name: 'Core: Animation'
    description: 'Declarative animations: CSS animations, CSS transitions, Web Animations
      API, and off-main thread animations.'
    includes:
      - dom/animation/**/*
      # TODO "and animation-related and interpolation-related code
      # in layout/style, gfx/layers, servo/components/style and servo/ports/gecko
    meta:
      group: dev-platform
      components:
        - 'Core::DOM: Animation'
        - Core::CSS Transitions and Animations
      peers_emeritus:
        - Matt Woodrow
    owners:
      - *birtles
    peers:
      - *boris
      - *hiro
    machine_name: core_animation

  - name: 'Core: Anti-Tracking'
    description: Tracking detection and content-blocking.
    includes:
      - toolkit/components/antitracking/**/*
      # several files under browser/ and netwerk/url-classifier/ **TODO**
    meta:
      peers_emeritus:
        - Ehsan Akhgari
        - Erica Wright
        - Gary Chen
        - *baku
        - Johann Hofmann
      group: dev-platform
      components:
        - 'Core::Privacy: Anti-Tracking'
      review_group: anti-tracking
    owners:
      - *timhuang
    peers:
      - *bvandersloot
      - *dimi
      - *emz
      - *tjr
      - *manuel
    machine_name: core_antitracking

  - name: 'Core: APZ (Graphics submodule)'
    description: Asynchronous panning and zooming
    includes:
      - gfx/layers/apz/**/*
    meta:
      owners_emeritus:
        - Kartikaya Gupta
      peers_emeritus:
        - Ryan Hunt
      group: dev-platform
      url: <https://wiki.mozilla.org/Platform/GFX/APZ>
      components:
        - Core::Panning and Zooming
    owners:
      - *botond
    peers:
      - *tnikkel
      - *dlrobertson
      - *hiro
      - *mstange
    machine_name: core_apz_graphics_submodule

  - name: 'Core: Build and Release Tools'
    description: Tools related to build and release automation and configuration of
      release builds.
    includes:
      - tools/update-packaging/**/*
      - tools/update-verify/**/*
    meta:
      owners_emeritus:
        - Aki Sasaki
      group: release-engineering
      url: <https://wiki.mozilla.org/ReleaseEngineering>
      components:
        - Release Engineering::*
      review_group: releng-reviewers
    owners:
      - *jcristau
    peers:
      - *hneiva
      - *bhearsum
      - *gabriel
    machine_name: core_build_and_release_tools

  - name: 'Core: Build Config'
    description: The build system for Gecko and several mozilla.org hosted Gecko-based
      applications.
    includes:
      - build/**/*
      - config/**/*
      - python/mozbuild/**/*
      - browser/config/mozconfigs/**/*
    meta:
      owners_emeritus:
        - Chris Manchester
        - Gregory Szorc
        - Ted Mielczarek
        - Benjamin Smedberg
      peers_emeritus:
        - Ted Mielczarek
        - Ralph Giles
        - Gregory Szorc
        - Chris Manchester
        - Mike Shal
        - Nathan Froyd
        - Ricky Stewart
        - David Major
        - Mitchell Hentges
        - *andi
      group: dev-builds
      url: '{doc}`/build/buildsystem/index`'
      components:
        - Core::Build Config
      review_group: firefox-build-system-reviewers
    owners:
      - *glandium
    peers:
      - *ahochheiden
      - *sergesanspaille
    submodules:

      - name: 'Core: Build Config - Fenix'
        description: Submodule of the build config covering Fenix's build system in
          mobile/android.
        meta:
          group: dev-builds
          components:
            - Core::Build Config
          owners_emeritus:
            - *nalexander
        owners:
          - *ahochheiden
        peers:
          - *nalexander
          - *tcampbell
        machine_name: core_build_config_fennec

      - name: 'Core: Build Config - Taskgraph'
        description: Support for task-graph generation in decision, action, and cron
          tasks, including configuration of all tasks including those for CI, nightlies,
          and releases; as well as Docker and VM images used to execute those tasks.
        includes:
          - taskcluster
        meta:
          components:
            - Firefox Build System::Task Configuration
          owners_emeritus:
            - Tom Prince
          peers_emeritus:
            - Dustin Mitchell
            - Aki Sasaki
            - Brian Stack
            - Gregory Szorc
            - Justin Wood
          review_group: taskgraph-reviewers
        owners:
          - *ahal
        peers:
          - *glandium
          - *jcristau
          - *jlorenzo
          - *jmaher
        machine_name: core_build_config_taskgraph
    machine_name: core_build_config

  - name: 'Core: Canvas (Graphics submodule)'
    description: Canvas2D and WebGL implementation
    includes:
      - dom/canvas/**/*
    meta:
      group: dev-platform
      url: <https://wiki.mozilla.org/Platform/GFX/Moz2D>
      components:
        - 'Core::Graphics: Canvas2D'
        - 'Core::Graphics: CanvasWebGL'
      review_group: gfx-reviewers
