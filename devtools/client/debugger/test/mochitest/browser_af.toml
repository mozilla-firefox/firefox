["browser_dbg-asyncstacks.js"]

["browser_dbg-audiocontext.js"]

["browser_dbg-backgroundtask-debugging.js"]
skip-if = [
  "os == 'mac' && os_version == '14.70' && arch == 'x86_64'", # Bug 1937229
  "os == 'mac' && os_version == '15.30' && arch == 'aarch64'", # Bug 1937229, Bug 2028047
]

