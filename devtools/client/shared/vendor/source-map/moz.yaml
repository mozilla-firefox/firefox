schema: 1

bugzilla:
  product: DevTools
  component: "General"

origin:
  name: source-map
  description: library to generate and consume the source map

  url: https://github.com/mozilla/source-map

  release: 8c668f3dd3916e96d06131dec97c78a3e62bd0f3 (2026-10-12T09:32:45Z).
  revision: 8c668f3dd3916e96d06131dec97c78a3e62bd0f3

  license: BSD-3-Clause
  license-file: LICENSE

vendoring:
  url: https://github.com/mozilla/source-map
  source-hosting: github
  tracking: commit

  exclude:
    - "**"

  keep:
    - LICENSE

  include:
    - source-map.js
    - "lib/*.js"
    - "lib/*.mjs"
    - "lib/*.wasm"

  update-actions:
    - action: move-file
      from: '{vendor_dir}/lib/read-wasm-browser.js'
      to: '{vendor_dir}/lib/read-wasm.js'

  patches:
    # Tweak read-wasm in order to support running in both Jest/Node and Firefox
    - read_wasm.patch
