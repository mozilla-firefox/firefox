  "passthrough-sw.js",
  "simple_json.json",
  "simple_json.json^headers^",
  "valid_json.json",
  "valid_json.json^headers^",
  "!/devtools/client/framework/test/head.js",
  "!/devtools/client/shared/test/shared-head.js",
