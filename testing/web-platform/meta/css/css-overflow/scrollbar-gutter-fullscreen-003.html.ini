[scrollbar-gutter-fullscreen-003.html]
  # remote.screenshot.use_readback takes the screenshot from the window, to exercise
  # the code in nsDisplayListBuilder::OutOfFlowDisplayData::ComputeVisibleRectForFrame.
  # Remove it after WPT reftest snapshot uses drawWindow (Bug 2008054).
  #
  # full-screen-api.warning.timeout:0 disables the fullscreen warning, which can
  # appear in the screenshots.
  prefs: [remote.screenshot.use_readback:true, full-screen-api.warning.timeout:0]
