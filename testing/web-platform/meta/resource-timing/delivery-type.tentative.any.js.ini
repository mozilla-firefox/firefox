# The revalidated cases fail because the cached 200 has no Content-Length, so
# the entry is weakly framed and Gecko does not send a conditional request.
# The redirected cases fail in workers because FetchDriver reports timing from
# the pre-redirect channel.
[delivery-type.tentative.any.sharedworker.html]
  [PerformanceResourceTiming deliveryType test, same origin.]
    expected: FAIL

  [PerformanceResourceTiming deliveryType test, cross origin, TAO passes.]
    expected: FAIL

  [PerformanceResourceTiming deliveryType test, cross origin, TAO fails.]
    expected:
      if asan: [PASS, FAIL]

  [PerformanceResourceTiming deliveryType test, cross origin, TAO passes on the final response but fails on the redirect.]
    expected:
      if asan and not fission: [PASS, FAIL]


[delivery-type.tentative.any.serviceworker.html]
  expected:
    if (os == "android") and not debug: [OK, ERROR]
  [PerformanceResourceTiming deliveryType test, same origin.]
    expected: FAIL

  [PerformanceResourceTiming deliveryType test, cross origin, TAO passes.]
    expected: FAIL

  [PerformanceResourceTiming deliveryType test, cross origin, TAO fails.]
    expected:
      if (os == "linux") and debug and not fission: [FAIL, PASS]
      if (os == "linux") and not debug and fission: PASS
      if (os == "win") and not debug: PASS
      if (os == "mac") and not debug: PASS
      [PASS, FAIL]

  [PerformanceResourceTiming deliveryType test, cross origin, TAO passes on the final response but fails on the redirect.]
    expected:
      if asan and not fission: [PASS, FAIL]


[delivery-type.tentative.any.html]
  max-asserts: 2
  [PerformanceResourceTiming deliveryType test, same origin.]
    expected: FAIL

  [PerformanceResourceTiming deliveryType test, cross origin, TAO passes.]
    expected: FAIL


[delivery-type.tentative.any.worker.html]
  expected:
    if os == "mac": [OK, CRASH]
  [PerformanceResourceTiming deliveryType test, same origin.]
    expected: FAIL

  [PerformanceResourceTiming deliveryType test, cross origin, TAO passes.]
    expected: FAIL

  [PerformanceResourceTiming deliveryType test, cross origin, TAO fails.]
    expected:
      if (os == "linux") and asan and fission: [FAIL, PASS]
      if (os == "linux") and asan and not fission: [PASS, FAIL]
      if (os == "linux") and not asan and debug: [PASS, FAIL]
