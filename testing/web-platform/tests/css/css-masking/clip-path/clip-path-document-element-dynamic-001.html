<!DOCTYPE html>
<html class="reftest-wait">
<style>
html {
  background: red;
}
div {
  width: 500px;
  height: 500px;
  background: green;
}
</style>
<link rel="help" href="https://drafts.fxtf.org/compositing/#pagebackdrop">
<link rel="match" href="reference/clip-path-document-element-ref.html">
<meta name="assert" content="Clip-path added to the document element after the
    initial paint applies to the root background. The test passes if there is
    a green 'L' shape without red.">
<div></div>
<script>
onload = () => {
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.documentElement.style.clipPath =
        "polygon(50px 50px, 100px 50px, 100px 100px, 150px 100px, 150px 150px, 50px 150px)";
    document.documentElement.classList.remove("reftest-wait");
  }));
};
</script>
</html>
