<!DOCTYPE html>
<meta charset="utf-8">
<title>Negative end margin is applied again when a line moves below a float</title>
<link rel="help" href="https://drafts.csswg.org/css2/box.html#margin-properties">
<link rel="match" href="negative-margin-inline-007-ref.html">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
.container {
  font: 10px/1 Ahem;
  width: 300px;
}
.float {
  float: left;
  width: 100px;
  height: 20px;
}
.span {
  margin-right: -30px;
}
.box {
  display: inline-block;
  width: 90px;
  height: 10px;
  background: green;
}
</style>
<div class="container">
  <div class="float"></div><span class="span"><span>XXXXXXXXXXXXXXXXXXXXXX</span><span class="box"></span></span>
</div>
