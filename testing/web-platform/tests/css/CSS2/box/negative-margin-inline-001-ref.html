<!DOCTYPE html>
<meta charset="utf-8">
<title>Negative inline margins do not cause wrapped line to overflow</title>
<style>
.outer {
  display: inline-block;
  font: 16px monospace;
  width: 20ch;
  border: 1px solid gray;
  margin: 2em;
}
.inner::before {
  content: "the";
  display: inline-block;
  margin-left: -3ch;
}
</style>
<span class="outer"><span class="inner">&nbsp;quick brown fox jumps over the lazy dog.</span></span>
