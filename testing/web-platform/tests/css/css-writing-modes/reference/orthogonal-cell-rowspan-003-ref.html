<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Writing Modes reference: orthogonal table cell with collapsed borders spanning several rows</title>

<style>
.container {
  display: flex;
  align-items: flex-start;
  gap: 20px;
}

table {
  border-collapse: collapse;
}

td {
  padding: 0;
}

td[rowspan] {
  padding: 5px 10px 15px 20px;
  border-style: solid;
  border-color: transparent;
  border-width: 2px 4px 6px 8px;
}

td.filler {
  width: 20px;
  height: 20px;
}

.bar {
  width: 20px;
  height: 40px;
  background: green;
}

.gap {
  height: 20px;
}
</style>

<p>Test passes if there are six identical green shapes below, each made of two 20x40 bars stacked vertically with a 20px gap between them.</p>

<div class="container">
  <table><tr><td rowspan="2"><div class="bar"></div><div class="gap"></div><div class="bar"></div></td><td class="filler"></td></tr><tr><td class="filler"></td></tr></table>
  <table><tr><td rowspan="2"><div class="bar"></div><div class="gap"></div><div class="bar"></div></td><td class="filler"></td></tr><tr><td class="filler"></td></tr></table>
  <table><tr><td rowspan="2"><div class="bar"></div><div class="gap"></div><div class="bar"></div></td><td class="filler"></td></tr><tr><td class="filler"></td></tr></table>
  <table><tr><td rowspan="2"><div class="bar"></div><div class="gap"></div><div class="bar"></div></td><td class="filler"></td></tr><tr><td class="filler"></td></tr></table>
  <table><tr><td rowspan="2"><div class="bar"></div><div class="gap"></div><div class="bar"></div></td><td class="filler"></td></tr><tr><td class="filler"></td></tr></table>
  <table><tr><td rowspan="3"><div class="bar"></div><div class="gap"></div><div class="bar"></div></td><td class="filler"></td></tr><tr><td class="filler"></td></tr><tr><td class="filler"></td></tr></table>
</div>
