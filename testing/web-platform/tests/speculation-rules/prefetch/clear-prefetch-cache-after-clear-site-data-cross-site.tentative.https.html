<!DOCTYPE html>
<meta name="timeout" content="long">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/common/dispatcher/dispatcher.js"></script>
<script src="/common/get-host-info.sub.js"></script>
<script src="/common/utils.js"></script>
<script src="../resources/utils.js"></script>
<script src="resources/utils.sub.js"></script>
<script>
  setup(() => assertSpeculationRulesIsSupported());

  // Test that a Clear-Site-Data "prefetchCache" response loaded in a
  // cross-site iframe doesn't clear the same origin's top-level prefetches,
  // since the two are in different network partitions.
  promise_test(async t => {
    let agent = await spawnWindow(t, { protocol: 'https' });
    let nextUrl = agent.getExecutorURL({protocol: 'https', page: 2 });
    await agent.forceSinglePrefetch(nextUrl);

    const gotMessage = new Promise(resolve => {
      window.addEventListener('message', e => {
        resolve(e.data);
      }, {
        once: true
      });
    });
    let iframeUrl = location.origin + "/clear-site-data/support/clear-site-data-prefetchCache.py";
    window.open(get_host_info().HTTPS_NOTSAMESITE_ORIGIN +
        "/clear-site-data/support/clear-site-data-cache.py?cache_helper=" +
        self.crypto.randomUUID() + "&response=single_html&iframe=" +
        encodeURIComponent(iframeUrl));
    await gotMessage;

    await agent.navigate(nextUrl);
    assert_prefetched(await agent.getRequestHeaders());
  }, "clear-site-data prefetchCache header in a cross-site iframe should not clear top-level prefetches");
</script>
