<!DOCTYPE html>
<html class=reftest-wait>
<link rel=author href="mailto:jarhar@chromium.org">
<link rel=help href="https://github.com/w3c/csswg-drafts/issues/10909">
<link rel=match href="select-appearance-hover-ref.html">
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<script src="/resources/testdriver-actions.js"></script>
<style>
select, ::picker(select) {
  appearance: base-select;
  /* Use a sans-serif font, to avoid fuzzy-mismatches from serif fonts (when
   * e.g. subpixel-antialiasing fringe extends outwards from a serif and
   * happens to barely overstep the glyph's declared bounds). */
  font-family: sans-serif;
}
</style>

<select>
  <option>option</option>
</select>

<script>
(async () => {
  const select = document.querySelector('select');
  await (new test_driver.Actions()
    .pointerMove(1, 1, {origin: select}))
    .send();
  document.documentElement.classList.remove('reftest-wait');
})();
</script>
