<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script>
"use strict";

addEventListener("load", () => {
  const editingHost = document.querySelector("div[contenteditable]");
  const ul = editingHost.querySelector("ul");
  const li = ul.querySelector("li");
  const iframe = li.querySelector("iframe");

  iframe.contentWindow.addEventListener("unload", () => {
    const a = document.createElement("a");
    a.href = "x";
    editingHost.insertBefore(a, ul);
    a.appendChild(ul);
  }, {once: true});
  editingHost.focus();
  getSelection().collapse(li, 0);
  document.execCommand(
    "insertHTML",
    false,
    `<ol><li style="display:inline"><br></li></ol>`
  );
}, {once: true});
</script>
</head>
<body>
<div contenteditable>text<ul style="display:inline"><li style="display:inline;"><iframe contenteditable="false" srcdoc="inner text"></iframe></li></ul></div>
</body>
</html>
