<!DOCTYPE html>
<html>
<head>
  <title>Test that service worker registrations not cleaned up in mochitests cause failures</title>
  <script src="/tests/SimpleTest/SimpleTest.js"></script>
</head>
<body>
<script>
SimpleTest.waitForExplicitFinish();
SimpleTest.expectRegisteredServiceWorker();
SpecialPowers.pushPrefEnv({"set": [
  ["dom.serviceWorkers.exemptFromPerDomainMax", true],
  ["dom.serviceWorkers.enabled", true],
  ["dom.serviceWorkers.testing.enabled", true]
]}, function() {
  // Registering over an existing registration doesn't count as registering
  // a worker for the harness's end-of-test check.
  navigator.serviceWorker.getRegistration("scope")
    .then(existing => existing?.unregister())
    .then(() => navigator.serviceWorker.register("empty.js", {scope: "scope"}))
    .then(function(registration) {
      ok(registration, "Registration succeeded");
      SimpleTest.finish();
    });
});
</script>
</body>
</html>
