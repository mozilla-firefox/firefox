            welcome: "Measures pageload metrics for the first-install about:welcome page"
            idb-open-many-par: "Measures opening many IndexedDB databases in parallel"
            idb-open-many-seq: "Measures opening many IndexedDB databases in sequence"
            idb-open-few-par: "Measures opening a few IndexedDB databases in parallel"
            idb-open-few-seq: "Measures opening a few IndexedDB databases in sequence"
            addMab1: "Use add API to send many small ArrayBuffers to IndexedDB in one transaction"
            addMabN: "Use add API to send many small ArrayBuffers to IndexedDB independently"
            addMar1: "Use add API to send many small Arrays to IndexedDB in one transaction"
            addMarN: "Use add API to send many small Arrays to IndexedDB independently"
            addMbl1: "Use add API to send many small Blobs to IndexedDB in one transaction"
            addMblN: "Use add API to send many small Blobs to IndexedDB independently"
            addkAB1: "Use add API to send a couple of large ArrayBuffers to IndexedDB in one transaction"
            addkABN: "Use add API to send a couple of large ArrayBuffers to IndexedDB independently"
            addkAR1: "Use add API to send a couple of large JS Arrays to IndexedDB in one transaction"
            addkARN: "Use add API to send a couple of large JS Arrays to IndexedDB independently"
            addkBL1: "Use add API to send a couple of large Blobs to IndexedDB in one transaction"
            addkBLN: "Use add API to send a couple of large Blobs to IndexedDB independently"
            constant-regression: "Generates a constant value that can be changed to induce a regression."
            getkeyrng: "Measures the speed of key-range based reads of IndexedDB"
            idbCurNext: "Measures IDBIndex cursor iteration via continue() over many rows sharing an index value"
            idbCurPKey: "Measures IDBIndex cursor iteration via continuePrimaryKey() over many rows sharing an index value"
            idbCurPrev: "Measures IDBIndex cursor iteration via continue() in the prev direction over many rows sharing an index value"
            dns-multi: "Tests multi-domain DNS lookup and pageload performance via native DNS."
            dns-native: "Tests DNS lookup time via native DNS."
            trr-cira: "Tests DNS lookup time on a CIRA TRR server."
            trr-cloudf: "Tests DNS lookup time on a Cloudflare TRR server."
            trr-comcas: "Tests DNS lookup time on a Comcast TRR server."
            trr-multi: "Tests multi-domain DNS lookup and pageload performance on a Cloudflare TRR server."
            trr-next: "Tests DNS lookup time on a NextDNS TRR server."
            trr-w-cira: "Tests DNS lookup time on a CIRA TRR server, with the TRR connection warmed up."
            trr-w-clou: "Tests DNS lookup time on a Cloudflare TRR server, with the TRR connection warmed up."
            trr-w-comc: "Tests DNS lookup time on a Comcast TRR server, with the TRR connection warmed up."
            trr-w-next: "Tests DNS lookup time on a NextDNS TRR server, with the TRR connection warmed up."
            baseline: "Cross-browser baseline: measures connection time and protocol to an HTTP/3 site (cloudflare.com). Used on Chrome, where the Firefox-only Happy Eyeballs v3 and DoH preferences do not apply."
            he3off-dns: "Measures connection time and protocol to an HTTP/3 site (cloudflare.com) with Happy Eyeballs v3 disabled, using native DNS."
            he3off-doh: "Measures connection time and protocol to an HTTP/3 site (cloudflare.com) with Happy Eyeballs v3 disabled, using DoH (TRR mode 2, CIRA)."
            he3on-dns: "Measures connection time and protocol to an HTTP/3 site (cloudflare.com) with Happy Eyeballs v3 enabled, using native DNS."
            he3on-doh: "Measures connection time and protocol to an HTTP/3 site (cloudflare.com) with Happy Eyeballs v3 enabled, using DoH (TRR mode 2, CIRA)."
            upload: "Measures HTTP/2 file upload throughput with a remote server"
            upload-h3: "Measures HTTP/3 file upload throughput with a remote server"
            h2-upload: "Measures HTTP/2 file upload throughput with a local server"
            h2-download: "Measures HTTP/2 download throughput with a local server"
            h3-upload: "Measures HTTP/3 file upload throughput with a local server"
            h3-download: "Measures HTTP/3 download throughput with a local server"
            throttled: "Pageload test using a throttled network environment"
            sample-python-support: "A sample test that uses a python support file to modify the test command."
            connect: "Verifies that connection time on a pageload is zero when a speculative connection has first been made"
            media-seek: "Measures buffered video seek latency (time from a currentTime seek to the seeked event) with the decoder warm, and also cold on Firefox, where the decoder can be forced to be released on pause."
            prefetch-immediate: "Speculation Rules prefetch test (immediate eagerness): the inline speculationrules script prefetches the target as soon as it is parsed, then the link is clicked so a prefetch-capable browser serves the navigation from the prefetch cache."
            prefetch-eager: "Speculation Rules prefetch test (eager eagerness): the inline speculationrules script prefetches the target on the slightest hover, then the link is clicked so a prefetch-capable browser serves the navigation from the prefetch cache."
            prefetch-moderate: "Speculation Rules prefetch test (moderate eagerness): the inline speculationrules script prefetches the target after ~200 ms of sustained hover, then the link is clicked so a prefetch-capable browser serves the navigation from the prefetch cache."
            prefetch-conservative: "Speculation Rules prefetch test (conservative eagerness): the inline speculationrules script prefetches the target on pointerdown, which is held so the prefetch can complete before release navigates, letting a prefetch-capable browser serve the navigation from the prefetch cache."
            prefetch-list-immediate: "Speculation Rules prefetch test using a list-source rule (immediate eagerness): the inline speculationrules script lists the target URLs explicitly, so a prefetch-capable browser prefetches them as soon as the rules are parsed, then the link is clicked to serve the navigation from the prefetch cache."
            prefetch-list-eager: "Speculation Rules prefetch test using a list-source rule (eager eagerness): the inline speculationrules script lists the target URLs explicitly; matching links are present so the prefetch can be triggered on the slightest hover (list-rule eagerness is browser-defined), then the link is clicked to serve the navigation from the prefetch cache."
            prefetch-list-moderate: "Speculation Rules prefetch test using a list-source rule (moderate eagerness): the inline speculationrules script lists the target URLs explicitly; matching links are present so the prefetch can be triggered after ~200 ms of sustained hover (list-rule eagerness is browser-defined), then the link is clicked to serve the navigation from the prefetch cache."
            prefetch-list-conservative: "Speculation Rules prefetch test using a list-source rule (conservative eagerness): the inline speculationrules script lists the target URLs explicitly; matching links are present so the prefetch can be triggered on pointerdown, which is held so the prefetch can complete before release navigates (list-rule eagerness is browser-defined)."
            tp6-bench: >
                A pageload benchmark test that quickly runs through a selection of the
                pages available to produce a single overall metric for fcp, lcp, and
                loadtime. The metrics from all pages get summarized with the geomean, and mean.
            vpl-av1: "Measures AV1 1080p video playback latency."
            vpl-h264: "Measures H264 1080p video playback latency."
            vpl-vp9: "Measures VP9 1080p video playback latency."
            ve-av1-rt: "Measures AV1 encoding performance for 1080p video in real-time mode."
            ve-av1-q: "Measures AV1 encoding performance for 1080p video in quality mode."
            ve-h264-rt: "Measures H264-baseline encoding performance for 1080p video in real-time mode using Annex B format."
            ve-h264-rt-sd: "Measures H264-baseline encoding performance for 480p video in real-time mode using Annex B format."
            ve-h264-q: "Measures H264-baseline encoding performance for 1080p video in quality mode using AVC format."
            ve-h264-q-sd: "Measures H264-baseline encoding performance for 480p video in quality mode using AVC format."
            ve-vp8-rt: "Measures VP8 encoding performance for 1080p video in real-time mode."
            ve-vp8-q: "Measures VP8 encoding performance for 1080p video in quality mode."
            ve-vp9-rt: "Measures VP9 encoding performance for 1080p video in real-time mode."
            ve-vp9-q: "Measures VP9 encoding performance for 1080p video in quality mode."
            ve-av1-rt-i420: "Measures AV1 encoding performance for 1080p I420 input in real-time mode."
            ve-av1-q-i420: "Measures AV1 encoding performance for 1080p I420 input in quality mode."
            ve-h264-rt-i420: "Measures H264-baseline encoding performance for 1080p I420 input in real-time mode using Annex B format."
            ve-h264-q-i420: "Measures H264-baseline encoding performance for 1080p I420 input in quality mode using AVC format."
            ve-vp8-rt-i420: "Measures VP8 encoding performance for 1080p I420 input in real-time mode."
            ve-vp8-q-i420: "Measures VP8 encoding performance for 1080p I420 input in quality mode."
            ve-vp9-rt-i420: "Measures VP9 encoding performance for 1080p I420 input in real-time mode."
            ve-vp9-q-i420: "Measures VP9 encoding performance for 1080p I420 input in quality mode."
            ve-av1-rt-cam: "Measures AV1 encoding performance for 1080p camera input in real-time mode."
            ve-av1-q-cam: "Measures AV1 encoding performance for 1080p camera input in quality mode."
            ve-h264-rt-cam: "Measures H264-baseline encoding performance for 1080p camera input in real-time mode using Annex B format."
            ve-h264-q-cam: "Measures H264-baseline encoding performance for 1080p camera input in quality mode using AVC format."
            ve-h264-rt-sd-cam: "Measures H264-baseline encoding performance for 480p camera input in real-time mode using Annex B format."
            ve-h264-q-sd-cam: "Measures H264-baseline encoding performance for 480p camera input in quality mode using AVC format."
            ve-vp8-rt-cam: "Measures VP8 encoding performance for 1080p camera input in real-time mode."
