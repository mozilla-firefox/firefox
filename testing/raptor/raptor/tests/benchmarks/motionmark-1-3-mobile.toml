[DEFAULT]
alert_threshold = 2.0
apps = "fenix, geckoview, chrome-m, cstm-car-m"
gecko_profile_interval = 1
gecko_profile_features = "stackwalk,js,java,processcpu,memory"
gecko_profile_threads = "GeckoMain,Compositor,Renderer,SwComposite,RenderBackend,SceneBuilder,WrWorker,TextureUpdate"
expose_browser_profiler = true
lower_is_better = false
subtest_lower_is_better = false
page_cycles = 1
page_timeout = 600000
support_class = "motionmark-1-3.py"
test_script = "motionmark-1-3.js"
owner = "Graphics Team"
type = "benchmark"
unit = "score"
subtest_unit = "score"
fetch_path = "motionmark"
repository = "https://github.com/webkit/motionmark"
# Keep this revision in sync with the fetch used in benchmarks.yml by updating:
# taskcluster/kinds/fetch/benchmarks.yml
repository_revision = "be2a5fea89b6ef411b053ebeb95a6302b3dc0ecb"
test_url="http://<host>:<port>/MotionMark/developer.html?warmup-length=2000&warmup-frame-count=30&first-frame-minimum-length=0&test-interval=30&display=minimal&tiles=big&controller=ramp&system-frame-rate=60&frame-rate=60&time-measurement=performance"
cold = true
browser_cycles = 1
host_from_parent = false

[motionmark-1-3]
suite_name = "MotionMark"

[motionmark-htmlsuite-1-3]
suite_name = "HTML suite"
