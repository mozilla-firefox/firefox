[DEFAULT]
alert_threshold = 2.0
apps = "firefox, chrome, safari, safari-tp, custom-car"
gather_cpuTime = true
gecko_profile_interval = 1
gecko_profile_features = "stackwalk,js,processcpu,nomarkerstacks"
gecko_profile_threads = "GeckoMain,Compositor,Renderer,TaskController,StyleThread"
expose_browser_profiler = true
lower_is_better = false
owner = "SpiderMonkey Team"
page_cycles = 5
page_timeout = 600000
subtest_lower_is_better = true
subtest_unit = "ms"
test_url = "http://<host>:<port>/Speedometer/index.html?raptor"
type = "benchmark"
unit = "score"

[speedometer2]

[speedometer3]
alert_threshold = 0.5
subtest_alert_threshold = 2.0
browser_cycles = 5
owner = "Performance Team"
cold = true
host_from_parent = false
benchmark_port = 62763
support_class = "speedometer3.py"
test_script = "speedometer3.js"
test_url = "http://<host>:<port>/Speedometer3/index.html?raptor"

[speedometer-experimental]
browser_cycles = 5
owner = "Performance Team"
cold = true
host_from_parent = true
benchmark_port = 62764
support_class = "speedometer3.py"
test_script = "speedometer3.js"
test_url = "http://<host>:<port>/index.html?raptor&tags=sp4"
fetch_path = "Speedometer"
repository = "https://github.com/mozilla/Speedometer"
# Keep this revision in sync with the fetch used in benchmarks.yml by updating:
# taskcluster/kinds/fetch/benchmarks.yml
repository_revision = "0599c30930cba09c3203948008564bfb0a05a2bd"
# Media-Streaming starts muted playback from a synthetic click without user
# activation. Raptor's default Firefox autoplay policy rejects play(), which
# leaves the workload waiting indefinitely. Chromium permits muted autoplay.
preferences = [
  "media.autoplay.default=0",
  "media.autoplay.blocking_policy=0",
  "media.allowed-to-play.enabled=true",
  "media.block-autoplay-until-in-foreground=false",
]
