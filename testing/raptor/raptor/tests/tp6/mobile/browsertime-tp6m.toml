[DEFAULT]
alert_on = "fcp, loadtime, ContentfulSpeedIndex, PerceptualSpeedIndex, SpeedIndex, FirstVisualChange, LastVisualChange, largestContentfulPaint"
alert_threshold = 2.0
apps = "geckoview, fenix, refbrow"
browser_cycles = 15
lower_is_better = true
owner = "PerfTest Team"
page_cycles = 25
page_timeout = 60000
playback = "mitmproxy-android"
playback_pageset_manifest = "mitm6-android-fenix-{subtest}.manifest"
playback_version = "8.1.1"
type = "pageload"
unit = "ms"
use_live_sites = false
# TODO: Determine tests that should be included on mobile tp6-bench
benchmark_page = true
support_class = "browsertime_pageload.py"

