---
loader: taskgraph.loader.transform:loader

kind-dependencies:
    - build
    - toolchain

transforms:
    - gecko_taskgraph.transforms.build:transforms
    - gecko_taskgraph.transforms.build_attrs:transforms
    - gecko_taskgraph.transforms.build_schedules:transforms
    - gecko_taskgraph.transforms.build_lints:transforms
    - gecko_taskgraph.transforms.mozconfig:transforms
    - gecko_taskgraph.transforms.job:transforms
    - gecko_taskgraph.transforms.artifact:transforms
    - gecko_taskgraph.transforms.task:transforms

task-defaults:
    attributes:
        artifact_map: taskcluster/gecko_taskgraph/manifests/fennec_geckoview.yml
    index:
        product: mobile
    worker-type: b-linux-docker-amd
    use-python: default
    # Online in order to download the per-architecture AARs.
    use-gradle: online
    worker:
        docker-image: {in-tree: android-build}
        max-run-time: 7200
        env:
            TOOLTOOL_MANIFEST: "mobile/android/config/tooltool-manifests/android/releng.manifest"
            MOZ_ANDROID_FAT_AAR_ARCHITECTURES: "armeabi-v7a,arm64-v8a,x86_64"
            MACH_BUILD_PYTHON_NATIVE_PACKAGE_SOURCE: system
            MOZ_ANDROID_FAT_AAR_ARMEABI_V7A: "/builds/worker/fetches/armeabi-v7a/target.maven.zip"
            MOZ_ANDROID_FAT_AAR_ARM64_V8A: "/builds/worker/fetches/arm64-v8a/target.maven.zip"
            MOZ_ANDROID_FAT_AAR_X86_64: "/builds/worker/fetches/x86_64/target.maven.zip"
        artifacts:
            - name: public/build/maven
              path: /builds/worker/workspace/obj-build/gradle/maven/
              type: directory
            - name: public/build/target.maven.zip
              path: /builds/worker/workspace/obj-build/gradle/target.maven.zip
              type: file
            - name: public/build
              path: /builds/worker/artifacts/
              type: directory
            - name: public/build/geckoview-androidTest.apk
              path: /builds/worker/workspace/obj-build/gradle/build/mobile/android/geckoview/outputs/apk/androidTest/debug/geckoview-debug-androidTest.apk
              type: file
            - name: public/build/geckoview-test_runner.apk
              path: /builds/worker/workspace/obj-build/gradle/build/mobile/android/test_runner/outputs/apk/debug/test_runner-debug.apk
              type: file
            - name: public/build/geckoview-test_runner.aab
              path: /builds/worker/workspace/obj-build/gradle/build/mobile/android/test_runner/outputs/bundle/debug/test_runner-debug.aab
              type: file
            - name: public/build/geckoview_example.apk
              path: /builds/worker/workspace/obj-build/gradle/build/mobile/android/geckoview_example/outputs/apk/debug/geckoview_example-debug.apk
              type: file
            - name: public/build/geckoview_example.aab
              path: /builds/worker/workspace/obj-build/gradle/build/mobile/android/geckoview_example/outputs/bundle/debug/geckoview_example-debug.aab
              type: file
            - name: public/build/mozconfig
              path: /builds/worker/workspace/obj-build/.mozconfig
              type: file
            - name: public/reports
              path: /builds/worker/workspace/obj-build/gradle/build/reports
              type: directory
    mozconfig:
        variant:
            by-release-type:
                beta: beta-fat-aar
                release: release-fat-aar
                esr.*: release-fat-aar
                default: nightly-fat-aar
        platform: android-arm
    run:
        using: mozharness
        script: "mozharness/scripts/fx_desktop_build.py"
        secrets: true
        tooltool-downloads: internal
        # Note: These settings are only honored by nightly (i.e. shipping) builds
        update-channel:
            by-release-type:
                nightly:
                    by-project:
                        try: nightly-try
                        default: nightly
                nightly-larch: nightly-larch
                nightly-oak: nightly-oak
                nightly-pine: nightly-pine
                nightly-cypress: nightly-cypress
                beta:
                    by-shipping-product:
                        devedition: aurora
                        default: beta
                release: release
                esr.*: esr
                default: null
    fetches:
        toolchain:
            - android-ndk-linux
            - android-sdk-linux
            - linux64-embedded-uniffi-bindgen
            - linux64-nimbus-fml
            - linux64-clang
            - linux64-jdk
            - linux64-rust-android
            - linux64-rust-size
            - linux64-cbindgen
            - linux64-dump_syms
            - linux64-nasm
            - linux64-node
            - sysroot-x86_64-linux-gnu
            - sysroot-wasm32-wasi
            - terser
        armeabi-v7a:
            - artifact: target.maven.zip
              dest: armeabi-v7a
              extract: false
        arm64-v8a:
            - artifact: target.maven.zip
              dest: arm64-v8a
              extract: false
        x86_64:
            - artifact: target.maven.zip
              dest: x86_64
              extract: false

tasks:
    android-geckoview-fat-aar-shippable/opt:
        description: "Android GeckoView multi-architecture fat AAR Shippable"
        attributes:
            shippable: true
            enable-full-crashsymbols: true
            disable-push-apk: true
            maven_packages:
                - geckoview
        shipping-phase: build
        shipping-product: firefox-android
        index:
            job-name: android-geckoview-fat-aar-opt
            type: shippable-with-multi-l10n
        treeherder:
            platform: android-5-0-geckoview-fat-aar-shippable/opt
            symbol: B
        dependencies:
            x86_64: build-android-x86_64-shippable/opt
            armeabi-v7a: build-android-arm-shippable/opt
            arm64-v8a: build-android-aarch64-shippable/opt
        worker-type: b-linux-docker-xlarge-amd
        worker:
            env:
                PERFHERDER_EXTRA_OPTIONS: android-geckoview-fat-aar-nightly
                MOZ_ARTIFACT_TASK: {task-reference: '<armeabi-v7a>'}
        run:
            actions: [get-secrets, build, multi-l10n]
            config:
                - builds/releng_base_android_64_builds.py
                - taskcluster_nightly.py
            custom-build-variant-cfg: arm
        fetches:
            toolchain:
                - android-gradle-dependencies
        optimization:
            skip-unless-backstop: null

    android-geckoview-fat-aar-shippable-lite/opt:
        description: "Android GeckoView Lite multi-architecture fat AAR Shippable"
        attributes:
            shippable: true
            enable-full-crashsymbols: true
            disable-push-apk: true
            maven_packages:
                - geckoview
        shipping-phase: build
        shipping-product: firefox-android
        index:
            job-name: android-geckoview-fat-aar-opt-lite
            type: shippable-with-multi-l10n
        treeherder:
            platform: android-5-0-geckoview-fat-aar-shippable/opt
            symbol: Bl
        dependencies:
            x86_64: build-android-x86_64-shippable-lite/opt
            armeabi-v7a: build-android-arm-shippable-lite/opt
            arm64-v8a: build-android-aarch64-shippable-lite/opt
        worker-type: b-linux-docker-xlarge-amd
        worker:
            env:
                PERFHERDER_EXTRA_OPTIONS: android-geckoview-fat-aar-nightly-lite
                MOZ_ARTIFACT_TASK: {task-reference: '<armeabi-v7a>'}
        mozconfig:
            platform: android-arm-lite
        run:
            actions: [get-secrets, build, multi-l10n]
            config:
                - builds/releng_base_android_64_builds.py
                - taskcluster_nightly.py
            custom-build-variant-cfg: arm-lite
        fetches:
            toolchain:
                - android-gradle-dependencies
        optimization:
            skip-unless-backstop: null

    android-geckoview-fat-aar-nightlyasrelease/opt:
        description: "Android GeckoView multi-architecture fat AAR Nightly-As-Release"
        # shippable:true makes build-apk set MOZ_UPDATE_CHANNEL to
        # nightly-{project}. This matches the geckoview-nightly-{project}-omni
        # maven artifact that this task makes. Without it, the Fenix build
        # looks for geckoview-default-omni and fails.
        # This currently only makes GeckoView for the APK that performance
        # tests will use.
        attributes:
            shippable: true
            enable-full-crashsymbols: true
            disable-push-apk: true
            maven_packages:
                - geckoview
        index:
            job-name: android-geckoview-fat-aar-nightlyasrelease-opt
        treeherder:
            platform: android-5-0-geckoview-fat-aar-nightlyasrelease/opt
            symbol: Bnar
        run-on-projects: []
        dependencies:
            x86_64: build-android-x86_64-nightlyasrelease/opt
            armeabi-v7a: build-android-arm-nightlyasrelease/opt
            arm64-v8a: build-android-aarch64-nightlyasrelease/opt
        worker-type: b-linux-docker-xlarge-amd
        worker:
            env:
                PERFHERDER_EXTRA_OPTIONS: android-geckoview-fat-aar-nightlyasrelease
                MOZ_ARTIFACT_TASK: {task-reference: '<armeabi-v7a>'}
        mozconfig:
            platform: android-arm
            variant: nightly-fat-aar-as-release
        run:
            actions: [get-secrets, build]
            config:
                - builds/releng_base_android_64_builds.py
                - taskcluster_nightly.py
            custom-build-variant-cfg: arm
        fetches:
            toolchain:
                - android-gradle-dependencies

    android-geckoview-fat-aar/opt:
        description: "Android GeckoView multi-architecture fat AAR Opt"
        attributes:
            maven_packages:
                - geckoview
        index:
            job-name: android-geckoview-fat-aar-opt
        treeherder:
            platform: android-5-0-geckoview-fat-aar/opt
            symbol: B
        dependencies:
            x86_64: build-android-x86_64/opt
            armeabi-v7a: build-android-arm/opt
            arm64-v8a: build-android-aarch64/opt
        worker:
            env:
                PERFHERDER_EXTRA_OPTIONS: android-geckoview-fat-aar-opt
                USE_ARTIFACT: '1'
                MOZ_ARTIFACT_TASK: {task-reference: '<armeabi-v7a>'}
        run:
            actions: [get-secrets, build]
            config: ["builds/releng_base_android_64_builds.py"]
            custom-build-variant-cfg: arm
        fetches:
            toolchain:
                - linux64-sccache
                - android-gradle-dependencies

    android-geckoview-fat-aar-appservices/opt:
        description: "Android GeckoView multi-architecture fat AAR Opt with an in-tree app-services"
        attributes:
            maven_packages:
                - geckoview
        index:
            job-name: android-geckoview-fat-aar-appservices-opt
        treeherder:
            platform: android-5-0-geckoview-fat-aar/opt
            symbol: B-as
            tier: 3
        run-on-projects: []
        dependencies:
            x86_64: build-android-x86_64-appservices/opt
            armeabi-v7a: build-android-arm-appservices/opt
            arm64-v8a: build-android-aarch64-appservices/opt
            linux-x86-64: build-linux64-appservices/opt
            darwin-x86-64: build-macosx64-appservices/opt
            win32-x86-64: build-win64-appservices/opt
        worker:
            env:
                PERFHERDER_EXTRA_OPTIONS: android-geckoview-fat-aar-appservices
                USE_ARTIFACT: '1'
                MOZ_ARTIFACT_TASK: {task-reference: '<armeabi-v7a>'}
                MOZ_APPSERVICES_IN_TREE: "1"
                MOZ_ANDROID_FAT_AAR_DESKTOP_ARCHITECTURES: "linux-x86-64,darwin-x86-64,win32-x86-64"
                MOZ_ANDROID_FAT_AAR_DESKTOP_LINUX_X86_64: "/builds/worker/fetches/linux-x86-64/target.libmegazord_so_artifacts.zip"
                MOZ_ANDROID_FAT_AAR_DESKTOP_DARWIN_X86_64: "/builds/worker/fetches/darwin-x86-64/target.libmegazord_so_artifacts.zip"
                MOZ_ANDROID_FAT_AAR_DESKTOP_WIN32_X86_64: "/builds/worker/fetches/win32-x86-64/target.libmegazord_so_artifacts.zip"
        run:
            actions: [get-secrets, build]
            config: ["builds/releng_base_android_64_builds.py"]
            custom-build-variant-cfg: arm
        fetches:
            toolchain:
                - linux64-sccache
                - android-gradle-dependencies-appservices
            linux-x86-64:
                - artifact: target.libmegazord_so_artifacts.zip
                  dest: linux-x86-64
                  extract: false
            darwin-x86-64:
                - artifact: target.libmegazord_so_artifacts.zip
                  dest: darwin-x86-64
                  extract: false
            win32-x86-64:
                - artifact: target.libmegazord_so_artifacts.zip
                  dest: win32-x86-64
                  extract: false
