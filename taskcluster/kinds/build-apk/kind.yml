---
loader: taskgraph.loader.transform:loader

transforms:
    - android_taskgraph.transforms.build_android_app:transforms
    - gecko_taskgraph.transforms.build_schedules:transforms
    - gecko_taskgraph.transforms.job:transforms
    - gecko_taskgraph.transforms.task:transforms

kind-dependencies:
    - toolchain
    - build-fat-aar
    - generate-baseline-profile-firebase

task-defaults:
    run-on-repo-type: [hg]
    apk-artifact-template:
        type: file
        name: 'public/build/target.{abi}.apk'
        path: '/builds/worker/workspace/obj-build/gradle/build/mobile/android/{source_project_name}/app/outputs/apk/{apk_path}/{fileName}'
    attributes:
        build_platform: android

tasks:
    focus-debug:
        dependencies:
            build-fat-aar: build-fat-aar-android-geckoview-fat-aar/opt
        description: 'Focus debug build from source code'
        run:
            clone-with: hg
            gradle-build-type: debug
            gradle-build-name: focusDebug
            gradle-build: focus
            track-build-times: true
        source-project-name: "focus-android"
        treeherder:
            symbol: focus-debug(Bf)
            platform: focus-android-all/opt

    klar-debug:
        dependencies:
            build-fat-aar: build-fat-aar-android-geckoview-fat-aar/opt
        description: 'Klar debug build from source code'
        run:
            clone-with: hg
            gradle-build-type: debug
            gradle-build-name: klarDebug
            gradle-build: klar
        source-project-name: "focus-android"
        treeherder:
            symbol: focus-debug(Bkl)
            platform: focus-android-all/opt

    fenix-debug:
        dependencies:
            build-fat-aar: build-fat-aar-android-geckoview-fat-aar/opt
        description: 'Fenix debug build from source code'
        run:
            clone-with: hg
            gradle-build-type: debug
            gradle-build-name: debug
            gradle-build: fenix
            gradle-extra-options:
                - -PdisableLeakCanary
            track-apk-size: true
            track-build-times: true
        source-project-name: "fenix"
        treeherder:
            symbol: fenix-debug(Bf)
            platform: fenix-android-all/opt
        worker:
            artifacts:
                - path: /builds/worker/perfherder-data-apk-size.json
                  name: public/build/perfherder-data-apk-size.json
                  type: file
            env:
                MOZ_PERFHERDER_UPLOAD: /builds/worker/perfherder-data-apk-size.json

    focus-release:
        description: 'Release Focus build'
        attributes:
            release-type: release
        shipping-product: firefox-android
        dependencies:
            build-fat-aar: build-fat-aar-android-geckoview-fat-aar-shippable/opt
        include-shippable-secrets: true
        include-release-version: true
        run:
            clone-with: hg
            gradle-build-type: release
            gradle-build-name: focusRelease
            gradle-build: focus
            track-build-times: true
        run-on-projects: []
        shipping-phase: promote
        source-project-name: "focus-android"
        treeherder:
            symbol: focus-release(Bf)
            platform: focus-android-all/opt

    klar-release:
        description: 'Release Klar build'
        attributes:
            release-type: release
        shipping-product: firefox-android
        dependencies:
            build-fat-aar: build-fat-aar-android-geckoview-fat-aar-shippable/opt
        include-shippable-secrets: true
        include-release-version: true
        run:
            clone-with: hg
            gradle-build-type: release
            gradle-build-name: klarRelease
            gradle-build: klar
        run-on-projects: []
        shipping-phase: promote
        source-project-name: "focus-android"
        treeherder:
            symbol: focus-release(Bkl)
            platform: focus-android-all/opt

    fenix-release:
        description: 'Release Fenix build'
        attributes:
            release-type: release
        shipping-product: firefox-android
        dependencies:
            build-fat-aar: build-fat-aar-android-geckoview-fat-aar-shippable/opt
            baseline-profile: generate-baseline-profile-firebase-fenix
        fetches:
            baseline-profile:
                - artifact: baselineProfile.tar.zst
                  dest: baselineProfiles
        include-shippable-secrets: true
        include-release-version: true
        run:
            clone-with: hg
            gradle-build-type: release
            gradle-build-name: release
            gradle-build: fenix
            track-apk-size: true
            track-build-times: true
            baseline-profile-path: /builds/worker/fetches/baselineProfiles
        run-on-projects: []
        shipping-phase: promote
        source-project-name: "fenix"
        treeherder:
            symbol: fenix-release(Bf)
            platform: fenix-android-all/opt
        worker:
            artifacts:
                - path: /builds/worker/perfherder-data-apk-size.json
                  name: public/build/perfherder-data-apk-size.json
                  type: file
            env:
                MOZ_PERFHERDER_UPLOAD: /builds/worker/perfherder-data-apk-size.json

    focus-nightly:
        description: 'Nightly focus build'
        dependencies:
            build-fat-aar: build-fat-aar-android-geckoview-fat-aar-shippable/opt
        include-shippable-secrets: true
        include-nightly-version: true
        run:
            clone-with: hg
            gradle-build-type: nightly
            gradle-build-name: focusNightly
            gradle-build: focus
            track-build-times: true
        run-on-projects: []
        source-project-name: "focus-android"
        treeherder:
            symbol: focus-nightly(B)
            platform: focus-android-all/opt

    fenix-nightly:
        description: 'Nightly fenix build'
        dependencies:
            build-fat-aar: build-fat-aar-android-geckoview-fat-aar-shippable/opt
            baseline-profile: generate-baseline-profile-firebase-fenix
        fetches:
            baseline-profile:
                - artifact: baselineProfile.tar.zst
                  dest: baselineProfiles
        include-shippable-secrets: true
        include-nightly-version: true
        source-project-name: "fenix"
        run:
            clone-with: hg
            gradle-build-type: nightly
            gradle-build-name: nightly
            gradle-build: fenix
            track-apk-size: true
            track-build-times: true
            baseline-profile-path: /builds/worker/fetches/baselineProfiles
        run-on-projects: []
        treeherder:
            symbol: fenix-nightly(B)
            platform: fenix-android-all/opt
        worker:
            artifacts:
                - path: /builds/worker/perfherder-data-apk-size.json
                  name: public/build/perfherder-data-apk-size.json
                  type: file
            env:
                MOZ_PERFHERDER_UPLOAD: /builds/worker/perfherder-data-apk-size.json

    fenix-nightly-nobp:
        description: 'Nightly Fenix build without a baseline profile'
        dependencies:
            build-fat-aar: build-fat-aar-android-geckoview-fat-aar/opt
        include-nightly-version: true
        source-project-name: "fenix"
        run:
            gradle-build-type: nightly
            gradle-build-name: nightly
            gradle-build: fenix
            track-apk-size: true
            track-build-times: true
        run-on-projects: []
        treeherder:
            symbol: fenix-nightly-nobp(B)
            platform: fenix-android-all/opt
        worker:
            artifacts:
                - path: /builds/worker/perfherder-data-apk-size.json
                  name: public/build/perfherder-data-apk-size.json
                  type: file
            env:
                MOZ_PERFHERDER_UPLOAD: /builds/worker/perfherder-data-apk-size.json

    focus-beta:
        description: 'Beta focus build'
        attributes:
            release-type: beta
        shipping-product: firefox-android
        dependencies:
            build-fat-aar: build-fat-aar-android-geckoview-fat-aar-shippable/opt
        include-shippable-secrets: true
        include-release-version: true
        run:
            clone-with: hg
            gradle-build-type: beta
            gradle-build-name: focusBeta
            gradle-build: focus
            track-build-times: true
        run-on-projects: []
        shipping-phase: promote
        source-project-name: "focus-android"
        treeherder:
            symbol: focus-beta(B)
            platform: focus-android-all/opt

    fenix-beta:
        description: 'Beta fenix build'
        attributes:
            release-type: beta
        shipping-product: firefox-android
        dependencies:
            build-fat-aar: build-fat-aar-android-geckoview-fat-aar-shippable/opt
            baseline-profile: generate-baseline-profile-firebase-fenix
        fetches:
            baseline-profile:
                - artifact: baselineProfile.tar.zst
                  dest: baselineProfiles
        include-shippable-secrets: true
        include-release-version: true
        run:
            clone-with: hg
            gradle-build-type: beta
            gradle-build-name: beta
            gradle-build: fenix
            track-apk-size: true
            track-build-times: true
            baseline-profile-path: /builds/worker/fetches/baselineProfiles
        run-on-projects: []
        shipping-phase: promote
        source-project-name: "fenix"
        treeherder:
            symbol: fenix-beta(B)
            platform: fenix-android-all/opt
        worker:
            artifacts:
                - path: /builds/worker/perfherder-data-apk-size.json
                  name: public/build/perfherder-data-apk-size.json
                  type: file
            env:
                MOZ_PERFHERDER_UPLOAD: /builds/worker/perfherder-data-apk-size.json

    focus-nightly-firebase:
        description: 'Focus Nightly build for UI tests'
        dependencies:
            build-fat-aar: build-fat-aar-android-geckoview-fat-aar/opt
        disable-optimization: true
        run:
            clone-with: hg
            gradle-build-type: nightly
            gradle-build-name: focusNightly
            gradle-build: focus
            test-build-type: nightly
        run-on-projects: [trunk]
        source-project-name: "focus-android"
        treeherder:
            symbol: focus-nightly(Bf)
            platform: focus-android-all/opt

    fenix-nightly-firebase:
        description: 'Fenix Nightly build for UI tests'
        dependencies:
            build-fat-aar: build-fat-aar-android-geckoview-fat-aar/opt
        run:
            clone-with: hg
            gradle-build-type: nightly
            gradle-build-name: nightly
            gradle-build: fenix
            test-build-type: nightly
        run-on-projects: [trunk]
        source-project-name: "fenix"
        treeherder:
            symbol: fenix-nightly(Bf)
            platform: fenix-android-all/opt

    focus-beta-firebase:
        description: 'Focus Beta build for UI tests'
        dependencies:
            build-fat-aar: build-fat-aar-android-geckoview-fat-aar-shippable/opt
        disable-optimization: true
        run:
            clone-with: hg
            gradle-build-type: beta
            gradle-build-name: focusBeta
            gradle-build: focus
            test-build-type: beta
        run-on-projects: ['release']
        source-project-name: "focus-android"
        treeherder:
            symbol: focus-beta(Bf)
            platform: focus-android-all/opt

    fenix-beta-firebase:
        description: 'Fenix Beta build for UI tests'
        dependencies:
            build-fat-aar: build-fat-aar-android-geckoview-fat-aar-shippable/opt
        disable-optimization: true
        run:
            clone-with: hg
            gradle-build-type: beta
            gradle-build-name: beta
            gradle-build: fenix
            test-build-type: beta
        run-on-projects: ['release']
        source-project-name: "fenix"
        treeherder:
            symbol: fenix-beta(Bf)
            platform: fenix-android-all/opt

    focus-android-test-debug:
        description: 'Focus Android Test for debugging'
        dependencies:
            build-fat-aar: build-fat-aar-android-geckoview-fat-aar/opt
        run:
            clone-with: hg
            gradle-build-type: androidTest
            gradle-build-name: androidTest
            gradle-build: focus
        source-project-name: "focus-android"
        apk-artifact-template:
            # this path is determined by the gradle build configs
            path: '/builds/worker/workspace/obj-build/gradle/build/mobile/android/focus-android/app/outputs/apk/androidTest/focus/debug/app-focus-debug-androidTest.apk'
        treeherder:
            symbol: focus-debug(Bat)
            platform: focus-android-all/opt

    fenix-android-test-debug:
        description: 'Fenix Debug Android Test for debugging'
        dependencies:
            build-fat-aar: build-fat-aar-android-geckoview-fat-aar/opt
        run:
            clone-with: hg
            gradle-build-type: androidTest
            gradle-build-name: androidTest
            gradle-build: fenix
        source-project-name: "fenix"
        apk-artifact-template:
            # 3 differences here:
            #  * "androidTest/" is added
            #  * "{gradle_build_type}" is forced to "debug"
            #  * "{fileName}" is forced to "app-debug-androidTest.apk"
            path: '/builds/worker/workspace/obj-build/gradle/build/mobile/android/fenix/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk'
        treeherder:
            symbol: fenix-debug(Bat)
            platform: fenix-android-all/opt

    # android-test-nightly and android-test-beta, while still being debug builds, are meant to be signed
    # with the nightly/beta key. The Firebase testing infrastructure requires both the androidTest APK
    # and the APK under test to be signed with the same key. Thus, the nightly APK being signed with
    # nightly means we need an androidTest APK with the same signature.

    focus-android-test-nightly:
        description: 'Focus Nightly Android Test for debugging'
        dependencies:
            build-fat-aar: build-fat-aar-android-geckoview-fat-aar/opt
        disable-optimization: true
        run:
            clone-with: hg
            gradle-build-type: androidTest
            gradle-build-name: androidTest
            gradle-build: focus
            test-build-type: nightly
        run-on-projects: [trunk]
        source-project-name: "focus-android"
        apk-artifact-template:
            path: '/builds/worker/workspace/obj-build/gradle/build/mobile/android/focus-android/app/outputs/apk/androidTest/focus/nightly/app-focus-nightly-androidTest.apk'
        treeherder:
            symbol: focus-nightly(Bat)
            platform: focus-android-all/opt

    # android-test-nightly and android-test-beta, while still being debug builds, are meant to be signed
    # with the nightly/beta key. The Firebase testing infrastructure requires both the androidTest APK
    # and the APK under test to be signed with the same key. Thus, the nightly APK being signed with
    # nightly means we need an androidTest APK with the same signature.
    #
    # TODO: See if we can tweak the signing kind to make 2 signing jobs out of a single `android-test`
    # job.
    fenix-android-test-nightly:
        attributes:
            nightly: true
        description: 'Fenix Nightly Android Test for debugging'
        dependencies:
            build-fat-aar: build-fat-aar-android-geckoview-fat-aar/opt
        apk-artifact-template:
            # 3 differences here:
            #  * "androidTest/" is added
            #  * "{gradle_build_type}" is forced to "nightly"
            #  * "{fileName}" is forced to "app-nightly-androidTest.apk"
            path: '/builds/worker/workspace/obj-build/gradle/build/mobile/android/fenix/app/outputs/apk/androidTest/nightly/app-nightly-androidTest.apk'
        run:
            clone-with: hg
            gradle-build-type: androidTest
            gradle-build-name: androidTest
            gradle-build: fenix
            test-build-type: nightly
        run-on-projects: [trunk]
        source-project-name: "fenix"
        treeherder:
            symbol: fenix-nightly(Bat)
            platform: fenix-android-all/opt

    focus-android-test-beta:
        description: 'Focus Beta Android Test for debugging'
        dependencies:
            build-fat-aar: build-fat-aar-android-geckoview-fat-aar-shippable/opt
        disable-optimization: true
        run:
            clone-with: hg
            gradle-build-type: androidTest
            gradle-build-name: androidTest
            gradle-build: focus
            test-build-type: beta
        run-on-projects: ['release']
        source-project-name: "focus-android"
        apk-artifact-template:
            path: '/builds/worker/workspace/obj-build/gradle/build/mobile/android/focus-android/app/outputs/apk/androidTest/focus/beta/app-focus-beta-androidTest.apk'
        treeherder:
            symbol: focus-beta(Bat)
            platform: focus-android-all/opt

    fenix-android-test-beta:
        description: 'Fenix Beta Android Test for debugging'
        dependencies:
            build-fat-aar: build-fat-aar-android-geckoview-fat-aar-shippable/opt
        apk-artifact-template:
            # 3 differences here:
            #  * "androidTest/" is added
            #  * "{gradle_build_type}" is forced to "beta"
            #  * "{fileName}" is forced to "app-beta-androidTest.apk"
            path: '/builds/worker/workspace/obj-build/gradle/build/mobile/android/fenix/app/outputs/apk/androidTest/beta/app-beta-androidTest.apk'
        disable-optimization: true
        run:
            clone-with: hg
            gradle-build-type: androidTest
            gradle-build-name: androidTest
            gradle-build: fenix
            test-build-type: beta
        run-on-projects: ['release']
        source-project-name: "fenix"
        treeherder:
            symbol: fenix-beta(Bat)
            platform: fenix-android-all/opt

    fenix-android-test-mozillaonline:
        description: 'Fenix Android Test mozillaonline'
        dependencies:
            build-fat-aar: build-fat-aar-android-geckoview-fat-aar-shippable/opt
        apk-artifact-template:
            # 3 differences here:
            #  * "androidTest/" is added
            #  * "{gradle_build_type}" is forced to "beta"
            #  * "{fileName}" is forced to "app-beta-androidTest.apk"
            path: '/builds/worker/workspace/obj-build/gradle/build/mobile/android/fenix/app/outputs/apk/androidTest/beta/app-beta-androidTest.apk'
        run-on-projects: []
        disable-optimization: true
        run:
            clone-with: hg
            gradle-build-type: androidTest
            gradle-build-name: androidTest
            gradle-build: fenix
            gradle-extra-options:
                - -PmozillaOnline
            test-build-type: beta
        source-project-name: "fenix"
        treeherder:
            symbol: fenix-beta(Bat-mo)
            platform: fenix-android-all/opt

    fenix-nightly-simulation:
        description: 'Fenix Nightly Simulation'
        dependencies:
            build-fat-aar: build-fat-aar-android-geckoview-fat-aar-shippable/opt
            baseline-profile: generate-baseline-profile-firebase-fenix
        fetches:
            baseline-profile:
                - artifact: baselineProfile.tar.zst
                  dest: baselineProfiles
        attributes:
            nightly: false
        include-nightly-version: true
        include-shippable-secrets: true
        run-on-projects: []
        run:
            clone-with: hg
            gradle-build-type: nightly
            gradle-build-name: nightly
            gradle-build: fenix
            baseline-profile-path: /builds/worker/fetches/baselineProfiles
        source-project-name: "fenix"
        treeherder:
            symbol: fenix-nightlySim(B)
            platform: fenix-android-all/opt

    # This task builds Fenix Nightly with the nightly-as-release GeckoView
    # fat AAR. android nightly as release Browsertime use this APK. Analagous
    # to fenix-nightly-simulation config.
    fenix-nightlyasrelease-simulation:
        description: 'Fenix Nightly-As-Release Simulation'
        dependencies:
            build-fat-aar: build-fat-aar-android-geckoview-fat-aar-nightlyasrelease/opt
            baseline-profile: generate-baseline-profile-firebase-fenix
        fetches:
            baseline-profile:
                - artifact: baselineProfile.tar.zst
                  dest: baselineProfiles
        attributes:
            nightly: false
        include-nightly-version: true
        # Use dummy secrets on all levels. No secret exists for this task
        # name, and this perf-only APK does not need real tokens.
        include-shippable-secrets: false
        run-on-projects: []
        run:
            gradle-build-type: nightly
            gradle-build-name: nightly
            gradle-build: fenix
            baseline-profile-path: /builds/worker/fetches/baselineProfiles
        source-project-name: "fenix"
        treeherder:
            symbol: fenix-nightlyAsReleaseSim(B)
            platform: fenix-android-all/opt

    fenix-beta-mozillaonline:
        description: 'Fenix Beta mozillaonline'
        dependencies:
            build-fat-aar: build-fat-aar-android-geckoview-fat-aar-shippable/opt
        attributes:
            release-type: beta
            shipping_phase: promote
        include-release-version: true
        include-shippable-secrets: true
        run:
            clone-with: hg
            gradle-build-type: beta
            gradle-build-name: beta
            gradle-build: fenix
            gradle-extra-options:
                - -PmozillaOnline
        run-on-projects: []
        source-project-name: "fenix"
        treeherder:
            symbol: fenix-beta(Bmo)
            platform: fenix-android-all/opt

    fenix-release-mozillaonline:
        description: 'Fenix Release mozillaonline'
        dependencies:
            build-fat-aar: build-fat-aar-android-geckoview-fat-aar-shippable/opt
            baseline-profile: generate-baseline-profile-firebase-fenix
        fetches:
            baseline-profile:
                - artifact: baselineProfile.tar.zst
                  dest: baselineProfiles
        attributes:
            release-type: release
            shipping_phase: promote
        include-release-version: true
        include-shippable-secrets: true
        run:
            clone-with: hg
            gradle-build-type: release
            gradle-build-name: release
            gradle-build: fenix
            gradle-extra-options:
                - -PmozillaOnline
            baseline-profile-path: /builds/worker/fetches/baselineProfiles
        run-on-projects: []
        source-project-name: "fenix"
        treeherder:
            symbol: fenix-release(Bmo)
            platform: fenix-android-all/opt
