# This Source Code Form is subject to the terms of the Mozilla Public
# License, v. 2.0. If a copy of the MPL was not distributed with this
# file, You can obtain one at http://mozilla.org/MPL/2.0/.
---
loader: gecko_taskgraph.loader.test:loader

kind-dependencies:
    - artifact-build
    - build
    - repackage-signing-shippable-l10n-msix
    - repackage-signing-msix
    - fetch
    - toolchain
    - build-extensions

transforms:
    - gecko_taskgraph.transforms.test:transforms
    - gecko_taskgraph.transforms.job:transforms
    - gecko_taskgraph.transforms.task:transforms

# Adding a new test type or running tests on a new platform? Be sure to review
# https://wiki.mozilla.org/Sheriffing/Job_Visibility_Policy

task-defaults:
    run-on-repo-type: [hg]
    attributes:
        retrigger: true
    use-python: system
    use-uv: true
    worker-type:
        by-test-platform:
            windows11.*-asan/.*: win11-64-25h2-large
            windows11.*aarch64.*/.*: win11-a64-25h2
            windows11.*/.*: win11-64-25h2
            default: default
    require-signed-extensions:
        by-release-type:
            release|esr.*: true
            beta:
                by-test-platform:
                    .*-devedition/.*: false
                    default: true
            default: false
    docker-image:
        in-tree: ubuntu2404-test
    fetches:
        fetch:
            by-test-platform:
                win.*:
                    - win64-ffmpeg-7.1
                default: []
        toolchain:
            by-test-platform:
                win.*:
                    - win64-node
                    - win32-minidump-stackwalk
                    - win32-fix-stacks
                macosx.*-64.*:
                    - macosx64-node
                    - macosx64-minidump-stackwalk
                    - macosx64-fix-stacks
                macosx.*-aarch64.*:
                    - macosx64-aarch64-node
                    - macosx64-aarch64-minidump-stackwalk
                    - macosx64-aarch64-fix-stacks
                android-em-14.*:
                    - android34-system-image-x86_64-linux
                    - android34-avd-x86_64-linux
                    - android-emulator-linux
                    - linux64-minidump-stackwalk
                    - linux64-fix-stacks
                    - linux64-hostutils
                android-hw.*:
                    - linux64-minidump-stackwalk
                    - linux64-fix-stacks
                    - linux64-hostutils
                default:
                    - linux64-node
                    - linux64-minidump-stackwalk
                    - linux64-fix-stacks
    suite:
        category: mochitest
    target:
        by-test-platform:
            android-em.*: geckoview-test_runner.apk
            android-hw.*: geckoview-test_runner.apk
            default: null
    tier:
        by-variant:
            xorigin:
                by-test-platform:
                    linux.*64/debug: 1
                    default: 2
            default:
                by-test-platform:
                    android-em.*/debug-isolated-process: 2
                    default: default
    mozharness:
        requires-signed-builds:
            by-test-platform:
                windows1.*:
                    by-variant:
                        msix: true
                        default: false
                default: false
        script:
            by-test-platform:
                android-em.*: android_emulator_unittest.py
                android-hw.*: android_hardware_unittest.py
                default: desktop_unittest.py
        config:
            by-test-platform:
                android-em-14.*:
                    - android/android_common.py
                    - android/android14-x86_64.py
                android-hw.*:
                    - android/android_common.py
                    - android/android_hw.py
                linux.*:
                    - unittests/linux_unittest.py
                    - remove_executables.py
                macosx.*:
                    - unittests/mac_unittest.py
                windows.*:
                    - unittests/win_unittest.py

tasks:
    mochitest-plain:
        description: "Mochitest plain run"
        treeherder-symbol: M()
        schedules-component: mochitest-plain
        loopback-video: true
        virtualization: virtual
        variants:
            - aab+no-fission
            - conditioned_profile
            - xorigin
            - no-fission
            - standalone
            - headless
            - http3
            - http2
            - geckoview-fission-isolate-high-value
            - inc-origin-init
        run-on-projects:
            by-variant:
                conditioned_profile:
                    by-test-platform:
                        .*-ccov.*: []
                        .*-asan.*: []
                        .*-wayland.*: []
                        linux2404-64(-shippable)?/opt: ['trunk']
                        windows11-64.*(-shippable)?(-qr)?/opt: []
                        default: []
                xorigin:
                    by-test-platform:
                        .*-asan.*: []
                        .*-wayland.*: []
                        windows.*-ccov.*: []
                        linux.*64(-shippable)?/.*: ['trunk']
                        macosx.*64-aarch64(-shippable)?(-qr)?/.*: ['trunk']
                        macosx.*64(-shippable)?(-qr)?/.*: ['trunk']
                        windows11-64-24h2(-shippable)?(-qr)?/.*: ['trunk']
                        linux.*64-ccov/opt: ['mozilla-central']
                        android-em.*/debug-isolated-process: ['trunk']
                        android-em.*: ['trunk']
                        default: []
                aab+no-fission:
                    by-test-platform:
                        android-em.*/debug: built-projects
                        default: []
                standalone:
                    by-test-platform:
                        linux.*-64-shippable/opt: ['mozilla-central']
                        linux.*-64/debug: ['autoland', 'mozilla-central']
                        linux.*-64/opt: ['autoland']
                        windows.*-64-[^-/]+-shippable/opt: ['mozilla-central']
                        windows.*-64-[^-/]+/debug: ['autoland', 'mozilla-central']
                        windows.*-64-[^-/]+/opt: ['autoland']
                        default: []
                headless:
                    by-test-platform:
                        .*-wayland.*: []
                        linux2404-64.*: ['mozilla-central']
                        default: []
                no-fission:
                    by-test-platform:
                        android-em.*/debug-isolated-process: []
                        android.*: built-projects
                        linux2404-64/debug: ['mozilla-central']
                        linux2404-64-asan/opt: ['mozilla-central']
                        linux2404-64(-shippable)?/opt: ['mozilla-central']
                        default: []
                http3:
                    by-test-platform:
                        linux2404-64/debug: built-projects
                        default: []
                http2:
                    by-test-platform:
                        linux2404-64/debug: built-projects
                        default: []
                geckoview-fission-isolate-high-value:
                    by-test-platform:
                        android-em.*/debug-isolated-process: ['trunk']
                        android-em.*: built-projects
                        default: []
                inc-origin-init: []
                default:
                    by-test-platform:
                        android-em.*/debug-isolated-process: ['trunk']
                        android.*: built-projects
                        # Compositor shutdown assertion in DisconnectApzcTreeManager
                        # on headless macOS aarch64 VM workers (Bug 2039987 family);
                        # same pattern excludes jsreftest, marionette, mochitest-remote,
                        # and crashtest debug on this platform.
                        macosx1500-aarch64-vms/debug: []
                        default: built-projects
        chunks: dynamic
        default-chunks:
            by-variant:
                standalone:
                    by-test-platform:
                        windows.*/debug: 30
                        linux.*/debug: 25
                        default: 20
                default:
                    by-test-platform:
                        android.*/debug: 10
                        linux.*/debug: 16
                        linux.*64-tsan/opt: 20
                        .*-ccov.*: 10
                        .*-asan.*: 10
                        linux.*/opt: 8
                        windows.*/debug: 8
                        default: 5
        tier:
            by-variant:
                no-fission:
                    by-test-platform:
                        linux.*64.*: 2
                        default: default
                default: default
        instance-size:
            by-test-platform:
                linux.*64-asan/opt: xlarge-noscratch  # runs out of memory using 8GB
                linux.*64-tsan/opt: xlarge-noscratch  # runs out of memory using 8GB
                default: default
        max-run-time:
            by-variant:
                standalone: 5400
                default: 3600
        allow-software-gl-layers: false
        mozharness:
            mochitest-flavor: plain
            extra-options:
                by-test-platform:
                    android-em.*:
                        - --test-suite=mochitest-plain
                    default: []
            chunked:
                by-test-platform:
                    android-em.*: false
                    default: true
        fetches:
            toolchain:
                by-test-platform:
                    linux.*:
                        - linux64-node
                        - linux64-minidump-stackwalk
                        - linux64-fix-stacks
                    macosx.*-64.*:
                        - macosx64-node
                        - macosx64-minidump-stackwalk
                        - macosx64-fix-stacks
                    macosx.*-aarch64.*:
                        - macosx64-aarch64-node
                        - macosx64-aarch64-minidump-stackwalk
                        - macosx64-aarch64-fix-stacks
                    win.*-64.*:
                        - win64-node
                        - win32-minidump-stackwalk
                        - win32-fix-stacks
                    win.*32.*:
                        - win32-node
                        - win32-minidump-stackwalk
                        - win32-fix-stacks
                    android-em-14.*:
                        - android34-system-image-x86_64-linux
                        - android34-avd-x86_64-linux
                        - android-emulator-linux
                        - linux64-node
                        - linux64-minidump-stackwalk
                        - linux64-hostutils

    mochitest-a11y:
        description: "Mochitest a11y run"
        treeherder-symbol: M(a11y)
        schedules-component: mochitest-a11y
        loopback-video: true
        run-without-variant: false
        variants:
            - 1proc
            - webrender-sw+1proc
        run-on-projects:
            by-variant:
                webrender-sw+1proc:
                    by-test-platform:
                        android-em.*/debug: built-projects
                        linux.*64/debug: built-projects
                        default: []
                1proc: built-projects
        mozharness:
            mochitest-flavor: a11y

    mochitest-browser-chrome:
        description: "Mochitest browser-chrome run"
        suite:
            name: mochitest-browser-chrome
        treeherder-symbol: M(bc)
        schedules-component: mochitest-browser-chrome
        loopback-video: true
        variants:
            - webrender-sw
            - webrender-sw+a11y-checks
            - msix
            - standalone
            - vertical-tabs
            - inc-origin-init
            - trainhop-beta
            - trainhop-release
            - no-nova
            - no-nova+vertical-tabs
            - urlbar-ipc
            - webrender-sw+urlbar-ipc
        run-on-projects:
            by-variant:
                trainhop-beta:
                    by-test-platform:
                        .*-wayland.*: []
                        .*-32.*: []
                        linux2404-64(-shippable)?/opt: ['trunk']
                        macosx1500-aarch64(-shippable)?/opt: ['trunk']
                        windows11-64-25h2(-shippable)?/opt: ['trunk']
                        default: []
                trainhop-release:
                    by-test-platform:
                        .*-wayland.*: []
                        .*-32.*: []
                        linux2404-64(-shippable)?/opt: ['trunk']
                        macosx1500-aarch64(-shippable)?/opt: ['trunk']
                        windows11-64-25h2(-shippable)?/opt: ['trunk']
                        default: []
                webrender-sw:
                    by-test-platform:
                        linux.*64/debug: ['all']
                        linux.*64-artifact/opt: ['mozilla-central']
                        linux.*64-asan/opt: ['all']
                        linux.*64-tsan/opt: built-projects
                        linux.*64/opt: built-projects
                        linux.*64-devedition/opt: built-projects
                        linux.*64-shippable/opt: ['release']
                        .*-wayland.*: []  # will change to built-projects when greened up
                        default: []
                webrender-sw+a11y-checks:
                    by-test-platform:
                        linux.*64(-shippable)?/opt: ['trunk']
                        default: []
                msix:
                    by-test-platform:
                        windows11-64.*: built-projects
                        default: []
                standalone:
                    by-test-platform:
                        linux.*-64-shippable/opt: ['mozilla-central']
                        linux.*-64/debug: ['autoland', 'mozilla-central']
                        linux.*-64/opt: ['autoland']
                        windows.*-64-[^-/]+-shippable/opt: ['mozilla-central']
                        windows.*-64-[^-/]+/debug: ['autoland', 'mozilla-central']
                        windows.*-64-[^-/]+/opt: ['autoland']
                        default: []
                vertical-tabs:
                    by-test-platform:
                        .*-artifact.*: []
                        .*-asan.*: []
                        .*-ccov.*: []
                        linux.*64(-shippable)?/.*: ['autoland', 'mozilla-central']
                        macosx.*64(-shippable)?(-qr)?/.*: ['autoland', 'mozilla-central']
                        windows1.*-64.*(-shippable)?/.*: ['autoland', 'mozilla-central']
                        default: []
                inc-origin-init: []
                no-nova:
                    by-test-platform:
                        .*-artifact.*: []
                        .*-asan.*: []
                        .*-ccov.*: []
                        linux.*64(-shippable)?/opt: ['trunk']
                        # limited testing pool
                        macosx1[45].*64(-shippable)?(-qr)?/opt: ['mozilla-central']
                        windows11.*-64.*(-shippable)?/opt: ['trunk']
                        default: []
                no-nova+vertical-tabs:
                    by-test-platform:
                        .*-artifact.*: []
                        .*-asan.*: []
                        .*-ccov.*: []
                        linux.*64(-shippable)?/opt: ['trunk']
                        macosx1[45].*64(-shippable)?(-qr)?/opt: ['trunk']
                        windows11.*-64.*(-shippable)?/opt: ['trunk']
                        default: []
                urlbar-ipc:
                    by-test-platform:
                        .*-artifact.*: []
                        .*-asan.*: []
                        .*-ccov.*: []
                        macosx1[45].*64(-shippable)?(-qr)?/opt: ['mozilla-central']
                        windows11.*-64.*(-shippable)?/opt: ['autoland', 'mozilla-central']
                        default: []
                webrender-sw+urlbar-ipc:
                    by-test-platform:
                        .*-artifact.*: []
                        .*-asan.*: []
                        .*-ccov.*: []
                        linux.*64(-shippable)?/opt: ['autoland', 'mozilla-central']
                        default: []
                default:
                    by-test-platform:
                        android.*: []
                        linux.*: []  # linux runs M-swr(bc), not M(bc)
                        default: built-projects
        tier:
            by-variant:
                trainhop-beta: 2
                trainhop-release: 2
                webrender-sw:
                    by-test-platform:
                        linux.*64-asan/opt: 1
                        linux.*64(-shippable)?/.*: 1
                        default: default
                default: default
        chunks:
            by-variant:
                trainhop-release: 1
                trainhop-beta: 1
                default: dynamic
        default-chunks:
            by-variant:
                msix:
                    by-test-platform:
                        .*/debug: 16
                        default: 7
                standalone:
                    by-test-platform:
                        windows.*/debug: 60
                        default: 40
                default:
                    by-test-platform:
                        linux.*/debug: 16
                        linux.*64-asan/opt: 20
                        linux.*64-tsan/opt: 32
                        windows.*-asan.*/opt: 20
                        windows.*-ccov.*/.*: 14
                        macosx.*64.*/opt: 10
                        windows11.*/opt: 10
                        .*/debug: 12
                        default: 8
        max-run-time:
            by-variant:
                msix: 5400
                standalone: 5400
                default:
                    by-test-platform:
                        linux.*64-ccov/opt: 9000
                        linux.*64-tsan/opt: 10800
                        linux.*/opt: 5400
                        windows.*-ccov.*/.*: 10800
                        windows.*-asan.*/opt: 5400
                        .*/debug: 5400
                        default: 3600
        mozharness:
            mochitest-flavor: browser
            chunked: true
        instance-size:
            by-test-platform:
                linux.*64-asan/opt: xlarge-noscratch  # runs out of memory frequently
                default: default
        allow-software-gl-layers: false
        fetches:
            fetch:
                by-test-platform:
                    win.*:
                        - win64-ffmpeg-7.1
                        - ort.jsep.wasm
                    default:
                        - ort.jsep.wasm

    mochitest-browser-chrome-failures:
        description: "Mochitest browser-chrome failures run"
        suite:
            name: mochitest-browser-chrome
        treeherder-symbol: M-f(bc)
        schedules-component: mochitest-browser-chrome
        loopback-video: true
        variants:
            - webrender-sw
        run-on-projects:
            by-test-platform:
                android.*: []
                .*-wayland.*: []  # will change to built-projects when greened up
                default: []
        tier: 3
        chunks: 2
        max-run-time:
            by-test-platform:
                linux.*-wayland.*/opt: 1800
                linux.*-wayland.*/debug: 3600
                default: 3600
        mozharness:
            mochitest-flavor: browser
            chunked: true
            extra-options:
                by-test-platform:
                    linux.*-wayland.*:
                        - --run-failures="os == 'linux' && os_version == '22.04'"
                        - --timeout-as-pass
                        - --crash-as-pass
        instance-size: default
        allow-software-gl-layers: false

    mochitest-browser-a11y:
        description: "Mochitest browser-a11y run"
        suite:
            name: mochitest-browser-a11y
        treeherder-symbol: M(ba)
        schedules-component: mochitest-browser-a11y
        loopback-video: true
        run-on-projects:
            by-test-platform:
                android.*: []
                .*-wayland.*: []
                default: built-projects
        tier: default
        max-run-time:
            by-test-platform:
                .*-tsan.*: 2700
                linux.*/debug: 2700
                windows.*-ccov.*: 2700
                windows.*-asan.*: 2700
                windows.*/debug: 2700
                default: 1800
        mozharness:
            mochitest-flavor: browser
            chunked:
                by-test-platform:
                    .*-tsan.*: true
                    default: false
        chunks: dynamic
        default-chunks:
            by-test-platform:
                .*-tsan.*: 2
                .*-asan.*: 2
                default: 1
        instance-size: default
        allow-software-gl-layers: false
        virtualization: virtual

    mochitest-browser-media:
        description: "Mochitest browser media"
        suite:
            name: mochitest-browser-media
        treeherder-symbol: M(mda-bc)
        schedules-component: mochitest-browser-media
        loopback-video: true
        variants: ["wmf-media-engine"]
        run-on-projects:
            by-variant:
                wmf-media-engine:
                    by-test-platform:
                        windows11.*: built-projects
                        default: []
                default:
                    by-test-platform:
                        android.*: []
                        default: built-projects
        tier: default
        max-run-time:
            by-test-platform:
                .*-tsan.*: 1800
                default: 1200
        mozharness:
            mochitest-flavor: browser
        instance-size: default
        allow-software-gl-layers: false
        virtualization: virtual

    mochitest-browser-screenshots:
        description: "Browser Screenshots"
        suite:
            name: mochitest-browser-screenshots
        treeherder-symbol: M(ss)
        index:
            product: test
            job-name: mochitest-browser-screenshots
        loopback-video: true
        variants: ["no-nova"]
        run-on-projects:
            by-test-platform:
                linux2404-64.*/opt: ['trunk']
                windows11-64-25h2.*/opt: ['trunk']
                macosx1500-aarch64/opt: ['trunk']
                default: []
        max-run-time: 3600
        mozharness:
            mochitest-flavor: browser
            extra-options:
                - "--setpref=layout.css.devPixelsPerPx=1.0"
        allow-software-gl-layers: false

    mochitest-browser-translations:
        description: "Mochitest browser translations"
        suite:
            name: mochitest-browser-translations
        treeherder-symbol: M(tr8ns)
        schedules-component: mochitest-browser-translations
        loopback-video: true
        run-on-projects:
            by-test-platform:
                android.*: []
                default: built-projects
        tier: default
        max-run-time:
            by-test-platform:
                .*-asan.*: 2400
                .*-tsan.*: 2400
                .*-ccov.*: 2400
                .*/debug: 2400
                default: 1800
        mozharness:
            mochitest-flavor: browser
        instance-size: default
        allow-software-gl-layers: false
        virtualization: virtual
        fetches:
            fetch:
                - tr8ns.inference
                - tr8ns.T.esen.lex
                - tr8ns.T.esen.model
                - tr8ns.T.esen.vocab

    mochitest-browser-chrome-ml-models:
        description: "Mochitest browser-chrome tests that download real ML models from model-hub.mozilla.org"
        suite:
            name: mochitest-browser-chrome-ml-models
        treeherder-symbol: M(bc-ml)
        schedules-component: mochitest-browser-chrome-ml-models
        loopback-video: true
        run-on-projects:
            by-test-platform:
                # Shippable Linux opt only. The `.*` glob previously also
                # matched sanitizer variants (asan/tsan), which abort on
                # upstream ggml UB in the native llama.cpp backend.
                linux2404-64-shippable/opt: ['mozilla-central']
                default: []
        max-run-time: 1800
        mozharness:
            mochitest-flavor: browser
        allow-software-gl-layers: false

    mochitest-chrome:
        description: "Mochitest chrome run"
        treeherder-symbol: M(c)
        schedules-component: mochitest-chrome
        loopback-video: true
        run-without-variant: false
        variants:
            - 1proc
            - webrender-sw+1proc
            - standalone
            - inc-origin-init
            - no-nova
        run-on-projects:
            by-variant:
                webrender-sw+1proc:
                    by-test-platform:
                        android-em.*/debug: built-projects
                        linux.*64/debug: built-projects
                        default: []
                1proc:
                    by-test-platform:
                        .*-wayland.*: []
                        # Compositor shutdown assertion in DisconnectApzcTreeManager
                        # on headless macOS aarch64 VM workers (Bug 2039987 family);
                        # same pattern excludes the other suites' debug on this platform.
                        macosx1500-aarch64-vms/debug: []
                        default: built-projects
                standalone:
                    by-test-platform:
                        linux.*-64-shippable/opt: ['mozilla-central']
                        linux.*-64/debug: ['autoland', 'mozilla-central']
                        linux.*-64/opt: ['autoland']
                        windows.*-64-[^-/]+-shippable/opt: ['mozilla-central']
                        windows.*-64-[^-/]+/debug: ['autoland', 'mozilla-central']
                        windows.*-64-[^-/]+/opt: ['autoland']
                        default: []
                inc-origin-init: []
                no-nova:
                    by-test-platform:
                        .*-artifact.*: []
                        .*-asan.*: []
                        .*-ccov.*: []
                        linux.*64(-shippable)?/opt: ['trunk']
                        macosx1[45].*64(-shippable)?(-qr)?/opt: ['trunk']
                        windows11.*-64.*(-shippable)?/opt: ['trunk']
                        default: []
        chunks: dynamic
        default-chunks:
            by-variant:
                standalone: 10
                default:
                    by-test-platform:
                        .*-tsan.*/opt: 6
                        default: 3
        max-run-time:
            by-variant:
                standalone: 5400
                default: 3600
        mozharness:
            mochitest-flavor: chrome
            chunked: true
        instance-size:
            by-test-platform:
                linux.*64-tsan/opt: xlarge-noscratch  # runs out of memory otherwise using 8GB
                default: default

    mochitest-devtools-chrome:
        description: "Mochitest devtools-chrome run"
        suite:
            name: mochitest-devtools-chrome
        schedules-component: mochitest-browser-chrome
        treeherder-symbol: M(dt)
        loopback-video: true
        variants:
            - a11y-checks
            - standalone
            - http3
        run-on-projects:
            by-variant:
                a11y-checks:
                    by-test-platform:
                        linux.*64(-shippable)?/opt: ['trunk']
                        default: []
                standalone:
                    by-test-platform:
                        linux.*-64-shippable/opt: ['mozilla-central']
                        linux.*-64/debug: ['autoland', 'mozilla-central']
                        linux.*-64/opt: ['autoland']
                        windows.*-64-[^-/]+-shippable/opt: ['mozilla-central']
                        windows.*-64-[^-/]+/debug: ['autoland', 'mozilla-central']
                        windows.*-64-[^-/]+/opt: ['autoland']
                        default: []
                http3:
                    by-test-platform:
                        linux2404-64/debug: built-projects
                        default: []
                default:
                    by-test-platform:
                        android.*: []
                        .*-wayland.*: []
                        linux.*64-ccov/opt: []
                        default: built-projects
        tier: default
        max-run-time:
            by-test-platform:
