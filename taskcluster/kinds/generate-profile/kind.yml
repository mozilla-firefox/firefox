---
loader: taskgraph.loader.transform:loader

kind-dependencies:
    - fetch
    - toolchain
    - instrumented-build

transforms:
    - gecko_taskgraph.transforms.build_attrs:transforms
    - gecko_taskgraph.transforms.build_schedules:transforms
    - gecko_taskgraph.transforms.release_deps:transforms
    - gecko_taskgraph.transforms.run_pgo_profile:transforms
    - gecko_taskgraph.transforms.job:transforms
    - gecko_taskgraph.transforms.task:transforms


task-defaults:
    run-on-projects: []
    treeherder:
        symbol: Bpgo(run)
        kind: build
        tier: 1
    use-python: default
    run:
    fetches:
        fetch:
            - pgo-extended-corpus

tasks:
    linux64-shippable/opt:
        description: "Linux64 Profile Generation"
        shipping-phase: build
        shipping-product: firefox
        index:
            product: firefox
            job-name: linux64-profile
        treeherder:
            platform: linux64-shippable/opt
        worker-type: b-linux
        worker:
            chain-of-trust: true
            env:
                NEED_XVFB: "true"
            max-run-time: 1200
            docker-image: {in-tree: ubuntu2404-test}
            artifacts:
                - type: directory
                  name: public/build
                  path: /builds/worker/artifacts/
        run:
            using: run-task
            cwd: '{checkout}'
            command: >
                ./taskcluster/scripts/misc/run-profileserver.sh
        fetches:
            toolchain:
                - linux64-clang
                - linux64-minidump-stackwalk

    linux64-nightlyasrelease/opt:
        description: "Linux64 Nightly-as-release Profile Generation"
        shipping-phase: build
        shipping-product: firefox
        index:
            product: firefox
            job-name: linux64-nightlyasrelease-profile
        treeherder:
            platform: linux64-nightlyasrelease/opt
        worker-type: b-linux
        worker:
            chain-of-trust: true
            env:
                NEED_XVFB: "true"
            max-run-time: 1200
            docker-image: {in-tree: ubuntu2404-test}
            artifacts:
                - type: directory
                  name: public/build
                  path: /builds/worker/artifacts/
        run:
            using: run-task
            cwd: '{checkout}'
            command: >
                ./taskcluster/scripts/misc/run-profileserver.sh
        fetches:
            toolchain:
                - linux64-clang
                - linux64-minidump-stackwalk

    android-x86_64-shippable/opt:
        description: "Android x86_64 Profile Generation"
        shipping-phase: build
        shipping-product: firefox-android
        index:
            product: mobile
            job-name: android-x86_64-profile
        treeherder:
            platform: android-x86_64-shippable/opt
        worker-type: b-linux-kvm
        worker:
            chain-of-trust: true
            max-run-time: 2700
            kvm: true  # for access to /dev/kvm for hw accel in the emulator
            docker-image: {in-tree: ubuntu2404-test}
            env:
                WORKING_DIR: "/builds/worker"
                MOZHARNESS_PATH: "/builds/worker/checkouts/gecko/testing/mozharness"
                PYTHON: "/builds/worker/checkouts/gecko/mach python"
            artifacts:
                - type: directory
                  name: public/build
                  path: /builds/worker/artifacts/
        run:
            using: mozharness
            job-script: taskcluster/scripts/tester/test-linux.sh
            script: android_emulator_pgo.py
            tooltool-downloads: internal
            options: [installer-path=/builds/worker/fetches/geckoview-test_runner.apk]
            config:
                - android/android_common.py
                - android/android-x86_64-profile-generation.py
                - android/android_pgo.py
        fetches:
            toolchain:
                - linux64-clang
                - linux64-minidump-stackwalk
                - linux64-hostutils
                - android-sdk-linux
                - linux64-embedded-uniffi-bindgen
                - linux64-nimbus-fml
                - android34-system-image-x86_64-linux
                - android34-avd-x86_64-linux

    android-aarch64-shippable/opt:
        description: "Android Aarch64 Profile Generation"
        shipping-phase: build
        shipping-product: firefox-android
        index:
            product: mobile
            job-name: android-aarch64-profile
        treeherder:
            platform: android-aarch64-shippable/opt
        worker-type: b-osx-arm64
        worker:
            chain-of-trust: true
            max-run-time: 2700
            env:
                WORKING_DIR: "/opt/worker/tasks"
                PYTHONPATH: "testing/marionette/client:testing/mozbase/mozinfo:testing/mozbase/mozfile:testing/mozbase/mozhttpd:testing/mozbase/mozprofile:testing/mozbase/mozlog:testing/mozbase/mozdevice:testing/mozbase/moznetwork:testing/mozbase/mozprocess:testing/mozbase/mozsystemmonitor:third_party/python"
            artifacts:
                - type: directory
                  name: public/build
                  path: checkouts/gecko/artifacts/
        run:
            using: run-task
            checkout: true
            cwd: '{checkout}'
            command: >-
                python3 testing/mozharness/scripts/android_emulator_pgo.py
                --installer-path=$MOZ_FETCHES_DIR/geckoview-test_runner.apk
                --config=android/android_common.py
                --config=android/android-aarch64-profile-generation-macos.py
                --config=android/android_pgo.py
        dependencies:
            instrumented-build-android-aarch64-shippable/opt: instrumented-build-android-aarch64-shippable/opt
        fetches:
            toolchain:
                - macosx64-aarch64-clang
                - macosx64-aarch64-minidump-stackwalk
                - android-sdk-macos
                - android-avd-arm64-macos
                - android-system-image-arm64-macos
            instrumented-build-android-aarch64-shippable/opt:
                - artifact: geckoview-test_runner.apk
                  extract: false
                - artifact: target.crashreporter-symbols.zip

    android-aarch64-nightlyasrelease/opt:
        description: "Android Aarch64 Nightly-As-Release Profile Generation"
        shipping-phase: build
        shipping-product: firefox-android
        index:
            product: mobile
            job-name: android-aarch64-nightlyasrelease-profile
        treeherder:
            platform: android-aarch64-nightlyasrelease/opt
        worker-type: b-osx-arm64
        worker:
            chain-of-trust: true
            max-run-time: 2700
            env:
                WORKING_DIR: "/opt/worker/tasks"
                PYTHONPATH: "testing/marionette/client:testing/mozbase/mozinfo:testing/mozbase/mozfile:testing/mozbase/mozhttpd:testing/mozbase/mozprofile:testing/mozbase/mozlog:testing/mozbase/mozdevice:testing/mozbase/moznetwork:testing/mozbase/mozprocess:testing/mozbase/mozsystemmonitor:third_party/python"
            artifacts:
                - type: directory
                  name: public/build
                  path: checkouts/gecko/artifacts/
        run:
            using: run-task
            checkout: true
            cwd: '{checkout}'
            command: >-
                python3 testing/mozharness/scripts/android_emulator_pgo.py
                --installer-path=$MOZ_FETCHES_DIR/geckoview-test_runner.apk
                --config=android/android_common.py
                --config=android/android-aarch64-profile-generation-macos.py
                --config=android/android_pgo.py
        dependencies:
            instrumented-build-android-aarch64-nightlyasrelease/opt: instrumented-build-android-aarch64-nightlyasrelease/opt
        fetches:
            toolchain:
                - macosx64-aarch64-clang
                - macosx64-aarch64-minidump-stackwalk
                - android-sdk-macos
                - android-avd-arm64-macos
                - android-system-image-arm64-macos
            instrumented-build-android-aarch64-nightlyasrelease/opt:
                - artifact: geckoview-test_runner.apk
                  extract: false
                - artifact: target.crashreporter-symbols.zip

    android-arm-shippable/opt:
        description: "Android ARM Profile Generation"
        shipping-phase: build
        shipping-product: firefox-android
        index:
            product: mobile
            job-name: android-arm-profile
        treeherder:
