---
task-defaults:
    attributes:
        cached_task: false
    use-python: "3.11"
    run-on-projects: []
    run:
        script: build-custom-car.sh

macosx64-aarch64-custom-car:
    description: "Custom chromium-as-release build for mac (apple silicon)"
    worker-type: b-osx-arm64
    treeherder:
        symbol: TMA64(custom-car)
        tier: 2
    worker:
        max-run-time: 15000
    run:
        arguments: [
            car_macosx_arm.tar.zst,
            blink_symbol_level=0,
            chrome_pgo_phase=2,
            dcheck_always_on=false,
            enable_nacl=false,
            enable_resource_allowlist_generation=false,
            is_chrome_branded=false,
            is_clang=true,
            is_component_build=false,
            is_debug=false,
            is_official_build=true,
            symbol_level=0,
            target_cpu="arm64",
            use_clang_modules=false,
            v8_symbol_level=0,
            # metagen re-runs gn in a temp out dir, where the
            # //out/Default/MacOSX.sdk path falls outside root_build_dir.
            v8_use_metagen=false
        ]
        toolchain-artifact: public/build/car_macosx_arm.tar.zst
    fetches:
        toolchain:
            - MacOSX26.5.sdk
            - macosx64-aarch64-uv

android-custom-car:
    description: "Custom chromium-as-release build for Android"
    worker-type: b-linux-docker-xlarge-amd
    treeherder:
        symbol: TA(custom-car)
    worker:
        docker-image: {in-tree: custom-car-android}
        max-run-time: 30000
    run:
        arguments: [
            car_android.tar.zst,
            chrome_pgo_phase=2,
            dcheck_always_on=false,
            enable_nacl=false,
            enable_resource_allowlist_generation=false,
            is_chrome_branded=false,
            is_clang=true,
            is_component_build=false,
            is_debug=false,
            is_official_build=true,
            symbol_level=2,
            target_cpu="arm64",
            target_os="android",
            is_android=true,
            is_high_end_android=true
        ]
        toolchain-artifact: public/build/car_android.tar.zst

linux64-custom-car:
    description: "Custom chromium-as-release build for Linux"
    worker-type: b-linux-docker-xlarge-amd
    treeherder:
        symbol: TL(custom-car)
    worker:
        docker-image: {in-tree: custom-car-linux}
        max-run-time: 25000
    run:
        arguments: [
            car_linux.tar.zst,
            blink_symbol_level=0,
            chrome_pgo_phase=2,
            dcheck_always_on=false,
            enable_nacl=false,
            enable_resource_allowlist_generation=false,
            is_chrome_branded=false,
            is_clang=true,
            is_component_build=false,
            is_debug=false,
            is_official_build=true,
            symbol_level=0,
            target_cpu="x64",
            use_v8_context_snapshot=false,
            v8_symbol_level=0
        ]
        toolchain-artifact: public/build/car_linux.tar.zst

win64-custom-car:
    description: "Custom chromium-as-release build for Windows"
    treeherder:
        symbol: TW64(custom-car)
    worker-type: b-win2022-xxlarge
    worker:
        max-run-time: 10000
        env:
            MSYSTEM: "MINGW64"
    run:
        arguments: [
            car_win64.tar.zst,
            chrome_pgo_phase=2,
            dcheck_always_on=false,
            enable_nacl=false,
            enable_resource_allowlist_generation=false,
            is_chrome_branded=false,
            is_clang=true,
            is_component_build=false,
            is_debug=false,
            is_official_build=true,
            symbol_level=2,
            target_cpu=\"x64\",
            use_v8_context_snapshot=false,
            # MSVC 14.51's intrinsics headers hide clang's, so the
            # V8 metagen libclang parse fails.
            v8_use_metagen_instance_types=false
        ]
        toolchain-artifact: public/build/car_win64.tar.zst
    fetches:
        toolchain:
            - win64-vs2026
