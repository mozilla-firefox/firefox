---
task-defaults:
    worker-type: b-linux-docker-amd
    worker:
        max-run-time: 1800
    run:
        using: toolchain-script
        script: build-sysroot.sh
        toolchain-artifact: public/build/sysroot.tar.zst

sysroot-i686-linux-gnu:
    description: "Sysroot for linux32 builds"
    attributes:
        local-toolchain: true
    worker:
        env:
            PACKAGES_TASKS: {task-reference: '<gcc-11>'}
            GCC_VERSION: '11'
    treeherder:
        symbol: TL32(sysroot)
    dependencies:
        gcc-11: packages-deb8-32-gcc-11
    run:
        toolchain-artifact: public/build/sysroot-i686-linux-gnu.tar.zst
        arguments:
            - i386

sysroot-x86_64-linux-gnu:
    description: "Sysroot for linux64 builds"
    attributes:
        local-toolchain: true
    worker:
        env:
            PACKAGES_TASKS: {task-reference: '<gcc-11>'}
            GCC_VERSION: '11'
    treeherder:
        symbol: TL(sysroot)
    dependencies:
        gcc-11: packages-deb8-gcc-11
    run:
        toolchain-artifact: public/build/sysroot-x86_64-linux-gnu.tar.zst
        arguments:
            - amd64

sysroot-x86_64-linux-gnu-x11:
    description: "Sysroot for linux64 builds (X11-only)"
    attributes:
        local-toolchain: true
    worker:
        env:
            PACKAGES_TASKS: {task-reference: '<gcc-11> <gtk3>'}
            GCC_VERSION: '11'
    treeherder:
        symbol: TL(sysroot-x11)
    dependencies:
        gcc-11: packages-deb8-gcc-11
        gtk3: packages-deb8-gtk3
    run:
        toolchain-artifact: public/build/sysroot-x86_64-linux-gnu.tar.zst
        arguments:
            - amd64

sysroot-wasm32-wasi-clang-19:
    description: "Sysroot for wasi"
    attributes:
        local-toolchain: true
    treeherder:
        symbol: WASI(sysroot-19)
    run:
        script: build-wasi-sdk.sh
        arguments:
            - wasi-sdk-compat.patch
            - wasi-sdk-no-llvm-patches.patch
        resources:
            - taskcluster/scripts/misc/wasi-sdk-compat.patch
            - taskcluster/scripts/misc/wasi-sdk-no-llvm-patches.patch
        toolchain-alias: sysroot-wasm32-wasi-clang-base
        toolchain-artifact: public/build/sysroot-wasm32-wasi.tar.zst
    fetches:
        fetch:
            - clang-19
            - wasi-sdk
        toolchain:
            - linux64-clang-19-raw

sysroot-wasm32-wasi-clang-22:
    description: "Sysroot for wasi"
    attributes:
        local-toolchain: true
    treeherder:
        symbol: WASI(sysroot-22)
    run:
        script: build-wasi-sdk.sh
        arguments:
            - wasi-sdk-compat.patch
            - wasi-sdk-no-llvm-patches.patch
        resources:
            - taskcluster/scripts/misc/wasi-sdk-compat.patch
            - taskcluster/scripts/misc/wasi-sdk-no-llvm-patches.patch
        toolchain-alias:
            by-project:
                toolchains: null
                default: sysroot-wasm32-wasi
        toolchain-artifact: public/build/sysroot-wasm32-wasi.tar.zst
    fetches:
        fetch:
            - clang-22
            - wasi-sdk
        toolchain:
            - linux64-clang-22-stage1

sysroot-wasm32-wasi-clang-23:
    description: "Sysroot for wasi"
    attributes:
        local-toolchain: true
    treeherder:
        symbol: WASI(sysroot-23)
    run:
        script: build-wasi-sdk.sh
        arguments:
            - wasi-sdk-compat.patch
        resources:
            - taskcluster/scripts/misc/wasi-sdk-compat.patch
        toolchain-artifact: public/build/sysroot-wasm32-wasi.tar.zst
    fetches:
        fetch:
            - clang-23
            - wasi-sdk
        toolchain:
            - linux64-clang-23-stage1

sysroot-wasm32-wasi-clang-trunk:
    description: "Sysroot for wasi"
    attributes:
        cached_task: false
    treeherder:
        symbol: WASI(sysroot-trunk)
    run:
        script: build-wasi-sdk.sh
        arguments:
            - wasi-sdk-compat.patch
            - wasi-sdk-clang_24.patch
        resources:
            - taskcluster/scripts/misc/wasi-sdk-compat.patch
            - taskcluster/scripts/misc/wasi-sdk-clang_24.patch
        toolchain-alias:
            by-project:
                toolchains: sysroot-wasm32-wasi
                default: null
        toolchain-artifact: public/build/sysroot-wasm32-wasi.tar.zst
    fetches:
        fetch:
            - clang-trunk
            - wasi-sdk
        toolchain:
            - linux64-clang-trunk-stage1

sysroot-aarch64-linux-gnu:
    description: "Sysroot for linux64 aarch64 builds"
    attributes:
        local-toolchain: true
    worker:
        env:
            PACKAGES_TASKS: {task-reference: '<gcc-11>'}
            GCC_VERSION: '11'
    treeherder:
        symbol: TLA64(sysroot)
    dependencies:
        gcc-11: packages-deb10-arm64-gcc-11
    run:
        toolchain-artifact: public/build/sysroot-aarch64-linux-gnu.tar.zst
        arguments:
            - arm64

linux32-toolchain-sysroot:
    description: "Sysroot for linux32 toolchain builds"
    worker:
        env:
            PACKAGES_TASKS: {task-reference: '<gcc-8>'}
            GCC_VERSION: '8'
    treeherder:
        symbol: TL32(sysroot-toolchain)
    dependencies:
        gcc-8: packages-deb8-32-gcc-8
    run:
        arguments:
            - i386
            # For clang
            - binutils-dev
            - libxml2-dev

linux64-toolchain-sysroot:
    description: "Sysroot for linux64 toolchain builds"
    worker:
        env:
            PACKAGES_TASKS: {task-reference: '<gcc-8>'}
            GCC_VERSION: '8'
    treeherder:
        symbol: TL(sysroot-toolchain)
    dependencies:
        gcc-8: packages-deb8-gcc-8
    run:
        arguments:
            - amd64
            # For clang
            - binutils-dev
            - gcc-multilib
            - lib32stdc++-8-dev
            - libxml2-dev
            # For minidump-stackwalk
            - libcurl4-openssl-dev
            - libssl-dev
            - libbz2-dev
            # For msix-package
            - libicu-dev
            # For libdmg-hfsplus
            - liblzma-dev
            # For socorro-cli
            - libdbus-1-dev

linux64-toolchain-sysroot-gcc11:
    description: "Sysroot for linux64 toolchain builds"
    worker:
        env:
            PACKAGES_TASKS: {task-reference: '<gcc-11>'}
            GCC_VERSION: '11'
    treeherder:
        symbol: TL(sysroot-toolchain-gcc11)
    dependencies:
        gcc-11: packages-deb8-gcc-11
    run:
        arguments:
            - amd64
            # For clang
            - binutils-dev
            - gcc-multilib
            - lib32stdc++-11-dev
            - libxml2-dev
            # For minidump-stackwalk
            - libcurl4-openssl-dev
            - libssl-dev
            - libbz2-dev
            # For msix-package
            - libicu-dev
            # For libdmg-hfsplus
            - liblzma-dev
            # For hfsplus
            - uuid-dev

linux64-aarch64-toolchain-sysroot:
    description: "Sysroot for aarch64 linux64 toolchain builds"
    treeherder:
        symbol: TLA64(sysroot-toolchain)
    run:
        arguments:
            - arm64
            # For clang
            - binutils-dev
            - libxml2-dev
            # For socorro-cli
            - libdbus-1-dev
