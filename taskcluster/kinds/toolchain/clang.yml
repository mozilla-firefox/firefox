---
task-defaults:
    worker-type: b-linux-docker-xlarge-amd
    worker:
        max-run-time: 7200
    run:
        resources:
            - 'build/build-clang/build-clang.py'

linux64-clang-19-raw:
    description: "Clang 19 toolchain build"
    treeherder:
        symbol: TL(clang-19-raw)
    worker-type: b-linux-docker-large-amd
    run:
        script: build-clang.sh
        arguments:
            - 'build/build-clang/use-system-clang.json'
            - 'build/build-clang/clang-19.json'
            - 'build/build-clang/2stages.json'
        resources:
            - 'build/build-clang/use-system-clang.json'
            - 'build/build-clang/clang-19.json'
            - 'build/build-clang/2stages.json'
        toolchain-artifact: public/build/clang.tar.zst
    fetches:
        fetch:
            - clang-19
        toolchain:
            - linux64-toolchain-sysroot

linux64-clang-19:
    description: "Clang 19 toolchain build"
    treeherder:
        symbol: TL(clang-19)
    worker-type: b-linux-docker-amd
    worker:
        max-run-time: 600
    run:
        script: repack-clang.sh
        toolchain-alias: linux64-clang-base
        toolchain-artifact: public/build/clang.tar.zst
    fetches:
        toolchain:
            - linux64-clang-19-raw
            - wasm32-wasi-compiler-rt-19

linux64-clang-22-mingw-x86:
    description: "MinGW-Clang 22 x86 toolchain build"
    treeherder:
        symbol: TWM(clang-22-x86)
    worker-type: b-linux-docker-amd
    run:
        script: build-clang-mingw.sh
        arguments:
            - 'x86'
        resources:
            - 'taskcluster/scripts/misc/mingw-*.patch'
        toolchain-alias:
            by-project:
                toolchains: null
                default: linux64-clang-mingw-x86
        toolchain-artifact: public/build/clangmingw.tar.zst
    fetches:
        fetch:
            - clang-22
            - mingw-w64
        toolchain:
            - linux64-clang-22

linux64-clang-22-mingw-x64:
    description: "MinGW-Clang 22 x64 toolchain build"
    treeherder:
        symbol: TWM(clang-22-x64)
        tier: 1
    worker-type: b-linux-docker-amd
    run:
        script: build-clang-mingw.sh
        arguments:
            - 'x64'
        resources:
            - 'taskcluster/scripts/misc/mingw-*.patch'
        toolchain-alias:
            by-project:
                toolchains: null
                default: linux64-clang-mingw-x64
