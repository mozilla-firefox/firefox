---
loader: taskgraph.loader.transform:loader

kind-dependencies:
    - fetch
    - packages

transforms:
    - gecko_taskgraph.transforms.try_job:transforms
    - gecko_taskgraph.transforms.job:transforms
    - gecko_taskgraph.transforms.custom_car:transforms
    - gecko_taskgraph.transforms.cached_tasks:transforms
    - gecko_taskgraph.transforms.task:transforms

task-defaults:
    treeherder:
        kind: build
        platform: toolchains/opt
        tier: 1
    run-on-projects: []
    run:
        using: toolchain-script

tasks-from:
    - 7zz.yml
    - android.yml
    - android-macos.yml
    - cargo-audit.yml
    - cargo-vet.yml
    - cabextract.yml
    - cbindgen.yml
    - clang-tidy.yml
    - clang.yml
    - compiler-rt.yml
    - custom-car.yml
    - dxc.yml
    - dump-syms.yml
    - embedded-uniffi-bindgen.yml
    - fix-stacks.yml
    - gcc.yml
    - geckodriver.yml
    - gn.yml
    - grcov.yml
    - hostutils.yml
    - jj.yml
    - libunwind.yml
    - libxml2.yml
    - llvm-symbolizer.yml
    - macos-sdk.yml
    - mingw.yml
    - minidump-stackwalk.yml
    - misc.yml
    - mozcheck.yml
    - nasm.yml
    - nimbus-fml.yml
    - node.yml
    - onnx.yml
    - pkgconf.yml
    - profiler-node-tools.yml
    - python.yml
    - python-wheels.yml
    - rust.yml
    - rust-analyzer.yml
    - rust-size.yml
    - samply.yml
    - sccache.yml
    - searchfox-cli.yml
    - socorro-cli.yml
    - stmo-cli.yml
    - sysroot.yml
    - treeherder-cli.yml
    - upx.yml
    - uv.yml
    - webspec-index.yml
    - dist-toolchains.yml
