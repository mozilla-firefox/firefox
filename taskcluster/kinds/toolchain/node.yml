---
task-defaults:
    description: "Node repack toolchain build"
    attributes:
        local-toolchain: true
    worker-type: b-linux-docker-amd
    worker:
        max-run-time: 1800
    run:
        script: repack-node.sh
        toolchain-artifact: public/build/node.tar.zst

linux64-node-12:
    treeherder:
        symbol: TL(node-12)
    fetches:
        fetch:
            - nodejs-12-linux64

linux64-node-24:
    treeherder:
        symbol: TL(node-24)
    run:
        toolchain-alias:
            - linux64-node
    fetches:
        fetch:
            - nodejs-24-linux64

linux64-aarch64-node-24:
    treeherder:
        symbol: TLA64(node-24)
    run:
        toolchain-alias:
            - linux64-aarch64-node
    fetches:
        fetch:
            - nodejs-24-linux64-arm64

macosx64-aarch64-node-24:
    treeherder:
        symbol: TMA64(node-24)
    run:
        toolchain-alias:
            - macosx64-aarch64-node
    fetches:
        fetch:
            - nodejs-24-macosx64-arm64

win64-node-24:
    treeherder:
        symbol: TW64(node-24)
    run:
        toolchain-alias:
            - win64-node
    fetches:
        fetch:
            - nodejs-24-win64

win64-aarch64-node-24:
    treeherder:
        symbol: TWA64(node-24)
    run:
        toolchain-alias:
            - win64-aarch64-node
    fetches:
        fetch:
            - nodejs-24-win-arm64

macosx64-node-22:
    # Node 24 requires macOS 13.5, but we still have macOS 10.15 workers.
    treeherder:
        symbol: TM(node-22)
    run:
        toolchain-alias:
            - macosx64-node
    fetches:
        fetch:
            - nodejs-22-macosx64

win32-node-22:
    # There is no official 32-bit Windows build of Node 23 and later.
    treeherder:
        symbol: TW32(node-22)
    attributes:
        local-toolchain: false
    run:
        toolchain-alias:
            - win32-node
    fetches:
        fetch:
            - nodejs-22-win32
