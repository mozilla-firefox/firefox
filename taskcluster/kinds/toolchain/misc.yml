win64-cmake:
    description: "cmake toolchain build"
    treeherder:
        symbol: TW64(cmake)
    run:
        script: build-cmake.sh
        toolchain-artifact: public/build/cmake.tar.zst
    fetches:
        fetch:
            - cmake
        toolchain:
            - linux64-clang-toolchain
            - vs-toolchain

talos-pdfs:
    description: "Gathers all the PDFs needed for the pdfpaint test"
    treeherder:
        symbol: TL(talos-pdfs)
    worker:
        max-run-time: 3600
    run:
        script: run-fetch-talos-pdfs.sh
        sparse-profile: null
        resources:
            - 'taskcluster/scripts/misc/fetch-talos-pdfs.py'
        toolchain-artifact: project/gecko/talos-pdfs/talos-pdfs.tar.zst
    fetches:
        fetch:
            - mozilla-pdf.js
            - mozilla-pdf.js.pdfs
