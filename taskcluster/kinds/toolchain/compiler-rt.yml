---
task-defaults:
    worker-type: b-linux-docker-amd
    worker:
        max-run-time: 1800
    run:
        using: toolchain-script
        script: build-compiler-rt.sh

wasm32-wasi-compiler-rt-19:
    description: "wasm32-wasi Compiler-rt for Clang 19 toolchain build"
    treeherder:
        symbol: WASI(crt-19)
    worker-type: b-linux-docker-xlarge-amd
    run:
        script: build-wasi-sdk.sh
        arguments:
            - wasi-sdk-compat.patch
        resources:
            - taskcluster/scripts/misc/wasi-sdk-compat.patch
        toolchain-artifact: public/build/compiler-rt-wasm32-wasi.tar.zst
    fetches:
        fetch:
            - clang-19
            - wasi-sdk
        toolchain:
            - linux64-clang-19-raw

android-aarch64-compiler-rt-22:
    description: "android aarch64 Compiler-rt for Clang 22 toolchain build"
    treeherder:
        symbol: TA(crt-22-aarch64)
    run:
        arguments:
            - build/build-clang/clang-22.json
        resources:
            - build/build-clang/clang-22.json
            - taskcluster/scripts/misc/build-llvm-common.sh
        toolchain-artifact: public/build/compiler-rt-aarch64-linux-android.tar.zst
    fetches:
        fetch:
            - clang-22
        toolchain:
            - linux64-clang-22-stage1
            - linux64-android-ndk-linux-repack

