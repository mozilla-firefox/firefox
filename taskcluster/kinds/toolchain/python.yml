---
task-defaults:
    description: "python repack"
    worker-type: b-linux-docker-amd
    worker:
        max-run-time: 7200
    run:
        script: build-cpython.sh
        resources:
            - 'build/psutil_requirements.txt'
            - 'build/pyyaml_requirements.txt'
            - 'build/zstandard_requirements.txt'

linux64-python-3.10:
    treeherder:
        symbol: TL(python)
    run:
        toolchain-alias: linux64-python
        toolchain-artifact: public/build/python.tar.zst
    fetches:
        fetch:
            - cpython-3.10.11
    worker:
        docker-image: {in-tree: ubuntu1804-build-python}

linux64-aarch64-python-3.10:
    description: "cpython 3.10.11 AArch64/ARM64"
    worker-type: b-linux-aarch64
    treeherder:
        symbol: TLA64(python)
    run:
        toolchain-alias: linux64-aarch64-python
        toolchain-artifact: public/build/python.tar.zst
    fetches:
        fetch:
            - cpython-3.10.11
    worker:
        docker-image: {in-tree: ubuntu2204-arm64-build-python}

linux64-aarch64-python-3.11:
    worker-type: b-linux-aarch64
    treeherder:
        symbol: TLA64(python3.11)
    run:
        toolchain-artifact: public/build/python.tar.zst
    fetches:
        fetch:
            - cpython-3.11.7
    worker:
        docker-image: {in-tree: ubuntu2204-arm64-build-python}

win64-python-3.10:
    description: "cpython 3.10.11"
    treeherder:
        symbol: TW64(python)
    run:
        script: pack-cpython.sh
        toolchain-alias: win64-python
        toolchain-artifact: public/build/python.tar.zst
    fetches:
        toolchain:
            - linux64-wine
        fetch:
            - cpython-3.10.11.exe

macosx64-python-3.10:
    treeherder:
        symbol: TM(python)
    worker-type: b-osx-1015
    run:
        toolchain-alias: macosx64-python
        toolchain-artifact: public/build/python.tar.zst
        arguments:
            - cpython-3.10-macos-dup3-pipe2.patch
        resources:
            - 'taskcluster/scripts/misc/cpython-3.10-macos-dup3-pipe2.patch'
    fetches:
        fetch:
            - cpython-3.10.11
        toolchain:
            - macosx64-clang-toolchain
            - macosx64-sdk-toolchain
            - macosx64-xz

macosx64-aarch64-python-3.10:
    treeherder:
        symbol: TMA64(python)
    worker-type: b-osx-arm64
    run:
        toolchain-alias: macosx64-aarch64-python
        toolchain-artifact: public/build/python.tar.zst
        arguments:
            - cpython-3.10-macos-dup3-pipe2.patch
        resources:
            - 'taskcluster/scripts/misc/cpython-3.10-macos-dup3-pipe2.patch'
    fetches:
        fetch:
            - cpython-3.10.11
        toolchain:
            - macosx64-aarch64-clang
            - macosx64-sdk-toolchain
            - macosx64-aarch64-xz
            - macosx64-aarch64-openssl

