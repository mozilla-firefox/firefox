    description: "Android Gradle dependencies toolchain task with an in-tree app-services"
    treeherder:
        symbol: TL(gradle-dependencies-as)
        tier: 3
    use-gradle: online
    worker:
        env:
            ANDROID_SDK_ROOT: "/builds/worker/fetches/android-sdk-linux"
