---
task-defaults:
    worker-type: b-linux-docker-amd
    worker:
        max-run-time: 1800
    run:
        using: toolchain-script
        script: build-libunwind.sh

android-aarch64-libunwind-22:
    description: "android aarch64 libunwind for Clang 22 toolchain build"
    treeherder:
        symbol: TA(unwind-22-aarch64)
    run:
        arguments:
            - build/build-clang/clang-22.json
        resources:
            - build/build-clang/clang-22.json
            - taskcluster/scripts/misc/build-llvm-common.sh
        toolchain-artifact: public/build/libunwind-aarch64-linux-android.tar.zst
    fetches:
        fetch:
            - clang-22
        toolchain:
            - android-aarch64-compiler-rt-22
            - linux64-clang-22-stage1
            - linux64-android-ndk-linux-repack

