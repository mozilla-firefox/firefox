---
task-defaults:
    worker-type: b-linux-docker-amd
    worker:
        max-run-time: 1800
        env:
            MACH_BUILD_PYTHON_NATIVE_PACKAGE_SOURCE: system
    use-python: "3.11"
    attributes:
        local-toolchain: true
    run:
        script: build-onnxruntime.sh
        resources:
            - taskcluster/scripts/misc/onnxruntime.patches/**
    fetches:
        fetch:
            - onnxruntime-src
            - onnxruntime-deps

onnxruntime-x86_64-linux-gnu:
    description: "ONNX Runtime (linux x64)"
    attributes:
        enable-full-crashsymbols: true
    treeherder:
        symbol: TL(onnx)
    run:
        arguments:
            - "Linux"
            - "x64"
        toolchain-artifact: public/build/onnxruntime-x86_64-linux-gnu.tar.zst
        resources:
            - taskcluster/scripts/misc/onnxruntime-thread-atexit.cpp
    fetches:
        toolchain:
            - linux64-clang-toolchain
            - linux64-dump_syms
            - sysroot-x86_64-linux-gnu

onnxruntime-aarch64-linux-gnu:
    description: "ONNX Runtime (linux aarch64)"
    attributes:
        enable-full-crashsymbols: true
    treeherder:
