    amd64-local/opt:
        description: Build Firefox Nightly as a Snap using upstream definition and local gecko checkout
        attributes:
            build_platform: linux64-snap
            build_type: opt
            cron: false
        run-on-projects:
            - mozilla-central
            - autoland
        index:
