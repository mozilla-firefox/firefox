---
loader: taskgraph.loader.transform:loader

transforms:
    - taskgraph.transforms.task_context
    # While not a build, the build optimization works well for these tasks.
    - gecko_taskgraph.transforms.build_schedules:transforms
    - gecko_taskgraph.transforms.job:transforms
    - gecko_taskgraph.transforms.task:transforms

kind-dependencies:
    - toolchain
    - instrumented-build-apk

task-defaults:
    attributes:
        build_platform: android
        build-type: debug
    task-context:
        from-parameters:
            level: level
        substitution-fields:
            - routes
            - scopes
            - extra.notify
    fetches:
        toolchain:
            - android-sdk-linux
            - linux64-embedded-uniffi-bindgen
            - linux64-nimbus-fml
    optimization:
        skip-unless-backstop: null
    worker-type: b-linux-medium
    worker:
        docker-image: {in-tree: android-ui-tests}
        max-run-time: 7200
        env:
            GOOGLE_APPLICATION_CREDENTIALS: '.firebase_token.json'
            ANDROID_SDK_ROOT: /builds/worker/fetches/android-sdk-linux
        artifacts:
            - name: public
              path: /builds/worker/artifacts
              type: directory
        retry-exit-status: [20]
    treeherder:
        kind: test
        tier: 1
    run:
        using: run-commands
        dummy-secrets:
            - content: "faketoken"
              path: .adjust_token
    routes:
        by-level:
            '3':
                - notify.slack-channel.C099TSHR7GB.on-failed
            'default': []
    scopes:
        by-level:
            '3':
                - queue:route:notify.slack-channel.C099TSHR7GB.on-failed
                - notify:slack-channel:C099TSHR7GB
            'default': []
    extra:
        notify:
            by-level:
                '3':
                    slackText: 'https://firefox-ci-tc.services.mozilla.com/tasks/${{status.taskId}} | ${{task.metadata.name}} | ${{task.metadata.source}}'
                    slackBlocks: |
                        [
                          {{
                            "type": "header",
                            "text": {{
                              "type": "plain_text",
                              "text": "firefox-android :firefox: ${{task.metadata.name}} :x:\n "
                            }}
                          }},
                          {{
                            "type": "table",
                            "rows": [
                              [
                                {{
                                  "type": "rich_text",
                                  "elements": [
                                    {{
                                      "type": "rich_text_section",
                                      "elements": [
                                        {{
                                          "type": "text",
                                          "text": "Task",
                                          "style": {{ "bold": true }}
                                        }}
                                      ]
                                    }}
                                  ]
                                }},
                                {{
                                  "type": "rich_text",
                                  "elements": [
                                    {{
                                      "type": "rich_text_section",
                                      "elements": [
                                        {{
                                          "type": "link",
                                          "url": "https://firefox-ci-tc.services.mozilla.com/tasks/${{status.taskId}}",
                                          "text": "Taskcluster"
                                        }}
                                      ]
                                    }}
                                  ]
                                }}
                              ],
                              [
                                {{
                                  "type": "rich_text",
                                  "elements": [
                                    {{
                                      "type": "rich_text_section",
                                      "elements": [
                                        {{
                                          "type": "text",
                                          "text": "Owner",
                                          "style": {{ "bold": true }}
                                        }}
                                      ]
                                    }}
                                  ]
                                }},
                                {{
                                  "type": "raw_text",
                                  "text": "${{task.metadata.owner}}"
                                }}
                              ],
                              [
                                {{
                                  "type": "rich_text",
                                  "elements": [
                                    {{
                                      "type": "rich_text_section",
                                      "elements": [
                                        {{
                                          "type": "text",
                                          "text": "Source",
                                          "style": {{ "bold": true }}
                                        }}
                                      ]
                                    }}
                                  ]
                                }},
                                {{
                                  "type": "rich_text",
                                  "elements": [
                                    {{
                                      "type": "rich_text_section",
                                      "elements": [
                                        {{
                                          "type": "link",
                                          "url": "${{task.payload.env.GECKO_BASE_REPOSITORY}}/rev/${{task.payload.env.GECKO_HEAD_REV}}",
                                          "text": "Commit"
                                        }},
                                        {{
                                          "type": "text",
                                          "text": " "
                                        }},
                                        {{
                                          "type": "emoji",
                                          "name": "hg"
                                        }}
                                      ]
                                    }}
                                  ]
                                }}
                              ]
                            ]
                          }},
                          {{
                            "type": "context",
                            "elements": [
                              {{
                                "type": "mrkdwn",
                                "text": ":android: Refer to https://mozilla-hub.atlassian.net/wiki/x/SwCjZw for more information on baseline profiles."
                              }}
                            ]
                          }}
                        ]
                'default': {}

tasks:
    fenix:
        attributes:
            build-type: fenix-debug-firebase
        description: Baseline profile generation for Fenix
        dependencies:
            instrumented-apk: instrumented-build-apk-fenix
        fetches:
            instrumented-apk:
                - artifact: target.arm64-v8a.apk
                  extract: false
                - artifact: target.noarch.apk
                  extract: false
        run:
            secrets:
                - name: project/gecko/level-any/firefox-android/fenix/firebase
                  key: firebaseToken
                  path: mobile/android/test_infra/.firebase_token.json
                  json: true
            commands:
                - [python3, taskcluster/scripts/tests/test-lab.py, fenix/arm64-v8a-baseline-profile.yml, /builds/worker/fetches/target.arm64-v8a.apk, --apk_test, /builds/worker/fetches/target.noarch.apk]
                - [python3, taskcluster/scripts/tests/copy-artifacts-from-ftl.py, "baseline_profile"]
                - [mkdir, -p, /builds/worker/artifacts/build]
                - [tar, -C, /builds/worker/workspace/baselineProfile, -cf, /builds/worker/artifacts/build/baselineProfile.tar.zst, .]
        treeherder:
            platform: fenix-android-all/opt
            symbol: Bpgo(run)
        worker:
            env:
                GOOGLE_PROJECT: moz-fenix
    fenix-simulation:
        attributes:
            build-type: fenix-debug-firebase
        description: Baseline profile simulation for Fenix used on Try presets to run only 2 iterations of each generator
        run-on-projects: []
        dependencies:
            instrumented-apk: instrumented-build-apk-fenix
        fetches:
            instrumented-apk:
                - artifact: target.arm64-v8a.apk
                  extract: false
                - artifact: target.noarch.apk
                  extract: false
        run:
            secrets:
                - name: project/gecko/level-any/firefox-android/fenix/firebase
                  key: firebaseToken
                  path: mobile/android/test_infra/.firebase_token.json
                  json: true
            commands:
                - [python3, taskcluster/scripts/tests/test-lab.py, fenix/arm64-v8a-baseline-profile.yml, /builds/worker/fetches/target.arm64-v8a.apk, --apk_test, /builds/worker/fetches/target.noarch.apk, --baseline-profile-max-iterations, "2"]
                - [python3, taskcluster/scripts/tests/copy-artifacts-from-ftl.py, "baseline_profile"]
                - [mkdir, -p, /builds/worker/artifacts/build]
                - [tar, -C, /builds/worker/workspace/baselineProfile, -cf, /builds/worker/artifacts/build/baselineProfile.tar.zst, .]
        treeherder:
            platform: fenix-android-all/opt
            symbol: Bpgo(sim)
        worker:
            env:
                GOOGLE_PROJECT: moz-fenix
