---
loader: taskgraph.loader.transform:loader

kind-dependencies:
    - fetch
    - toolchain

transforms:
    - gecko_taskgraph.transforms.build_attrs:transforms
    - gecko_taskgraph.transforms.build_schedules:transforms
    - gecko_taskgraph.transforms.build_lints:transforms
    - gecko_taskgraph.transforms.mozconfig:transforms
    - gecko_taskgraph.transforms.job:transforms
    - gecko_taskgraph.transforms.artifact:transforms
    - gecko_taskgraph.transforms.task:transforms

task-defaults:
    index:
        product: firefox
    treeherder:
        kind: build
        symbol: AB
        tier: 1
    run-on-projects: ['mozilla-central']
    worker-type: b-linux
    worker:
        max-run-time: 3600
        env:
            MOZ_AUTOMATION_PACKAGE_TESTS: '1'
            PERFHERDER_EXTRA_OPTIONS: artifact
            MACH_BUILD_PYTHON_NATIVE_PACKAGE_SOURCE: system
            USE_ARTIFACT: '1'
    mozconfig:
        variant: nightly
    run:
        using: mozharness
        actions: [get-secrets, build]
        config:
            - builds/releng_base_firefox.py
        script: "mozharness/scripts/fx_desktop_build.py"
        secrets: true
        tooltool-downloads: public
    use-python: default
    fetches:
        toolchain:
            - terser

tasks:
    linux64-artifact/opt:
        description: "Linux64 Opt Artifact Build"
        index:
            job-name: linux64-artifact-opt
        treeherder:
            platform: linux64/opt
        worker:
            env:
                MOZ_ARTIFACT_TASK: {task-reference: '<linux64-opt>'}
        run:
            config:
                - builds/releng_base_linux_64_builds.py
        dependencies:
            linux64-opt: build-linux64/opt
        fetches:
            toolchain:
                - linux64-node

    linux64-artifact/debug:
        description: "Linux64 Debug Artifact Build"
        index:
            job-name: linux64-artifact-debug
        treeherder:
            platform: linux64/debug
        worker:
            env:
                MOZ_ARTIFACT_TASK: {task-reference: '<linux64-debug>'}
        mozconfig:
            variant: debug
        run:
            config:
                - builds/releng_base_linux_64_builds.py
            custom-build-variant-cfg: debug
        dependencies:
            linux64-debug: build-linux64/debug
        fetches:
            toolchain:
                - linux64-node

    macosx64-artifact/opt:
        description: "MacOS X x64 Opt Artifact Build"
        index:
            job-name: macosx64-artifact-opt
        treeherder:
            platform: osx-cross/opt
        worker:
            env:
                MOZ_ARTIFACT_TASK: {task-reference: '<macosx64-opt>'}
        run:
            config:
                - builds/releng_base_mac_64_cross_builds.py
        dependencies:
            macosx64-opt: build-macosx64/opt
        fetches:
            toolchain:
                - linux64-hfsplus
                - linux64-libdmg
                - linux64-node

    macosx64-artifact/debug:
        description: "MacOS X x64 Debug Artifact Build"
        index:
            job-name: macosx64-artifact-debug
        treeherder:
            platform: osx-cross/debug
        worker:
            env:
                MOZ_ARTIFACT_TASK: {task-reference: '<macosx64-debug>'}
        mozconfig:
            variant: debug
        run:
            config:
                - builds/releng_base_mac_64_cross_builds.py
            custom-build-variant-cfg: cross-debug
        dependencies:
            macosx64-debug: build-macosx64/debug
        fetches:
            toolchain:
                - linux64-hfsplus
                - linux64-libdmg
                - linux64-node

    win64-artifact/opt:
        description: "Win64 Opt Artifact Build"
        index:
            job-name: win64-artifact-opt
        attributes:
            enable-build-signing: true
        treeherder:
            platform: windows2012-64/opt
        worker:
            chain-of-trust: true
            env:
                MOZ_ARTIFACT_TASK: {task-reference: '<win64-opt>'}
        mozconfig:
            platform: win64
        run:
            config:
                - builds/releng_base_linux_64_builds.py
        dependencies:
            win64-opt: build-win64/opt
        fetches:
            toolchain:
                - linux64-7zz
                - linux64-node
                - linux64-upx
                - linux64-wine
                - nsis

    win64-artifact/debug:
        description: "Win64 Debug Artifact Build"
        index:
            job-name: win64-artifact-debug
        attributes:
            enable-build-signing: true
        treeherder:
            platform: windows2012-64/debug
        worker:
            chain-of-trust: true
            env:
                MOZ_ARTIFACT_TASK: {task-reference: '<win64-debug>'}
        mozconfig:
            variant: debug
            platform: win64
        run:
            config:
                - builds/releng_base_linux_64_builds.py
                - builds/taskcluster_sub_win64/debug.py
        dependencies:
            win64-debug: build-win64/debug
        fetches:
            toolchain:
                - linux64-7zz
                - linux64-node
                - linux64-upx
                - linux64-wine
                - nsis
