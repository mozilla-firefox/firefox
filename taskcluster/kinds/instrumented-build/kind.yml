    macosx64-shippable/opt:
        description: "MacOS X x64 Cross-compile Instrumented"
        shipping-phase: build
        shipping-product: firefox
        treeherder:
            platform: osx-shippable/opt
        worker-type: b-linux-docker-large-amd
        worker:
            max-run-time: 7200
            env:
                PERFHERDER_EXTRA_OPTIONS: instrumented
            artifacts:
                - name: public/build/security/{browser_entitlement}.xml
                  path: checkouts/gecko/security/mac/hardenedruntime/{entitlement_directory}/{browser_entitlement}.xml
                  type: file
                - name: public/build/security/media-plugin-helper.xml
                  path: checkouts/gecko/security/mac/hardenedruntime/{entitlement_directory}/media-plugin-helper.xml
                  type: file
                - name: public/build/security/plugin-container.xml
                  path: checkouts/gecko/security/mac/hardenedruntime/{entitlement_directory}/plugin-container.xml
                  type: file
                - name: public/build/security/security-module-helper.xml
