---
loader: taskgraph.loader.transform:loader

kind-dependencies:
    - toolchain
    - fetch

transforms:
    - gecko_taskgraph.transforms.build:transforms
    - gecko_taskgraph.transforms.build_attrs:transforms
    - gecko_taskgraph.transforms.build_lints:transforms
    - gecko_taskgraph.transforms.mozconfig:transforms
    - gecko_taskgraph.transforms.job:transforms
    - gecko_taskgraph.transforms.task:transforms

task-defaults:
    index:
        product: firefox
    treeherder:
        symbol: Searchfox(idx)
        kind: build
        tier: 2
    run-on-projects: ['mozilla-central']
    optimization: null
    use-python: default
    # These builds don't use sccache because otherwise we wouldn't index
    # the files that sccache optimizes away compilation for.
    use-sccache: false
    run:
        using: mozharness
        actions: [build]
        extra-config:
            max_build_output_timeout: 3600
    worker-type: b-linux-docker-large-amd
    worker:
        env:
            MACH_BUILD_PYTHON_NATIVE_PACKAGE_SOURCE: system
            PERFHERDER_EXTRA_OPTIONS: searchfox

tasks:
    linux64-searchfox/opt:
        description: "Linux64 opt Searchfox"
        index:
            job-name: linux64-searchfox-opt
        treeherder:
            platform: linux64/opt
        worker:
            max-run-time: 10800
            env:
                MOZSEARCH_PLATFORM: "linux64-opt"
        mozconfig:
            variant: opt-searchfox-clang
        run:
            config:
                - builds/releng_base_firefox.py
                - builds/releng_sub_linux_configs/64_searchfox_and_opt.py
            script: "mozharness/scripts/fx_desktop_build.py"
            tooltool-downloads: public
            keep-artifacts: false
        fetches:
            toolchain:
                - linux64-clang
                - linux64-nasm
                - linux64-node
                - linux64-rust
                - linux64-rust-analyzer
                - linux64-cbindgen
                - linux64-dump_syms
                - linux64-pkgconf
                - sysroot-x86_64-linux-gnu
                - sysroot-wasm32-wasi
                - terser

    linux64-searchfox/debug:
        description: "Linux64 Debug Searchfox"
        index:
            job-name: linux64-searchfox-debug
        treeherder:
            platform: linux64/debug
        worker:
            max-run-time: 10800
            env:
                MOZSEARCH_PLATFORM: "linux64"
        mozconfig:
            variant: debug-searchfox-clang
        run:
            config:
                - builds/releng_base_firefox.py
                - builds/releng_sub_linux_configs/64_searchfox_and_debug.py
            script: "mozharness/scripts/fx_desktop_build.py"
            tooltool-downloads: public
            keep-artifacts: false
        fetches:
            toolchain:
                - linux64-clang
                - linux64-nasm
                - linux64-node
                - linux64-rust
                - linux64-rust-analyzer
                - linux64-cbindgen
                - linux64-dump_syms
                - linux64-pkgconf
                - sysroot-x86_64-linux-gnu
                - sysroot-wasm32-wasi

    macosx64-searchfox/debug:
        description: "MacOS X x64 Debug Cross-compile Searchfox"
        index:
            job-name: macosx64-searchfox-debug
        treeherder:
            platform: osx-cross/debug
        worker:
            max-run-time: 10800
            env:
                MOZSEARCH_PLATFORM: "macosx64"
        mozconfig:
            variant: debug-searchfox
        run:
            config:
                - builds/releng_base_firefox.py
                - builds/releng_base_mac_64_cross_builds.py
            script: "mozharness/scripts/fx_desktop_build.py"
            custom-build-variant-cfg: cross-debug-searchfox
            keep-artifacts: false
        fetches:
            toolchain:
                - linux64-clang
                - linux64-hfsplus
                - linux64-libdmg
                - linux64-nasm
                - linux64-node
                - linux64-rust-cross
                - linux64-rust-analyzer
                - linux64-cbindgen
                - linux64-dump_syms
                - linux64-darling
                - macosx64-metal
                - macosx64-sdk
                - sysroot-x86_64-linux-gnu
                - sysroot-wasm32-wasi

    macosx64-aarch64-searchfox/opt:
        description: "MacOS X aarch64 Opt Cross-compile Searchfox"
        index:
            job-name: macosx64-aarch64-searchfox-opt
        treeherder:
            platform: osx-cross-aarch64/opt
        worker:
            max-run-time: 10800
            env:
                MOZSEARCH_PLATFORM: "macosx64-aarch64-opt"
        mozconfig:
            variant: opt-searchfox
        run:
            config:
                - builds/releng_base_firefox.py
                - builds/releng_base_mac_64_cross_builds.py
            script: "mozharness/scripts/fx_desktop_build.py"
            custom-build-variant-cfg: cross-opt-searchfox
            keep-artifacts: false
        fetches:
            toolchain:
                - linux64-clang
                - linux64-hfsplus
                - linux64-libdmg
                - linux64-nasm
                - linux64-node
                - linux64-rust-cross
                - linux64-rust-analyzer
                - linux64-cbindgen
                - linux64-dump_syms
                - linux64-darling
                - macosx64-metal
                - macosx64-sdk
                - sysroot-x86_64-linux-gnu
                - sysroot-wasm32-wasi
                - terser

    macosx64-aarch64-searchfox/debug:
        description: "MacOS X aarch64 Debug Cross-compile Searchfox"
        index:
            job-name: macosx64-aarch64-searchfox-debug
        treeherder:
            platform: osx-cross-aarch64/debug
        worker:
            max-run-time: 10800
            env:
                MOZSEARCH_PLATFORM: "macosx64-aarch64"
        mozconfig:
            variant: debug-searchfox
        run:
            config:
                - builds/releng_base_firefox.py
                - builds/releng_base_mac_64_cross_builds.py
            script: "mozharness/scripts/fx_desktop_build.py"
            custom-build-variant-cfg: cross-debug-searchfox
            keep-artifacts: false
        fetches:
            toolchain:
                - linux64-clang
                - linux64-hfsplus
                - linux64-libdmg
                - linux64-nasm
                - linux64-node
                - linux64-rust-cross
                - linux64-rust-analyzer
                - linux64-cbindgen
                - linux64-dump_syms
                - linux64-darling
                - macosx64-metal
                - macosx64-sdk
                - sysroot-x86_64-linux-gnu
                - sysroot-wasm32-wasi

    ios-searchfox/debug:
        description: "ios Debug Cross-compile Searchfox"
        index:
            job-name: ios-searchfox-debug
        treeherder:
            platform: ios/debug
        worker:
            max-run-time: 10800
            env:
                MOZSEARCH_PLATFORM: "ios"
        mozconfig:
            variant: debug-searchfox
            platform: ios
            app: mobile/ios
        run:
            config:
                - builds/releng_base_firefox.py
            script: "mozharness/scripts/fx_desktop_build.py"
            keep-artifacts: false
            extra-config:
                disable_package_metrics: true
                upload_env: {"UPLOAD_PATH": "/builds/worker/artifacts"}
        fetches:
            toolchain:
                - linux64-clang
                - linux64-hfsplus
                - linux64-libdmg
                - linux64-nasm
                - linux64-node
                - linux64-rust-ios
                - linux64-rust-analyzer
                - linux64-cbindgen
                - linux64-dump_syms
                - ios-sdk
                - sysroot-x86_64-linux-gnu
                - sysroot-wasm32-wasi

    win64-searchfox/opt:
        description: "Win64 Searchfox Opt (clang-cl)"
        index:
            job-name: win64-searchfox-opt
        treeherder:
            platform: windows2012-64/opt
        worker:
            max-run-time: 10800
            env:
                MOZSEARCH_PLATFORM: "win64-opt"
        mozconfig:
            variant: opt-searchfox
        run:
            options: [append-env-variables-from-configs]
            script: mozharness/scripts/fx_desktop_build.py
            config:
                - builds/releng_base_firefox.py
                - builds/releng_base_linux_64_builds.py
                - builds/taskcluster_sub_win64/searchfox_opt.py
        fetches:
            toolchain:
                - linux64-7zz
                - linux64-cbindgen
                - linux64-clang
                - linux64-dump_syms
                - linux64-nasm
                - linux64-node
                - linux64-rust-cross
                - linux64-rust-analyzer
                - linux64-rust-size
                - linux64-upx
                - linux64-winchecksec
                - linux64-wine
                - nsis
                - sysroot-x86_64-linux-gnu
                - sysroot-wasm32-wasi
                - terser
                - vs
                - dxc-x86_64-pc-windows-msvc
                - winappsdk-x86_64-pc-windows-msvc
            fetch:
                - windows-rs

    win64-searchfox/debug:
        description: "Win64 Searchfox Debug (clang-cl)"
        index:
            job-name: win64-searchfox-debug
        treeherder:
            platform: windows2012-64/debug
        worker:
            max-run-time: 10800
            env:
                MOZSEARCH_PLATFORM: "win64"
        mozconfig:
            variant: debug-searchfox
        run:
            options: [append-env-variables-from-configs]
            script: mozharness/scripts/fx_desktop_build.py
            config:
                - builds/releng_base_firefox.py
                - builds/releng_base_linux_64_builds.py
                - builds/taskcluster_sub_win64/searchfox_debug.py
        fetches:
            toolchain:
                - linux64-7zz
                - linux64-cbindgen
                - linux64-clang
                - linux64-dump_syms
                - linux64-nasm
                - linux64-node
                - linux64-rust-cross
                - linux64-rust-analyzer
                - linux64-rust-size
                - linux64-upx
                - linux64-winchecksec
                - linux64-wine
                - nsis
                - sysroot-x86_64-linux-gnu
                - sysroot-wasm32-wasi
                - vs
                - dxc-x86_64-pc-windows-msvc
                - winappsdk-x86_64-pc-windows-msvc
            fetch:
                - windows-rs

    android-aarch64-searchfox/debug:
        description: "Android 5.0 AArch64 Debug Searchfox"
        index:
            job-name: android-aarch64-searchfox-debug
        treeherder:
            platform: android-5-0-aarch64/debug
        use-gradle: offline
        use-gradle-cache: true
        worker:
            docker-image: {in-tree: android-build}
            max-run-time: 14400
            env:
                MOZSEARCH_PLATFORM: "android-aarch64"
                TOOLTOOL_MANIFEST: "mobile/android/config/tooltool-manifests/android/releng.manifest"
        mozconfig:
            variant: debug-searchfox
        run:
            config:
                - builds/releng_base_android_64_builds.py
            script: "mozharness/scripts/fx_desktop_build.py"
            custom-build-variant-cfg: aarch64-debug-searchfox
            tooltool-downloads: internal
        fetches:
            toolchain:
                - android-gradle-dependencies
                - android-ndk-linux
                - android-sdk-linux
                - linux64-embedded-uniffi-bindgen
                - linux64-nimbus-fml
                - linux64-jdk
                - linux64-clang
                - linux64-rust-cross
                - linux64-rust-analyzer
                - linux64-rust-size
                - linux64-cbindgen
                - linux64-dump_syms
                - linux64-nasm
                - linux64-node
                - sysroot-x86_64-linux-gnu
                - sysroot-wasm32-wasi
