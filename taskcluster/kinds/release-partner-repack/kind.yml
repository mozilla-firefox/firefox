---
loader: taskgraph.loader.transform:loader

transforms:
    - gecko_taskgraph.transforms.release_deps:transforms
    - taskgraph.transforms.task_context
    - gecko_taskgraph.transforms.partner_repack:transforms
    - gecko_taskgraph.transforms.job:transforms
    - gecko_taskgraph.transforms.task:transforms

kind-dependencies:
    - build
    - build-signing
    - build-mac-signing
    - build-mac-notarization
    - l10n-signing
    - shippable-l10n-mac-signing
    - shippable-l10n-mac-notarization

task-defaults:
    name: partner-repack
    description: Release Promotion partner repacks
    task-context:
        from-custom:
            - release-level
        substitution-fields:
            - extra.limit-locales
    run-on-projects: []  # to make sure this never runs as part of CI
    shipping-product: firefox
    shipping-phase: promote
    worker-type: b-linux
    worker:
        docker-image:
            in-tree: "partner-repack"
        chain-of-trust: true
        max-run-time: 7200
        artifacts:
            - name: releng/partner
              path: /builds/worker/artifacts/
              type: directory
    run:
        using: run-task
        cwd: '{checkout}'
        command: $GECKO_PATH/taskcluster/scripts/release/partner-repack.sh
    extra:
        limit-locales:
            by-release-level:
                staging: true
                production: false

tasks:
    linux64-shippable:
        attributes:
            build_platform: linux64-shippable
            build_type: opt
            artifact_prefix: releng/partner
            shippable: true

    macosx64-shippable:
        attributes:
            build_platform: macosx64-shippable
            build_type: opt
            artifact_prefix: releng/partner
            shippable: true

    win32-shippable:
        attributes:
            build_platform: win32-shippable
            build_type: opt
            artifact_prefix: releng/partner
            shippable: true

    win64-shippable:
        attributes:
            build_platform: win64-shippable
            build_type: opt
            artifact_prefix: releng/partner
            shippable: true

    win64-aarch64-shippable:
        attributes:
            build_platform: win64-aarch64-shippable
            build_type: opt
            artifact_prefix: releng/partner
            shippable: true
