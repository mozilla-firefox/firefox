---
task-defaults:
    platform: linux2404-64/opt
    always-target:
        by-platform:
            macosx.*: false
            default: true
    worker-type:
        by-platform:
            linux2404-64.*: t-linux-docker-amd
            macosx1470-64.*: t-osx-1400-r8
            macosx1500-aarch64.*: t-osx-1500-m4
            windows11-64.*: win11-64-25h2-source
    worker:
        by-platform:
            linux2404-64.*:
                docker-image: {in-tree: "lint"}
                max-run-time: 3600
                env:
                    TASKGRAPH_SERIAL: "1"
            macosx.*:
                max-run-time: 3600
                env:
                    PATH: "/usr/local/bin:/bin:/sbin:/usr/bin:/usr/sbin"
                    # ensure we don't use internal pypi for these tasks
                    PIP_INDEX_URL: https://pypi.python.org/simple/
                    PIP_NO_INDEX: "0"
                    TASKGRAPH_SERIAL: "1"
            default:
                max-run-time: 3600
                env:
                    TASKGRAPH_SERIAL: "1"
    use-python: default
    treeherder:
        kind: test
        tier: 1
    run:
        clone-with: hg
        using: mach
        use-caches: [checkout, pip, uv]
    when:
        files-changed:
            - 'config/mozunit/**'
            - 'python/mach_commands.py'

firefox-ci:
    description: taskcluster/gecko_taskgraph unit tests
    always-target: false
    treeherder:
        symbol: ci
    run:
        using: python-test
        subsuite: ci
    when:
        files-changed:
            - '.taskcluster.yml'
            - 'taskcluster/kinds/**'
            - 'taskcluster/**/*.py'
            - 'taskcluster/requirements.txt'
            - 'tools/tryselect/selectors/auto.py'

