        - macosx1470-64/opt
        - windows11-64/opt
    treeherder:
        symbol: mozlint
        tier: 2
    run:
        using: python-test
        subsuite: mozlint
        prepend-env:
            PATH: "$MOZ_FETCHES_DIR/rustc/bin/:/builds/worker/.cargo/bin${PATH:+:$PATH}"
    dependencies:
        clang-tidy:
            by-platform:
                linux2404-64/opt: toolchain-linux64-clang-tidy
                macosx1470-64/opt: toolchain-macosx64-clang-tidy
                windows11-64/opt: toolchain-win64-clang-tidy
    fetches:
        toolchain:
            by-platform:
                linux2404-64/opt:
                    - linux64-node
                    - linux64-rust
                    - linux64-mozcheck
                macosx1470-64/opt:
                    - macosx64-node
                    - macosx64-rust
                    - macosx64-mozcheck
                windows11-64/opt:
                    - win64-node
                    - win64-rust
                    - win64-mozcheck
        fetch:
            - pnpm
        clang-tidy:
            - artifact: clang-tidy.tar.zst
              dest: clang-tools
    when:
        files-changed:
            - 'python/mozlint/**'
            - 'tools/lint/**'

