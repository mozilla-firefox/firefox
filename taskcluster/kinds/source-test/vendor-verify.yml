#
# One task per group of vendored libraries. Each re-vendors every library in its
# `members` list at the revision pinned in that library's moz.yaml and checks the
# result matches what is committed.
#
# Every vendored moz.yaml (one with a `vendoring:` section, non-rust) must
# appear in exactly one group's `members` -- the `coverage` task turns the tree
# orange for any that don't. Which group a library is in only decides which task
# verifies it, so put a new one with related libraries.
#
# Libraries that do not re-vendor cleanly yet are annotated in
# taskcluster/scripts/misc/vendor-verify-expected-fail.yml.
---
task-defaults:
    description: Verify that re-vendoring libraries reproduces the committed tree
    worker-type: t-linux-docker-amd
    attributes:
        # Deliberately not wired to the code-review bot: code-review: true would
        # trip remove_optimization_on_central and run every group unconditionally
        # on mozilla-central.
        code-review: false
    worker:
        docker-image: {in-tree: static-analysis-build}
        # A group re-vendors all of its libraries, some of which are slow, so this
        # needs more than the 20-minute task default.
        max-run-time: 1800
        env:
            MACH_BUILD_PYTHON_NATIVE_PACKAGE_SOURCE: system
    treeherder:
        kind: test
        tier: 1
    platform: lint/opt
    run:
        clone-with: hg
        using: run-task
        cwd: '{checkout}'
    # Some libraries' update-actions need tooling the image doesn't have: gfx/angle
    # runs gn, and dom/webgpu/tests/cts runs cargo, which in turn runs npm. Fetching
    # gn also stops the build system bootstrapping it at runtime, which fails in a
    # task that sets no UPLOAD_DIR. Fetch these for every group rather than tracking
    # which library needs what -- the libraries that need tooling are spread across
    # most of the groups, and only the group whose files changed actually runs.
    fetches:
        toolchain:
            - linux64-gn
            - linux64-node
            - linux64-rust

algorithms:
    treeherder:
        symbol: vendor(algorithms)
    members:
        - dom/webauthn/winwebauthn/moz.yaml
        - mfbt/double-conversion/moz.yaml
        - modules/brotli/moz.yaml
        - modules/fdlibm/moz.yaml
        - modules/xz-embedded/moz.yaml
        - modules/zlib/moz.yaml
        - nsprpub/moz.yaml
        - security/nss/moz.yaml
        - third_party/gemmology/moz.yaml
        - third_party/js/PKI.js/moz.yaml
        - third_party/picosha2/moz.yaml
        - third_party/simde/moz.yaml
        - third_party/xsimd/moz.yaml
        - third_party/zstd/moz.yaml
        - third_party/zucchini/chromium/moz.yaml

data:
    treeherder:
        symbol: vendor(data)
    members:
        - mozglue/misc/decimal/moz.yaml
        - parser/expat/moz.yaml
        - third_party/msgpack/moz.yaml
        - third_party/skv/moz.yaml
        - third_party/sqlite3/ext/sqlite-vec/moz.yaml
        - third_party/sqlite3/moz.yaml
        - toolkit/components/jsoncpp/moz.yaml
        - toolkit/components/protobuf/moz.yaml

