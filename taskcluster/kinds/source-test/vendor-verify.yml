        - third_party/js/prosemirror/prosemirror-commands/moz.yaml
        - third_party/js/prosemirror/prosemirror-history/moz.yaml
        - third_party/js/prosemirror/prosemirror-keymap/moz.yaml
        - third_party/js/prosemirror/prosemirror-markdown/moz.yaml
        - third_party/js/prosemirror/prosemirror-model/moz.yaml
        - third_party/js/prosemirror/prosemirror-schema-basic/moz.yaml
        - third_party/js/prosemirror/prosemirror-state/moz.yaml
        - third_party/js/prosemirror/prosemirror-suggestions/moz.yaml
        - third_party/js/prosemirror/prosemirror-transform/moz.yaml
        - third_party/js/prosemirror/prosemirror-view/moz.yaml
