testing:
    treeherder:
        symbol: vendor(testing)
    members:
        - testing/mochitest/pywebsocket3/moz.yaml
        - third_party/googletest/moz.yaml
        - third_party/webkit/PerformanceTests/MotionMark/moz.yaml
        - third_party/webkit/PerformanceTests/Speedometer3/moz.yaml
        - third_party/webkit/PerformanceTests/media-capabilities/moz.yaml
        - third_party/webkit/PerformanceTests/webaudio/moz.yaml
        - tools/fuzzing/libfuzzer/moz.yaml

# No `members`: this one checks that every vendored library is in a group
# above, rather than verifying any library itself.
coverage:
    description: Check every vendored library is assigned to a vendor-verify group
    treeherder:
        symbol: vendor(coverage)
    run:
        command: './mach python taskcluster/scripts/misc/check-vendor-coverage.py'
    when:
        files-changed:
            - '**/moz.yaml'
            - 'taskcluster/kinds/source-test/vendor-verify.yml'
            - 'taskcluster/scripts/misc/check-vendor-coverage.py'
