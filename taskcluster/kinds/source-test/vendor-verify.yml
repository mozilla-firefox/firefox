        - media/libdav1d/moz.yaml
        - media/libnestegg/moz.yaml
        - media/libogg/moz.yaml
        - media/libopus/moz.yaml
        - media/libsoundtouch/moz.yaml
        - media/libspeex_resampler/moz.yaml
        - media/libvorbis/moz.yaml
        - media/libvpx/moz.yaml
        - media/libyuv/moz.yaml
        - netwerk/sctp/src/moz.yaml
        - third_party/libsrtp/moz.yaml
        - third_party/pipewire/moz.yaml

