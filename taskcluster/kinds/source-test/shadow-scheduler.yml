---
task-defaults:
    platform: gecko-decision/opt
    worker-type: t-linux-docker-amd
    worker:
        docker-image: {in-tree: "lint"}
        max-run-time: 3600
        artifacts:
            - type: file
              name: public/shadow-scheduler/optimized-tasks.json
              path: /builds/worker/optimized-tasks.json
            - type: directory
              name: public/shadow-scheduler-state
              path: /builds/worker/shadow-scheduler-state
            - type: directory
              name: public/build
              path: /builds/worker/artifacts/perf
        env:
            DECISION_TASK_ID: {task-reference: <decision>}
            MOZ_PERFHERDER_UPLOAD: /builds/worker/artifacts/perf/perfherder-data-bugbug.json
            SHADOW_SCHEDULER_STATE_PATH: /builds/worker/shadow-scheduler-state/state.json
    treeherder:
        kind: other
        tier: 3
    run-on-projects: ['autoland-only']
    run:
        using: run-task
        cwd: '{checkout}'
        command: ./mach taskgraph optimized -v --json -p task-id=$DECISION_TASK_ID --output-file /builds/worker/optimized-tasks.json
        sparse-profile: taskgraph

relevant_tests:
    description: Runs the relevant_tests optimization strategy instead of the default.
    treeherder:
        symbol: SS(relevant_tests)
    index:
        product: source
        job-name: shadow-scheduler-relevant_tests
    worker:
        env:
            TASKGRAPH_OPTIMIZE_STRATEGIES: gecko_taskgraph.optimize:experimental.relevant_tests

