    index:
        product: source
        job-name: shadow-scheduler-perf_rapb_la
    worker:
        artifacts: *perf-shadow-scheduler-artifacts
        env:
            TASKGRAPH_OPTIMIZE_STRATEGIES: gecko_taskgraph.optimize:experimental.perf_rapb_la
