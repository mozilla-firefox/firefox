---
generate:
    description: Generate the Sphinx documentation
    index:
        # Searchfox needs a fixed URL for the artifacts to download the latest
        # trees.json file.
        product: source
        job-name: doc-generate
    use-python: "3.12"
    platform: doc/opt
    treeherder:
        symbol: doc(generate)
        kind: test
        tier: 1
    run-on-projects: ['trunk']
    worker-type: b-linux-medium
    worker:
        docker-image: {in-tree: "lint"}
        max-run-time: 1800
        env:
            LC_ALL: C
            # Define various variables to make the generation happy and not
            # output `KeyError`s.
            #
            # This occurs when sphinx is processing some of the python, and
            # there is processing going on at the top level. It shows up in
            # automation because there's no build environment setup, and so
            # the python code can't work out what these variables should be.
            # Hence in defining them here we can work around the issue.
            OS_TARGET: Linux
            BIN_SUFFIX: ""
            DLL_PREFIX: ""
            DLL_SUFFIX: ""
        artifacts:
            - type: file
              name: public/docs.tar.gz
              path: /builds/worker/checkouts/gecko/docs-out/main.tar.gz
            - type: file
              name: public/trees.json
              path: /builds/worker/artifacts/trees.json
    run:
        using: run-task
        cwd: '{checkout}'
        command: >
            cp -r $MOZ_FETCHES_DIR/node_modules node_modules &&
            ln -s ../tools/lint/eslint/eslint-plugin-mozilla node_modules &&
            ln -s ../tools/lint/eslint/eslint-plugin-spidermonkey-js node_modules &&
            ./mach doc --outdir docs-out --no-open --no-serve --archive --dump-trees=/builds/worker/artifacts/trees.json
    optimization:
        docs: null
    fetches:
        toolchain:
            - linux64-node
            - node-modules


upload:
    description: Generate and upload the Sphinx documentation
    use-python: "3.12"
    platform: doc/opt
    attributes:
        code-review: true
    treeherder:
        symbol: doc(upload)
        kind: test
        tier: 2
    run-on-projects: [mozilla-central-only]
    # Review bot waits for this task, and it is in the long tail that often
    # finishes last. The docs build reads the sources in parallel, so a 30 core
    # worker shortens the end to end time.
    worker-type: b-linux-docker-large-amd
    worker:
        docker-image: {in-tree: "lint"}
        max-run-time: 2400
        env:
            LC_ALL: C
            MOZ_SOURCE_DOCS_USE_GOOGLE: "1"
            # Define various variables to make the generation happy and not
            # output `KeyError`s.
            #
            # This occurs when sphinx is processing some of the python, and
            # there is processing going on at the top level. It shows up in
            # automation because there's no build environment setup, and so
            # the python code can't work out what these variables should be.
            # Hence in defining them here we can work around the issue.
            OS_TARGET: Linux
            BIN_SUFFIX: ""
            DLL_PREFIX: ""
            DLL_SUFFIX: ""
        taskcluster-proxy: true
        artifacts:
            - type: file
              name: public/firefox-source-docs-url.txt
              path: /builds/worker/firefox-source-docs-url.txt
            - type: file
              name: public/trees.json
              path: /builds/worker/artifacts/trees.json
            - type: file
              name: public/code-review/issues.json
              path: /builds/worker/issues.json
    run:
        using: run-task
        cwd: '{checkout}'
        command: >
            cp -r $MOZ_FETCHES_DIR/node_modules node_modules &&
            ln -s ../tools/lint/eslint/eslint-plugin-mozilla node_modules &&
            ln -s ../tools/lint/eslint/eslint-plugin-spidermonkey-js node_modules &&
            ./mach doc --upload --no-open --no-serve --write-url /builds/worker/firefox-source-docs-url.txt --dump-trees=/builds/worker/artifacts/trees.json --errors-file=/builds/worker/issues.json
    scopes:
        - secrets:get:project/releng/gecko/build/level-{level}/gecko-docs-upload
    optimization:
        docs: null
    fetches:
        toolchain:
            - linux64-node
            - node-modules
