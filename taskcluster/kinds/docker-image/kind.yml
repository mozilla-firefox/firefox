        definition: debian-raw
        args:
            BASE_IMAGE: ubuntu:bionic
    ubuntu1804-packages:
        symbol: I(ub18-pkg)
        definition: debian-packages
        parent: ubuntu1804-raw
    ubuntu1804-base:
        symbol: I(ub18-base)
        parent: ubuntu1804-raw
        packages:
            - ub18-coreutils
