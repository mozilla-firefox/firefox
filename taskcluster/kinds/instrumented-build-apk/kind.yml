---
loader: taskgraph.loader.transform:loader

transforms:
    - android_taskgraph.transforms.build_android_app:transforms
    - gecko_taskgraph.transforms.job:transforms
    - gecko_taskgraph.transforms.task:transforms

kind-dependencies:
    - toolchain
    - build-fat-aar

task-defaults:
    use-gradle-cache: true
    fetches:
        toolchain:
            - linux64-android-sdk-linux-repack
            - linux64-embedded-uniffi-bindgen
            - linux64-nimbus-fml
            - linux64-jdk-repack
            - linux64-node
    run:
        using: gradlew
    treeherder:
        kind: test
        tier: 1
    run-on-projects: []

tasks:
    fenix:
        description: 'Generate baseline profile apks for fenix.'
        dependencies:
            build-fat-aar: build-fat-aar-android-geckoview-fat-aar/opt
        source-project-name: "fenix"
        run:
            gradle-package-command: ":benchmark:assembleBenchmark :app:assembleBenchmark"
        treeherder:
            symbol: Bpgo(instr)
            platform: fenix-android-all/opt
        worker:
            artifacts:
                - name: "public/build/target.arm64-v8a.apk"
                  path: "/builds/worker/workspace/obj-build/gradle/build/mobile/android/fenix/app/outputs/apk/benchmark/app-arm64-v8a-benchmark.apk"
                  type: "file"
                - name: "public/build/target.noarch.apk"
                  path: "/builds/worker/workspace/obj-build/gradle/build/mobile/android/fenix/benchmark/outputs/apk/benchmark/benchmark-benchmark.apk"
                  type: "file"
            chain-of-trust: true
