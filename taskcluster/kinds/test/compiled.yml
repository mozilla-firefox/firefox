---
task-defaults:
    test-manifest-loader: null  # don't load tests in the taskgraph
    run-without-variant: false
    variants:
        - 1proc
        - inc-origin-init
    virtualization: virtual
    worker-type:
        by-test-platform:
            windows11-64-24h2-asan/.*: win11-64-25h2-large
            windows11-(32|64)-24h2(-ccov|-devedition|-mingwclang|-shippable)?/.*: win11-64-25h2
            windows11-aarch64-24h2(-devedition|-shippable)?/.*: win11-a64-25h2
            android-hw.*: t-bitbar-gw-perf-p6
            default: default
    mozharness:
        script:
            by-test-platform:
                android-em.*: android_emulator_unittest.py
                android-hw.*: android_hardware_unittest.py
                default: desktop_unittest.py
        config:
            by-test-platform:
                android-em-14.*:
                    - android/android_common.py
                    - android/android14-x86_64.py
                android-hw.*:
                    - android/android_common.py
                    - android/android_hw.py
                linux.*:
                    - unittests/linux_unittest.py
                    - remove_executables.py
                macosx.*:
                    - unittests/mac_unittest.py
                windows.*:
                    - unittests/win_unittest.py
    supports-artifact-builds: false

cppunittest:
    description: "CPP Unit Tests"
    suite: cppunittest
    treeherder-symbol: cppunit
    target:
        by-test-platform:
            android-em.*: geckoview-test_runner.apk
            default: null
    tier: default
    run-on-projects:
        by-variant:
            1proc: built-projects
            default: []

gtest:
    description: "GTests run"
    suite: gtest
    treeherder-symbol: GTest
    use-python:
        by-test-platform:
            # DesktopLauncherDownloaderTest spins up `python -m http.server
            # --protocol`, which requires Python >= 3.11; the default fetched
            # CI Python is 3.9. Only the Windows gtest runs that test.
            win.*: "3.11"
            android-hw.*: system
            default: default
    instance-size:
        by-test-platform:
            linux.*: large-noscratch
            windows.*-asan.*: large
            default: default
    run-on-projects:
        by-variant:
            1proc:
                by-test-platform:
                    .*android.*: built-projects
                    .*-devedition.*: []
                    .*-wayland.*: []
                    default: built-projects
            inc-origin-init: []
            default: []
    mozharness:
        extra-options:
            by-variant:
                1proc:
                    by-test-platform:
                        # TSAN adds significant per-process overhead that often
                        # results in timeout, so run gtests as a single
                        # process.
                        .*-tsan.*:
                            - --combine-suites
                        default: []
                inc-origin-init:
                    - --disable-e10s
                    - --enable-inc-origin-init
                    - --filter-set=dom-storage
                default: []
    target:
        by-test-platform:
            android-em.*: geckoview-test_runner.apk
            default: null
    tier: default

jittest:
    description: "JIT Test run"
    suite: jittest
    treeherder-symbol: Jit
    run-on-projects:
        by-variant:
            1proc:
                by-test-platform:
                    android-hw-.*-aarch64(-qr)?/debug: ['mozilla-central', 'release']
                    android-hw-.*-arm7(-qr)?/debug: ['mozilla-central', 'release']
                    default: built-projects
            default: []
    chunks:
        by-test-platform:
            windows.*-ccov.*/opt: 6
            windows.*: 1
            macosx.*/opt: 1
            macosx.*/debug: 3
            android.*/opt: 3
            android-hw-.*-aarch64(-qr)?/debug: 8
            default: 6
    max-run-time:
        by-test-platform:
            windows.*-ccov.*/.*: 1800
            android-hw.*/debug: 3600
            android-hw.*/opt: 2400
            default: 3600
    mozharness:
        chunked:
            by-test-platform:
                windows.*: false
                macosx.*: false
                default: true
    target:
        by-test-platform:
            android-.*: geckoview-test_runner.apk
            default: null
    tier:
        by-test-platform:
            android-hw.*: 2
            default: default

jittest-all:
    description: "JIT Test run with all flags for android arm7 opt"
    suite: jittest
    treeherder-symbol: Jit
    run-on-projects:
        by-variant:
            inc-origin-init: []
            default: ['mozilla-central', 'release']
    chunks:
        by-test-platform:
            android-.*/opt: 3
            android-.*/debug: 6
    max-run-time: 3600
    mozharness:
        chunked: true
        extra-options:
            by-test-platform:
                android.*:
                    - --jittest-flags=all
                default: []
    target:
        by-test-platform:
            android-.*: geckoview-test_runner.apk
            default: null
    tier:
        by-test-platform:
            android-hw.*: 2
            default: default
