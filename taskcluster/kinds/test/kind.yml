---
loader: gecko_taskgraph.loader.test:loader

kind-dependencies:
    - artifact-build
    - build
    - build-signing
    - repackage-signing-shippable-l10n-msix
    - repackage-signing-msix
    - repackage
    - fetch
    - toolchain

transforms:
    - gecko_taskgraph.transforms.test:transforms
    - gecko_taskgraph.transforms.job:transforms
    - gecko_taskgraph.transforms.task:transforms

# Each stanza in a file pointed to by 'jobs-from' describes a particular test
# suite or sub-suite. These are processed through the transformations described
# above to produce a bunch of tasks. See the schema in
# `taskcluster/gecko_taskgraph/transforms/test/__init__.py` for a description of the fields
# used in these files.

# Adding a new test type or running tests on a new platform? Be sure to review
# https://wiki.mozilla.org/Sheriffing/Job_Visibility_Policy

tasks-from:
    - awsy.yml
    - compiled.yml
    - devtools-compat.yml
    - firefox-ui.yml
    - marionette.yml
    - misc.yml
    - talos.yml
    - xpcshell.yml

task-defaults:
    run-on-repo-type: [hg]
    attributes:
        retrigger: true
    use-python:
        by-test-platform:
            # android-hw tasks are driven by the host's script.py wrapper,
            # which imports mozdevice from the host environment; a fetched CI
            # Python would shadow the host Python on PATH and break that import.
            android-hw.*: system
            default: default
    use-uv: true
    require-signed-extensions:
        by-release-type:
            release|esr.*: true
            beta:
                by-test-platform:
                    .*-devedition/.*: false
                    default: true
            default: false
    mozharness:
        requires-signed-builds:
            by-test-platform:
                windows1.*:
                    by-variant:
                        msix: true
                        default: false
                default: false
    docker-image:
        in-tree: ubuntu2404-test
    fetches:
        fetch:
            by-test-platform:
                win.*:
                    - win64-ffmpeg-7.1
                default: []
        toolchain:
            by-test-platform:
                win.*:
                    - win32-minidump-stackwalk
                    - win32-fix-stacks
                macosx.*-64.*:
                    - macosx64-minidump-stackwalk
                    - macosx64-fix-stacks
                macosx.*-aarch64.*:
                    - macosx64-aarch64-minidump-stackwalk
                    - macosx64-aarch64-fix-stacks
                android-em-14.*:
                    - android34-system-image-x86_64-linux
                    - android34-avd-x86_64-linux
                    - android-emulator-linux
                    - linux64-minidump-stackwalk
                    - linux64-fix-stacks
                    - linux64-hostutils
                android-hw.*:
                    - linux64-minidump-stackwalk
                    - linux64-fix-stacks
                    - linux64-hostutils
                default:
                    - linux64-minidump-stackwalk
                    - linux64-fix-stacks
                    - linux64-python3.9-dbus-python
