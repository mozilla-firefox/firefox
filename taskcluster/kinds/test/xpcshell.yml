---
task-defaults:
    worker-type:
        by-test-platform:
            windows11.*-(32|64).*-asan/.*: win11-64-25h2-large
            windows11.*aarch64.*/.*: win11-a64-25h2
            windows11.*/.*: win11-64-25h2
            default: default
    suite:
        category: xpcshell
        name: xpcshell
    target:
        by-test-platform:
            android-em.*: geckoview-test_runner.apk
            windows11-64-24h2.*:
                by-variant:
                    msix: target.installer.msix
                    default: null
            default: null
    mozharness:
        script:
            by-test-platform:
                android-em.*: android_emulator_unittest.py
                default: desktop_unittest.py
        config:
            by-test-platform:
                android-em-14.*:
                    - android/android_common.py
                    - android/android14-x86_64.py
                linux.*:
                    - unittests/linux_unittest.py
                    - unittests/linux_dbus-python.py
                    - remove_executables.py
                macosx.*:
                    - unittests/mac_unittest.py
                windows.*:
                    - unittests/win_unittest.py
        requires-signed-builds:
            by-test-platform:
                macosx.*-artifact/.*: false
                macosx1500.*: true
                windows.*-asan/opt: false    # No XPCShell on ASAN yet
                windows.*-mingwclang/.*: false
                windows.*: true
                default: false

xpcshell:
    description: "xpcshell test run"
    treeherder-symbol: X(X)
    variants:
        - conditioned_profile
        - no-fission
        - msix
        - inc-origin-init
        - privatebrowsing
    instance-size:
        by-variant:
            conditioned_profile:
                by-test-platform:
                    linux.*: large-legacy
                    default: large
            default: highcpu
    run-on-projects:
        by-variant:
            conditioned_profile:
                by-test-platform:
                    .*-artifact.*: []
                    .*-asan.*: []
                    .*-ccov.*: []
                    linux2404-64.*/opt: ['trunk']
                    windows11-64.*/opt: ['trunk']
                    default: []
            no-fission:
                by-test-platform:
                    android-em.*/debug-isolated-process: []
                    android.*: built-projects
                    linux2404-64.*: ['mozilla-central']
                    default: []
            msix:
                by-test-platform:
                    windows11-64-25h2(-shippable)?/opt: built-projects
                    windows11-64-25h2/debug: built-projects
                    default: []
            inc-origin-init: []
            privatebrowsing: []
            default:
                by-test-platform:
                    android.*: built-projects
                    .*-wayland.*: []
                    windows.*-asan/opt: []  # No XPCShell on ASAN yet
                    default: built-projects
    chunks: dynamic
    default-chunks:
        by-test-platform:
            .*-asan.*/opt: 4
            .*-ccov.*: 8
            .*-tsan(-qr)?/opt: 10
            android-em-14.*/debug: 16
            android-em-14.*/opt: 8
            android.*/debug: 10
            android.*/opt: 5
            macosx.*: 2
            linux2404-64.*/opt: 2
            default: 4
    timeoutfactor:
        by-test-platform:
            android-em-14.*: 2
            linux2404-64-asan/opt: 2
            linux2404-64-ccov/opt: 4
            linux2404-64-tsan/opt: 3
            linux2404-64/debug: 2
            linux2204-64-wayland/debug: 2
            macosx1015-64.*: 6
            macosx1470-64/debug: 6
            macosx1470-64.*/opt: 4
            windows.*/debug: 2
            windows11-64-(24h2|25h2)-asan/opt: 2
            windows11-64-(24h2|25h2)-ccov/opt: 3
            default: 1
    max-run-time:
        by-variant:
            msix: 7200
            conditioned_profile: 7200
            default:
                by-test-platform:
                    .*-ccov.*: 7200
                    .*-tsan(-qr)?/opt: 7200
                    default: 5400
    allow-software-gl-layers: false
    tier:
        by-variant:
            no-fission:
                by-test-platform:
                    linux.*: 2
                    default: default
            default:
                by-test-platform:
                    windows.*-asan.*: 3
                    android-em.*/debug-isolated-process: 2
                    default: default
    mozharness:
        extra-options: []
    fetches:
        toolchain:
            by-test-platform:
                linux.*:
                    - linux64-node
                    - linux64-minidump-stackwalk
                    - linux64-fix-stacks
                    - linux-python-dbusmock
                    - linux64-python3.9-dbus-python
                macosx.*-64.*:
                    - macosx64-node
                    - macosx64-minidump-stackwalk
                    - macosx64-fix-stacks
                macosx.*-aarch64.*:
                    - macosx64-aarch64-node
                    - macosx64-aarch64-minidump-stackwalk
                    - macosx64-aarch64-fix-stacks
                win.*-64.*:
                    - win64-node
                    - win32-minidump-stackwalk
                    - win32-fix-stacks
                win.*32.*:
                    - win32-node
                    - win32-minidump-stackwalk
                    - win32-fix-stacks
                android-em-14.*:
                    - android34-system-image-x86_64-linux
                    - android34-avd-x86_64-linux
                    - android-emulator-linux
                    - linux64-node
                    - linux64-minidump-stackwalk
                    - linux64-hostutils

xpcshell-failures:
    description: "xpcshell specific failures test run"
    treeherder-symbol: X-f(X)
    run-on-projects: ["mozilla-central"]
    chunks: 2
    max-run-time: 2700
    allow-software-gl-layers: false
    tier: 3
    mozharness:
        script:
            by-test-platform:
                macosx.*: mac_unittest.py
                windows1.*: desktop_unittest.py
        config:
            by-test-platform:
                macosx.*:
                    - unittests/mac_unittest.py
                windows1.*:
                    - unittests/win_unittest.py
        extra-options:
            by-test-platform:
                macosx1500.*:
                    - --run-failures=apple_silicon
                    - --timeout-as-pass
                    - --crash-as-pass
    fetches:
        toolchain:
            by-test-platform:
                macosx.*-64.*:
                    - macosx64-node
                    - macosx64-minidump-stackwalk
                    - macosx64-fix-stacks
                macosx.*-aarch64.*:
                    - macosx64-aarch64-node
                    - macosx64-aarch64-minidump-stackwalk
                    - macosx64-aarch64-fix-stacks
                win.*32.*:
                    - win32-node
                    - win32-minidump-stackwalk
                    - win32-fix-stacks
