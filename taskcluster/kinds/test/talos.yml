---
task-defaults:
    max-run-time: 3600
    suite: talos
    dependencies:
        by-test-platform:
            macosx(1500|2700)-aarch64(-vms)?-shippable/.*:
                build: build-macosx64-aarch64-shippable/opt
            default: {}
    use-python: system
    use-caches:
        by-test-platform:
            windows.*: [checkout, pip]
            default: [checkout, pip, uv]
    virtualization: hardware
    mozharness:
        script: talos_script.py
        config:
            by-test-platform:
                macosx.*:
                    - talos/mac_config.py
                windows.*:
                    - talos/windows_config.py
                default:
                    - talos/linux_config.py
    test-manifest-loader: null  # don't load tests in the taskgraph

talos-bcv:
    description: Talos basic compositor video
    try-name: bcv
    treeherder-symbol: T(bcv)
    variants:
        - webrender-sw
    run-on-projects:
        by-variant:
            webrender-sw:
                by-test-platform:
                    linux2404-64-shippable/opt: [trunk]
                    windows11-64.*(-qr)?/opt: [trunk]
                    macosx.*(-qr)?/opt: [trunk]
                    default: []
            default: [trunk]
    max-run-time: 1800
    mozharness:
        extra-options:
            - --suite=bcv

talos-bcv-profiling:
    description: Talos basic compositor video with gecko profiling
    try-name: bcv-prof
    treeherder-symbol: T-Prof(bcv)
    tier: 2
    run-on-projects: []
    max-run-time: 1800
    mozharness:
        extra-options:
            - --suite=bcv
            - --gecko-profile

