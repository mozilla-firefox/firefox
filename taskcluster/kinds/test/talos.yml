talos-xperf:
    description: Talos xperf
    try-name: xperf
    treeherder-symbol: T(x)
    virtualization: virtual
    os-groups: [Administrators]
    worker-type:
        by-test-platform:
            windows11-64-25h2(-shippable)?/opt: win11-64-25h2-privileged
            default: default
    run-as-administrator:
        by-test-platform:
            windows.*32.*: false
            windows11.*64.*: true
    variants:
        - webrender-sw
    run-on-projects:
        by-test-platform:
            windows.*-shippable(-qr)?/.*: [trunk]
            default: []
    mozharness:
        extra-options:
            by-test-platform:
                windows.*:
                    - --suite=xperf
                    # Disable the GPU process due to bug 1868737. There are
                    # sandbox related issues with using the GPU process when
                    # running xperf as an administrator which cause us to fail
                    # due to generating minidumps.
                    - --setpref=layers.gpu-process.enabled=false
                    # On these runs in particular, the Windows App SDK crashes
                    # when initializing because DCompositionCreateDevice3()
                    # fails with ERROR_ACCESS_DENIED. This only seems to happen
                    # on this kind of run, so disable the Windows App SDK.
                    - --setpref=widget.windows.windowsappsdk.enabled=false
                default:
                    - --suite=xperf
        config:
            by-test-platform:
                windows.*:
                    - talos/windows_vm_config.py

