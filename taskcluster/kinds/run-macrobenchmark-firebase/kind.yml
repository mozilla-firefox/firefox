---
loader: taskgraph.loader.transform:loader

transforms:
    - taskgraph.transforms.task_context
    # While not a build, the build optimization works well for these tasks.
    - gecko_taskgraph.transforms.build_schedules:transforms
    - gecko_taskgraph.transforms.job:transforms
    - gecko_taskgraph.transforms.task:transforms

kind-dependencies:
    - toolchain
    - instrumented-build-macrobenchmark-apk

task-defaults:
    run-on-projects: []
    attributes:
        build_platform: android
        build-type: debug
        retrigger: true
    task-context:
        from-parameters:
            level: level
        substitution-fields:
            - routes
            - scopes
            - extra.notify
    worker-type: b-linux-medium
    worker:
        docker-image: {in-tree: android-ui-tests}
        max-run-time: 7200
        env:
            GOOGLE_APPLICATION_CREDENTIALS: '.firebase_token.json'
            MOZ_PERFHERDER_UPLOAD: /builds/worker/build/perfherder-data-macrobenchmark.json
        artifacts:
            - name: public
              path: /builds/worker/artifacts
              type: directory
            - name: public/build/perfherder-data-macrobenchmark.json
              path: /builds/worker/build/perfherder-data-macrobenchmark.json
              type: file
        retry-exit-status: [20]
    treeherder:
        kind: test
        tier: 1
    run:
        using: run-commands
        dummy-secrets:
            - content: "faketoken"
              path: .adjust_token
    routes:
        by-level:
            '3':
                - notify.slack-channel.C099TSHR7GB.on-failed
            'default': []
    scopes:
        by-level:
            '3':
                - queue:route:notify.slack-channel.C099TSHR7GB.on-failed
                - notify:slack-channel:C099TSHR7GB
            'default': []
    extra:
        notify:
            by-level:
                '3':
                    slackText: 'https://firefox-ci-tc.services.mozilla.com/tasks/${{status.taskId}} | ${{task.metadata.name}} | ${{task.metadata.source}}'
                    slackBlocks: |
                        [
                          {{
                            "type": "header",
                            "text": {{
                              "type": "plain_text",
                              "text": "firefox-android :firefox: ${{task.metadata.name}} :x:\n "
                            }}
                          }},
                          {{
                            "type": "table",
                            "rows": [
                              [
                                {{
                                  "type": "rich_text",
                                  "elements": [
                                    {{
                                      "type": "rich_text_section",
                                      "elements": [
                                        {{
                                          "type": "text",
                                          "text": "Task",
                                          "style": {{ "bold": true }}
                                        }}
                                      ]
                                    }}
                                  ]
                                }},
                                {{
                                  "type": "rich_text",
                                  "elements": [
                                    {{
                                      "type": "rich_text_section",
                                      "elements": [
                                        {{
                                          "type": "link",
                                          "url": "https://firefox-ci-tc.services.mozilla.com/tasks/${{status.taskId}}",
                                          "text": "Taskcluster"
                                        }}
                                      ]
                                    }}
                                  ]
                                }}
                              ],
                              [
                                {{
                                  "type": "rich_text",
                                  "elements": [
                                    {{
                                      "type": "rich_text_section",
                                      "elements": [
                                        {{
                                          "type": "text",
                                          "text": "Owner",
                                          "style": {{ "bold": true }}
                                        }}
                                      ]
                                    }}
                                  ]
                                }},
                                {{
                                  "type": "raw_text",
                                  "text": "${{task.metadata.owner}}"
                                }}
                              ],
                              [
                                {{
                                  "type": "rich_text",
                                  "elements": [
                                    {{
                                      "type": "rich_text_section",
                                      "elements": [
                                        {{
                                          "type": "text",
                                          "text": "Source",
                                          "style": {{ "bold": true }}
                                        }}
                                      ]
                                    }}
                                  ]
                                }},
                                {{
                                  "type": "rich_text",
                                  "elements": [
                                    {{
                                      "type": "rich_text_section",
                                      "elements": [
                                        {{
                                          "type": "link",
                                          "url": "${{task.payload.env.GECKO_BASE_REPOSITORY}}/rev/${{task.payload.env.GECKO_HEAD_REV}}",
                                          "text": "Commit"
                                        }},
                                        {{
                                          "type": "text",
                                          "text": " "
                                        }},
                                        {{
                                          "type": "emoji",
                                          "name": "hg"
                                        }}
                                      ]
                                    }}
                                  ]
                                }}
                              ]
                            ]
                          }},
                          {{
                            "type": "context",
                            "elements": [
                              {{
                                "type": "mrkdwn",
                                "text": ":android: Refer to https://mozilla-hub.atlassian.net/wiki/x/SwCjZw for more information on baseline profiles."
                              }}
                            ]
                          }}
                        ]
                'default': {}

tasks:
    fenix:
        attributes:
            build-type: fenix-debug-firebase
        description: Run macrobenchmark for Fenix
        dependencies:
            instrumented-apk: instrumented-build-macrobenchmark-apk-fenix
        fetches:
            instrumented-apk:
                - artifact: target.arm64-v8a.apk
                  extract: false
                - artifact: target.noarch.apk
                  extract: false
        run:
            secrets:
                - name: project/gecko/level-any/firefox-android/fenix/firebase
                  key: firebaseToken
                  path: mobile/android/test_infra/.firebase_token.json
                  json: true
            commands:
                - [python3, taskcluster/scripts/tests/test-lab.py, fenix/arm64-v8a-macrobenchmark.yml, /builds/worker/fetches/target.arm64-v8a.apk, --apk_test, /builds/worker/fetches/target.noarch.apk]
                - [python3, taskcluster/scripts/tests/copy-artifacts-from-ftl.py, "macrobenchmark"]
                - [python3, taskcluster/scripts/tests/compute-macrobenchmark-results.py, "/builds/worker/artifacts/build/macrobenchmark", "/builds/worker/artifacts/build/macrobenchmark.txt"]
        treeherder:
            platform: fenix-android-all/opt
            symbol: fenix(run)
        worker:
            env:
                GOOGLE_PROJECT: moz-fenix
