# XXX: We can consolidate this once bug 1865852 lands.
perftest-accessibility:
    description: Run accessibility performance tests
    treeherder:
        symbol: perftest(a11y)
        tier: 2
    attributes:
        batch: false
        cron: false
    run-on-projects: [autoland, mozilla-central]
    run:
        clone-with: hg
        command: >-
            mkdir -p $MOZ_FETCHES_DIR/../artifacts &&
            cd $MOZ_FETCHES_DIR &&
            python3 python/mozperftest/mozperftest/runner.py
            --mochitest-binary ${MOZ_FETCHES_DIR}/firefox/firefox.exe
            --flavor mochitest
            --output $MOZ_FETCHES_DIR/../artifacts
            accessible/tests/browser/performance/browser_addManyIds.js
            && python3 python/mozperftest/mozperftest/runner.py
            --mochitest-binary ${MOZ_FETCHES_DIR}/firefox/firefox.exe
            --flavor mochitest
            --output $MOZ_FETCHES_DIR/../artifacts
            accessible/tests/browser/performance/browser_addManyNodes.js
            && python3 python/mozperftest/mozperftest/runner.py
            --mochitest-binary ${MOZ_FETCHES_DIR}/firefox/firefox.exe
            --flavor mochitest
            --output $MOZ_FETCHES_DIR/../artifacts
            accessible/tests/browser/performance/browser_reflowPseudoelements.js
            && python3 python/mozperftest/mozperftest/runner.py
            --mochitest-binary ${MOZ_FETCHES_DIR}/firefox/firefox.exe
            --flavor mochitest
            --output $MOZ_FETCHES_DIR/../artifacts
            accessible/tests/browser/performance/browser_removeManySpellingErrors.js
            && python3 python/mozperftest/mozperftest/runner.py
            --mochitest-binary ${MOZ_FETCHES_DIR}/firefox/firefox.exe
            --flavor mochitest
            --output $MOZ_FETCHES_DIR/../artifacts
            accessible/tests/browser/performance/browser_implicitRoleARIAExpanded.js
            && python3 python/mozperftest/mozperftest/runner.py
            --mochitest-binary ${MOZ_FETCHES_DIR}/firefox/firefox.exe
            --flavor mochitest
            --output $MOZ_FETCHES_DIR/../artifacts
            accessible/tests/browser/performance/browser_bounds.js
            && python3 python/mozperftest/mozperftest/runner.py
            --mochitest-binary ${MOZ_FETCHES_DIR}/firefox/firefox.exe
            --flavor mochitest
            --output $MOZ_FETCHES_DIR/../artifacts
            accessible/tests/browser/performance/browser_displayContentsBounds.js
