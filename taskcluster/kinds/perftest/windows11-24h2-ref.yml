---
task-defaults:
    worker-type: win11-64-24h2-hw-ref
    fetches:
        build:
            - artifact: target.condprof.tests.tar.zst
            - artifact: target.common.tests.tar.zst
            - artifact: target.mochitest.tests.tar.zst
            - artifact: target.perftests.tests.tar.zst
            - artifact: target.zip
        toolchain:
            - win64-node
            - win64-geckodriver
            - browsertime
    platform: windows11-64-24h2-hw-ref-shippable/opt
    require-build:
        windows11-64-24h2-hw-ref-shippable/opt: build-win64-shippable/opt
    scopes:
        - secrets:get:project/releng/gecko/build/level-{level}/conditioned-profiles

ml-perf-wasm: &ml-perf
    fetches:
        fetch:
            - ort.jsep.wasm
            - xenova-all-minilm-l6-v2
    description: Run ML Models Perf Tests (wasm onnx backend)
    treeherder:
        symbol: perftest(ml-perf-w)
        tier: 2
    attributes:
        batch: false
        cron: false
    run-on-projects: [mozilla-central]
    worker:
        env:
            MOZ_ML_BACKENDS: onnx
    run:
        clone-with: hg
        command: >-
            mkdir -p $MOZ_FETCHES_DIR/../artifacts &&
            cd $MOZ_FETCHES_DIR &&
            python3 python/mozperftest/mozperftest/runner.py
            --mochitest-binary ${MOZ_FETCHES_DIR}/firefox/firefox.exe
            --flavor mochitest
            --output $MOZ_FETCHES_DIR/../artifacts
            --hooks toolkit/components/ml/tests/tools/hooks_local_hub.py
            toolkit/components/ml/tests/browser/browser_ml_engine_perf.js

ml-perf-native:
    <<: *ml-perf
    description: Run ML Models Perf Tests (native onnxruntime backend)
    treeherder:
        symbol: perftest(ml-perf-n)
        tier: 2
    worker:
        env:
            MOZ_ML_BACKENDS: onnx-native

