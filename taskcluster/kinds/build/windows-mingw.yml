---
task-defaults:
    worker-type: b-linux-docker-amd
    index:
        product: firefox
    treeherder:
        platform: windows-mingw32/all
        tier: 2
    worker:
        max-run-time: 7200
        env:
            MOZ_AUTOMATION_PACKAGE_TESTS: "1"
    run:
        using: mozharness
        actions: [build]
        script: mozharness/scripts/fx_desktop_build.py
        config:
            - builds/releng_base_firefox.py
            - builds/releng_base_windows_mingw_builds.py
    run-on-projects:
        - 'mozilla-central'
        - 'mozilla-esr153'
    use-sccache: true
    optimization:
        skip-unless-expanded: null
    fetches:
        fetch:
            - windows-rs
        toolchain:
            - mingw32-rust
            - linux64-7zz
            - linux64-upx
            - linux64-wine
            - linux64-sccache
            - linux64-cbindgen
            - linux64-nasm
            - linux64-node
            - linux64-mingw32-nsis
            - linux64-mingw-fxc2-x86
            - linux64-dump_syms
            - sysroot-x86_64-linux-gnu
            - sysroot-wasm32-wasi

win32-mingwclang/opt:
    description: "Win32 MinGW-Clang Opt"
    index:
        job-name: win32-mingwclang-opt
    treeherder:
        symbol: WMC32(Bo)
    worker:
        env:
            PERFHERDER_EXTRA_OPTIONS: "opt 32 clang"
    mozconfig:
        variant: mingwclang
    run:
        config:
            - builds/releng_sub_windows_configs/32_mingwclang.py
    fetches:
        toolchain:
            - linux64-clang-mingw-x86
            - winappsdk-x86-pc-windows-msvc

win32-mingwclang/debug:
    description: "Win32 MinGW-Clang Debug"
    index:
        job-name: win32-mingwclang-debug
    treeherder:
        symbol: WMC32(Bd)
    worker:
        env:
            PERFHERDER_EXTRA_OPTIONS: "debug 32 clang"
    mozconfig:
        variant: mingwclang-debug
    run:
        config:
            - builds/releng_sub_windows_configs/32_mingwclang.py
    fetches:
        toolchain:
            - linux64-clang-mingw-x86
            - winappsdk-x86-pc-windows-msvc

win64-mingwclang/opt:
    description: "Win64 MinGW-Clang Opt"
    index:
        job-name: win64-mingwclang-opt
    treeherder:
        symbol: WMC64(Bo)
    worker:
        env:
            PERFHERDER_EXTRA_OPTIONS: "opt 64 clang"
    mozconfig:
        variant: mingwclang
    run:
        config:
            - builds/releng_sub_windows_configs/64_mingwclang.py
    fetches:
        toolchain:
            - linux64-clang-mingw-x64
            - winappsdk-x86_64-pc-windows-msvc

win64-mingwclang/debug:
    description: "Win64 MinGW-Clang Debug"
    index:
        job-name: win64-mingwclang-debug
    treeherder:
        symbol: WMC64(Bd)
    worker:
        env:
            PERFHERDER_EXTRA_OPTIONS: "debug 64 clang"
    mozconfig:
        variant: mingwclang-debug
    run:
        config:
            - builds/releng_sub_windows_configs/64_mingwclang.py
    fetches:
        toolchain:
            - linux64-clang-mingw-x64
            - winappsdk-x86_64-pc-windows-msvc
