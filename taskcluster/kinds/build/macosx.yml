        type: shippable
    treeherder:
        platform: osx-cross-devedition/opt
        symbol: Bx
        tier: 1
    worker:
        max-run-time: 7200
        env:
            MOZ_AUTOMATION_PACKAGE_TESTS: "1"
            MOZ_GENERATE_SBOM: "1"
            SOURCE_DATE_EPOCH: "{build_date}"
    mozconfig:
        variant: devedition
    run:
        config:
            - builds/releng_base_firefox.py
