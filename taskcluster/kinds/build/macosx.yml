---
task-defaults:
    index:
        product: firefox
    worker-type: b-linux-docker-large-amd
    worker:
        artifacts:
            - name: public/build/security/{browser_entitlement}.xml
              path: checkouts/gecko/security/mac/hardenedruntime/{entitlement_directory}/{browser_entitlement}.xml
              type: file
            - name: public/build/security/media-plugin-helper.xml
              path: checkouts/gecko/security/mac/hardenedruntime/{entitlement_directory}/media-plugin-helper.xml
              type: file
            - name: public/build/security/plugin-container.xml
              path: checkouts/gecko/security/mac/hardenedruntime/{entitlement_directory}/plugin-container.xml
              type: file
            - name: public/build/security/security-module-helper.xml
              path: checkouts/gecko/security/mac/hardenedruntime/{entitlement_directory}/security-module-helper.xml
              type: file
    run:
        using: mozharness
        actions: [get-secrets, build]
        secrets: true
        script: "mozharness/scripts/fx_desktop_build.py"
    fetches:
        toolchain:
            - linux64-dump_syms
            - linux64-hfsplus
            - linux64-libdmg
            - linux64-rust-macos
            - linux64-rust-size
            - linux64-cbindgen
            - linux64-nasm
            - linux64-node
            - sysroot-x86_64-linux-gnu

macosx64/debug:
    description: "MacOS X x64 Cross-compile"
    index:
        job-name: macosx64-debug
    attributes:
        enable-build-signing: true
        enable-full-crashsymbols: true
    treeherder:
        platform: osx-cross/debug
        symbol: B
        tier: 1
    worker:
        max-run-time: 5400
        env:
            MOZ_AUTOMATION_PACKAGE_TESTS: "1"
    mozconfig:
        variant: debug
    run:
        config:
            - builds/releng_base_firefox.py
            - builds/releng_base_mac_64_cross_builds.py
        custom-build-variant-cfg: cross-debug
    use-sccache: true
    use-python: "3.11"
    fetches:
        toolchain:
            - linux64-clang
            - linux64-sccache
            - macosx64-sdk
            - sysroot-wasm32-wasi
            - onnxruntime-x86_64-apple-darwin

macosx64-aarch64/debug:
    description: "MacOS X Aarch64 Cross-compile"
    index:
        job-name: macosx64-aarch64-debug
    attributes:
        enable-build-signing: true
        enable-full-crashsymbols: true
    treeherder:
        platform: osx-cross-aarch64/debug
        symbol: B
        tier: 1
    worker:
        max-run-time: 5400
        env:
            MOZ_AUTOMATION_PACKAGE_TESTS: "1"
            PERFHERDER_EXTRA_OPTIONS: aarch64
    mozconfig:
