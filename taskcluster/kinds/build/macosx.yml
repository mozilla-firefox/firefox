            - artifact: target.jittest.tests.tar.zst
              dest: x64/jittest
            - artifact: target.jsreftest.tests.tar.zst
              dest: x64/jsreftest
            - artifact: target.mochitest.tests.tar.zst
              dest: x64/mochitest
            - artifact: target.reftest.tests.tar.zst
              dest: x64/reftest
            - artifact: target.talos.tests.tar.zst
              dest: x64/talos
            - artifact: target.raptor.tests.tar.zst
              dest: x64/raptor
            - artifact: target.condprof.tests.tar.zst
              dest: x64/confprof
            - artifact: target.awsy.tests.tar.zst
              dest: x64/awsy
            - artifact: target.xpcshell.tests.tar.zst
              dest: x64/xpcshell
            - artifact: target.web-platform.tests.tar.zst
              dest: x64/web-platform
            - artifact: target.updater-dep.tests.tar.zst
              dest: x64/updater-dep
            - artifact: target.crashreporter-symbols.zip
              dest: x64/crashreporter-symbols
            - artifact: target.crashreporter-symbols-gtest.zip
              dest: x64/crashreporter-symbols-gtest
            - artifact: target.jsshell.zip
              dest: x64/jsshell
            - artifact: target.update_framework_artifacts.zip
              dest: x64/update_framework_artifacts
            - artifact: target.generated-files.tar.gz
