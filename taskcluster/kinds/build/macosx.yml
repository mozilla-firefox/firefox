macosx64-devedition/opt:
    description: "MacOS X Dev Edition Universal"
    worker-type: b-linux-docker-amd
    attributes:
        shippable: true
        enable-build-signing: true
        skip-upload-crashsymbols: true
        skip-verify-test-packaging: true
    shipping-phase: build
    shipping-product: devedition
    index:
        product: devedition
        job-name: macosx64-opt
        type: shippable
    treeherder:
        platform: osx-cross-devedition/opt
        symbol: B
        tier: 1
    run-on-projects: ['mozilla-beta']
    worker:
        max-run-time: 1800
    mozconfig: null
    run:
        job-script: taskcluster/scripts/misc/unify.sh
        config:
            - builds/releng_base_firefox.py
    dependencies:
        macosx64-x64-devedition-opt: build-macosx64-x64-devedition/opt
        macosx64-aarch64-devedition-opt: build-macosx64-aarch64-devedition/opt
    fetches:
        macosx64-x64-devedition-opt:
            - artifact: target.dmg
              extract: false
              dest: x64
            - artifact: sbom.json
              extract: false
              dest: x64
            - artifact: sbom-build-tooling.json
              extract: false
              dest: x64
            - artifact: buildhub.json
              extract: false
              dest: ../artifacts
            - artifact: host/bin/mar
              extract: false
              dest: ../artifacts/host/bin
            - artifact: host/bin/mbsdiff
              extract: false
              dest: ../artifacts/host/bin
            - artifact: target.txt
              extract: false
              dest: ../artifacts
            - artifact: target_info.txt
              extract: false
              dest: ../artifacts
            - artifact: target.json
              extract: false
              dest: ../artifacts
            - artifact: target.mozinfo.json
              extract: false
              dest: ../artifacts
            - artifact: target.test_packages.json
              extract: false
              dest: ../artifacts
            - artifact: target.perftests.tests.tar.zst
              extract: false
              dest: ../artifacts
            - artifact: target.xpt_artifacts.zip
              extract: false
              dest: ../artifacts
            - artifact: target.common.tests.tar.zst
