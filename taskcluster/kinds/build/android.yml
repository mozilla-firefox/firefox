# Nightly-as-release builds compile the nightly source with a release
# milestone (--as-milestone=release).
# This will allow performance tests to measure the release
# configuration, similar to the nightly as release variant on Desktop
# platforms
android-aarch64-nightlyasrelease/opt:
    description: "Android AArch64 Nightly-As-Release"
    use-pgo: android-aarch64-nightlyasrelease/opt
    attributes:
        enable-full-crashsymbols: true
    index:
        job-name: android-aarch64-nightlyasrelease-opt
    treeherder:
        platform: android-5-0-aarch64-nightlyasrelease/opt
        symbol: Bpgo(Bnar)
    run-on-projects: []
    worker-type: b-linux-docker-xlarge-amd
    worker:
        env:
            TOOLTOOL_MANIFEST: "mobile/android/config/tooltool-manifests/android/releng.manifest"
            MOZ_AUTOMATION_PACKAGE_TESTS: "1"
            PERFHERDER_EXTRA_OPTIONS: nightly-as-release
    mozconfig:
        variant: nightly-as-release
    run:
        actions: [get-secrets, build]
        config: [taskcluster_nightly.py]
        custom-build-variant-cfg: aarch64
        extra-config:
            # This build makes test packages (MOZ_AUTOMATION_PACKAGE_TESTS)
            # for the browsertime task. A multi-locale build puts them in
            # en-US/. The android-hw harness needs top-level packages.
            multi_locale: false
    fetches:
        toolchain:
            - linux64-clang
            - linux64-rust-android
            - android-gradle-dependencies
