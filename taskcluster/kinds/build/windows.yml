win32-shippable/opt:
    description: "Win32 Opt Shippable"
    use-pgo: true
    index:
        product: firefox
        job-name: win32-opt
        type: shippable
    attributes:
        shippable: true
        enable-full-crashsymbols: true
    stub-installer:
        by-release-type:
            nightly: true
            beta: true
            release: true
            esr.*: false
            default:
                by-project:
                    # browser/confvars.sh looks for nightly-try
                    try: true
                    default: false
    shipping-phase: build
    shipping-product: firefox
    treeherder:
        platform: windows2012-32-shippable/opt
        symbol: Bpgo(B)
        tier: 1
    run-on-projects: ['release']
    worker:
        max-run-time: 10800
        env:
            MOZ_AUTOMATION_PACKAGE_TESTS: "1"
            MOZ_GENERATE_SBOM: "1"
            SOURCE_DATE_EPOCH: "{build_date}"
    mozconfig:
        platform: win32
    run:
        actions: [get-secrets, build]
        options: [append-env-variables-from-configs]
        script: mozharness/scripts/fx_desktop_build.py
        secrets: true
        config:
            - builds/releng_base_firefox.py
              builds/releng_base_linux_64_builds.py
            - taskcluster_nightly.py
    fetches:
        toolchain:
            - linux64-7zz
            - linux64-clang
            - linux64-rust-cross
            - linux64-rust-size
            - linux64-nasm
            - linux64-node
            - linux64-cbindgen
            - linux64-dump_syms
            - linux64-upx
            - linux64-winchecksec
            - linux64-wine
            - nsis
            - sysroot-x86_64-linux-gnu
            - sysroot-wasm32-wasi
            - vs
            - onnxruntime-i686-windows-msvc
            - winappsdk-x86-pc-windows-msvc

