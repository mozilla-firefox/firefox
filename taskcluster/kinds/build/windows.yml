---
task-defaults:
    worker-type: b-linux-docker-amd
    run:
        using: mozharness
    fetches:
        fetch:
            - windows-rs

win32/debug:
    description: "Win32 Debug"
    index:
        product: firefox
        job-name: win32-debug
    attributes:
        enable-build-signing: true
        enable-full-crashsymbols: true
    treeherder:
        platform: windows2012-32/debug
        symbol: B
        tier: 1
    worker:
        max-run-time: 7200
        env:
            MOZ_AUTOMATION_PACKAGE_TESTS: "1"
    mozconfig:
        variant: debug
        platform: win32
    run:
        options: [append-env-variables-from-configs]
        actions: [get-secrets, build]
        script: mozharness/scripts/fx_desktop_build.py
        secrets: true
        config:
            - builds/releng_base_firefox.py
            - builds/releng_base_linux_64_builds.py
            - builds/taskcluster_sub_win32/debug.py
    use-sccache: true
    fetches:
        toolchain:
            - linux64-7zz
            - linux64-clang
            - linux64-rust-cross
            - linux64-rust-size
            - linux64-nasm
            - linux64-node
            - linux64-cbindgen
            - linux64-dump_syms
            - linux64-sccache
            - linux64-upx
            - linux64-winchecksec
            - linux64-wine
            - nsis
            - sysroot-x86_64-linux-gnu
            - sysroot-wasm32-wasi
            - vs
            - onnxruntime-i686-windows-msvc
            - winappsdk-x86-pc-windows-msvc

