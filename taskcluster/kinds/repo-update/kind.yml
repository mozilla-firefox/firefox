---
loader: taskgraph.loader.transform:loader

transforms:
    - taskgraph.transforms.task_context
    - gecko_taskgraph.transforms.repo_update:transforms
    - gecko_taskgraph.transforms.job:transforms
    - gecko_taskgraph.transforms.task:transforms

task-defaults:
    run-on-projects: []  # Only run via cron
    worker-type: b-linux-medium
    run:
        using: run-task
        checkout: true
        sparse-profile: periodic-updates
        command: /runme.sh
    worker:
        os: linux
        docker-image: {in-tree: periodic-updates}
        env:
            REVIEWERS: "#release-managers"
        taskcluster-proxy: true
        artifacts:
            - name: 'public/build/nsSTSPreloadList.diff'
              path: '/home/worker/artifacts/nsSTSPreloadList.diff'
              type: file
            - name: 'public/build/StaticHPKPins.h.diff'
              path: '/home/worker/artifacts/StaticHPKPins.h.diff'
              type: file
            - name: 'public/build/hsts-probe-results.json'
              path: '/home/worker/artifacts/hsts-probe-results.json'
              type: file
    treeherder:
        kind: build
        platform: linux64/opt
        tier: 1
    scopes:
        - secrets:get:project/releng/gecko/build/level-{level}/arc-phabricator-token

tasks:
    pinning-update:
        description: HSTS and HPKP pinning update
        worker-type: b-linux
        task-context:
            from-parameters:
                project: project
            substitution-fields:
                - worker.env.DO_HSTS
                - worker.env.DO_HPKP
                - worker.env.USE_MOZILLA_CENTRAL
        treeherder:
            symbol: hfu
        index:
            product: firefox
            job-name: pinning-update
        worker:
            max-run-time: 3600
            env:
                DO_HSTS:
                    by-project:
                        mozilla-(central|beta): "1"
                        default: ""
                DO_HPKP:
                    by-project:
                        mozilla-(central|beta): "1"
                        default: ""
                USE_MOZILLA_CENTRAL:
                    by-project:
                        mozilla-central|try: "1"
                        default: ""

    periodic-file-update:
        description:
            by-project:
                mozilla-esr.*: Remote settings, suffix list, mobile experiments, mobile merino manifest, CT log, HSTS and HPKP pinning update
                default: Remote settings, suffix list, mobile experiments, mobile merino manifest, and CT log update
        worker-type:
            by-project:
                mozilla-esr.*: b-linux
                default: b-linux-medium
        task-context:
            from-parameters:
                project: project
            substitution-fields:
                - worker-type
                - worker.max-run-time
                - worker.env.DO_HSTS
                - worker.env.DO_HPKP
                - worker.env.DO_REMOTE_SETTINGS
                - worker.env.DO_SUFFIX_LIST
                - worker.env.DO_MOBILE_EXPERIMENTS
                - worker.env.DO_MOBILE_MERINO_MANIFEST
                - worker.env.DO_CT_LOGS
        treeherder:
            symbol: pfu
        index:
            product: firefox
            job-name: periodic-file-update
        worker:
            max-run-time:
                by-project:
                    mozilla-esr.*: 3600
                    default: 1200
            env:
                HSTS_RESULTS_JOB: periodic-file-update
                DO_HSTS:
                    by-project:
                        mozilla-esr.*: "1"
                        default: ""
                DO_HPKP:
                    by-project:
                        mozilla-esr.*: "1"
                        default: ""
                DO_REMOTE_SETTINGS:
                    by-project:
                        mozilla-(central|beta|release|esr.*): "1"
                        default: ""
                DO_SUFFIX_LIST:
                    by-project:
                        mozilla-(central|beta|esr.*): "1"
                        default: ""
                DO_MOBILE_EXPERIMENTS:
                    by-project:
                        mozilla-(central|beta|release): "1"
                        default: ""
                DO_MOBILE_MERINO_MANIFEST:
                    by-project:
                        mozilla-(central|beta|release): "1"
                        default: ""
                DO_CT_LOGS:
                    by-project:
                        mozilla-(central|beta|esr.*): "1"
                        default: ""
            artifacts:
                - name: 'public/build/remote-settings.diff'
                  path: '/home/worker/artifacts/remote-settings.diff'
                  type: file
                - name: 'public/build/effective_tld_names.diff'
                  path: '/home/worker/artifacts/effective_tld_names.diff'
                  type: file
                - name: 'public/build/initial_experiments.diff'
                  path: '/home/worker/artifacts/initial_experiments.diff'
                  type: file
                - name: 'public/build/merino_manifest.diff'
                  path: '/home/worker/artifacts/merino_manifest.diff'
                  type: file
