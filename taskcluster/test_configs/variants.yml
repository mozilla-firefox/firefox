---
1proc:
    description: "{description} with e10s disabled"
    component: "Testing::General"
    expiration: "never"
    suffix: "1proc"
    mozinfo: "e10s"
    merge:
        mozharness:
            extra-options:
                - "--disable-e10s"
                - "--disable-fission"

confirm-failure:
    description: "{description} with confirm failures enabled"
    component: "Testing::General"
    expiration: "never"
    suffix: "cf"

headless:
    description: "{description} without a window"
    component: "Firefox::Headless"
    expiration: "never"
    suffix: "headless"
    mozinfo: "headless"
    replace:
        tier: 2
    when:
        $eval: '(
                    "linux" in task["test-platform"]
                    && (
                        "mochitest-plain" in task["try-name"]
                        || "marionette" in task["try-name"]
                    )
                )
                || "web-platform-tests-wdspec" == task["try-name"]'
    merge:
        mozharness:
            extra-options:
                - "--headless"

a11y-checks:
    description: "{description} with accessibility checks enabled"
    component: "Core::Disability Access APIs"
    expiration: "2027-03-01"
    suffix: "a11y-checks"
    mozinfo: "a11y_checks"
    replace:
        tier: 2
    when:
        $eval: '(
                    "linux" in task["test-platform"]
                    && "opt" in task["test-platform"]
                    && !(
                        "asan" in task["test-platform"]
                        || "tsan" in task["test-platform"]
                        || "ccov" in task["test-platform"]
                    )
                ) && (
                    "mochitest-devtools-chrome" == task["try-name"]
                    || "mochitest-browser-chrome" == task["try-name"]
                    || "mochitest-browser-chrome-thunderbird" == task["try-name"]
                )'
    merge:
        mozharness:
            extra-options:
                - "--enable-a11y-checks"

aab:
    description: "{description} with aab test_runner"
    component: "GeckoView::General"
    expiration: "2027-03-01"
    when: &gv_e10s_filter
        $eval: '"android" in task["test-platform"]'
    suffix: "aab"
    # Need to add jdk but there isn't a good way to do that
    # so we just replace the toolchain list
    merge:
        fetches:
            toolchain:
                by-test-platform:
                    android-em-14.*:
                        - android34-system-image-x86_64-linux
                        - android34-avd-x86_64-linux
                        - android-emulator-linux
                        - linux64-minidump-stackwalk
                        - linux64-fix-stacks
                        - linux64-jdk
                        - linux64-hostutils
                        - linux64-samply
                        - profiler-node-tools
    replace:
        target: "geckoview-test_runner.aab"

trainhop-release:
    description: Mochitest-browser for Newtab using latest Release builds
    component: "Firefox::New Tab Page"
    suffix: "trainhop-rel"
    mozinfo: "trainhop"
    expiration: "never"
    merge:
        worker:
            env:
                MOZHARNESS_TEST_TAG:
                    - "newtab"
        mozharness:
            chunked: false
            extra-options:
                - --install-extension=newtab.xpi
                # Setting these to "any" allows us to install the newtab.xpi
                # regardless of what version it is.
                - --setpref=browser.newtabpage.trainhopAddonDeployment.version=any
        dependencies:
            newtab-xpi-job: build-extensions-browser
    replace:
        fetches:
            newtab-xpi-job:
                - artifact: ../browser-extensions/newtab.xpi
                  extract: false
        target:
            by-test-platform:
                linux.*:
                    index: gecko.v2.mozilla-release.shippable.latest.firefox.linux64-opt
                    name: build/target.tar.xz
                macosx.*:
                    index: gecko.v2.mozilla-release.shippable.latest.firefox.macosx64-opt
                    name: build/target.dmg
                windows.*:
                    index: gecko.v2.mozilla-release.shippable.latest.firefox.win64-opt
                    name: build/target.zip


trainhop-beta:
    description: Mochitest-browser for Newtab using latest Beta builds
    component: "Firefox::New Tab Page"
    suffix: "trainhop-beta"
    mozinfo: "trainhop"
    expiration: "never"
    merge:
        worker:
            env:
                MOZHARNESS_TEST_TAG:
                    - "newtab"
        mozharness:
            chunked: false
            extra-options:
                - --install-extension=newtab.xpi
                # Setting these to "any" allows us to install the newtab.xpi
                # regardless of what version it is.
                - --setpref=browser.newtabpage.trainhopAddonDeployment.version=any
        dependencies:
            newtab-xpi-job: build-extensions-browser

    replace:
        fetches:
            newtab-xpi-job:
                - artifact: ../browser-extensions/newtab.xpi
                  extract: false
        target:
            by-test-platform:
                linux.*:
                    index: gecko.v2.mozilla-beta.shippable.latest.firefox.linux64-opt
                    name: build/target.tar.xz
                macosx.*:
                    index: gecko.v2.mozilla-beta.shippable.latest.firefox.macosx64-opt
                    name: build/target.dmg
                windows.*:
                    index: gecko.v2.mozilla-beta.shippable.latest.firefox.win64-opt
                    name: build/target.zip


standalone:
    description: "{description} with browser restart after each test to identify test dependencies"
    component: "Testing::General"
    expiration: "never"
    suffix: "standalone"
    treeherder-suffix: "sa"
    mozinfo: "standalone"
    replace:
        optimization:
            skip-unless-backstop: null
    merge:
        mozharness:
            extra-options:
                - "--restart-between-tests"

geckoview-fission-isolate-high-value:
    description: "{description} with fission enabled and isolation strategy isolateHighValue"
    component: "GeckoView::General"
    expiration: "2027-03-01"
    when:
        <<: *gv_e10s_filter
    suffix: "fis-hv"
    mozinfo: "fission-high-value"
    merge:
        mozharness:
            extra-options:
                - "--setpref=fission.webContentIsolationStrategy=2"

geckoview-isolated-process:
    description: "{description} with content service isolated process"
    component: "GeckoView::General"
    expiration: "2027-03-01"
    when:
        <<: *gv_e10s_filter
    suffix: "isolated"
    treeherder-suffix: "iso"
    mozinfo: "isolated_process"
    merge:
        mozharness:
            extra-options:
                - "--enable-isolated-process"
                # The Java MediaCodec decoders are unavailable in an isolated process,
                # so decode and encode with the MediaCodec NDK via ffmpeg in the GPU
                # process, or in RDD if the GPU process is disabled.
                - "--setpref=media.android-media-codec.enabled=false"
                - "--setpref=media.android-media-codec.preferred=false"
                - "--setpref=media.ffmpeg.encoder.enabled=true"
                - "--setpref=media.ffvpx-hw.enabled=true"
                - "--setpref=media.gmp.android.isolated-process=true"
                - "--setpref=media.gpu-process-decoder=true"
                - "--setpref=media.gpu-process-encoder=true"
                - "--setpref=media.rdd-ffvpx.enabled=true"
                - "--setpref=media.rdd-opus.enabled=true"
                - "--setpref=media.rdd-process.enabled=true"
                - "--setpref=media.rdd-vorbis.enabled=true"
                - "--setpref=media.rdd-vpx.enabled=true"
                - "--setpref=media.rdd-wav.enabled=true"
                - "--setpref=media.use-remote-encoder.video.platform=true"

geckoview-java-media:
    description: "{description} with the Java MediaCodec pipeline"
    component: "Core::Audio/Video: Playback"
    expiration: "2027-06-01"
    when:
        <<: *gv_e10s_filter
    suffix: "java-media"
    treeherder-suffix: "java"
    merge:
        mozharness:
            extra-options:
                # Nightly decodes and encodes with the MediaCodec NDK via ffmpeg in
                # the RDD/GPU processes, but release still uses the Java MediaCodec
                # pipeline. Restore the release values until the NDK path ships.
                - "--setpref=gfx.video.force-aimage-reader-android=false"
                - "--setpref=gfx.webrender.enable-angle=false"
                - "--setpref=media.android-media-codec.enabled=true"
                - "--setpref=media.android-media-codec.preferred=true"
                - "--setpref=media.ffmpeg.encoder.enabled=false"
                - "--setpref=media.ffvpx-hw.enabled=false"
                - "--setpref=media.gpu-process-decoder=false"
                - "--setpref=media.gpu-process-encoder=false"
                - "--setpref=media.rdd-ffvpx.enabled=false"
                - "--setpref=media.rdd-opus.enabled=false"
                - "--setpref=media.rdd-process.enabled=false"
                - "--setpref=media.rdd-vorbis.enabled=false"
                - "--setpref=media.rdd-vpx.enabled=false"
                - "--setpref=media.rdd-wav.enabled=false"
                - "--setpref=media.use-remote-encoder.video.platform=false"

no-fission:
    description: "{description} without fission enabled"
    component: "Core::DOM: Content Processes"
    expiration: "2027-03-01"
    suffix: "nofis"
    mozinfo: "fission"
    when:
        $eval: '
                "linux" in task["test-platform"]
                || "android" in task["test-platform"]
                '
    merge:
        mozharness:
            extra-options:
                - "--disable-fission"

geckoview-zygote:
    description: "{description} with app Zygote preloading enabled"
    component: "GeckoView::General"
    expiration: "2027-03-01"
    suffix: "zygote"
    when:
        <<: *gv_e10s_filter
    merge:
        mozharness:
            extra-options:
                - "--enable-isolated-zygote-process"

xorigin:
    description: "{description} with cross-origin"
    component: "Core::DOM: Content Processes"
    expiration: "never"
    suffix: "xorig"
    mozinfo: "xorigin"
    replace:
        e10s: true
    when:
        $eval: '"mochitest-plain" in task["try-name"]'
    merge:
        mozharness:
            extra-options:
                - "--enable-xorigin-tests"

conditioned_profile:
    description: "{description} with conditioned profile"
    component: "Testing::General"
    expiration: "2026-09-01"
    suffix: "condprof"
    mozinfo: "condprof"
    when:
        $eval: '
                (
                    "linux" in task["test-platform"]
                    || "windows" in task["test-platform"]
                ) && (
                    "opt" in task["test-platform"]
                    && !(
                        "asan" in task["test-platform"]
                        || "tsan" in task["test-platform"]
                        || "ccov" in task["test-platform"]
                    )
                ) && (
                    "mochitest-plain" == task["try-name"]
                    || "xpcshell" == task["try-name"]
                )'
    merge:
        worker:
            env:
                MOZHARNESS_TEST_TAG:
                    - "condprof"
        mozharness:
            extra-options:
                - "--conditioned-profile"

# -
# Webrender DComp variants for Win10

webrender-dcomp-disabled:
    description: "{description} with dcomp disabled"
    component: "Core::Graphics: WebRender"
    expiration: "2027-03-01"
    suffix: "wr-dc0"
    when:
        $eval: '"windows1" in task["test-platform"]'
    merge:
        mozharness:
            extra-options:
                - "--setpref=gfx.webrender.dcomp-win.enabled=false"
                - "--setpref=gfx.webrender.dcomp-video-overlay-win=false"
                - "--setpref=gfx.webrender.dcomp-video-overlay-win.force-enabled=false"
                - "--setpref=gfx.webrender.compositor=false"
                - "--setpref=gfx.webrender.compositor.force-enabled=false"

webrender-dcomp-present:  # Default variant ends up like this.
    description: "{description} with dcomp present but not overlays"
    component: "Core::Graphics: WebRender"
    expiration: "2027-03-01"
    suffix: "wr-dc1-p"
    when:
        $eval: '"windows1" in task["test-platform"]'
    merge:
        mozharness:
            extra-options:
                - "--setpref=gfx.webrender.dcomp-win.enabled=true"
                - "--setpref=gfx.webrender.dcomp-video-overlay-win=false"
                - "--setpref=gfx.webrender.dcomp-video-overlay-win.force-enabled=false"
                - "--setpref=gfx.webrender.compositor=false"
                - "--setpref=gfx.webrender.compositor.force-enabled=false"

webrender-dcomp-overlays:
    description: "{description} with dcomp overlays but not compositing"
    component: "Core::Graphics: WebRender"
    expiration: "2027-03-01"
    suffix: "wr-dc2-o"
    when:
        $eval: '"windows1" in task["test-platform"]'
    merge:
        mozharness:
            extra-options:
                - "--setpref=gfx.webrender.dcomp-win.enabled=true"
                - "--setpref=gfx.webrender.dcomp-video-overlay-win=true"
                - "--setpref=gfx.webrender.dcomp-video-overlay-win.force-enabled=true"
                - "--setpref=gfx.webrender.compositor=false"
                - "--setpref=gfx.webrender.compositor.force-enabled=false"

webrender-dcomp-compositing:
    description: "{description} with dcomp compositing"
    component: "Core::Graphics: WebRender"
    expiration: "2027-03-01"
    suffix: "wr-dc3-c"
    when:
        $eval: '"windows1" in task["test-platform"]'
    merge:
        mozharness:
            extra-options:
                - "--setpref=gfx.webrender.dcomp-win.enabled=true"
                - "--setpref=gfx.webrender.dcomp-video-overlay-win=true"
                - "--setpref=gfx.webrender.dcomp-video-overlay-win.force-enabled=true"
                - "--setpref=gfx.webrender.compositor=true"
                - "--setpref=gfx.webrender.compositor.force-enabled=true"

# -

webrender-sw:
    description: "{description} with software webrender enabled"
    component: "Core::Graphics: WebRender"
    expiration: "never"
    suffix: "swr"
    mozinfo: "swgl"
    merge:
        webrender: true
        mozharness:
            extra-options:
                - "--setpref=gfx.webrender.software=true"

wmf-media-engine:
    description: "{description} with Windows Media Foundation media engine enabled"
    component: "Core::Audio/Video: Playback"
    expiration: "never"
    when:
        $eval: '"windows1" in task["test-platform"]'
    suffix: "wmfme"
    mozinfo: "wmfme"
    merge:
        worker:
            env:
                MOZHARNESS_TEST_TAG:
                    - "media-engine-compatible"
        mozharness:
            extra-options:
                - "--setpref=media.wmf.media-engine.enabled=1"
                - "--setpref=media.wmf.media-engine.channel-decoder.enabled=true"
                - "--setpref=media.eme.wmf.clearkey.enabled=true"
                - "--setpref=media.wmf.media-engine.bypass-gfx-blocklist=true"
                - "--setpref=media.eme.mfcdm.origin-filter.enabled=0"

eme-wmf:
    description: "{description} with Windows Media Foundation based CDM enabled for EME wpt"
    component: "Core::Audio/Video: Playback"
    expiration: "never"
    when:
        $eval: '"windows1" in task["test-platform"]'
    suffix: "emewmf"
    mozinfo: "emewmf"
    merge:
        virtualization: virtual-with-gpu

# For EME wpts which need the Widevine CDM to verify the host, i.e. a signed
# build. Suites using this variant should set mozharness.requires-signed-builds
# for it. Tests disabled due to the signing issue can be enabled with the
# vmpSigned run info property, which is set when the build has Widevine VMP
# signatures.
eme-signed:
    description: "{description} with a signed build for EME wpt"
    component: "Core::Audio/Video: Playback"
    expiration: "never"
    when:
        $eval: '"shippable" in task["test-platform"] && ("windows1" in task["test-platform"] || "macosx1500-aarch64" in task["test-platform"])'
    suffix: "emesigned"
    mozinfo: "emesigned"

# Use OpenH264 plugin built in CI and make it preferred over other codecs.
openh264:
    description: "{description} with OpenH264 preferred"
    component: "Core::Audio/Video: Playback"
    expiration: "never"
    suffix: "openh264"
    treeherder-suffix: "oh264"
    when:
        $eval: '(
                    "linux" in task["test-platform"]
                    || "windows" in task["test-platform"]
                    || "macosx" in task["test-platform"]
                ) && !(
                    "asan" in task["test-platform"]
                    || "tsan" in task["test-platform"]
                    || "ccov" in task["test-platform"]
                )'
    merge:
        dependencies:
            openh264-plugin:
                by-test-platform:
                    macosx.*-aarch64.*: openh264-plugin-macosx64-aarch64/opt
                    macosx.*-64.*: openh264-plugin-macosx64/opt
                    windows.*-aarch64.*: openh264-plugin-win64-aarch64/opt
                    windows.*-64.*: openh264-plugin-win64/opt
                    windows.*-32.*: openh264-plugin-win32/opt
                    linux.*-aarch64.*: openh264-plugin-linux64-aarch64/opt
                    linux.*-64.*: openh264-plugin-linux64/opt
        fetches:
            openh264-plugin:
                by-test-platform:
                    macosx.*-aarch64.*:
                        - artifact: /private/openh264/openh264-v{openh264_version}-macosx64-aarch64.zip
                          dest: gmp-gmpopenh264/{openh264_version}
                    macosx.*-64.*:
                        - artifact: /private/openh264/openh264-v{openh264_version}-macosx64.zip
                          dest: gmp-gmpopenh264/{openh264_version}
                    windows.*-aarch64.*:
                        - artifact: /private/openh264/openh264-v{openh264_version}-win64-aarch64.zip
                          dest: gmp-gmpopenh264/{openh264_version}
                    windows.*-64.*:
                        - artifact: /private/openh264/openh264-v{openh264_version}-win64.zip
                          dest: gmp-gmpopenh264/{openh264_version}
                    windows.*-32.*:
                        - artifact: /private/openh264/openh264-v{openh264_version}-win32.zip
                          dest: gmp-gmpopenh264/{openh264_version}
                    linux.*-aarch64.*:
                        - artifact: /private/openh264/openh264-v{openh264_version}-linux64-aarch64.zip
                          dest: gmp-gmpopenh264/{openh264_version}
                    linux.*-64.*:
                        - artifact: /private/openh264/openh264-v{openh264_version}-linux64.zip
                          dest: gmp-gmpopenh264/{openh264_version}
        mozharness:
            extra-options:
                - "--setpref=media.gmp.encoder.enabled=true"
                - "--setpref=media.gmp.encoder.preferred=true"
                - "--setpref=media.gmp.decoder.preferred=true"

media-gpu:
    description: "{description} for running media tests on the GPU worker"
    component: "Core::Audio/Video: Playback"
    expiration: "never"
    suffix: "mda-gpu"
    mozinfo: "mda_gpu"
    when:
        $eval: '
                    (
                        "windows" in task["test-platform"]
                        && "hw" in task["test-platform"]
                    )
                    ||
                    (
                        "macosx" in task["test-platform"]
                        && !("vms" in task["test-platform"])
                    )
                    ||
                    (
                        "android" in task["test-platform"]
                        && "hw" in task["test-platform"]
                    )
                '
    merge:
        worker:
            env:
                MOZHARNESS_TEST_TAG:
                    - "media-gpu"
                USE_HARDWARE: "1"
        virtualization: virtual-with-gpu
        mozharness:
            extra-options:
                - "--setpref=media.hardware-video-decoding.force-enabled=true"

no-gpu-process:
    description: "{description} without a dedicated GPU process"
    component: "Core::Graphics"
    expiration: "2027-01-15"
    suffix: "nogpu"
    mozinfo: "nogpu"
    when:
        $eval: '
                    "windows" in task["test-platform"]
                    || "android" in task["test-platform"]
                    || "linux" in task["test-platform"]
                    || "macosx" in task["test-platform"]
                '
    replace:
        virtualization: virtual

    merge:
        mozharness:
            extra-options:
                - "--setpref=layers.gpu-process.enabled=false"
                - "--setpref=layers.gpu-process.force-enabled=false"
                - "--setpref=webgl.force-enabled=true"  # Bug 1922686

msix:
    description: "{description} from msix packages"
    component: "Firefox:Installer"
    expiration: "never"
    suffix: "msix"
    mozinfo: "msix"
    when:
        $eval: '
                    "windows11" in task["test-platform"]
                    && "-64" in task["test-platform"]
                    && (
                        "opt" in task["test-platform"]
                        || "debug" in task["test-platform"]
                    ) && !(
                        "asan" in task["test-platform"]
                        || "artifact" in task["test-platform"]
                        || "ccov" in task["test-platform"]
                        || "devedition" in task["test-platform"]
                    )
                '
    replace:
        target:
            by-test-platform:
                windows11-64.*: target.installer.msix
        mozharness:
            extra-options:
                - "--variant=msix"
                - "--installer-path installer.msix"

http3:
    description: "{description} with http3 server"
    component: "Core::Networking"
    expiration: "2027-06-01"
    suffix: "http3"
    mozinfo: "http3"
    when:
        $eval: '(
                    "linux" in task["test-platform"]
                    && "debug" in task["test-platform"]
                ) && (
                    "mochitest-plain" == task["try-name"]
                    || "mochitest-devtools-chrome" == task["try-name"]
                )'
    merge:
        mozharness:
            extra-options:
                - "--use-http3-server"

http2:
    description: "{description} with http2 server"
    component: "Core::Networking"
    expiration: "2027-06-01"
    suffix: "http2"
    mozinfo: "http2"
    when:
        $eval: '(
                    "linux" in task["test-platform"]
                    && "debug" in task["test-platform"]
                )
                    && "mochitest-plain" == task["try-name"]
                '
    merge:
        mozharness:
            extra-options:
                - "--use-http2-server"

draw-snapshot:
    description: "{description} with draw snapshot"
    component: "Core::Graphics"
    suffix: "s"
    mozinfo: "snapshot"
    expiration: "never"
    when:
        $eval: '(
                    "linux" in task["test-platform"]
                    && "debug" in task["test-platform"]
                )
                && (
                    "reftest" == task["try-name"]
                    || "web-platform-tests-reftest" == task["try-name"]
                )
                '
    replace:
        virtualization: virtual
    merge:
        mozharness:
            extra-options:
                - "--setpref=reftest.use-draw-snapshot=true"

native-printer:
    description: "{description} through the system PDF printer"
    component: "Core::Printing: Output"
    suffix: "np"
    expiration: "never"
    when:
        $eval: '"windows" in task["test-platform"]'
    merge:
        mozharness:
            extra-options:
                - "--setpref=remote.print.printer_name=\"Microsoft Print to PDF\""

async-event-dispatching:
    description: "{description} with async widget event dispatching"
    component: "Remote Protocol::Agent"
    expiration: "2027-04-01"
    suffix: "async"
    mozinfo: "remote_async"
    replace:
        tier: 3
    merge:
        mozharness:
            extra-options:
                - "--setpref=remote.events.async.mouse.enabled=true"
                - "--setpref=remote.events.async.touch.enabled=true"
                - "--setpref=remote.events.async.wheel.enabled=true"

vertical-tabs:
    description: "{description} limited to tests identified as being applicable to also run with vertical tabs enabled"
    component: "Firefox::Tabbed Browser"
    expiration: "never"
    suffix: "vt"
    mozinfo: "vertical_tab"
    merge:
        worker:
            env:
                MOZHARNESS_TEST_TAG:
                    - "vertical-tabs"
        mozharness:
            extra-options:
                - "--setpref=sidebar.verticalTabs=true"

inc-origin-init:
    description: "{description} limited to tests identified as being applicable to also run with incremental origin initialization enabled"
    component: "Core::Storage: Quota Manager"
    expiration: "2026-12-31"
    suffix: "ioi"
    mozinfo: "inc_origin_init"
    replace:
        tier: 3
    merge:
        worker:
            env:
                MOZHARNESS_TEST_TAG:
                    - "inc-origin-init"
                MOZ_ENABLE_INC_ORIGIN_INIT: "1"

privatebrowsing:
    description: "{description} limited to tests identified as being applicable to also run in private browsing mode"
    component: "Core::Storage: Quota Manager"
    expiration: "never"
    suffix: "pb"
    mozinfo: "privateBrowsing"
    merge:
        worker:
            env:
                MOZHARNESS_TEST_TAG:
                    - "privatebrowsing"
                MOZ_PRIVATE_BROWSING: "1"
        mozharness:
