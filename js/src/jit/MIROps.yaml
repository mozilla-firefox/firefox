- name: GuardBoundFunctionIsConstructor
  operands:
    object: Object
  result_type: Object
  guard: true
  movable: true
  congruent_to: if_operands_equal
  # The is-constructor flag is immutable for a bound function.
  alias_set: none
  generate_lir: true
  lir_result_type: none

- name: MutateProto
  doc: |
    Setting __proto__ in an object literal.
  operands:
    object: Object
    value: Value
  result_type: None
  possibly_calls: true
  generate_lir: true

- name: InitPropGetterSetter
