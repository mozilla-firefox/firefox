    value: any
  arguments:
    mustBeFloat32: bool
  result_type: None
  type_policy: none
  can_consume_float32: true

- name: Compare
  gen_boilerplate: false

- name: StrictConstantCompareInt32
  operands:
    value: Value
  arguments:
    constant: int32_t
    jsop: JSOp
  can_recover: true
  movable: true
  alias_set: none
  folds_to: custom
  result_type: Boolean
  generate_lir: true
  lir_temps: 1

- name: StrictConstantCompareBoolean
  operands:
    value: Value
  arguments:
    constant: bool
    jsop: JSOp
  can_recover: true
  movable: true
  alias_set: none
  folds_to: custom
  result_type: Boolean
  generate_lir: true

- name: StrictConstantCompareString
  operands:
    value: Value
  arguments:
    constant: JSOffThreadAtom*
    jsop: JSOp
  movable: true
  alias_set: none
  folds_to: custom
  result_type: Boolean
  generate_lir: true
  lir_temps: 1

- name: StrictConstantCompareObject
  operands:
    value: Value
  arguments:
    constant: JSObject*
    jsop: JSOp
  movable: true
  alias_set: none
  result_type: Boolean
  generate_lir: true

- name: SameValueDouble
  operands:
    left: Double
    right: Double
  result_type: Boolean
  movable: true
  congruent_to: if_operands_equal
  alias_set: none
  folds_to: custom
  clone: true
  generate_lir: true
  lir_temps: 1

- name: SameValue
  operands:
    left: Value
    right: Value
  result_type: Boolean
  movable: true
  congruent_to: if_operands_equal
  alias_set: none
  folds_to: custom
  clone: true
  generate_lir: true

- name: Box
  gen_boilerplate: false

- name: Unbox
  gen_boilerplate: false

- name: AssertRange
  gen_boilerplate: false

- name: AssertClass
  gen_boilerplate: false

- name: AssertShape
  operands:
    object: Object
  arguments:
    shape: Shape*
  type_policy: none
  alias_set: none
  guard: true
  generate_lir: true

- name: CreateThis
  doc: |
    Caller-side allocation of |this| for |new|:
    Constructs |this| when possible, else MagicValue(JS_IS_CONSTRUCTING).
  operands:
    callee: Object
    newTarget: Object
  result_type: Value
  # Performs a property read from |newTarget| iff |newTarget| is a JSFunction
  # with an own |.prototype| property.
  alias_set:
    load: Any
  possibly_calls: true
  generate_lir: true

- name: CreateArgumentsObject
  doc: |
    Eager initialization of arguments object.
  operands:
    callObject: Object
  arguments:
    templateObject: ArgumentsObject*
  result_type: Object
  alias_set: none
  possibly_calls: true
  can_recover: true
  generate_lir: true
  lir_temps: 3

- name: CreateInlinedArgumentsObject
  gen_boilerplate: false

- name: GetInlinedArgument
  gen_boilerplate: false

- name: GetInlinedArgumentHole
  gen_boilerplate: false

- name: GetArgumentsObjectArg
  doc: |
    Get argument from arguments object.
  operands:
    argsObject: Object
  arguments:
    argno: size_t
  result_type: Value
  congruent_to: if_operands_and_arguments_equal
  alias_set:
    load: Any
  generate_lir: true
  lir_temps: 1

- name: SetArgumentsObjectArg
  doc: |
    Set argument on arguments object.
  operands:
    argsObject: Object
    value: Value
  arguments:
    argno: size_t
  alias_set:
    store: Any
  generate_lir: true
  lir_temps: 1

- name: LoadArgumentsObjectArg
  doc: |
    Load |arguments[index]| from a mapped or unmapped arguments object. Bails out
    when any elements were overridden or deleted. Also bails out if the index is
    out of bounds.
  operands:
    argsObject: Object
    index: Int32
  result_type: Value
  guard: true
  congruent_to: if_operands_equal
  alias_set:
    load: Any
  generate_lir: true
  lir_temps: 1

- name: LoadArgumentsObjectArgHole
  doc: |
    Load |arguments[index]| from a mapped or unmapped arguments object. Bails out
    when any elements were overridden or deleted. Returns undefined if the index is
    out of bounds.
  operands:
    argsObject: Object
    index: Int32
  result_type: Value
  guard: true
  congruent_to: if_operands_equal
  alias_set:
    load: Any
  generate_lir: true
  lir_temps: 1

- name: InArgumentsObjectArg
  operands:
    argsObject: Object
    index: Int32
  result_type: Boolean
  guard: true
  congruent_to: if_operands_equal
  # Loads |arguments.length|, but not the actual element, so we can use the
  # same alias-set as ArgumentsObjectLength.
  alias_set:
    load:
      - ObjectFields
      - FixedSlot
      - DynamicSlot
  generate_lir: true
  lir_temps: 1

- name: ArgumentsObjectLength
  doc: |
    Load |arguments.length|. Bails out if the length has been overriden.
  operands:
    argsObject: Object
  result_type: Int32
  guard: true
  movable: true
  congruent_to: if_operands_equal
  # Even though the "length" property is lazily resolved, it acts similar to
  # a normal property load, so we can treat this operation like any other
  # property read.
  alias_set:
    load:
      - ObjectFields
      - FixedSlot
      - DynamicSlot
  generate_lir: true

- name: ArrayFromArgumentsObject
  doc: |
    Create an array from an arguments object.
  operands:
    argsObject: Object
  arguments:
    shape: Shape*
  result_type: Object
  possibly_calls: true
  generate_lir: true

- name: GuardArgumentsObjectFlags
  doc: |
    Guard that the given flags are not set on the arguments object.
  operands:
    argsObject: Object
  arguments:
    flags: uint32_t
  result_type: Object
  movable: true
  guard: true
  congruent_to: if_operands_and_arguments_equal
  # The flags are packed with the length in a fixed private slot.
  alias_set:
    load: FixedSlot
  generate_lir: true
  lir_result_type: none
  lir_temps: 1

- name: GuardObjectHasSameRealm
  doc: |
    Guard cx->realm() == obj->realm().
  operands:
    object: Object
  result_type: Object
  guard: true
  movable: true
  congruent_to: if_operands_equal
  # The object's realm is immutable. The context's realm must always be the same
  # realm for this compilation.
  alias_set: none
  generate_lir: true
  lir_result_type: none
  lir_temps: 1

- name: LoadScriptedProxyHandler
  operands:
    object: Object
  result_type: Object
  guard: true
  congruent_to: if_operands_equal
  # The handler slot is cleared when the proxy is revoked.
  alias_set:
    load: ObjectFields
  generate_lir: true

#ifdef JS_PUNBOX64
- name: CheckScriptedProxyGetResult
  operands:
    target: Value
    id: Value
    value: Value
  guard: true
  alias_set:
    store: ExceptionState
  generate_lir: true
  lir_temps: 2
#endif

- name: IdToStringOrSymbol
  operands:
    idVal: Value
  result_type: Value
  congruent_to: if_operands_equal
  alias_set: none
  folds_to: custom
  generate_lir: true
  lir_temps: 1

- name: ReturnFromCtor
  doc: |
    Given a MIRType::Value A and a MIRType::Object B:
    If the Value may be safely unboxed to an Object, return Object(A).
    Otherwise, return B.
    Used to implement return behavior for inlined constructors.
  operands:
    value: Value
    object: Object
  result_type: Object
  folds_to: custom
  congruent_to: if_operands_equal
  alias_set: none
  generate_lir: true

