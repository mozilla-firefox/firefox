    templateObject: JSObject*
  result_type: Object
  possibly_calls: true
  generate_lir: true
  lir_temps: 2

- name: NewObject
  gen_boilerplate: false

- name: NewPlainObject
  gen_boilerplate: false

- name: NewArrayObject
