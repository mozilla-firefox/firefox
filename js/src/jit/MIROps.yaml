    templateObject: JSObject*
    initialHeap: gc::Heap
  result_type: Object
  # Need to throw if length is negative.
  guard: true
  # Throws if length is negative.
  alias_set:
    store: ExceptionState
  generate_lir: true
  lir_temps: 1

- name: NewTypedArray
  gen_boilerplate: false

- name: NewTypedArrayDynamicLength
