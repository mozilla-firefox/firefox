    This op serves as a way to force the encoding of a snapshot, even if there
    is no resume point using it.  This is useful to run MAssertRecoveredOnBailout
    assertions.
  guard: true
  generate_lir: true

- name: AssertRecoveredOnBailout
  gen_boilerplate: false

- name: AssertFloat32
