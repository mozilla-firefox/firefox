schema: 1

bugzilla:
  product: Core
  component: "XML"

# Document the source of externally hosted code
origin:
  name: libexpat
  description: Expat is an XML parser.
  url: https://github.com/libexpat/libexpat
  release: R_2_8_2 (2026-06-25T16:07:00+02:00).
  revision: R_2_8_2
  license: MIT
  license-file: COPYING

  notes: >
    To test the upstream's main branch tip, one can
    run `./mach vendor --revision tip parser/expat/moz.yaml`

vendoring:
  url: https://github.com/libexpat/libexpat
  source-hosting: github
  tracking: tag

  exclude:
    - "**"
    - expat/lib/Makefile.am
    - expat/lib/libexpat.def.cmake
    - expat/lib/libexpat.map.in
    - expat/lib/memory_sanitizer.h
    - expat/lib/random_*.c
    - expat/lib/random_*.h

  include:
    - AUTHORS
    - Changes
    - COPYING
    - README.md
    - expat/lib/*

  keep:
    - expat_config.h
    - expat_config_moz.h
    - expat_config_rlbox.h
    - README_MOZILLA
    - rlbox_expat.h
    - rlbox_expat_types.h
    - sources.mozbuild
    - expat/lib/moz_expat.h
    - expat/lib/moz_xmlparse.c
    - expat/lib/moz_xmltok.c

  patches:
    - 00_xmlchar.patch
    - 01_report_mismatched_tag.patch
    - 02_dont_generate_salt.patch
    - 03_always_set_eventptrs.patch
    - 04_getcurrentbyteindex.patch
    - 05_always_store_rawnames.patch
    - 06_dont_ignore_undeclared_entity.patch
    - 07_include_xmlns.patch
    - 08_internalsubset.patch
    - 09_version_limit.patch
    - 10_no_debug_report.patch
    - 11_unused.patch
    - 12_high_surrogate_mask.patch
