[DEFAULT]
subsuite = "a11y"
# ATK exists only on Linux, and AT-SPI needs a real window.
run-if = [
  "os == 'linux' && !headless",
]
support-files = ["head.js"]
prefs = [
  "accessibility.ariaNotify.enabled=true",
  # Enabling the a11y service from XPCOM doesn't seem to be enough to get ATK
  # working correctly. Force enable it before the test starts.
  "accessibility.force_disabled=-1",
  # Required for the eval in invokeContentTask in shared-head.js
  "security.allow_eval_with_system_principal=true"
]

["browser_action.js"]

["browser_atspi_interfaces.js"]

["browser_editabletext.js"]

["browser_forceEnabled.js"]

["browser_groupPosition.js"]

["browser_notification.js"]

["browser_prune_children.js"]

["browser_role.js"]

["browser_table.js"]

["browser_valuetext.js"]
